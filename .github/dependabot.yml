# Dependabot for the docs repo.
#
# Docs is a Mintlify site. The package.json has a single direct dep
# (`mintlify`); the 40+ transitive deps that show up as Dependabot
# alerts are inside mintlify's tree. They mostly resolve when mintlify
# itself ships a patched release, so a weekly mintlify bump is the
# main lever here.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # `applies-to` defaults to version-updates, so the group above does not
      # apply to a security fix — without the group below, every advisory opens
      # its own PR no matter what the version groups say.
      #
      # That matters particularly here: this site's direct dependency is
      # `mintlify`, and the advisories are almost all inside its tree, so they
      # clear in waves whenever mintlify ships. Ungrouped, a wave arrives as a
      # wave of pull requests.
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  # Re-added per the note this block replaces: it said to restore the
  # github-actions ecosystem "as soon as the first workflow lands", and
  # .github/workflows/vale.yml is that workflow.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'

# `target-branch` does not mean what it looks like: it governs VERSION
# updates only. SECURITY updates always target the repository's DEFAULT
# branch, and no key in this file changes that. The default is currently
# `develop`, which is what makes the two agree. If it is ever moved back
# to `main`, this file will keep looking correct while security updates
# quietly stop landing on the branch feature work targets.
