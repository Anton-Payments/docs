# Dependabot for the docs repo: the site's npm tree (site/) and the workflows' actions.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/site'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # `applies-to` defaults to version-updates, so the group above does not apply to a
      # security fix; without this group every advisory opens its own PR.
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'

# `target-branch` does not mean what it looks like: it governs VERSION
# updates only. SECURITY updates always target the repository's DEFAULT
# branch, and no key in this file changes that. The default is currently
# `develop`, which is what makes the two agree. If it is ever moved back
# to `main`, this file will keep looking correct while security updates
# quietly stop landing on the branch feature work targets.
