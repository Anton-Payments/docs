name: Docs app

# Builds the new docs app and crawls it for broken links and anchors.
# Mintlify's checks don't cover this app; this job is what does.
on:
  pull_request:
    branches: [develop, main]
    paths: ['site/**', 'openapi-merchant.yaml', 'api-reference/**', 'docs.json']

permissions:
  contents: read

jobs:
  build:
    name: build and links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Crawl for broken links and anchors
        run: |
          npm run start -- --port 3004 &
          for i in $(seq 1 30); do curl -sf http://localhost:3004/ >/dev/null && break; sleep 1; done
          npm run check:links
