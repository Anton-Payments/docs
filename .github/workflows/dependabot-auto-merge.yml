name: Dependabot auto-merge

# Keeps the dependency queue draining on its own. Clearing a backlog by hand is
# a sweep; this is the thing that stops one re-forming.
#
# READ THIS BEFORE COPYING THIS FILE ANYWHERE ELSE — the safety argument that
# holds in the sibling repos does NOT hold here, and the difference is invisible
# from the file itself.
#
# Elsewhere, `gh pr merge --auto` is safe because it does not merge: it asks
# GitHub to merge *when the branch-protection ruleset is satisfied*, so a bump
# that breaks a required check sits open instead of landing. The gate is the
# ruleset, not this workflow.
#
# This repo's ruleset carries NO `required_status_checks` rule at all. Verify
# rather than trust this comment:
#
#   gh api repos/Anton-Payments/docs/rulesets/<id> \
#     --jq '[.rules[]|select(.type=="required_status_checks")]'
#
# An empty list means auto-merge here waits on nothing. `vale-spellcheck`,
# `link-rot` and `Mintlify Deployment` all run and all report, but none of them
# block, so a red one does not stop the merge.
#
# That is a deliberate, recorded decision rather than an oversight: this is a
# Mintlify site whose npm tree is almost entirely mintlify's own transitive
# dependencies, Mintlify scans and validates that tree independently, and this
# repo ships documentation rather than code that runs in a service.
#
# There is a second reason not to promote a check to required. `vale-spellcheck`
# lints the *whole repository* on any PR that changes no Markdown — which is
# exactly what a lockfile-only dependency PR is. Making it required would block
# the dependency queue on prose the PR's author never wrote.
#
# If this repo ever gains a check that genuinely gates correctness, make it
# required — and this file becomes gate-driven like its siblings with no edit.
#
# pull_request_target, not pull_request: a Dependabot-authored PR gets a
# read-only GITHUB_TOKEN on `pull_request` no matter what the permissions block
# says, so the merge call would 403. pull_request_target runs in the base-branch
# context with a writable token. The usual injection risk does not apply because
# this workflow never checks out — or runs — a single line of PR code.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A grouped PR reports the highest update-type across its members, so one
      # major in a group holds the whole group for review. That is the intent.
      - name: Queue patch and minor for auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label majors for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "major-update" || true
          gh pr comment "$PR_URL" --body \
            "Held for review: this is a **major** version update (\`${{ steps.meta.outputs.update-type }}\`). Auto-merge is deliberately not queued for majors."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
