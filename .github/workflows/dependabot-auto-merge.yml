name: Dependabot auto-merge

# Keeps the dependency queue draining on its own. Clearing a backlog by hand is
# a sweep; this is the thing that stops one re-forming.
#
# `gh pr merge --auto` does not merge: it asks GitHub to merge once the develop ruleset is
# satisfied, so the gate is the ruleset, not this workflow. The ruleset must require the
# `build and links` check (site.yml): this repo now ships a Next.js app, and a dependency bump
# that breaks the build must sit open instead of landing on develop, which deploys the preview.
# Verify:
#
#   gh api repos/Anton-Payments/docs/rules/branches/develop \
#     --jq '[.[]|select(.type=="required_status_checks")]'
#
# An empty list means auto-merge waits on nothing. Do not require `spellcheck`: it lints the
# whole tree, so a lockfile-only PR would be blocked on prose its author never wrote.
#
# pull_request_target, not pull_request: a Dependabot-authored PR gets a
# read-only GITHUB_TOKEN on `pull_request` no matter what the permissions block
# says, so the merge call would 403. pull_request_target runs in the base-branch
# context with a writable token. The usual injection risk does not apply because
# this workflow never checks out — or runs — a single line of PR code.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A grouped PR reports the highest update-type across its members, so one
      # major in a group holds the whole group for review. That is the intent.
      - name: Queue patch and minor for auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label majors for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "major-update" || true
          gh pr comment "$PR_URL" --body \
            "Held for review: this is a **major** version update (\`${{ steps.meta.outputs.update-type }}\`). Auto-merge is deliberately not queued for majors."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
