openapi: 3.1.0
info:
  title: Anton Payments API
  description: |
    Cross-border payouts platform supporting fiat, crypto, and stablecoin rails.
    
    ## Authentication
    
    **Merchant API** (`/v1/*`): API key authentication via `Authorization: Bearer ak_live_...` header.
    
    **Ops API** (`/v1/ops/*`): Session/JWT authentication for internal operations portal.
    
    ## Idempotency
    
    POST requests support idempotency via the `Idempotency-Key` header.
    If a duplicate key is detected, the original response is replayed with `X-Idempotent-Replayed: true`.
    
    ## Rate Limiting
    
    Requests are rate-limited per IP. Exceeding the limit returns `429 Too Many Requests`.
    
    ## Pagination
    
    List endpoints support `limit` and `offset` query parameters.
    Responses include pagination metadata in the `pagination` envelope.
  version: 1.0.0
  contact:
    name: Anton Payments Engineering
    email: engineering@antonpayments.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.staging.antonpayments.com
    description: Staging
  - url: https://api.antonpayments.com
    description: Production

tags:
  - name: Health
    description: Health and readiness checks
  - name: Merchants
    description: Merchant profile management
  - name: Payouts
    description: Create and manage payouts
  - name: Beneficiaries
    description: Manage payout beneficiaries
  - name: Balances
    description: Merchant balance queries
  - name: API Keys
    description: API key lifecycle management
  - name: Batches
    description: Batch file upload and processing
  - name: Webhooks
    description: Webhook subscription and event management
  - name: Onboarding
    description: Merchant onboarding applications
  - name: Documents
    description: KYB document management
  - name: RFIs
    description: Requests for information
  - name: Pricing
    description: Pricing plan management
  - name: Quotes
    description: FX quote generation
  - name: Rails
    description: Payment rail provider management
  - name: Ops Users
    description: Operations portal user management
  - name: Finance
    description: Accounting, settlements, reconciliation, invoicing, reporting
  - name: Audit
    description: Audit log queries
  - name: Velocity Rules
    description: Fraud and velocity rule management
  - name: Approvals
    description: Maker-checker approval workflows
  - name: Instruments
    description: Payment instrument management
  - name: Notifications
    description: Notification channels and preferences
  - name: Merchant Self-Service
    description: User profile, MFA, and password management
  - name: Registration
    description: Public merchant self-registration
  - name: Compliance Screenings
    description: Compliance screening management
  - name: Transaction Reviews
    description: Transaction review case management
  - name: Merchant Reviews
    description: Ongoing merchant due diligence reviews
  - name: Notes
    description: Internal ops notes
  - name: Corridors
    description: Payment corridor management
  - name: Provisioning
    description: Post-approval merchant provisioning

paths:
  # ── Health ─────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: healthCheck
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: readyCheck
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready

  # ── Merchant API ───────────────────────────────────────────────────

  /v1/merchant:
    get:
      tags: [Merchants]
      summary: Get current merchant profile
      operationId: getMerchant
      security:
        - apiKey: []
      responses:
        "200":
          description: Merchant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Payouts ────────────────────────────────────────────────────────

  /v1/payouts:
    post:
      tags: [Payouts]
      summary: Create a payout
      operationId: createPayout
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayoutRequest"
      responses:
        "201":
          description: Payout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Payouts]
      summary: List payouts
      operationId: listPayouts
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PayoutStatus"
      responses:
        "200":
          description: Paginated list of payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutList"

  /v1/payouts/{id}:
    get:
      tags: [Payouts]
      summary: Get a payout by ID
      operationId: getPayout
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Payout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payouts/{id}/cancel:
    post:
      tags: [Payouts]
      summary: Cancel a payout
      operationId: cancelPayout
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Payout cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Beneficiaries ──────────────────────────────────────────────────

  /v1/beneficiaries:
    post:
      tags: [Beneficiaries]
      summary: Create a beneficiary
      operationId: createBeneficiary
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBeneficiaryRequest"
      responses:
        "201":
          description: Beneficiary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Beneficiaries]
      summary: List beneficiaries
      operationId: listBeneficiaries
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of beneficiaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryList"

  /v1/beneficiaries/{id}:
    get:
      tags: [Beneficiaries]
      summary: Get a beneficiary by ID
      operationId: getBeneficiary
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Beneficiary details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Beneficiaries]
      summary: Delete a beneficiary
      operationId: deleteBeneficiary
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Beneficiary deleted

  # ── Balances ───────────────────────────────────────────────────────

  /v1/balances:
    get:
      tags: [Balances]
      summary: List all balances
      operationId: listBalances
      security:
        - apiKey: []
      responses:
        "200":
          description: List of currency balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Balance"

  /v1/balances/{currency}:
    get:
      tags: [Balances]
      summary: Get balance for a specific currency
      operationId: getBalance
      security:
        - apiKey: []
      parameters:
        - name: currency
          in: path
          required: true
          schema:
            type: string
            example: USD
      responses:
        "200":
          description: Balance details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"

  # ── API Keys ───────────────────────────────────────────────────────

  /v1/api-keys:
    post:
      tags: [API Keys]
      summary: Create an API key
      operationId: createAPIKey
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, environment]
              properties:
                name:
                  type: string
                  example: Production Key
                environment:
                  type: string
                  enum: [test, live]
      responses:
        "201":
          description: API key created (raw key is only returned once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreateResult"
    get:
      tags: [API Keys]
      summary: List API keys
      operationId: listAPIKeys
      security:
        - apiKey: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"

  /v1/api-keys/{id}/revoke:
    post:
      tags: [API Keys]
      summary: Revoke an API key
      operationId: revokeAPIKey
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"

  # ── Batches ────────────────────────────────────────────────────────

  /v1/batches:
    post:
      tags: [Batches]
      summary: Upload a batch file
      operationId: uploadBatch
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX file containing payout instructions
      responses:
        "201":
          description: Batch uploaded and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Batches]
      summary: List batches
      operationId: listBatches
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"

  /v1/batches/{id}:
    get:
      tags: [Batches]
      summary: Get batch details
      operationId: getBatch
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Batch details with errors if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/batches/{id}/payouts:
    get:
      tags: [Batches]
      summary: List payouts in a batch
      operationId: getBatchPayouts
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Payouts belonging to the batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutList"

  /v1/batches/template:
    get:
      tags: [Batches]
      summary: Download batch upload template
      description: Returns an XLSX or CSV template file for batch payout uploads.
      operationId: downloadBatchTemplate
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        "200":
          description: Template file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary

  /v1/batches/{id}/errors:
    get:
      tags: [Batches]
      summary: Get batch validation errors
      operationId: getBatchErrors
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Batch errors and warnings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                            field:
                              type: string
                            message:
                              type: string
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                            field:
                              type: string
                            message:
                              type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/batches/{id}/results:
    get:
      tags: [Batches]
      summary: Get batch row-level results
      operationId: getBatchResults
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated row results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  has_more:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/batches/{id}/confirm:
    post:
      tags: [Batches]
      summary: Confirm a validated batch for processing
      operationId: confirmBatch
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source_currency:
                  type: string
                  description: Override source currency for all payouts
      responses:
        "200":
          description: Batch confirmed and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "409":
          description: Batch not in valid state for confirmation

  /v1/batches/{id}/cancel:
    post:
      tags: [Batches]
      summary: Cancel a batch
      operationId: cancelBatch
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Batch cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "409":
          description: Batch cannot be cancelled in current state

  # ── Webhooks ───────────────────────────────────────────────────────

  /v1/webhooks:
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      operationId: createWebhookSubscription
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      operationId: listWebhookSubscriptions
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionList"

  /v1/webhooks/{id}:
    get:
      tags: [Webhooks]
      summary: Get a webhook subscription
      operationId: getWebhookSubscription
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
    put:
      tags: [Webhooks]
      summary: Deactivate a webhook subscription
      operationId: deactivateWebhookSubscription
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Subscription deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      operationId: deleteWebhookSubscription
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Subscription deleted

  /v1/webhooks/events:
    get:
      tags: [Webhooks]
      summary: List webhook events
      operationId: listWebhookEvents
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/WebhookEventType"
      responses:
        "200":
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventList"

  /v1/webhooks/events/{id}:
    get:
      tags: [Webhooks]
      summary: Get a webhook event
      operationId: getWebhookEvent
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEvent"

  /v1/webhooks/events/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: List deliveries for an event
      operationId: listWebhookDeliveries
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"

  # ── Payment Instruments ────────────────────────────────────────────

  /v1/beneficiaries/{id}/instruments:
    post:
      tags: [Instruments]
      summary: Create a payment instrument for a beneficiary
      description: Adds a new payment instrument (bank account, card, crypto wallet, etc.) to the specified beneficiary.
      operationId: createInstrument
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstrumentRequest"
      responses:
        "201":
          description: Instrument created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Instruments]
      summary: List instruments for a beneficiary
      description: Returns all payment instruments attached to the specified beneficiary.
      operationId: listBeneficiaryInstruments
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: List of instruments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"

  /v1/instruments:
    get:
      tags: [Instruments]
      summary: List all instruments
      description: Returns paginated instruments for the authenticated merchant with optional filters.
      operationId: listInstruments
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: beneficiary_id
          in: query
          schema:
            type: string
          description: Filter by beneficiary ID
        - name: method
          in: query
          schema:
            type: string
          description: Filter by payment method (e.g., ach, sepa, swift)
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
          description: Filter by instrument status
        - name: search
          in: query
          schema:
            type: string
          description: Search by label, bank, or last4
      responses:
        "200":
          description: Paginated list of instruments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"

  /v1/instruments/{id}:
    get:
      tags: [Instruments]
      summary: Get an instrument by ID
      description: Returns a single payment instrument.
      operationId: getInstrument
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Instrument details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Instruments]
      summary: Update an instrument
      description: Updates mutable fields (label, default status, active/disabled). Credential changes require creating a new instrument.
      operationId: updateInstrument
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstrumentRequest"
      responses:
        "200":
          description: Instrument updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Instruments]
      summary: Delete an instrument
      description: Soft-deletes a payment instrument.
      operationId: deleteInstrument
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Instrument deleted
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Merchant Self-Service ──────────────────────────────────────────

  /v1/users/me:
    get:
      tags: [Merchant Self-Service]
      summary: Get my profile
      description: Returns the authenticated user's profile enriched with WorkOS data (profile picture, MFA status).
      operationId: getMyProfile
      security:
        - apiKey: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Merchant Self-Service]
      summary: Update my profile
      description: Updates the authenticated user's name. Syncs changes to WorkOS.
      operationId: updateMyProfile
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/users/me/mfa:
    get:
      tags: [Merchant Self-Service]
      summary: Get my MFA status
      description: Returns the authenticated user's MFA factors from WorkOS.
      operationId: getMyMFA
      security:
        - apiKey: []
      responses:
        "200":
          description: MFA status and factors
          content:
            application/json:
              schema:
                type: object
                properties:
                  factors:
                    type: array
                    items:
                      type: object
                  mfa_enabled:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/mfa/enroll:
    post:
      tags: [Merchant Self-Service]
      summary: Enroll in MFA
      description: Starts TOTP MFA enrollment for the authenticated user via WorkOS.
      operationId: enrollMyMFA
      security:
        - apiKey: []
      responses:
        "201":
          description: MFA enrollment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  authentication_factor:
                    type: object
                  authentication_challenge:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/password:
    post:
      tags: [Merchant Self-Service]
      summary: Change my password
      description: Changes the authenticated user's password via WorkOS. Minimum 12 characters.
      operationId: changeMyPassword
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 12
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Notifications ──────────────────────────────────────────────────

  /v1/users/me/notifications/event-types:
    get:
      tags: [Notifications]
      summary: List notification event types
      description: Returns all available event types with metadata (category, label, description, admin-only flag).
      operationId: getNotificationEventTypes
      security:
        - apiKey: []
      responses:
        "200":
          description: List of event type info objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationEventTypeInfo"

  /v1/users/me/notifications/channels:
    get:
      tags: [Notifications]
      summary: List notification channels
      description: Returns all notification delivery channels configured by the authenticated user.
      operationId: listNotificationChannels
      security:
        - apiKey: []
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationChannel"
    post:
      tags: [Notifications]
      summary: Create a notification channel
      description: Adds a new notification delivery channel (email, Slack, or Teams webhook).
      operationId: createNotificationChannel
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationChannelRequest"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/me/notifications/channels/{id}:
    put:
      tags: [Notifications]
      summary: Update a notification channel
      description: Updates a channel's name, config, or active status.
      operationId: updateNotificationChannel
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                config:
                  type: object
                is_active:
                  type: boolean
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Notifications]
      summary: Delete a notification channel
      description: Removes a notification delivery channel.
      operationId: deleteNotificationChannel
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Channel deleted
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/me/notifications/channels/{id}/test:
    post:
      tags: [Notifications]
      summary: Test a notification channel
      description: Sends a test notification and marks the channel as verified on success.
      operationId: testNotificationChannel
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  channel:
                    $ref: "#/components/schemas/NotificationChannel"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/me/notifications/preferences:
    get:
      tags: [Notifications]
      summary: List notification preferences
      description: Returns all notification preferences for the authenticated user.
      operationId: listNotificationPreferences
      security:
        - apiKey: []
      responses:
        "200":
          description: List of preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationPreference"
    put:
      tags: [Notifications]
      summary: Update notification preferences
      description: Bulk-updates notification preferences for the authenticated user.
      operationId: updateNotificationPreferences
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  items:
                    type: object
                    required: [event_type, channels, enabled]
                    properties:
                      event_type:
                        type: string
                      channels:
                        type: array
                        items:
                          type: string
                          enum: [email, slack, teams]
                      config:
                        type: object
                      enabled:
                        type: boolean
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationPreference"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Registration (public) ───────────────────────────────────────────

  /v1/register:
    post:
      tags: [Registration]
      summary: Self-register a new merchant
      description: |
        Public endpoint — no authentication required.
        Creates a merchant, draft onboarding application, and initial API key in one atomic operation.
      operationId: registerMerchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Merchant registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Merchant with this email already exists
        "422":
          description: Validation error

  /v1/onboarding/status/{token}:
    get:
      tags: [Registration]
      summary: Check onboarding status (public)
      description: |
        Public endpoint — no authentication required.
        Returns a minimal status view using the UUID status token (no PII exposed).
      operationId: getOnboardingStatus
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Status tracking token (UUID)
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Onboarding (merchant-facing) ───────────────────────────────────

  /v1/onboarding:
    get:
      tags: [Onboarding]
      summary: Get my onboarding application
      operationId: getMyApplication
      security:
        - apiKey: []
      responses:
        "200":
          description: Current onboarding application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
    put:
      tags: [Onboarding]
      summary: Update draft application
      operationId: updateDraft
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingApplication"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"

  /v1/onboarding/submit:
    post:
      tags: [Onboarding]
      summary: Submit application for review
      operationId: submitApplication
      security:
        - apiKey: []
      responses:
        "200":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"

  # ── Documents (merchant-facing) ────────────────────────────────────

  /v1/documents:
    post:
      tags: [Documents]
      summary: Upload a document
      operationId: uploadDocument
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  $ref: "#/components/schemas/DocumentCategory"
                description:
                  type: string
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    get:
      tags: [Documents]
      summary: List my documents
      operationId: listMyDocuments
      security:
        - apiKey: []
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"

  /v1/documents/{id}:
    get:
      tags: [Documents]
      summary: Get a document
      operationId: getDocument
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  # ── RFIs (merchant-facing) ─────────────────────────────────────────

  /v1/rfis:
    get:
      tags: [RFIs]
      summary: List my RFIs
      operationId: listMyRFIs
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of RFIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFIList"

  /v1/rfis/{id}:
    get:
      tags: [RFIs]
      summary: Get an RFI
      operationId: getRFI
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: RFI details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFI"

  /v1/rfis/{id}/respond:
    post:
      tags: [RFIs]
      summary: Respond to an RFI
      operationId: respondToRFI
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                document_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Response submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFI"

  # ── Quotes ─────────────────────────────────────────────────────────

  /v1/quotes:
    post:
      tags: [Quotes]
      summary: Get an FX quote
      operationId: getQuote
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_currency, dest_currency, amount]
              properties:
                source_currency:
                  type: string
                  example: USD
                dest_currency:
                  type: string
                  example: EUR
                amount:
                  type: string
                  description: Decimal amount
                  example: "1000.00"
                method:
                  type: string
                  example: bank_transfer
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange_rate:
                    type: string
                  source_amount:
                    type: string
                  dest_amount:
                    type: string
                  fee:
                    type: string
                  fee_currency:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  # ── Corridors (merchant-facing) ────────────────────────────────────

  /v1/corridors:
    get:
      tags: [Corridors]
      summary: List available payment corridors
      description: Returns active corridors available to the merchant, with optional filters.
      operationId: listMerchantCorridors
      security:
        - apiKey: []
      parameters:
        - name: source_currency
          in: query
          schema:
            type: string
        - name: dest_currency
          in: query
          schema:
            type: string
        - name: dest_country
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of active corridors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Corridor"

  # ── Velocity Rules (merchant-facing) ───────────────────────────────

  /v1/velocity/rules:
    get:
      tags: [Velocity Rules]
      summary: List applicable velocity rules
      description: Read-only list of global and merchant-specific velocity rules.
      operationId: listMerchantVelocityRules
      security:
        - apiKey: []
      responses:
        "200":
          description: Applicable velocity rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VelocityRuleList"

  # ── Ops API ────────────────────────────────────────────────────────

  # ── Ops: Merchants ─────────────────────────────────────────────────

  /v1/ops/merchants:
    post:
      tags: [Merchants]
      summary: Create a merchant
      operationId: createMerchant
      security:
        - opsAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMerchantRequest"
      responses:
        "201":
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
    get:
      tags: [Merchants]
      summary: List all merchants
      operationId: listMerchants
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            type: string
          description: Filter by merchant status
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
      responses:
        "200":
          description: Paginated list of merchants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantList"

  /v1/ops/merchants/counts:
    get:
      tags: [Merchants]
      summary: Get merchant counts by status
      description: Returns merchant counts grouped by status.
      operationId: getMerchantCounts
      security:
        - opsAuth: []
      responses:
        "200":
          description: Counts by status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: integer

  /v1/ops/merchants/{id}:
    get:
      tags: [Merchants]
      summary: Get a merchant by ID
      operationId: getMerchantByID
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Merchant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
    put:
      tags: [Merchants]
      summary: Update a merchant
      description: Modifies merchant settings (risk rating, payout limits, webhook URL, rate limits).
      operationId: updateMerchant
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMerchantRequest"
      responses:
        "200":
          description: Merchant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/merchants/{id}/activate:
    post:
      tags: [Merchants]
      summary: Activate a merchant
      operationId: activateMerchant
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Merchant activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"

  /v1/ops/merchants/{id}/suspend:
    post:
      tags: [Merchants]
      summary: Suspend a merchant
      operationId: suspendMerchant
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Merchant suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"

  /v1/ops/merchants/{id}/reactivate:
    post:
      tags: [Merchants]
      summary: Reactivate a suspended merchant
      description: Transitions a suspended merchant back to active status.
      operationId: reactivateMerchant
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Merchant reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/merchants/{id}/terminate:
    post:
      tags: [Merchants]
      summary: Terminate a merchant
      description: Permanently closes a merchant account. Requires a reason.
      operationId: terminateMerchant
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Merchant terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/merchants/{id}/users:
    get:
      tags: [Merchants]
      summary: List merchant users
      description: Returns all users belonging to a merchant.
      operationId: listMerchantUsers
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  /v1/ops/merchants/{id}/users/invite:
    post:
      tags: [Merchants]
      summary: Invite a merchant user
      description: Sends a WorkOS invitation for a new merchant user with the specified role.
      operationId: inviteMerchantUser
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, accounting, technical, operator, viewer]
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    type: object
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/merchants/{id}/users/{uid}/role:
    put:
      tags: [Merchants]
      summary: Update merchant user role
      description: Changes a merchant user's role and syncs to WorkOS.
      operationId: updateMerchantUserRole
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, accounting, technical, operator, viewer]
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/merchants/{id}/users/{uid}/deactivate:
    post:
      tags: [Merchants]
      summary: Deactivate a merchant user
      description: Deactivates a merchant user account.
      operationId: deactivateMerchantUser
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/merchants/{id}/users/{uid}/activate:
    post:
      tags: [Merchants]
      summary: Activate a merchant user
      description: Reactivates a previously deactivated merchant user.
      operationId: activateMerchantUser
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/merchants/{id}/balances:
    get:
      tags: [Merchants]
      summary: List merchant balances
      description: Returns all balance accounts for a merchant.
      operationId: listMerchantBalances
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: List of balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceList"

  /v1/ops/merchants/{id}/api-keys:
    get:
      tags: [Merchants]
      summary: List merchant API keys
      description: Returns all API keys for a merchant.
      operationId: listMerchantAPIKeys
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"

  /v1/ops/merchants/{id}/api-keys/{kid}/revoke:
