        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of approval rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRuleList"

  /v1/ops/approvals/rules/{id}:
    get:
      tags: [Approvals]
      summary: Get an approval rule
      operationId: getApprovalRule
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Rule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRule"
    put:
      tags: [Approvals]
      summary: Update an approval rule
      operationId: updateApprovalRule
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRuleRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRule"

  /v1/ops/approvals/pending:
    get:
      tags: [Approvals]
      summary: List pending approval requests
      operationId: listPendingApprovals
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Pending approval requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestList"

  /v1/ops/approvals/{id}:
    get:
      tags: [Approvals]
      summary: Get an approval request
      operationId: getApprovalRequest
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Approval request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"

  /v1/ops/approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve a request
      operationId: approveRequest
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: X-Reviewer-ID
          in: header
          required: true
          schema:
            type: string
          description: ID of the approving reviewer (must differ from requester)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "403":
          description: Maker cannot be checker
        "409":
          description: Already decided or expired

  /v1/ops/approvals/{id}/reject:
    post:
      tags: [Approvals]
      summary: Reject a request
      operationId: rejectRequest
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: X-Reviewer-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"

  /v1/ops/approvals/{id}/decisions:
    get:
      tags: [Approvals]
      summary: List decisions for an approval request
      operationId: listApprovalDecisions
      security:
        - opsAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: List of decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalDecision"

# ── Components ─────────────────────────────────────────────────────
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "Merchant API key: `ak_live_...` or `ak_test_...`"
    opsAuth:
      type: http
      scheme: bearer
      description: Ops portal JWT/session token

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier (xid format)
      example: pay_cq1234567890abcdef

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items to return

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        format: uuid
      description: Unique key for idempotent request deduplication

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              fields:
                type: object
                additionalProperties:
                  type: string

  schemas:
    # ── Common ────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: string
          example: resource not found

    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean

    # ── Merchant ──────────────────────────────────────────────────────
    Merchant:
      type: object
      properties:
        id:
          type: string
          example: mer_cq1234567890abcdef
        legal_name:
          type: string
        trading_name:
          type: string
        registration_no:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2
        status:
          $ref: "#/components/schemas/MerchantStatus"
        risk_rating:
          type: string
          enum: [low, medium, high]
        primary_email:
          type: string
          format: email
        primary_phone:
          type: string
        kyb_completed_at:
          type: string
          format: date-time
        webhook_url:
          type: string
          format: uri
        daily_payout_limit:
          type: string
        monthly_payout_limit:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MerchantStatus:
      type: string
      enum: [pending, active, suspended, terminated]

    CreateMerchantRequest:
      type: object
      required: [legal_name, country, primary_email]
      properties:
        legal_name:
          type: string
        trading_name:
          type: string
        registration_no:
          type: string
        country:
          type: string
        primary_email:
          type: string
          format: email
        primary_phone:
          type: string

    MerchantList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Merchant"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Payout ────────────────────────────────────────────────────────
    Payout:
      type: object
      properties:
        id:
          type: string
          example: pay_cq1234567890abcdef
        merchant_id:
          type: string
        beneficiary_id:
          type: string
        batch_id:
          type: string
        idempotency_key:
          type: string
        status:
          $ref: "#/components/schemas/PayoutStatus"
        method:
          $ref: "#/components/schemas/PayoutMethod"
        source_amount:
          type: string
          description: Decimal string
        source_currency:
          type: string
        dest_amount:
          type: string
        dest_currency:
          type: string
        exchange_rate:
          type: string
        fee:
          type: string
        fee_currency:
          type: string
        rail_type:
          type: string
          enum: [fiat, crypto, stablecoin]
        rail_provider:
          type: string
        rail_reference:
          type: string
        network:
          type: string
        wallet_address:
          type: string
        token_contract:
          type: string
        token_symbol:
          type: string
        tx_hash:
          type: string
        block_confirmations:
          type: integer
        required_confirms:
          type: integer
        network_fee:
          type: string
        network_fee_currency:
          type: string
        purpose:
          type: string
        reference:
          type: string
        compliance_status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        screened_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time

    PayoutStatus:
      type: string
      enum:
        - created
        - pending_screening
        - screening_failed
        - pending_approval
        - approved
        - processing
        - sent
        - completed
        - failed
        - returned
        - cancelled
        - manual_review

    PayoutMethod:
      type: string
      enum:
        - bank_transfer
        - wire
        - sepa
        - swift
        - ach
        - faster_payment
        - mobile_money
        - wallet
        - on_chain
        - layer2
        - exchange
        - stablecoin

    CreatePayoutRequest:
      type: object
      required:
        - beneficiary_id
        - source_amount
        - source_currency
        - dest_currency
        - method
        - purpose
        - reference
      properties:
        beneficiary_id:
          type: string
        source_amount:
          type: string
        source_currency:
          type: string
        dest_currency:
          type: string
        method:
          $ref: "#/components/schemas/PayoutMethod"
        purpose:
          type: string
        reference:
          type: string
        network:
          type: string
        wallet_address:
          type: string
        token_contract:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    PayoutList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payout"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Beneficiary ───────────────────────────────────────────────────
    Beneficiary:
      type: object
      properties:
        id:
          type: string
          example: ben_cq1234567890abcdef
        merchant_id:
          type: string
        type:
          type: string
          enum: [individual, business]
        status:
          type: string
          enum: [pending, verified, blocked]
        first_name:
          type: string
        last_name:
          type: string
        company_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        country:
          type: string
        bank_name:
          type: string
        account_number:
          type: string
        iban:
          type: string
        swift_bic:
          type: string
        wallet_address:
          type: string
        wallet_network:
          type: string
        token_contract:
          type: string
        token_symbol:
          type: string
        address_verified:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBeneficiaryRequest:
      type: object
      required: [type, first_name, last_name, country]
      properties:
        type:
          type: string
          enum: [individual, business]
        first_name:
          type: string
        last_name:
          type: string
        company_name:
          type: string
        email:
          type: string
          format: email
        country:
          type: string
        bank_name:
          type: string
        account_number:
          type: string
        iban:
          type: string
        swift_bic:
          type: string
        wallet_address:
          type: string
        wallet_network:
          type: string

    BeneficiaryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Beneficiary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Balance ───────────────────────────────────────────────────────
    Balance:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        currency:
          type: string
        available:
          type: string
          description: Decimal string
        pending:
          type: string
        total:
          type: string
        updated_at:
          type: string
          format: date-time

    # ── API Key ───────────────────────────────────────────────────────
    APIKey:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        name:
          type: string
        prefix:
          type: string
          example: ak_live_
        environment:
          type: string
          enum: [test, live]
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    APIKeyCreateResult:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        raw_key:
          type: string
          description: Full API key value, only returned at creation time
          example: ak_live_cq1234567890abcdef_sEcReTkEyVaLuE

    # ── Batch ─────────────────────────────────────────────────────────
    Batch:
      type: object
      properties:
        id:
          type: string
          example: bat_cq1234567890abcdef
        merchant_id:
          type: string
        uploaded_by:
          type: string
        status:
          $ref: "#/components/schemas/BatchStatus"
        file_name:
          type: string
        file_format:
          type: string
          enum: [csv, xlsx]
        file_size:
          type: integer
          format: int64
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        processed_rows:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/BatchError"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    BatchStatus:
      type: string
      enum: [uploaded, validating, validated, processing, completed, failed, partial]

    BatchError:
      type: object
      properties:
        row:
          type: integer
        field:
          type: string
        message:
          type: string

    BatchList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Webhook ───────────────────────────────────────────────────────
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          example: whs_cq1234567890abcdef
        merchant_id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          type: string
          enum: [active, inactive]
        version:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEventType:
      type: string
      enum:
        - payout.created
        - payout.approved
        - payout.processing
        - payout.sent
        - payout.completed
        - payout.failed
        - payout.cancelled
        - payout.returned
        - beneficiary.created
        - beneficiary.updated
        - beneficiary.deleted
        - batch.uploaded
        - batch.completed
        - batch.failed
        - balance.low
        - funding.credit
        - screening.hit

    WebhookEvent:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        type:
          $ref: "#/components/schemas/WebhookEventType"
        payload:
          type: object
        created_at:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
        event_id:
          type: string
        subscription_id:
          type: string
        status:
          type: string
          enum: [pending, success, failed, abandoned]
        url:
          type: string
          format: uri
        response_status:
          type: integer
        response_body:
          type: string
        attempts:
          type: integer
        max_attempts:
          type: integer
        next_retry_at:
          type: string
          format: date-time
        error:
          type: string
        duration_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        metadata:
          type: object
          additionalProperties:
            type: string

    WebhookSubscriptionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSubscription"
        pagination:
          $ref: "#/components/schemas/Pagination"

    WebhookEventList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"

    WebhookDeliveryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Onboarding ────────────────────────────────────────────────────
    OnboardingApplication:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        status:
          $ref: "#/components/schemas/OnboardingStatus"
        legal_name:
          type: string
        trading_name:
          type: string
        registration_no:
          type: string
        business_type:
          type: string
        industry:
          type: string
        website:
          type: string
        reg_country:
          type: string
        primary_contact_name:
          type: string
        primary_contact_email:
          type: string
          format: email
        expected_monthly_volume:
          type: string
        destination_countries:
          type: array
          items:
            type: string
        source_currencies:
          type: array
          items:
            type: string
        beneficial_owners:
          type: array
          items:
            $ref: "#/components/schemas/BeneficialOwner"
        risk_tier:
          type: string
          enum: [low, standard, elevated, high]
        assigned_to:
          type: string
        rejection_reason:
          type: string
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OnboardingStatus:
      type: string
      enum: [draft, submitted, in_review, info_needed, approved, rejected, withdrawn]

    BeneficialOwner:
      type: object
      properties:
        full_name:
          type: string
        date_of_birth:
          type: string
        nationality:
          type: string
        country:
          type: string
        ownership_pct:
          type: integer
        role:
          type: string

    OnboardingApplicationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingApplication"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Document ──────────────────────────────────────────────────────
    Document:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        category:
          $ref: "#/components/schemas/DocumentCategory"
        status:
          type: string
          enum: [uploaded, accepted, rejected, expired]
        file_name:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
          format: int64
        entity_type:
          type: string
        entity_id:
          type: string
        uploaded_by:
          type: string
        description:
          type: string
        reviewed_by:
          type: string
        reviewed_at:
          type: string
          format: date-time
        rejection_reason:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    DocumentCategory:
      type: string
      enum:
        - incorporation
        - shareholder_register
        - director_id
        - ubo_id
        - proof_of_address
        - bank_statement
        - license
        - tax_certificate
        - aml_policy
        - financial_statement
        - beneficiary_proof
        - rfi_response
        - other

    # ── RFI ───────────────────────────────────────────────────────────
    RFI:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        status:
          type: string
          enum: [open, responded, in_review, resolved, escalated, closed]
        category:
          type: string
          enum:
            - source_of_funds
            - purpose_of_payment
            - beneficiary_info
            - documentation
            - unusual_activity
            - sanctions_related
            - other
        urgency:
          type: string
          enum: [low, medium, high, critical]
        entity_type:
          type: string
        entity_id:
          type: string
        subject:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            type: string
        response:
          type: string
        responded_at:
          type: string
          format: date-time
        resolution_note:
          type: string
        outcome:
          type: string
        due_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRFIRequest:
      type: object
      required: [merchant_id, category, urgency, subject, description, questions]
      properties:
        merchant_id:
          type: string
        category:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, critical]
        entity_type:
          type: string
        entity_id:
          type: string
        subject:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            type: string
        due_at:
          type: string
          format: date-time

    RFIList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RFI"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Pricing ───────────────────────────────────────────────────────
    PricingPlan:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        name:
          type: string
        active:
          type: boolean
        source_currency:
          type: string
        dest_currency:
          type: string
        dest_country:
          type: string
        method:
          type: string
        fee_type:
          type: string
          enum: [fixed, percentage, hybrid, tiered]
