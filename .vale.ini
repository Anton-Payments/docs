# Vale configuration for the Anton Payments public docs.
#
# Mintlify runs Vale on every PR. Without this config, Vale uses its
# default dictionary which flags common fintech/API terminology
# (idempotency, tokenization, counterparty, backoff, plaintext,
# hostnames, RFIs, JWTs, etc.) as suggestions. None of those are
# typos — just terms not in the default list.
#
# This config registers a project vocabulary under
# styles/config/vocabularies/AntonDocs so real typos still trigger
# the spellchecker while technical terms pass.
#
# Vale lints the WHOLE repo, not the PR diff. A term that goes
# unaccepted therefore fails every subsequent PR — including ones
# that touch no prose at all, such as a Dependabot lockfile bump.
# `.github/workflows/vale.yml` runs the same lint on every PR so the
# author who introduces a term sees it, instead of it silently
# blocking the queue afterwards.

StylesPath = styles
MinAlertLevel = suggestion
Vocab = AntonDocs

[*.mdx]
BasedOnStyles = Vale
Vale.Terms = NO

[*.md]
BasedOnStyles = Vale
Vale.Terms = NO

# CLAUDE.md is repo context for engineers, not published content —
# it is not in docs.json navigation and Mintlify never renders it.
# Spellchecking it only produces alerts that block unrelated PRs.
[CLAUDE.md]
BasedOnStyles =
