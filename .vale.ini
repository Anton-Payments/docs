# Vale configuration for the Anton Payments public docs.
#
# Mintlify runs Vale on every PR. Without this config, Vale uses its
# default dictionary which flags common fintech/API terminology
# (idempotency, tokenization, counterparty, backoff, plaintext,
# hostnames, RFIs, JWTs, etc.) as suggestions. None of those are
# typos — just terms not in the default list.
#
# This config registers a project vocabulary under
# styles/config/vocabularies/AntonDocs so real typos still trigger
# the spellchecker while technical terms pass.
#
# How Mintlify's hosted check chooses what to lint, because it is not
# what you would assume and it is why this file goes stale silently:
#
#   PR changes .md/.mdx  ->  lints ONLY those files
#   PR changes none      ->  "Running Vale across all Markdown/MDX files
#                             in this repository"
#
# So an unaccepted term never fails the PR that introduced it — that PR
# only ever sees its own files. It surfaces later, on a PR that touches
# no prose at all, such as a dependency lockfile bump. The PRs least able
# to fix prose are the only ones that see the whole-repo state, which is
# why a dependency queue can go red on a backlog none of its authors
# wrote.
#
# `.github/workflows/vale.yml` lints the whole tree on EVERY PR, so the
# author who adds a term is the one who sees it fail.

StylesPath = styles
MinAlertLevel = suggestion
Vocab = AntonDocs

[*.mdx]
BasedOnStyles = Vale
Vale.Terms = NO

[*.md]
BasedOnStyles = Vale
Vale.Terms = NO

# CLAUDE.md is repo context for engineers, not published content — it is
# not in docs.json navigation and Mintlify never renders it. Spellchecking
# it only produces alerts on unrelated PRs.
#
# The glob MUST be `**/CLAUDE.md`, not `CLAUDE.md`. A bare `CLAUDE.md`
# matches only when Vale is handed a relative path; pass the same file as
# an ABSOLUTE path and the section silently stops applying and all its
# alerts come back. Mintlify's hosted runner passes absolute paths, so the
# bare form works on a laptop and fails in CI — which is exactly what
# happened here. Verified: bare = 12 alerts absolute / 0 relative;
# `**/CLAUDE.md` = 0 both ways.
[**/CLAUDE.md]
BasedOnStyles =
