# Vale configuration for the Anton Payments public docs.
#
# Vale's default dictionary flags common fintech and API terms (idempotency, tokenization,
# counterparty, backoff, JWTs). This config registers a project vocabulary under
# styles/config/vocabularies/AntonDocs, so real typos still fail and technical terms pass.
# .github/workflows/vale.yml lints the whole tree on every PR, so the author who adds a term
# is the one who sees it fail.

StylesPath = styles
MinAlertLevel = suggestion
Vocab = AntonDocs

[*.mdx]
BasedOnStyles = Vale
Vale.Terms = NO

[*.md]
BasedOnStyles = Vale
Vale.Terms = NO

# CLAUDE.md is repo context for engineers, not published content. Spellchecking
# it only produces alerts on unrelated PRs.
#
# The glob MUST be `**/CLAUDE.md`, not `CLAUDE.md`. A bare `CLAUDE.md`
# matches only when Vale is handed a relative path; given an absolute path
# the section silently stops applying.
[**/CLAUDE.md]
BasedOnStyles =
