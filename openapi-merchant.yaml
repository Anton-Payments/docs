        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example: {"id":"ins_dbvlj5qukohfu54jbmlg","object":"instrument","livemode":false,"status":"active","beneficiary_id":"ben_dbvlj5qukohfu54jbmjg","method":"iban","currency":"EUR","country":null,"label":"Primary EUR account","default":true,"display_last4":"3000","display_bank":null,"display_network":"IBAN","masked_account":"IBAN ****3000","created_via":"api","source_batch_id":null,"metadata":{"cost_center":"4421"},"created_at":"2026-11-19T20:18:31.832Z","updated_at":"2026-11-19T20:18:31.832Z"}

    InstrumentDeleted:
      type: object
      description: The result of deleting an instrument.
      required: [id, object, deleted]
      properties:
        id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
        object:
          type: string
          enum: [instrument]
        deleted:
          type: boolean
          enum: [true]

    InstrumentCountry:
      type: object
      description: A country instruments can be created for.
      required: [object, livemode, code, name, method_count]
      properties:
        object:
          type: string
          enum: [instrument_country]
        livemode:
          type: boolean
          description: "`true` in production, `false` in sandbox."
        code:
          $ref: '#/components/schemas/CountryCode'
        name:
          type: string
          example: Germany
        method_count:
          type: integer
          description: How many payment methods are available in this country.

    InstrumentMethod:
      type: object
      description: |
        A payment method available in one country, with the credential fields to collect.
        Use it to drive dynamic instrument-creation forms.
      required: [object, livemode, country, country_name, method, label, category, default_currency, fields]
      properties:
        object:
          type: string
          enum: [instrument_method]
        livemode:
          type: boolean
          description: "`true` in production, `false` in sandbox."
        country:
          $ref: '#/components/schemas/CountryCode'
        country_name:
          type: string
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        label:
          type: string
          description: Human-friendly label for this method.
          example: IBAN (SEPA)
        category:
          type: string
          description: Grouping for display. New values may be added.
          enum: [bank_account, card, crypto, mobile_money, real_time_payment, national_identifier]
        default_currency:
          type: string
          description: The currency used when the instrument is created without one.
        fields:
          type: array
          description: Credential fields to collect, for `credentials` on create.
          items:
            type: object
            required: [key, label, type, required]
            properties:
              key:
                type: string
                example: iban
              label:
                type: string
                example: IBAN
              type:
                type: string
                enum: [string, enum]
              required:
                type: boolean
              pattern:
                type: string
                description: Format the value must match, when there is one.
              hint:
                type: string
              example:
                type: string
              options:
                type: array
                items:
                  type: string
                description: Allowed values when `type` is `enum`.

    PayoutStatus:
      type: string
      description: |
        What you see of a payout's lifecycle. The set is deliberately small and says nothing about why a
        payout is waiting or refused.

        - `created`: accepted; checks have not started.
        - `pending_approval`: waiting for a second person in your team to approve it (your own approval policy).
        - `processing`: being checked and prepared, or submitted to the rail.
        - `on_hold`: held for review. The `status_message` is the only thing we say about it. It cannot be cancelled while held.
        - `sent`: the rail confirmed dispatch.
        - `completed`: the beneficiary received the funds.
        - `returned`: the funds came back after being sent, possibly after the payout was `completed`.
        - `cancelled`: cancelled before submission: by you, or by Anton (an approval that expired, or a held payout Anton closed).
        - `failed`: the payout did not go through, and its status will not change again. `failure_code` says what the rail reported, or is
          `cannot_be_processed` when we could not process the payout (no further detail is given).

        Transitions: `created` to `pending_approval`, `processing` or `on_hold`; `pending_approval` to
        `processing` or `cancelled`; `processing` to `on_hold`, `sent`, `failed`, `returned` or `cancelled`; `on_hold` to
        `processing`, `cancelled` or `failed` (only Anton moves an `on_hold` payout to `cancelled`; you
        cannot); `sent` to `completed`, `failed` or `returned`; `completed` to `returned` (the receiving bank
        sent the funds back after settlement, so keep handling `payout.returned` after `completed`).
        `returned`, `cancelled` and `failed` are final. Treat a status you do not know as in progress.
      enum:
        - created
        - pending_approval
        - processing
        - on_hold
        - sent
        - completed
        - returned
        - cancelled
        - failed

    PayoutMethod:
      type: string
      description: "How the payout is delivered. Not the same as an `Instrument`'s `method` (the credential format): this is the rail-family selection."
      enum:
        - bank_transfer
        - wire
        - sepa
        - swift
        - ach
        - faster_payment
        - mobile_money
        - wallet
        - card
        - interac
        - crypto
        - layer2
        - exchange
        - stablecoin

    RailType:
      type: string
      enum: [fiat, crypto, stablecoin]

    Network:
      type: string
      description: Specific rail or chain. Set when the payout is routed.
      enum:
        - swift
        - sepa
        - ach
        - fps
        - rtgs
        - ethereum
        - bitcoin
        - tron
        - solana
        - polygon
        - arbitrum
        - optimism
        - base
        - avalanche
        - bsc
        - lightning
        - stellar
        - ripple

    PayoutCreateRequest:
      type: object
      required:
        - beneficiary_id
        - instrument_id
        - source_amount
        - destination_amount
        - destination_currency
        - method
        - purpose
        - reference
      properties:
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
          description: Must belong to the beneficiary named above and be active.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Amount debited from your balance (before fees), at most the source currency's precision.
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Funding currency. Defaults to your merchant's default currency.
        destination_amount:
          $ref: '#/components/schemas/Money'
          description: Amount the beneficiary receives, at most the destination currency's precision.
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        rail_type:
          $ref: '#/components/schemas/RailType'
          description: Hint for rail routing. Anton may override it based on corridor availability.
        network:
          $ref: '#/components/schemas/Network'
          description: Optional hint for the rail or chain to use.
        fixed_side:
          type: string
          enum: [fixed_source, fixed_destination]
          default: fixed_destination
          description: Which amount is authoritative. Anton recomputes the other from current corridor pricing.
        fee_bearer:
          type: string
          enum: [merchant, beneficiary]
          default: merchant
          description: Who absorbs the fee. `beneficiary` reduces the amount credited to them by the fee.
        purpose:
          type: string
          maxLength: 255
          description: |
            Payment purpose code, used for compliance reporting and corridor-specific rail requirements.
            Examples: `contractor_payment`, `supplier_payment`, `salary`, `refund`.
          example: contractor_payment
        reference:
          type: string
          maxLength: 100
          description: Your own reference. Reaches the beneficiary where the rail supports it.
          example: INV-1042
        external_id:
          type: string
          maxLength: 255
          description: |
            Your own identifier for the payee (CRM ID, accounting code), for reconciliation. Returned in
            `metadata.external_id` unless `metadata` already has that key. Must not contain personal data.
        metadata:
          $ref: '#/components/schemas/Metadata'
        end_user_ip:
          type: string
          description: |
            IP of the end user who initiated the payout, used for risk signals. Superseded by `session.ip`: when
            both are present, `session.ip` wins; prefer the `session` object.
        session:
          $ref: '#/components/schemas/SessionAssertion'
        quote_id:
          type: string
          pattern: '^pq_[a-zA-Z0-9]+$'
          description: |
            A bindable pricing quote returned by `POST /v1/pricing/quotes`. The payout fee is locked to the
            quoted value. The quote must be unexpired, unused, and match the payout's source and destination currencies,
            source and destination amounts, `method`, `rail_type` and destination country (the beneficiary's;
            these last three when the quote was priced with them), otherwise `422 quote_expired`, `409 quote_already_used` or `422 quote_mismatch`.

    SessionAssertion:
      type: object
      description: |-
        The end user's session as your edge observed it: the person who started this payout in your product, not your server. Every field is optional, but richer context improves Anton's risk assessment of the payout (IP geolocation and network type, timezone-vs-location consistency, device continuity).

        Data-quality issues never fail the payout. Only a syntactically invalid `ip` is rejected (`422`). Anything else is accepted and reported in the response's `session_quality` array so you can fix your integration: a private `ip` (usually a misconfigured proxy forwarding your own LB address), an unrecognized `timezone`, a future `started_at`.

        By sending session data you confirm you collected it lawfully from your end user, under your own privacy notice, and are authorized to share it with Anton for fraud prevention and AML transaction-monitoring purposes.
      properties:
        ip:
          type: string
          description: |
            The end user's public IP address (IPv4 or IPv6) as your edge
            observed it. Must be syntactically valid if present.
          example: 203.0.113.7
        user_agent:
          type: string
          maxLength: 512
          description: The end user's browser/client User-Agent, verbatim.
        accept_language:
          type: string
          maxLength: 64
          description: The end user's Accept-Language header value.
          example: en-CA
        timezone:
          type: string
          maxLength: 64
          description: The end user's IANA timezone name.
          example: America/Toronto
        device_hash:
          type: string
          maxLength: 128
          description: |
            An opaque device identifier computed by YOU (hash of whatever
            device signals you collect). Anton treats it as an opaque
            continuity token and never sees the underlying attributes.
        started_at:
          type: string
          format: date-time
          description: When the end user's session began (RFC 3339).

    Payout:
      type: object
      description: |-
        A payment from your balance to one of a payee's instruments. `status` is the public status (see
        `PayoutStatus`). Amounts are decimal strings at their currency's precision. A field that does not apply
        is `null`, never absent: crypto fields are `null` on a fiat payout.
      required:
        - id
        - object
        - livemode
        - status
        - status_message
        - failure_code
        - beneficiary_id
        - beneficiary_name
        - instrument_id
        - batch_id
        - method
        - rail_type
        - network
        - source_amount
        - source_currency
        - destination_amount
        - destination_currency
        - exchange_rate
        - fee
        - fee_currency
        - fee_bearer
        - fixed_side
        - fee_finalized
        - total_debited
        - total_debited_currency
        - buffer_amount
        - buffer_currency
        - wallet_address
        - token_contract
        - token_symbol
        - transaction_hash
        - block_confirmations
        - required_confirmations
        - network_fee
        - network_fee_currency
        - created_by
        - purpose
        - reference
        - metadata
        - created_at
        - updated_at
        - screened_at
        - approved_at
        - processed_at
        - completed_at
        - failed_at
        - cancelled_at
        - funds_released_at
        - risk
        - delivery
        - session_quality
      properties:
        id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
          example: pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB
        object:
          type: string
          enum: [payout]
        livemode:
          type: boolean
          description: '`true` in production, `false` in the sandbox.'
        status:
          $ref: '#/components/schemas/PayoutStatus'
        status_message:
          type: [string, 'null']
          description: |
            Our wording for a payout that is `on_hold`, or `failed` with `failure_code` `cannot_be_processed`.
            It never gives a reason. `null` otherwise.
        failure_code:
          type: [string, 'null']
          enum: [cannot_be_processed, provider_rejected, provider_unavailable, insufficient_funds, beneficiary_not_found, null]
          description: |
            Set when `status` is `failed`, otherwise `null`. `cannot_be_processed` means we could not process the
            payout and cannot say more. `provider_rejected` (the generic rail failure), `provider_unavailable`,
            `insufficient_funds` and `beneficiary_not_found` are what the rail reported. Treat an unknown code as a
            generic failure.
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        beneficiary_name:
          type: [string, 'null']
          description: The beneficiary's display name, set on list responses for convenience; `null` elsewhere.
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
        batch_id:
          type: [string, 'null']
          pattern: '^bat_[a-zA-Z0-9]+$'
          description: The batch that created the payout, if any.
        method:
          $ref: '#/components/schemas/PayoutMethod'
        rail_type:
          $ref: '#/components/schemas/RailType'
        network:
          oneOf:
            - $ref: '#/components/schemas/Network'
            - type: 'null'
        source_amount:
          $ref: '#/components/schemas/Money'
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
        destination_amount:
          $ref: '#/components/schemas/Money'
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
        exchange_rate:
          type: [string, 'null']
          pattern: '^\d+(\.\d+)?$'
          description: Source-to-destination rate; `null` on a same-currency payout.
        fee:
          $ref: '#/components/schemas/Money'
        fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        fee_bearer:
          type: string
          enum: [merchant, beneficiary]
        fixed_side:
          type: string
          enum: [fixed_source, fixed_destination]
        fee_finalized:
          type: boolean
          description: Whether `fee` is the final fee confirmed by the rail.
        total_debited:
          $ref: '#/components/schemas/Money'
          description: Total drawn from your balance (`source_amount` plus fee plus buffer while processing).
        total_debited_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buffer_amount:
          $ref: '#/components/schemas/Money'
          description: Cross-currency rate buffer held while processing, released on settlement.
        buffer_currency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
          description: Currency of `buffer_amount`; `null` when no buffer applies (the amount is then zero).
        wallet_address:
          type: [string, 'null']
          description: Destination wallet address. Crypto and stablecoin payouts only.
        token_contract:
          type: [string, 'null']
          description: Token contract address. Stablecoin payouts only.
        token_symbol:
          type: [string, 'null']
          example: USDC
        transaction_hash:
          type: [string, 'null']
          description: On-chain transaction hash, once sent. Crypto and stablecoin payouts only.
        block_confirmations:
          type: [integer, 'null']
          description: Confirmations observed so far.
        required_confirmations:
          type: [integer, 'null']
          description: Confirmations needed before the payout is `completed`.
        network_fee:
          type: [string, 'null']
          description: Network (gas) fee, deducted from the settlement and not from your balance.
        network_fee_currency:
          type: [string, 'null']
        created_by:
          type: [string, 'null']
          description: |
            The user (`usr_...`) in your team who created the payout in the dashboard; `null` for payouts
            created with programmatic credentials and batches. The creator can never approve their own payout.
        purpose:
          type: string
        reference:
          type: string
        screened_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            When the payout was checked and cleared before it was sent. `null` until then, and always
            `null` while the payout is `on_hold` or `failed`.
        approved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        processed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the payout was submitted to the rail.
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        failed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cancelled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        funds_released_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            When the funds reserved for the payout went back to your balance. `null` until then, for a
            payout that is not `failed`, `cancelled` or `returned`, and for one that is `on_hold` or
            failed with `cannot_be_processed`.
        risk:
          oneOf:
            - type: object
              required: [score, tier]
              properties:
                score:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 1000
                  description: The payout's risk score, 0 to 1000, higher is worse; `null` until scored.
                tier:
                  type: [string, 'null']
                  enum: [low, medium, high, critical, null]
                  description: The score's tier; `null` until scored.
              description: The payout's risk score and tier, and nothing else (no reasons or signals).
            - type: 'null'
          description: |
            The payout's risk score and tier. Always present: `null` while the payout has no score, and `null` for a
            payout that is `on_hold` or `failed`.
        delivery:
          oneOf:
            - $ref: '#/components/schemas/PayoutDelivery'
            - type: 'null'
          description: |
            Delivery-time context for the payout. Always present: `null` when the corridor has no estimate, when the
            payout is not in flight, and for a payout that is `on_hold` or `failed`. It is populated on retrieve
            (`GET /v1/payouts/{id}`), on create and cancel, and in webhook events (the same object, computed at that moment); it is `null` in lists, where computing it per payout would cost a query each.
        session_quality:
          type:
            - array
            - 'null'
          items:
            type: string
            enum: [non_public_ip, invalid_started_at, future_started_at, unknown_timezone]
          description: |
            Always present. On `POST /v1/payouts`, the data-quality flags found in the request's `session` object
            (non-blocking: the payout was created; fix the flagged fields to improve risk-signal quality); `null`
            when there are none and on every other response and event.
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        {
          "id": "pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB",
          "object": "payout",
          "livemode": false,
          "status": "processing",
          "status_message": null,
          "failure_code": null,
          "beneficiary_id": "ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1",
          "beneficiary_name": null,
          "instrument_id": "ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2",
          "batch_id": null,
          "method": "sepa",
          "rail_type": "fiat",
          "network": "sepa",
          "source_amount": "550.00",
          "source_currency": "USD",
          "destination_amount": "500.00",
          "destination_currency": "EUR",
          "exchange_rate": "0.9091",
          "fee": "5.00",
          "fee_currency": "USD",
          "fee_bearer": "merchant",
          "fixed_side": "fixed_destination",
          "fee_finalized": false,
          "total_debited": "557.50",
          "total_debited_currency": "USD",
          "buffer_amount": "0.00",
          "buffer_currency": null,
          "wallet_address": null,
          "token_contract": null,
          "token_symbol": null,
          "transaction_hash": null,
          "block_confirmations": null,
          "required_confirmations": null,
          "network_fee": null,
          "network_fee_currency": null,
          "created_by": null,
          "purpose": "supplier_payment",
          "reference": "PO-8821",
          "metadata": {
            "order_ref": "A-1042"
          },
          "created_at": "2026-11-19T14:03:22.104Z",
          "updated_at": "2026-11-19T14:03:25.871Z",
          "screened_at": null,
          "approved_at": null,
          "processed_at": null,
          "completed_at": null,
          "failed_at": null,
          "cancelled_at": null,
          "funds_released_at": null,
          "risk": null,
