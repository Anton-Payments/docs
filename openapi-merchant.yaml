  /v1/transactions:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Accounts]
      summary: List transactions
      operationId: listTransactions
      description: List movements on your balances across all accounts, newest first (ties break on `id`). Filter by type, direction, status, currency and creation time. `created_after` is inclusive and `created_before` is exclusive. Pages use an opaque `cursor`, and `next_cursor` is `null` on the last page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          required: false
          description: Only this kind of movement.
          schema:
            type: string
            enum: [payin, payout, fee, exchange, transfer, return]
        - name: direction
          in: query
          required: false
          description: Only money in (`credit`) or money out (`debit`).
          schema:
            type: string
            enum: [credit, debit]
        - name: status
          in: query
          required: false
          description: Only this status.
          schema:
            type: string
            enum: [completed, pending, failed, returned]
        - name: currency
          in: query
          required: false
          description: Only this currency (3 to 5 letters).
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: created_after
          in: query
          required: false
          description: Only transactions created at or after this time (inclusive), such as `2026-11-01T00:00:00.000Z`. Use an RFC 3339 UTC timestamp with millisecond precision and a Z suffix. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Only transactions created before this time (exclusive). Use an RFC 3339 UTC timestamp with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of transactions.
          content:
            application/json:
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantTransaction'
                  has_more:
                    type: boolean
                    description: Whether more results exist after this page.
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page. `null` on the last page.
              examples:
                response:
                  summary: Response
                  value:
                    {
                      "object": "list",
                      "data": [
                        {
                          "id": "stx_01",
                          "object": "transaction",
                          "livemode": false,
                          "type": "payout",
                          "status": "completed",
                          "direction": "debit",
                          "account_id": "acc_usd",
                          "amount": "40.00",
                          "currency": "USD",
                          "reference": "INV-1042",
                          "counterparty_name": null,
                          "payout_id": "pay_01",
                          "exchange_id": null,
                          "created_at": "2026-01-02T09:00:00.000Z",
                          "updated_at": "2026-01-02T09:00:00.000Z"
                        }
                      ],
                      "has_more": true,
                      "next_cursor": "eyJsYXN0X2lkIjoiKyIsImxhc3RfdHMiOiIxOTcwLTAxLTAxVDAwOjAwOjAxWiJ9"
                    }
        '400':
          description: An unknown query parameter (`unknown_parameter`), an invalid filter value or a timestamp that does not parse (`invalid_request`), a `limit` outside 1 to 100 (`invalid_limit`), or a malformed `cursor` (`cursor_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "invalid_request",
                        "message": "type must be one of: payin, payout, fee, exchange, transfer, return",
                        "param": "type",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#invalid_request",
                        "request_id": "req_01JD3XB7Q2"
                      }
                    }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

