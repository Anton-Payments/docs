    delete:
      tags: [Beneficiaries]
      summary: Delete a beneficiary
      operationId: deleteBeneficiary
      description: |-
        Soft-delete a beneficiary and remove its personal details from the vault. The beneficiary disappears from listings and can no longer start new payouts. Historical payouts that reference it stay unchanged and accessible.

        Archiving is usually the better choice: see `POST /v1/beneficiaries/{id}/archive`. Archiving keeps the beneficiary and its details, and you can restore it later.

        The body is optional and may carry only `end_user_ip`. Accepts an `Idempotency-Key` but does not require one.
      parameters:
