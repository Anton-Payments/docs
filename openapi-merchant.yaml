        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Instruments]
      summary: Update an instrument
      operationId: updateInstrument
      description: |-
        Update an instrument's `label`, `default`, `status` and `metadata`. A field you leave out stays unchanged. `null` clears `label` and `metadata`, and sets `default` to `false`. `status` cannot be cleared. When you send `metadata`, it replaces the whole map. Making an instrument the default unflags the payee's previous default. You cannot update credentials: create a new instrument and delete the old one.

        Accepts an `Idempotency-Key` but does not require one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
