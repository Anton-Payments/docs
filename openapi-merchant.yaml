        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Instruments]
      summary: Delete an instrument
      operationId: deleteInstrument
      description: |-
        Delete an instrument and remove its credentials from the vault. The instrument disappears from listings and cannot be used on new payouts. Past payouts that used it stay accessible and unchanged.

        The body is optional. When you send one, it may carry only `end_user_ip`. Accepts an `Idempotency-Key` but does not require one.
      parameters:
