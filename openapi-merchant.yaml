    PaymentMethodCode:
      type: string
      description: |-
        Credential format of a payment instrument, named by what data is stored, not by the rail that delivers the funds. One credential type can route to multiple rails (e.g. an IBAN can go via SEPA, SEPA Instant, TARGET2, SWIFT, or CHAPS). The rail is selected at payout time.

        Query `GET /v1/payment-methods` for the full country-specific catalog, including per-method credential schemas.
      enum:
        - iban
        - uk_bank
        - us_bank
        - ca_bank
        - au_bank
        - nz_bank
        - jp_bank
        - in_bank
        - za_bank
        - ng_bank
        - ph_bank
        - cl_bank
        - co_bank
        - swift
        - clabe
        - cbu
        - cci
        - pix
        - upi
        - interac
        - paynow
        - fps_hk
        - promptpay
        - card
        - crypto
        - mobile_money

    InstrumentCreateRequest:
      type: object
      required: [beneficiary_id, method, credentials]
      additionalProperties: false
      description: |
        Create an instrument attached to a beneficiary.

        The `credentials` object shape varies by `method`. A few common shapes:

        - `iban`: `{ "iban": "GB82WEST12345698765432", "bic": "WESTGB22" }` (BIC optional)
        - `uk_bank`: `{ "account_number": "12345678", "sort_code": "123456" }`
        - `us_bank`: `{ "routing_number": "026073150", "account_number": "...", "account_type": "checking" }`
        - `crypto`: `{ "wallet_address": "0x...", "network": "ethereum", "token_symbol": "USDC" }`
        - `card`: `{ "number": "...", "exp_month": "12", "exp_year": "2028" }` (routed through the PCI vault)

        Call `GET /v1/instruments/methods?country=XX` for the exact fields each method asks for.
      properties:
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
          description: The beneficiary the instrument belongs to.
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        currency:
          $ref: '#/components/schemas/IntelligenceCurrencyOrAssetCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        label:
          type: string
          description: Your label for this instrument (e.g. "Payroll - primary account").
          maxLength: 255
        credentials:
          type: object
          description: Method-specific credential fields. Tokenized on receipt.
          additionalProperties: true
        default:
          type: boolean
          description: Make this the payee's default instrument. The previous default, if any, is unflagged.
          default: false
        metadata:
          $ref: '#/components/schemas/Metadata'
        end_user_ip:
          type: string
          description: IP address of the end user who started this action. Optional.

    InstrumentUpdateRequest:
      type: object
      description: |
        Mutable fields on an instrument. A field left out is left unchanged; `null` clears
        `label` and `metadata` and sets `default` to `false`.
      additionalProperties: false
      properties:
        label:
          type: [string, 'null']
          maxLength: 255
        default:
          type: [boolean, 'null']
        status:
          type: string
          enum: [active, disabled]
          description: Cannot be `null`.
        metadata:
          oneOf:
            - $ref: '#/components/schemas/Metadata'
            - type: 'null'
          description: Replaces the whole map. Set to `null` to clear.
        end_user_ip:
          type: string

    Instrument:
      type: object
      description: |
        A payment destination attached to a beneficiary. Credentials (account numbers,
        wallet addresses, card PANs) are tokenized in a secure vault and never returned
        by the API; only masked display fields are.
      required: [id, object, livemode, status, beneficiary_id, method, currency, country, label, default, display_last4, display_bank, display_network, masked_account, created_via, source_batch_id, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
          example: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
        object:
          type: string
          enum: [instrument]
        livemode:
          type: boolean
          description: "`true` in production, `false` in sandbox."
        status:
          type: string
          enum: [active, disabled]
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        currency:
          type: [string, 'null']
          description: Default currency of the instrument, if known.
        country:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2 country, if known.
        label:
          type: [string, 'null']
          description: Your label for the instrument.
        default:
          type: boolean
          description: Whether this is the beneficiary's default instrument for payouts.
        display_last4:
          type: [string, 'null']
          description: Last 4 characters of the primary credential (account number, PAN, wallet address), for display.
        display_bank:
          type: [string, 'null']
          description: Bank name, for display.
        display_network:
          type: [string, 'null']
          description: Card network, chain or scheme, for display (e.g. `visa`, `ethereum`, `IBAN`).
        masked_account:
          type: [string, 'null']
          description: The masked credential for list views.
          example: "IBAN ****3000"
        created_via:
          type: string
          enum: [api, batch, portal]
          description: The surface that first created the instrument.
        source_batch_id:
          type: [string, 'null']
