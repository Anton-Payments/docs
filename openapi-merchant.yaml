    WebhookSubscriptionCreateRequest:
      type: object
      description: Register an endpoint.
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint that receives deliveries. Must be publicly reachable.
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Event types to deliver, at least one.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.

    WebhookSubscriptionUpdateRequest:
      type: object
      description: >-
        Change an endpoint. Only fields you send change. `metadata` replaces the whole map; `null`
        clears it. `url` and `events` cannot be cleared. At least one field is required. Status changes
        use `activate` and `deactivate`, and the secret `secret/rotate`.
      required: []
      properties:
        url:
          type: string
          format: uri
          description: New endpoint URL.
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: The full new list of event types.
        metadata:
          oneOf:
            - $ref: '#/components/schemas/Metadata'
            - type: 'null'
          description: The full new metadata map, or `null` to clear it.

    WebhookSubscription:
      type: object
      description: >-
        A webhook endpoint subscription. The signing secret is never part of it: it is shown once, on
        create and on rotate, and cannot be read back.
      required: [id, object, livemode, status, url, events, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [webhook_subscription]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          enum: [active, inactive]
          description: Whether deliveries are sent.
        url:
          type: string
          format: uri
          description: The endpoint URL.
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Event types delivered.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    WebhookEvent:
      type: object
      description: "An event: what each delivery to your endpoint carries, and what `GET /v1/webhooks/events` returns. Events are immutable. `data.object` is the object the API returns for the resource, rendered at the event's own `api_version`. That is the version your account was pinned to when the event was created, so a retry sends the same bytes. `x-anton-data-objects` on `WebhookEventType` names the schema of each type's `data.object`. An event stored before API versions existed is shown as it was stored, under the launch version."
      required: [id, object, type, api_version, livemode, created_at, data]
      properties:
        id:
          type: string
          description: Unique identifier, prefixed `evt_`.
        object:
          type: string
          enum: [event]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        type:
          $ref: '#/components/schemas/WebhookEventType'
          description: The event type.
        api_version:
          type: string
          description: The API version `data.object` is rendered at.
          example: '2026-12-01'
        data:
          type: object
          description: The event data.
          required: [object]
          properties:
            object:
              description: The resource the event is about, as the API returns it.
              anyOf:
                - $ref: '#/components/schemas/WebhookTestObject'
                # BEGIN GENERATED: webhook event data.object schemas
                - $ref: '#/components/schemas/Payout'
                - $ref: '#/components/schemas/PolicyMatch'
                - $ref: '#/components/schemas/Beneficiary'
                - $ref: '#/components/schemas/BeneficiaryDeleted'
                - $ref: '#/components/schemas/Instrument'
                - $ref: '#/components/schemas/InstrumentDeleted'
                - $ref: '#/components/schemas/Batch'
                - $ref: '#/components/schemas/ScheduleEvent'
                - $ref: '#/components/schemas/BalanceAlert'
                - $ref: '#/components/schemas/FundingCredit'
                - $ref: '#/components/schemas/FXQuote'
                - $ref: '#/components/schemas/FXExchange'
                - $ref: '#/components/schemas/VerificationEvent'
                - $ref: '#/components/schemas/IntelligenceEvaluation'
                - $ref: '#/components/schemas/Insight'
                - $ref: '#/components/schemas/ReviewEvent'
                # END GENERATED
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the event was created.

    WebhookDelivery:
      type: object
      description: One delivery attempt record. It holds what your server answered (status, up to 4 KB of body, headers) and the headers Anton sent, signature included, which is what you need to debug verification. The same shape serves one endpoint's history and one event's attempts.
      required: [id, object, livemode, status, event_id, event_type, subscription_id, url, request_headers, response_status, response_body, response_headers, attempts, max_attempts, next_retry_at, error, duration_milliseconds, delivered_at, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [webhook_delivery]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          enum: [pending, success, failed, abandoned]
          description: >-
            `failed` means another try is scheduled; `abandoned` means every try failed.
        event_id:
          type: string
          description: The event delivered.
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
          description: The type of that event.
        subscription_id:
          type: string
          description: The endpoint delivered to.
        url:
          type: string
          description: The URL at dispatch time.
        request_headers:
          type: object
          additionalProperties:
            type: string
          description: Headers Anton sent.
        response_status:
          type: [integer, 'null']
          description: HTTP status your server answered, `null` if it did not.
        response_body:
          type: [string, 'null']
          description: Up to 4 KB of your server's answer.
        response_headers:
          type: object
          additionalProperties:
            type: string
          description: Your server's response headers; credential-bearing ones are redacted.
        attempts:
          type: integer
          description: Tries so far.
        max_attempts:
          type: integer
          description: Tries before the delivery is abandoned.
        next_retry_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the next try is scheduled.
        error:
          type: [string, 'null']
          description: Why the last try failed.
        duration_milliseconds:
          type: integer
          description: How long the last try took.
        delivered_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the delivery succeeded.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.



    WebhookDeliverySummary:
      type: object
      description: >-
        Delivery outcomes over the last 30 days, with the retry schedule deliveries follow. A computed
        report: it has no `id`.
      required: [object, livemode, subscription_id, since, until, delivered, retrying, abandoned, pending, last_delivered_at, retry_policy]
      properties:
        object:
          type: string
          enum: [webhook_delivery_summary]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        subscription_id:
          type: [string, 'null']
          description: The endpoint the summary is for; `null` for every endpoint.
        since:
          $ref: '#/components/schemas/Timestamp'
          description: Start of the window.
        until:
          $ref: '#/components/schemas/Timestamp'
          description: End of the window.
        delivered:
          type: integer
          description: Deliveries that succeeded.
        retrying:
          type: integer
          description: Deliveries with another try scheduled.
        abandoned:
          type: integer
          description: Deliveries where every try failed.
        pending:
          type: integer
          description: Deliveries not yet tried.
        last_delivered_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Most recent success.
        retry_policy:
          type: object
          required: [max_attempts, retry_after_seconds]
          properties:
            max_attempts:
              type: integer
            retry_after_seconds:
              type: array
              items:
                type: integer
          description: >-
            The schedule failed deliveries follow: tries, and the wait before each retry in seconds.

    Balance:
      type: object
      description: >-
        Your balance in one currency. `available` is what new payouts can use, `pending` is reserved for
        in-flight payouts, and `total` is the two together. The figures come from Anton's own ledger and
        are what the overdraft guard enforces. Amounts carry the currency's precision.
      required: [id, object, livemode, currency, available, pending, total, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [balance]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the balance.
        available:
          $ref: '#/components/schemas/Money'
          description: Funds available for new payouts.
        pending:
          $ref: '#/components/schemas/Money'
          description: Funds reserved for in-flight payouts.
        total:
          $ref: '#/components/schemas/Money'
          description: Available plus pending.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the balance last changed.

    Corridor:
      type: object
      description: >-
        An active route Anton pays out through: a destination currency, destination country and method.
        The rail behind a corridor and its routing priority are not exposed.
      required: [id, object, livemode, rail_type, destination_currency, destination_country, network, method, active, cutoff_time, settlement_days, settlement_minutes, min_amount, max_amount, required_confirmations]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [corridor]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        rail_type:
          type: string
          enum: [fiat, crypto, stablecoin]
          description: Rail family.
        destination_currency:
          type: string
          description: Currency paid out, the destination of the payout.
        destination_country:
          type: string
          description: ISO 3166-1 alpha-2 code, or `XX` for a global crypto corridor.
        network:
          type: [string, 'null']
          description: Blockchain network for crypto corridors, otherwise `null`.
        method:
          type: string
          description: Payout method code.
        active:
          type: boolean
          description: >-
            Always true: only active corridors are listed.
        cutoff_time:
          type: [string, 'null']
          description: Daily cut-off for same-day delivery on fiat corridors, otherwise `null`.
        settlement_days:
          type: integer
          description: Expected delivery in business days.
        settlement_minutes:
          type: [integer, 'null']
          description: Expected delivery in minutes for crypto corridors, otherwise `null`.
        min_amount:
          type: [string, 'null']
          description: Smallest payout the corridor accepts, in the destination currency, or `null`.
        max_amount:
          type: [string, 'null']
          description: Largest payout the corridor accepts, in the destination currency, or `null`.
        required_confirmations:
          type: [integer, 'null']
          description: Block confirmations a crypto corridor waits for, otherwise `null`.

    PayoutDelivery:
      type: object
      description: |-
        Delivery-time context for a payout, based on how its destination corridor (country × method) has performed over the trailing 30 days. It appears only when the corridor has enough completed payouts across enough distinct merchants, and only while the payout is non-terminal. It is omitted once the payout reaches a terminal state (`completed`, `failed`, `returned`, `cancelled`), where an ETA carries no meaning.

        `estimated_completion_at` and a `delayed` value of `true` are meaningful only while the payout is in flight (`processing` or `sent`, with a `processed_at` timestamp). In every other non-terminal state, `estimated_completion_at` is omitted and `delayed` is `false`.
      required: [corridor, method, p50_minutes, p90_minutes, sample_size, delayed]
      properties:
        corridor:
          $ref: '#/components/schemas/CountryCode'
          description: ISO 3166-1 alpha-2 destination country for this payout.
        method:
          type: string
        p50_minutes:
          type: integer
          description: Median send-to-complete time for the corridor, in minutes.
        p90_minutes:
          type: integer
          description: 90th-percentile send-to-complete time for the corridor, in minutes.
        sample_size:
          type: integer
          description: Number of completed payouts the percentiles were computed from.
        estimated_completion_at:
          type: string
          format: date-time
          description: "When the payout is expected to finish: `processed_at` plus p50 minutes, in RFC 3339 UTC. Present only while the payout is in flight."
        delayed:
          type: boolean
          description: True when an in-flight payout has run past the corridor's p90 delivery time, so it is slower than 90% of comparable payouts.

    FXQuoteCreateRequest:
      type: object
      description: >-
        Quote a conversion. `source` is the currency you give up and `destination` the one you receive.
        Fix one side: send exactly one of `source_amount` and `destination_amount`; the other is
        computed.
      required: [source_currency, destination_currency]
      properties:
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you give up.
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you receive.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Fix the amount you give up, at the source currency's precision.
        destination_amount:
          $ref: '#/components/schemas/Money'
          description: Fix the amount you receive, at the destination currency's precision.
        locked:
          type: boolean
          description: >-
            Lock the rate so the quote can be executed. Default `true`. `false` returns an indicative price
            that cannot be executed and is not stored.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.

    FXQuote:
      type: object
      description: >-
        An FX quote. A locked quote is stored and can be executed on `POST /v1/fx/exchanges` until
        `expires_at`; an indicative quote (`locked: false`) is a price only, has `expires_at: null` and can never be
        executed (`422 quote_not_locked`). `source` is the currency you give up, `destination` the one you receive.
      required: [id, object, livemode, status, locked, source_currency, destination_currency, source_amount, destination_amount, mid_market_rate, customer_rate, inverse_rate, markup_basis_points, fee, fee_currency, expires_at, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [fx_quote]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          enum: [active, used, expired, cancelled]
          description: Lifecycle of a locked quote; indicative quotes are `active`.
        locked:
          type: boolean
          description: Whether the rate is locked.
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you give up.
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you receive.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Amount you give up.
        destination_amount:
          $ref: '#/components/schemas/Money'
          description: Amount you receive.
        mid_market_rate:
          type: string
          description: Mid-market rate, six decimal places.
        customer_rate:
          type: string
          description: The rate you get, six decimal places.
        inverse_rate:
          type: string
          description: One over the customer rate, six decimal places.
        markup_basis_points:
          type: integer
          description: Markup on the mid-market rate, in basis points.
        fee:
          $ref: '#/components/schemas/Money'
          description: Conversion fee, in `fee_currency`.
        fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the fee.
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When a locked quote stops being executable; `null` on an indicative quote.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    FXExchange:
      type: object
      description: >-
        An executed conversion between two of your balances. `source` is the currency you gave up,
        `destination` the one you received. `markup_basis_points`, `fee` and `fee_currency` are the
        pricing of the quote that was executed, `null` when that quote is no longer on record.
      required: [id, object, livemode, status, quote_id, payout_id, source_currency, destination_currency, source_amount, destination_amount, mid_market_rate, customer_rate, markup_basis_points, fee, fee_currency, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [fx_exchange]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          enum: [completed, pending, failed]
          description: Where the conversion stands. `completed` means the funds have moved, your destination balance is credited and the source amount is debited. `pending` means the conversion has not settled yet; the source amount stays held on your balance and nothing is credited until it settles. `failed` means it did not go through; the held amount is released and nothing is credited. A `pending` exchange moves to `completed` or `failed` on its own, and you are told through the `fx.exchange.completed` or `fx.exchange.failed` webhook event, or you can read it with `GET /v1/fx/exchanges/{id}`.
        quote_id:
          type: [string, 'null']
          description: The locked quote that was executed.
        payout_id:
          type: [string, 'null']
          description: The payout the exchange was made for, when there is one.
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you gave up.
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you received.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Amount you gave up.
        destination_amount:
          $ref: '#/components/schemas/Money'
          description: Amount you received.
        mid_market_rate:
          type: string
          description: Mid-market rate, six decimal places.
        customer_rate:
          type: string
          description: The rate you got, six decimal places.
        markup_basis_points:
          type: [integer, 'null']
          description: Markup on the mid-market rate, in basis points.
        fee:
          type: [string, 'null']
          description: Conversion fee, in `fee_currency`.
        fee_currency:
          type: [string, 'null']
          description: Currency of the fee.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.



    MerchantAccount:
      type: object
      description: >-
        A funding account in one currency: where you receive money. It uses the same three words as a
        balance: `pending` is what is not yet available.
      required: [id, object, livemode, status, currency, country, available, pending, total, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [account]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          description: Account status, for example `active`.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the account.
        country:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2 country of the account, when it has one.
        available:
          $ref: '#/components/schemas/Money'
          description: Funds available now.
        pending:
          $ref: '#/components/schemas/Money'
          description: Funds not yet available (total minus available).
        total:
          $ref: '#/components/schemas/Money'
          description: Everything the account holds.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    AccountDetails:
      type: object
      description: >-
        The bank details to pay money into an account. Its `id` is the id of the account it belongs to.
        Which fields are set depends on the currency and country; the others are `null`.
      required: [id, object, livemode, currency, country, holder_name, bank_name, iban, bic, account_number, sort_code, routing_codes]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [account_details]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the account.
        country:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2 country of the account.
        holder_name:
          type: [string, 'null']
          description: Name the account is held in.
        bank_name:
          type: [string, 'null']
          description: Name of the bank.
        iban:
          type: [string, 'null']
          description: IBAN.
        bic:
          type: [string, 'null']
          description: BIC or SWIFT code.
        account_number:
          type: [string, 'null']
          description: Account number.
        sort_code:
          type: [string, 'null']
          description: UK sort code.
        routing_codes:
          type: object
          additionalProperties:
            type: string
          description: Other routing codes, by scheme (for example `ach`).

    MerchantTransaction:
      type: object
      description: >-
        One movement on your balance. `amount` is unsigned: `direction` says which way the money moved.
        The ledger does not record when a transaction last changed, so `updated_at` equals `created_at`.
      required: [id, object, livemode, type, status, direction, account_id, amount, currency, reference, counterparty_name, payout_id, exchange_id, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [transaction]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          enum: [completed, pending, failed, returned]
          description: Where the movement stands.
        type:
          type: string
          enum: [payin, payout, fee, exchange, transfer, return]
          description: What kind of movement it is.
        direction:
          type: [string, 'null']
          enum: [credit, debit]
          description: >-
            `credit` is money in, `debit` money out; `null` when it could not be told.
        account_id:
          type: [string, 'null']
          description: The account the movement is on.
        amount:
          $ref: '#/components/schemas/Money'
          description: Unsigned amount at the currency's precision.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the movement.
        reference:
          type: [string, 'null']
          description: Reference carried by the movement.
        counterparty_name:
          type: [string, 'null']
          description: Name of the other side, when known.
        payout_id:
          type: [string, 'null']
          description: The payout the movement belongs to, when there is one.
        exchange_id:
          type: [string, 'null']
          description: The FX exchange the movement belongs to, when there is one.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    PricingPlan:
      type: object
      description: >-
        One fee rule that applies to you. Percentages are percent (`1.50` is 1.5%); amounts are decimal
        strings. A `null` scope field means the rule applies to all.
      required: [id, object, livemode, name, source_currency, destination_currency, destination_country, method, fee_type, fixed_fee, fixed_fee_currency, percentage_fee, min_fee, max_fee, tiers, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [pricing_plan]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        name:
          type: string
          description: Plan name.
        source_currency:
          type: [string, 'null']
          description: Source currency the rule applies to, or `null` for all.
        destination_currency:
          type: [string, 'null']
          description: Destination currency the rule applies to, or `null` for all.
        destination_country:
          type: [string, 'null']
          description: Destination country the rule applies to, or `null` for all.
        method:
          type: [string, 'null']
          description: Payout method the rule applies to, or `null` for all.
        fee_type:
          type: string
          enum: [fixed, percentage, hybrid, tiered]
          description: How the fee is worked out.
        fixed_fee:
          $ref: '#/components/schemas/Money'
          description: Flat part of the fee, in `fixed_fee_currency`.
        fixed_fee_currency:
          type: string
          description: Currency of the flat fee and the caps (empty when the plan has none).
        percentage_fee:
          $ref: '#/components/schemas/Money'
          description: Percentage part of the fee, in percent.
        min_fee:
          $ref: '#/components/schemas/Money'
          description: Smallest fee charged.
        max_fee:
          $ref: '#/components/schemas/Money'
          description: Largest fee charged; zero means no cap.
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PricingTier'
          description: Volume tiers of a tiered plan, otherwise empty.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    PricingTier:
      type: object
      description: One volume tier of a tiered plan.
      required: [min_volume, max_volume, fixed_fee, percentage_fee]
      properties:
        min_volume:
          type: string
          description: Monthly volume where the tier starts.
        max_volume:
          type: string
          description: Monthly volume where the tier ends; `0` means no limit.
        fixed_fee:
          type: string
          description: Flat fee in the tier.
        percentage_fee:
          type: string
          description: Percentage fee in the tier, in percent.

    PricingQuoteCreateRequest:
      type: object
      description: Price a payout and store the quote.
      required: [source_currency, destination_currency, source_amount]
      properties:
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you pay from.
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency the payee receives.
        destination_country:
          $ref: '#/components/schemas/CountryCode'
          description: Destination country, when the fee depends on it.
        method:
          type: string
          description: Payout method code.
        rail_type:
          type: string
          enum: [fiat, crypto, stablecoin]
          description: Rail family, when the method is ambiguous.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Amount to pay from the source currency, at its precision.
        destination_amount:
          $ref: '#/components/schemas/Money'
          description: >-
            Amount the payee receives; computed from the indicative FX rate when omitted on a cross-currency
            quote.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.

    PricingQuote:
      type: object
      description: >-
        A stored fee quote. Pass its `id` as `quote_id` on `POST /v1/payouts` before `expires_at` to pin
        the fee and rate it carries. Quotes last five minutes and bind to one payout.
      required: [id, object, livemode, status, pricing_plan_id, fee_type, source_currency, destination_currency, source_amount, destination_amount, fee, fee_currency, rate, rail_type, method, total_cost, total_cost_currency, expires_at, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [pricing_quote]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          enum: [active, consumed, expired]
          description: >-
            `active` until it is bound to a payout (`consumed`) or passes `expires_at` (`expired`).
        pricing_plan_id:
          type: [string, 'null']
          description: The plan that priced the quote.
        fee_type:
          type: string
          description: The plan's fee type.
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you pay from.
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency the payee receives.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Amount paid from the source currency.
        destination_amount:
          $ref: '#/components/schemas/Money'
          description: Amount the payee receives.
        fee:
          $ref: '#/components/schemas/Money'
          description: The fee, in `fee_currency`.
        fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency the fee is charged in.
        rate:
          type: string
          description: FX rate applied; 1 for a same-currency payout.
        rail_type:
          type: [string, 'null']
          description: Rail family, when set on the request.
        method:
          type: [string, 'null']
          description: Payout method, when set on the request.
        total_cost:
          $ref: '#/components/schemas/Money'
          description: Source amount plus fee when both are in the source currency, otherwise the source amount.
        total_cost_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of `total_cost`.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the quote stops being bindable.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    FXExchangeCreateRequest:
      type: object
      description: >-
        Execute a conversion. Send `quote_id` to execute a locked quote at its rate, or the currencies
        and `destination_amount` to quote and execute in one step. `quote_id` cannot be combined with
        the other fields.
      required: []
      properties:
        quote_id:
          type: string
          description: A locked FX quote (`fxq_`) to execute.
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you give up (one-step mode).
        destination_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency you receive (one-step mode).
        destination_amount:
          $ref: '#/components/schemas/Money'
          description: Amount you receive (one-step mode).
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs. Never put personal data in it.

    WebhookSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Signing secret (`whsec_` + 64 hex). Shown once, here, so store it now.
              example: whsec_0a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef

    WebhookSubscriptionRotated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          required: [secret, previous_secret_expires_at]
          properties:
            secret:
              type: string
              description: The new signing secret. Shown once, here.
              example: whsec_0a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef
            previous_secret_expires_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
              description: When the previous secret stops signing. Until then deliveries carry two signatures. `null` after an immediate rotation.

    WebhookEventTypeInfo:
      type: object
      description: >-
        An event type a subscription can name, with its label and category. Generated from the event
        catalog in code; rows come in presentation order.
      required: [id, object, livemode, type, label, description, category, category_label, category_description, deprecated]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [webhook_event_type]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        type:
          $ref: '#/components/schemas/WebhookEventType'
          description: The event type. Same as `id`.
        label:
          type: string
          description: Display label.
        description:
          type: string
          description: What the event means.
        category:
          type: string
          description: Category key, such as `payouts`.
        category_label:
          type: string
          description: Display label of the category.
        category_description:
          type: string
          description: What the category covers.
        deprecated:
          type: boolean
          description: True for a type that is still accepted but no longer sent.

    DeletedObject:
      type: object
      description: The answer to a successful delete.
      required: [id, object, deleted]
      properties:
        id:
          type: string
          description: The id of the deleted object.
        object:
          type: string
          description: The type of the deleted object.
        deleted:
          type: boolean
          enum: [true]
          description: Always true.

    SandboxDeposit:
      type: object
      description: >-
        A credit to a sandbox balance. It is not stored as a record of its own, so there is no endpoint
        to retrieve it.
      required: [id, object, livemode, currency, amount, available, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [sandbox_deposit]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency credited.
        amount:
          $ref: '#/components/schemas/Money'
          description: What this call credited.
        available:
          $ref: '#/components/schemas/Money'
          description: The balance's available figure after the credit.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    CreateIntelligenceEvaluationRequest:
      type: object
      additionalProperties: false
      required: [use_case, entity]
      properties:
