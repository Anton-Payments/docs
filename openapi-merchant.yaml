  /v1/payouts/cancel:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Payouts]
      summary: Cancel several payouts
      operationId: cancelPayouts
      description: |-
        Cancel up to 200 payouts in one call. Each payout is cancelled on its own, under the same rules as `POST /v1/payouts/{id}/cancel`. The call is not atomic: the response lists, per ID, which payouts were cancelled and which were not, and why. A payout that is on hold or already submitted to a rail is reported under `failed`, not as an error of the call.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCancelRequest'
            example:
              ids:
                - pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB
                - pay_01HX8Z9K0M2N3P4Q5R6S7T8UAC
      responses:
        '200':
          description: The outcome for each ID.
          content:
            application/json:
              example: {"object":"payout_cancellation_result","livemode":false,"cancelled":[],"failed":[{"id":"pay_dbvqrpqukoh470i0a7tg","code":"payout_not_cancellable","message":"payout could not be cancelled"},{"id":"pay_missing","code":"resource_missing","message":"payout not found"}]}
              schema:
                $ref: '#/components/schemas/PayoutCancelResult'
        '400':
          description: '`ids_required`, `too_many_ids`, `resource_id_invalid` (an ID is not a payout ID; `param` names it), or the request body is malformed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/payouts/{id}:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Payout ID (prefixed `pay_`).
        schema:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
          example: pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB
    get:
      tags: [Payouts]
      summary: Retrieve a payout
      operationId: getPayout
      description: |-
        Get a payout. Returns `404` if it does not exist or belongs to another merchant, and `400 resource_id_invalid` if the ID is not a payout ID. The response is the same payout object a `payout.*` webhook event carries.

        `risk` (the payout's score and tier) and `delivery` (corridor timing, when known and the payout is in flight) are always present, and `null` when they do not apply. Both are `null` for a payout that is `on_hold` or `failed`.
      responses:
        '200':
          description: The payout.
          content:
            application/json:
              example: {"id":"pay_dbvqrpqukoh470i0a400","object":"payout","livemode":false,"status":"on_hold","status_message":"This payout is under review. We will update you when the review is complete. We are not able to share further detail at this time.","failure_code":null,"beneficiary_id":"ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1","beneficiary_name":null,"instrument_id":"ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2","batch_id":null,"method":"sepa","rail_type":"fiat","network":"sepa","source_amount":"550.00","source_currency":"USD","destination_amount":"500.00","destination_currency":"EUR","exchange_rate":"0.9091","fee":"5.00","fee_currency":"USD","fee_bearer":"merchant","fixed_side":"fixed_destination","fee_finalized":false,"total_debited":"555.00","total_debited_currency":"USD","buffer_amount":"0.00","buffer_currency":null,"wallet_address":null,"token_contract":null,"token_symbol":null,"transaction_hash":null,"block_confirmations":null,"required_confirmations":null,"network_fee":null,"network_fee_currency":null,"created_by":null,"purpose":"supplier_payment","reference":"PO-8821","screened_at":null,"approved_at":null,"processed_at":null,"completed_at":null,"failed_at":null,"cancelled_at":null,"funds_released_at":null,"risk":null,"delivery":null,"session_quality":null,"metadata":{"order_ref":"A-1042"},"created_at":"2026-11-20T02:18:15.232Z","updated_at":"2026-11-20T02:18:15.232Z"}
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/payouts/{id}/events:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        description: The payout ID (`pay_...`).
    get:
      tags: [Payouts]
      summary: List a payout's status changes
      operationId: listPayoutEvents
      description: |-
        Get the payout's timeline, oldest first, in the same public statuses as the payout. A change of internal state that does not change the public status is not an event. The last event is always the payout's current status.

        Follow a payout through its webhooks instead of this call. Polling wastes rate limit.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              example: {"object":"list","data":[{"id":"pev_01HX8Z9K0M2N3P4Q5R6S7T8UE1","object":"payout_event","livemode":false,"status":"created","payout_id":"pay_dbvqrpqukoh470i0a7j0","previous_status":null,"failure_code":null,"actor_type":"api_client","actor_id":null,"occurred_at":"2026-11-20T02:18:15.241Z","created_at":"2026-11-20T02:18:15.241Z"}],"has_more":true,"next_cursor":"eyJsYXN0X2lkIjoiMSIsImxhc3RfdHMiOiIwMDAxLTAxLTAxVDAwOjAwOjAwWiJ9"}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PayoutEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/payouts/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        description: The payout ID (`pay_...`).
    post:
      tags: [Payouts]
      summary: Cancel a payout
      operationId: cancelPayout
      description: |-
        Cancel a payout that has not been submitted to a rail. You can cancel while the status is `created` or `pending_approval`, and while it is `processing` early on, up to the point it is submitted to the rail. The response does not show that point, so a `processing` payout may or may not be cancellable.

        A payout that is `on_hold` cannot be cancelled until the hold ends (`409
        payout_on_hold`). One that is already past submission, or that is `sent`, `completed`, `returned`, `cancelled` or `failed`, is `409 payout_not_cancellable`. So is one that failed with `cannot_be_processed`, always with the same wording whatever the reason. The request takes no body.

        On success, any debited source funds (source amount, fee and buffer) return to your balance.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled payout.
          content:
            application/json:
              example: {"id":"pay_dbvqrpqukoh470i0a7tg","object":"payout","livemode":false,"status":"cancelled","status_message":null,"failure_code":null,"beneficiary_id":"ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1","beneficiary_name":null,"instrument_id":"ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2","batch_id":null,"method":"sepa","rail_type":"fiat","network":"sepa","source_amount":"550.00","source_currency":"USD","destination_amount":"500.00","destination_currency":"EUR","exchange_rate":"0.9091","fee":"5.00","fee_currency":"USD","fee_bearer":"merchant","fixed_side":"fixed_destination","fee_finalized":false,"total_debited":"557.50","total_debited_currency":"USD","buffer_amount":"0.00","buffer_currency":null,"wallet_address":null,"token_contract":null,"token_symbol":null,"transaction_hash":null,"block_confirmations":null,"required_confirmations":null,"network_fee":null,"network_fee_currency":null,"created_by":null,"purpose":"supplier_payment","reference":"PO-8821","screened_at":null,"approved_at":null,"processed_at":null,"completed_at":null,"failed_at":null,"cancelled_at":"2026-11-20T02:18:15.242Z","funds_released_at":"2026-11-20T02:18:15.242Z","risk":null,"delivery":null,"session_quality":null,"metadata":{"order_ref":"A-1042"},"created_at":"2026-11-20T02:18:15.242Z","updated_at":"2026-11-20T02:18:15.242Z"}
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "State conflict: `payout_not_cancellable` (the payout is past the point of cancelling, or failed), `payout_on_hold` (the payout is under review), or `idempotency_in_flight`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                payout_on_hold:
                  value:
                    error:
                      type: invalid_request_error
                      code: payout_on_hold
                      message: This payout is under review. We will update you when the review is complete. We are not able to share further detail at this time.
                      doc_url: https://docs.antonpayments.com/api-reference/errors#payout_on_hold
                      request_id: req_01JD3XB7Q2
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/beneficiaries/import:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Beneficiaries]
      summary: Preview a bulk beneficiary import
      operationId: previewBeneficiaryImport
      description: |-
        Upload a CSV file of beneficiaries, all individuals or all businesses (one type per file), and check it before anything is created. The server parses every row, runs the same validation as `POST /v1/beneficiaries`, and returns the import with per-row results. **No beneficiaries are created at this phase.** The import is a resource of its own (`imp_…`, status `preview`) and expires 24 hours after it is created.

        Review the per-row errors, then call `POST /v1/beneficiaries/import/{import_id}/confirm` to create the beneficiaries for the rows that passed validation.

        This differs from the `POST /v1/batches` flow, which creates beneficiaries, instruments and payouts in one shot. This flow creates only beneficiaries.

        Requires an `Idempotency-Key` header. Maximum file size: 8 MB. Only `.csv` is accepted. The route takes no query parameters.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file matching the individual or business template.
                metadata:
                  type: string
                  description: Optional. Your own key/value pairs for the import, as a JSON object string such as `{"order_ref":"A-1042"}`. Strings only, at most 50 keys, keys up to 40 characters and values up to 500. Never put personal data here. Invalid JSON is `400 malformed_json`, and an object that is not all strings is `400 type_mismatch`, both with `param` `metadata`. Breaking the caps is `422`.
      responses:
        '201':
          description: Import created, with per-row validation results.
          content:
            application/json:
              example: {"id":"imp_dbvqrpqukoh470i0a3q0","object":"beneficiary_import","livemode":false,"status":"preview","summary":{"total":2,"valid":2,"invalid":0},"rows":[{"row_number":1,"type":"individual","valid":true,"errors":[],"external_ref":"R-001","country":"GB","masked":{"display_name":"A**** L**","email":"***@example.com","phone":"**********11"}},{"row_number":2,"type":"individual","valid":true,"errors":[],"external_ref":"R-002","country":"US","masked":{"display_name":"B** S****","email":"***@example.com","phone":"*********01"}}],"result":null,"confirmed_at":null,"expires_at":"2026-11-21T02:18:15.231Z","metadata":{},"created_at":"2026-11-20T02:18:15.231Z"}
              schema:
                $ref: '#/components/schemas/BeneficiaryImport'
        '400':
          description: |-
            Malformed upload. One of:

            - `invalid_multipart_form`: the request body is not valid multipart/form-data.
            - `invalid_file`: the `file` form field was missing or unreadable.
            - `invalid_file_format`: unsupported extension (only `.csv` is accepted).
            - `invalid_csv`: the file could not be parsed, or the header row does not match the individual or business template.
            - `unknown_parameter`: the request carried a query parameter.
            - `missing_idempotency_key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          description: "`file_too_large`: the file exceeds the 8 MB limit."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: "`import_too_large`: the file has more than 1,000 data rows. Split it and upload each part. Also `idempotency_key_reused`: the same `Idempotency-Key` was sent with a different request body."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: "`service_unavailable`: the vault could not take the rows, and nothing was stored. Upload the file again."
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/beneficiaries/import/{import_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: import_id
        in: path
        required: true
        description: Import ID (prefixed `imp_`), from the preview.
        schema:
          type: string
          pattern: '^imp_[a-zA-Z0-9]+$'
    post:
      tags: [Beneficiaries]
      summary: Confirm a beneficiary import
      operationId: confirmBeneficiaryImport
      description: |-
        Create a beneficiary for every row that passed preview validation. Rows that failed validation are skipped. Rows that pass preview but fail at create time (duplicate identity, vault failure) are listed in `result.errors`.

        The call answers `200` with the import, now `confirmed`, and its `result`. The import is marked `confirmed` once the call completes, even on partial failure. To re-run a subset, edit the source CSV and upload a fresh import.

        Takes no request body. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Confirm completed.
          content:
            application/json:
              example: {"id":"imp_dbvqrpqukoh470i0a3q0","object":"beneficiary_import","livemode":false,"status":"confirmed","summary":{"total":2,"valid":2,"invalid":0},"rows":null,"result":{"created":2,"skipped":0,"failed":0,"beneficiary_ids":["ben_0000000000000000000c","ben_0000000000000000000b"],"errors":[]},"confirmed_at":"2026-11-20T02:18:15.232Z","expires_at":"2026-11-21T02:18:15.231Z","metadata":{},"created_at":"2026-11-20T02:18:15.231Z"}
              schema:
                $ref: '#/components/schemas/BeneficiaryImport'
        '400':
          description: "`resource_id_invalid` (the path parameter does not look like an `imp_` ID), `invalid_request` (a request body was sent), or `missing_idempotency_key`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`resource_missing`: no import matches this ID for your merchant."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |-
            Confirm cannot proceed. One of:
            - `import_already_confirmed`: a previous call created the beneficiaries, or another confirm is creating them now.
            - `import_expired`: the 24-hour window has elapsed. Re-upload the file.
            - `idempotency_in_flight`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: "`service_unavailable`: the vault could not answer. Nothing was discarded and the import is open again, so confirm again."
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/beneficiaries/import/template:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Beneficiaries]
      summary: Download the payee import CSV template
      operationId: downloadBeneficiaryImportTemplate
      description: Get a ready-to-fill CSV template (`text/csv`) with the canonical header row and one or two example rows. Use it to set up your import file. Column order and casing matter.
      parameters:
        - name: type
          in: query
          required: true
          description: Which template to download.
          schema:
            type: string
            enum: [individual, business]
        - name: format
          in: query
          required: false
          description: Template format. Only `csv` is supported.
          schema:
            type: string
            enum: [csv]
            default: csv
      responses:
        '200':
          description: Template file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: |-
            One of:
            - `invalid_template_type`: `type` must be `individual` or `business`.
            - `invalid_template_format`: only `csv` is supported.
            - `unknown_parameter`: you sent a query parameter other than `type` and `format`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches/template:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Batches]
      summary: Download the batch template
      operationId: downloadBatchTemplate
      description: Get a ready-to-fill template file with the canonical header row and a few example rows. Column order and casing matter. The response is a file download, not JSON.
      parameters:
        - name: format
          in: query
          description: Template format. Defaults to `xlsx`.
          schema:
            type: string
            enum: [xlsx, csv]
      responses:
        '200':
          description: The template file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: "`invalid_template_format` (`format` must be `xlsx` or `csv`), or you sent an unknown query parameter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          description: "`resource_missing`: the template could not be found."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Batches]
      summary: Upload a batch
      operationId: uploadBatch
      description: |-
        Upload a batch file (CSV or XLSX) of payout rows, up to 32 MB. Anton stores the file, hashes it to detect duplicates and validates it asynchronously. The call returns the batch as `uploaded`. It then becomes `validating` and `validated` (or `validation_failed`), and a webhook reports each change.

        Once the batch is `validated`, review it and its summary, then call `POST /v1/batches/{id}/confirm` to create the payouts. Confirmation expires; see `expires_at`.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV or XLSX file.
                file_hash:
                  type: string
                  description: Optional `sha256:`-prefixed hash of the file. The upload is refused if it does not match.
                metadata:
                  type: string
                  description: Optional. Your own key/value pairs for the batch, as a JSON object string such as `{"payroll_run":"2026-11"}`. Strings only, at most 50 keys, keys up to 40 characters and values up to 500. Never put personal data here. A value that is not JSON is `400 malformed_json`, and one that is not an object of strings is `400 type_mismatch`, both with `param` `metadata`. Going over the limits is `422`.
      responses:
        '201':
          description: Batch accepted and queued for validation.
          content:
            application/json:
              example: {"id":"bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT","object":"batch","livemode":false,"status":"validated","file_name":"payroll.csv","file_format":"csv","file_size":2048,"total_rows":3,"valid_rows":2,"invalid_rows":1,"warning_rows":0,"skipped_rows":0,"processed_rows":0,"summary":{"new_beneficiaries":1,"matched_beneficiaries":0,"existing_beneficiaries":0,"external_id_matched_beneficiaries":0,"methods":{"ach":2},"estimated_debits":[{"currency":"USD","amount":"1200.50","fx_rows":0,"same_currency_rows":2,"rate_at":"2026-11-19T14:00:00.000Z"}],"fx_markup_basis_points":50,"balance_checks":{"USD":{"available":"5000.00","estimated_debit":"1200.50","sufficient":true}}},"source_currency":null,"total_amount":"1200.50","total_currency":"USD","uploaded_by":"usr_1","confirmed_by":null,"cancelled_by":null,"confirmed_at":null,"processing_started_at":null,"completed_at":null,"cancelled_at":null,"expires_at":null,"pending_batches":[],"metadata":{},"created_at":"2026-11-20T02:18:15.242Z","updated_at":"2026-11-20T02:18:15.242Z"}
              schema:
                $ref: '#/components/schemas/BatchUpload'
        '400':
          description: "The upload is malformed: `invalid_multipart_form`, `invalid_file` (the `file` field is missing), `invalid_file_format` (only `.csv` and `.xlsx`) or `file_hash_mismatch`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '409':
          description: '`duplicate_file` (a batch with this exact file is still being processed) or `idempotency_in_flight`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: "`file_too_large`: the file is over 32 MB."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`batch_upload_failed` (safe to retry with a fresh key) or `idempotency_key_reused`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Batches]
      summary: List batches
      operationId: listBatches
      description: List your batches, newest first, with cursor pagination. An unknown `status`, a malformed timestamp or an unknown query parameter is a `400`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchStatus'
          description: Only batches in this status.
        - name: created_after
          in: query
          description: Only batches with `created_at` at or after this time. Use an RFC 3339 UTC timestamp with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          description: Only batches with `created_at` before this time. Use an RFC 3339 UTC timestamp with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: A page of batches.
          content:
            application/json:
              example: {"object":"list","data":[{"id":"bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT","object":"batch","livemode":false,"status":"validated","file_name":"payroll.csv","file_format":"csv","file_size":2048,"total_rows":3,"valid_rows":2,"invalid_rows":1,"warning_rows":0,"skipped_rows":0,"processed_rows":0,"summary":{"new_beneficiaries":1,"matched_beneficiaries":0,"existing_beneficiaries":0,"external_id_matched_beneficiaries":0,"methods":{"ach":2},"estimated_debits":[{"currency":"USD","amount":"1200.50","fx_rows":0,"same_currency_rows":2,"rate_at":"2026-11-19T14:00:00.000Z"}],"fx_markup_basis_points":50,"balance_checks":{"USD":{"available":"5000.00","estimated_debit":"1200.50","sufficient":true}}},"source_currency":null,"total_amount":"1200.50","total_currency":"USD","uploaded_by":"usr_1","confirmed_by":null,"cancelled_by":null,"confirmed_at":null,"processing_started_at":null,"completed_at":null,"cancelled_at":null,"expires_at":null,"metadata":{},"created_at":"2026-11-20T02:18:15.242Z","updated_at":"2026-11-20T02:18:15.242Z"}],"has_more":false,"next_cursor":null}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches/{id}:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Batch ID (prefixed `bat_`).
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    get:
      tags: [Batches]
      summary: Retrieve a batch
      operationId: getBatch
      description: Get a batch with its counts and validation summary. Returns `404` if the batch does not exist or belongs to another merchant.
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              example: {"id":"bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT","object":"batch","livemode":false,"status":"validated","file_name":"payroll.csv","file_format":"csv","file_size":2048,"total_rows":3,"valid_rows":2,"invalid_rows":1,"warning_rows":0,"skipped_rows":0,"processed_rows":0,"summary":{"new_beneficiaries":1,"matched_beneficiaries":0,"existing_beneficiaries":0,"external_id_matched_beneficiaries":0,"methods":{"ach":2},"estimated_debits":[{"currency":"USD","amount":"1200.50","fx_rows":0,"same_currency_rows":2,"rate_at":"2026-11-19T14:00:00.000Z"}],"fx_markup_basis_points":50,"balance_checks":{"USD":{"available":"5000.00","estimated_debit":"1200.50","sufficient":true}}},"source_currency":null,"total_amount":"1200.50","total_currency":"USD","uploaded_by":"usr_1","confirmed_by":null,"cancelled_by":null,"confirmed_at":null,"processing_started_at":null,"completed_at":null,"cancelled_at":null,"expires_at":null,"metadata":{},"created_at":"2026-11-20T02:18:15.242Z","updated_at":"2026-11-20T02:18:15.242Z"}
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
        description: The batch ID (`bat_...`).
    post:
      tags: [Batches]
      summary: Confirm a validated batch
      operationId: confirmBatch
      description: |-
        Confirm a `validated` batch so it can be processed. It becomes `confirmed`, then `processing` as payouts are created from the valid rows. You cannot undo a confirmation, but you can still cancel individual payouts (`POST /v1/payouts/{id}/cancel`) until they are submitted to a rail.

        The body is optional. When you send one, it is strict JSON and an unknown field is a `400`.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            example: {"source_currency":"USD"}
            schema:
              type: object
              properties:
                source_currency:
                  $ref: '#/components/schemas/CurrencyCode'
                  description: Funding currency for rows that name none.
      responses:
        '200':
          description: The batch, confirmed and queued for processing.
          content:
            application/json:
              example: {"id":"bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT","object":"batch","livemode":false,"status":"confirmed","file_name":"payroll.csv","file_format":"csv","file_size":2048,"total_rows":3,"valid_rows":2,"invalid_rows":1,"warning_rows":0,"skipped_rows":0,"processed_rows":0,"summary":{"new_beneficiaries":1,"matched_beneficiaries":0,"existing_beneficiaries":0,"external_id_matched_beneficiaries":0,"methods":{"ach":2},"estimated_debits":[{"currency":"USD","amount":"1200.50","fx_rows":0,"same_currency_rows":2,"rate_at":"2026-11-19T14:00:00.000Z"}],"fx_markup_basis_points":50,"balance_checks":{"USD":{"available":"5000.00","estimated_debit":"1200.50","sufficient":true}}},"source_currency":null,"total_amount":"1200.50","total_currency":"USD","uploaded_by":"usr_1","confirmed_by":null,"cancelled_by":null,"confirmed_at":"2026-11-19T14:05:00.000Z","processing_started_at":null,"completed_at":null,"cancelled_at":null,"expires_at":null,"metadata":{},"created_at":"2026-11-20T02:18:15.242Z","updated_at":"2026-11-20T02:18:15.242Z"}
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`batch_not_validated`, `batch_confirmation_expired` (re-upload the file) or `idempotency_in_flight`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            `insufficient_balance` (your balance cannot cover the batch in one or more funding currencies),
            `batch_confirm_failed` (safe to retry with the same key), `validation_error` or `idempotency_key_reused`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
        description: The batch ID (`bat_...`).
    post:
      tags: [Batches]
      summary: Cancel a batch
      operationId: cancelBatch
      description: |-
        Cancel a batch before processing begins, from `uploaded`, `validating`, `validated`, `validation_failed` or `confirmed`. Once `processing` has begun, cancel payouts one by one instead. The request takes no body.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled batch.
          content:
            application/json:
              example: {"id":"bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT","object":"batch","livemode":false,"status":"cancelled","file_name":"payroll.csv","file_format":"csv","file_size":2048,"total_rows":3,"valid_rows":2,"invalid_rows":1,"warning_rows":0,"skipped_rows":0,"processed_rows":0,"summary":{"new_beneficiaries":1,"matched_beneficiaries":0,"existing_beneficiaries":0,"external_id_matched_beneficiaries":0,"methods":{"ach":2},"estimated_debits":[{"currency":"USD","amount":"1200.50","fx_rows":0,"same_currency_rows":2,"rate_at":"2026-11-19T14:00:00.000Z"}],"fx_markup_basis_points":50,"balance_checks":{"USD":{"available":"5000.00","estimated_debit":"1200.50","sufficient":true}}},"source_currency":null,"total_amount":"1200.50","total_currency":"USD","uploaded_by":"usr_1","confirmed_by":null,"cancelled_by":null,"confirmed_at":null,"processing_started_at":null,"completed_at":null,"cancelled_at":"2026-11-19T14:05:00.000Z","expires_at":null,"metadata":{},"created_at":"2026-11-20T02:18:15.242Z","updated_at":"2026-11-20T02:18:15.242Z"}
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`batch_not_cancellable` (terminal or already processing) or `idempotency_in_flight`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`batch_cancel_failed` or `idempotency_key_reused`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches/{id}/payouts:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
        description: The batch ID (`bat_...`).
    get:
      tags: [Batches]
      summary: List payouts created from a batch
      operationId: listBatchPayouts
      description: List the payouts this batch created, newest first, with cursor pagination. Returns `404` for a batch that belongs to another merchant.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of payouts.
          content:
            application/json:
              example: {"object":"list","data":[],"has_more":false,"next_cursor":null}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches/{id}/beneficiaries:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
        description: The batch ID (`bat_...`).
    get:
      tags: [Batches]
      summary: List payees created or referenced by a batch
      operationId: listBatchBeneficiaries
      description: List the payees this batch created or first referenced, with cursor pagination. Returns `404` for a batch that belongs to another merchant.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of beneficiaries.
          content:
            application/json:
              example: {"object":"list","data":[],"has_more":false,"next_cursor":null}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Listing a batch's payees is not available on this API (`service_unavailable`).
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/batches/{id}/errors:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
        description: The batch ID (`bat_...`).
    get:
      tags: [Batches]
      summary: List the problems found in a batch file
      operationId: listBatchErrors
      description: List the row-level errors and warnings found while the batch was `validating`, errors first. Each one carries the row number so you can find it in your file. Validation checks the file itself (format, amounts, methods, credentials, payee resolution). Each payout a confirmed batch creates is checked again before it is sent.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of issues.
          content:
            application/json:
              example: {"object":"list","data":[{"object":"batch_issue","severity":"error","row":3,"field":"amount","type":null,"message":"must be positive"}],"has_more":true,"next_cursor":"eyJsYXN0X2lkIjoiMSIsImxhc3RfdHMiOiIwMDAxLTAxLTAxVDAwOjAwOjAwWiJ9"}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BatchIssue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/batches/{id}/results:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
        description: The batch ID (`bat_...`).
    get:
      tags: [Batches]
      summary: List per-row processing results
      operationId: listBatchResults
      description: "List what happened to each row during `processing`: the row number, the outcome (`success`, `failed`, `skipped`, `pending`), the created `payout_id`, and a message for any row that did not succeed."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of row results.
          content:
            application/json:
              example: {"object":"list","data":[{"object":"batch_row_result","row":1,"status":"success","payout_id":"pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB","beneficiary_id":null,"instrument_id":null,"message":null},{"object":"batch_row_result","row":2,"status":"failed","payout_id":null,"beneficiary_id":null,"instrument_id":null,"message":"the payout could not be created"}],"has_more":false,"next_cursor":null}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BatchRowResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/instruments:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Instruments]
      summary: Create an instrument
      operationId: createInstrument
      description: |-
        Add a payment instrument to a payee, named by `beneficiary_id` in the body. Anton tokenizes the credentials you submit (bank account numbers, wallet addresses, card PANs) in the secure vault on receipt. Its core database keeps only a token reference, display-only masked values, and a content fingerprint used for deduplication.

        The shape of `credentials` depends on the `method`. Call `GET /v1/instruments/methods` for the per-country catalog with the exact fields each method asks for. A method that is not available in the payee's country is `422 method_not_supported`. Credentials that fail the method's format rules are `422 invalid_credentials`. An instrument you already hold for the payee is `409 duplicate_instrument`.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentCreateRequest'
            examples:
              iban:
                summary: An IBAN account
                value:
                  beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
                  method: iban
                  currency: EUR
                  label: Primary EUR account
                  default: true
                  credentials:
                    account_holder_name: Jane Smith
                    iban: DE89370400440532013000
      responses:
        '201':
          description: Instrument created.
          headers:
            Request-Id:
              $ref: '#/components/headers/Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              example: {"id":"ins_dbvqrpqukoh470i0a3d0","object":"instrument","livemode":false,"status":"active","beneficiary_id":"ben_dbvqrpqukoh470i0a3ag","method":"iban","currency":"EUR","country":null,"label":"Primary EUR account","default":true,"display_last4":"3000","display_bank":null,"display_network":"IBAN","masked_account":"IBAN ****3000","created_via":"api","source_batch_id":null,"metadata":{"cost_center":"4421"},"created_at":"2026-11-20T02:18:15.225Z","updated_at":"2026-11-20T02:18:15.225Z"}
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`resource_missing`: `beneficiary_id` names no payee of yours."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: "`duplicate_instrument` (you already hold this instrument for the payee), `beneficiary_not_active` (the payee is archived or blocked) or `idempotency_in_flight`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: The request failed validation (`validation_error`, with `details` listing every failing field) or a business rule (`invalid_credentials`, `method_not_supported`), or it is `idempotency_key_reused`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Instruments]
      summary: List instruments
      operationId: listInstruments
      description: |-
        List payment instruments across all your payees, newest first (ties broken by ID). Use `beneficiary_id` to list one payee's instruments.

        Filters are exact-match and validated. An unknown query parameter, a filter value outside its allowed set, an out-of-range `limit` or a bad `cursor` is a `400`, never an empty list. A `beneficiary_id` that names no payee of yours is `404 resource_missing`. `created_after` is inclusive and `created_before` is exclusive. Both are RFC 3339 UTC timestamps with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: beneficiary_id
          in: query
          description: Only this payee's instruments.
          schema:
            type: string
            pattern: '^ben_[a-zA-Z0-9]+$'
        - name: method
          in: query
          description: Only instruments of this method.
          schema:
            $ref: '#/components/schemas/PaymentMethodCode'
        - name: currency
          in: query
          description: Only instruments with this default currency.
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: country
          in: query
          description: Only instruments in this country.
          schema:
            $ref: '#/components/schemas/CountryCode'
        - name: status
          in: query
          description: Only instruments with this status.
          schema:
            type: string
            enum: [active, disabled]
        - name: search
          in: query
          description: Substring match on the instrument's label and bank name.
          required: false
          schema:
            type: string
        - name: created_after
          in: query
          description: Only instruments created at or after this instant (inclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Only instruments created before this instant (exclusive).
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated list of instruments.
          content:
            application/json:
              example: {"object":"list","data":[{"id":"ins_dbvqrpqukoh470i0a3d0","object":"instrument","livemode":false,"status":"active","beneficiary_id":"ben_dbvqrpqukoh470i0a3ag","method":"iban","currency":"EUR","country":null,"label":"Primary EUR account","default":true,"display_last4":"3000","display_bank":null,"display_network":"IBAN","masked_account":"IBAN ****3000","created_via":"api","source_batch_id":null,"metadata":{"cost_center":"4421"},"created_at":"2026-11-20T02:18:15.225Z","updated_at":"2026-11-20T02:18:15.225Z"}],"has_more":false,"next_cursor":null}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Instrument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`resource_missing`: `beneficiary_id` names no payee of yours."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

