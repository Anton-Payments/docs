    IntelligencePayout:
      type: object
      additionalProperties: false
      required: [amount, source_country, destination_country]
      properties:
        reference_id:
          type: string
        amount:
          $ref: '#/components/schemas/IntelligenceMoney'
        source_country:
          $ref: '#/components/schemas/CountryCode'
        destination_country:
          $ref: '#/components/schemas/CountryCode'
        rail:
          type: string
          enum: [bank, card, crypto, wallet, internal, other]

    IntelligenceMoney:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/IntelligenceCurrencyOrAssetCode'

    IntelligenceCurrencyOrAssetCode:
      type: string
      description: Uppercase supported fiat currency or crypto asset code.
      pattern: '^[A-Z]{3,5}$'
      examples: [USD, BTC, USDC]

    IntelligenceContext:
      type: object
      additionalProperties: false
      properties:
        velocity:
          type: object
          additionalProperties: true
        fingerprints:
          type: object
          additionalProperties: true
        history:
          type: object
          additionalProperties: true
        industry:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    IntelligenceEvaluation:
      type: object
      description: |
        One evaluation. `status` is its lifecycle: `pending` and `processing` while it is being decided,
        `completed` once decided, `failed` when it could not be (`failure_reason` is `evaluation_failed`).
        The result fields (`coverage`, `decision`, `score`, `tier`, `reasons`, `required_actions`) are present
        only when `status` is `completed`. `score` runs 0 to 1000 and higher is worse. `reasons` and
        `required_actions` come from the fixed lists below; Anton does not return how a decision was reached.
      required: [id, object, livemode, status, use_case, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^eval_[a-zA-Z0-9]+$'
        object:
          type: string
          enum: [evaluation]
        livemode:
          type: boolean
        status:
          type: string
          enum: [pending, processing, completed, failed]
        use_case:
          type: [string, 'null']
          enum: [payee_registration, instrument_screening, payout_screening, merchant_onboarding, monitoring, null]
        failure_reason:
          type: string
          enum: [evaluation_failed]
          description: Present only when `status` is `failed`.
        coverage:
          type: string
          enum: [complete, partial, error]
          description: How much of the screening panel answered.
        decision:
          type: string
          enum: [approve, review, decline]
        score:
          type: integer
          minimum: 0
          maximum: 1000
          description: Risk score, 0 to 1000. Higher is worse.
        tier:
          type: string
          enum: [low, medium, high, critical]
        reasons:
          type: array
          description: |
            Why the decision is not a plain approval. `watchlist_review`: a possible or confirmed list match
            needs review. `identity_unverified`: the identity could not be confirmed. `information_incomplete`:
            details needed for a confident answer were missing. `elevated_risk`: the risk is elevated, or the
            reason is not one of the others. Empty for a clean approval.
          items:
            type: string
            enum: [watchlist_review, identity_unverified, information_incomplete, elevated_risk]
        required_actions:
          type: array
          description: |
            What you can do about it. `provide_missing_information`: resubmit with the missing details.
            `verify_identity`: verify the subject's identity (see verification subjects).
          items:
            type: string
            enum: [provide_missing_information, verify_identity]
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    VerificationStatus:
      type: string
      description: |-
        Where a verification attempt stands.

        - `created`: the attempt exists and the link is minted, but nothing is delivered yet (manual delivery, or email unavailable)
        - `sent`: the hosted link was delivered to the subject by email
        - `in_progress`: the subject opened the flow
        - `processing`: submitted, and provider checks are running
        - `awaiting_owners`: business only. The business case is done and owner (UBO) flows are outstanding
        - `review`: flagged for manual review
        - `approved`: verified (terminal)
        - `declined`: failed verification (terminal)
        - `expired`: the link or inquiry lapsed unused (terminal)
        - `revoked`: cancelled by the merchant (terminal)
      enum:
        - created
        - sent
        - in_progress
        - processing
        - awaiting_owners
        - review
        - approved
        - declined
        - expired
        - revoked

    VerificationScreening:
      type: object
      description: |
        The result of screening a completed verification, limited the same way an evaluation is: a status, the
        score and tier, and reason codes from a fixed list. It never lists what was checked or says how the result
        was reached. `evaluation_id` resolves at `GET /v1/intelligence/evaluations/{id}`; `score` (0 to 1000, higher
        is worse) and `tier` come from that evaluation and are `null` until one is linked.
      required: [status, evaluation_id, score, tier, reasons]
      properties:
        status:
          type: string
          enum: [clear, review, pending]
          description: '`review` when the result needs a person to look at it. What it was is not said.'
        evaluation_id:
          type: [string, 'null']
          description: The evaluation backing this result.
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
        tier:
          type: [string, 'null']
          enum: [low, medium, high, critical, null]
        reasons:
          type: array
          description: Codes from the same fixed list an evaluation uses.
          items:
            type: string
            enum: [watchlist_review, identity_unverified, information_incomplete, elevated_risk]

    VerificationOwner:
      type: object
      description: |
        A controlling owner on a business verification. Each owner completes an individual
        KYC flow; the business cannot reach `approved` until every controlling owner has.
        `display_name` is masked.
      required: [id, object, livemode, display_name, email, ownership_percentage, status, completed_at]
      properties:
        id:
          type: string
          description: Owner ID (`vubo_...`).
        object:
          type: string
          enum: [verification_owner]
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/VerificationStatus'
        display_name:
          type: string
          description: Masked owner name.
        email:
          type: string
          description: Masked (`m***@example.com`). The full address is available only to people with the identity-details permission, in the portal.
        ownership_percentage:
          type: integer
          description: Declared ownership percentage.
        completed_at:
          type: [string, 'null']
          format: date-time
          description: Set once the owner's flow reached a terminal outcome.

    Verification:
      type: object
      description: |
        One verification of a subject. `hosted_link` is **secret-once**: present only on the response
        that minted it (create / resend / regenerate / re-verify) and never on a read.
      required: [id, object, livemode, status, subject_id, reason, screening, owners, link_expires_at, completed_at, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          description: Verification ID (`vrf_...`).
        object:
          type: string
          enum: [verification]
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/VerificationStatus'
        subject_id:
          type: string
          pattern: '^vsub_[a-zA-Z0-9]+$'
        reason:
          type: string
          enum: [initial, reverification, regenerated]
          description: Why this verification was opened.
        screening:
          oneOf:
            - $ref: '#/components/schemas/VerificationScreening'
            - type: 'null'
          description: '`null` until the verification has been screened.'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/VerificationOwner'
          description: Business verifications only; empty otherwise.
        link_expires_at:
          type: [string, 'null']
          format: date-time
          description: When the current hosted link lapses.
        completed_at:
          type: [string, 'null']
          format: date-time
          description: Set once the verification reached a terminal outcome.
        hosted_link:
          type: [string, 'null']
          description: |
            Secret-once hosted verification link. Present only on the response that minted it. A replay of that
            request (same `Idempotency-Key`) returns the same resource with `hosted_link` `null`: the link is
            returned once and never stored. Call regenerate to get a new link.
        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          description: Your own key-value pairs for this verification, set in the body when you re-verify a subject. Returned as-is and never read by Anton. The first verification of a subject carries none; set `metadata` on the subject when you create it.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    VerificationSubject:
      type: object
      description: |
        A person or business you verify. `display_name` is **masked on every read**
        (`A•• L••••••`); Anton stores the true name only as a vault token reference, and it is
        revealable solely through the dashboard's audited, admin-only reveal flow. `status` is the status of the
        current verification. `verifications` is present on create and retrieve (newest first) and absent from
        list rows.
      required: [id, object, livemode, status, type, display_name, email, external_ref, country, current_verification_id, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          description: Subject ID (`vsub_...`).
        object:
          type: string
          enum: [verification_subject]
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/VerificationStatus'
        type:
          type: string
          enum: [person, business]
        display_name:
          type: string
          description: Masked display name.
        email:
          type: string
          description: Masked (`a***@example.com`); empty when the subject has no email; the fixed value `unavailable` when the stored address could not be read. The full address is available only to people with the identity-details permission, in the portal.
        external_ref:
          type: [string, 'null']
          description: Your identifier for this subject, echoed back verbatim.
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        current_verification_id:
          type: [string, 'null']
          pattern: '^vrf_[a-zA-Z0-9]+$'
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/Verification'
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    VerificationOwnerLink:
      type: object
      description: The answer to an owner resend. Not a stored resource, because the link is minted for this answer and never kept.
      required: [object, livemode, hosted_link, delivered]
      properties:
        object:
          type: string
          enum: [verification_owner_link]
        livemode:
          type: boolean
        hosted_link:
          type: string
          description: Secret-once hosted link for this owner's individual flow.
        delivered:
          type: boolean
          description: Whether the link was also emailed to the owner.

    ResendOwnerLinkRequest:
      type: object
      description: Name the owner by exactly one of `owner_id` or `email`.
      additionalProperties: false
      properties:
        owner_id:
          type: string
          pattern: '^vubo_[a-zA-Z0-9]+$'
          description: An owner of this verification; the address on file receives the link. `deliver` cannot be `false` with it.
        email:
          type: string
          format: email
          description: The address of an owner on the case. It must belong to an owner of THIS verification, or the call is a 404.
        deliver:
          type: boolean
          default: true
          description: Whether to email the link too. `false` returns it for you to deliver.

    CreateVerificationSubjectRequest:
      type: object
      additionalProperties: false
      required: [type, display_name]
      properties:
        type:
          type: string
          enum: [person, business]
        display_name:
          type: string
          description: The subject's legal name. Vault-tokenized at rest; masked on every read.
        email:
          type: string
          description: 'Where the hosted link is delivered (with `delivery: "email"`), and the address shown in the flow. Without an email on file, delivery cannot happen: the verification stays `created` and you deliver the link yourself.'
        external_ref:
          type: string
          description: Optional identifier from your systems, echoed back on reads.
        country:
          type: string
          description: ISO 3166-1 alpha-2. Recommended; it feeds sanctions screening disambiguation.
        delivery:
          type: string
          enum: [email, manual]
          default: manual
          description: '`email`: Anton emails the hosted link to the subject. `manual` (the default when omitted): you deliver the returned `hosted_link` yourself.'
        message:
          type: string
          maxLength: 500
          description: |
            Optional text shown in the delivery email, attributed to your business. Used for that
            one send and **never persisted** (it may carry incidental PII); it cannot be read back.
        link_expires_in_days:
          type: integer
          enum: [7, 14, 30]
          default: 7
          description: Hosted-link lifetime.
        metadata:
          $ref: '#/components/schemas/Metadata'

    VerificationStats:
      type: object
      required: [object, livemode, totals, pass_rate, median_completion_minutes, weekly, period, queues]
      properties:
        object:
          type: string
          enum: [verification_stats]
        livemode:
          type: boolean
        totals:
          type: object
          description: All-time counts of verifications. `started` leaves out a new link on an existing verification, as `period` and `weekly` do.
          required: [started, approved, declined, review, in_flight]
          properties:
            started: { type: integer }
            approved: { type: integer }
            declined: { type: integer }
            review: { type: integer }
            in_flight: { type: integer }
        pass_rate:
          type: number
          description: Approved ÷ decided, 0–1.
        median_completion_minutes:
          type: integer
        weekly:
          type: array
          description: Attempts started in each of the last six weeks (Monday starts, UTC), oldest first, the current week last; a week with none is present as 0. A new link on an existing attempt is not a start.
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: integer }
        period:
          type: object
          description: The last `days` days. `started` counts attempts created in it (a new link on an existing attempt is not a start); `approved` and `declined` those decided in it; `completed` those completed in it; `median_completion_minutes` runs from the link to completion for the completed ones, and is 0 when `completed` is 0.
          required: [days, started, approved, declined, completed, pass_rate, median_completion_minutes]
          properties:
            days: { type: integer, example: 30 }
            started: { type: integer }
            approved: { type: integer }
            declined: { type: integer }
            completed: { type: integer }
            pass_rate: { type: number, description: "Approved ÷ decided in the period, 0–1." }
            median_completion_minutes: { type: integer }
        queues:
          type: object
          description: People and businesses (not attempts) by their current status, as the subject list's `status=review` and `status=in_flight` filters return them.
          required: [review, in_flight]
          properties:
            review: { type: integer }
            in_flight: { type: integer }
