    PayoutEvent:
      type: object
      description: |
        One change of a payout's public status. It carries no free text and nothing about screening or review:
        a change that leaves the public status as it was is not an event.
      required: [id, object, livemode, payout_id, status, previous_status, failure_code, actor_type, actor_id, occurred_at, created_at]
      properties:
        id:
          type: string
          pattern: '^pev_[a-zA-Z0-9]+$'
        object:
          type: string
          enum: [payout_event]
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/PayoutStatus'
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        previous_status:
          oneOf:
            - $ref: '#/components/schemas/PayoutStatus'
            - type: 'null'
          description: '`null` on the first event.'
        failure_code:
          type: [string, 'null']
          description: Set when `status` is `failed`, with the values of the payout's `failure_code`.
        actor_type:
          type: string
          enum: [user, api_client, system]
        actor_id:
          type: [string, 'null']
          description: The user (`usr_...`) for `actor_type` `user`; `null` otherwise.
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        {
          "id": "pev_01HX8Z9K0M2N3P4Q5R6S7T8UE3",
          "object": "payout_event",
          "livemode": false,
          "payout_id": "pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB",
          "status": "failed",
          "previous_status": "processing",
          "failure_code": "provider_rejected",
          "actor_type": "system",
          "actor_id": null,
          "occurred_at": "2026-11-19T14:03:25.871Z",
          "created_at": "2026-11-19T14:03:25.871Z"
        }

    PayoutCancelRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            pattern: '^pay_[a-zA-Z0-9]+$'
          description: The payouts to cancel. Duplicates are cancelled once.

    PayoutCancelResult:
      type: object
      description: The outcome of a bulk cancel, per payout ID.
      required: [object, livemode, cancelled, failed]
      properties:
        object:
          type: string
          enum: [payout_cancellation_result]
        livemode:
          type: boolean
        cancelled:
          type: array
          items:
            type: string
            pattern: '^pay_[a-zA-Z0-9]+$'
          description: IDs that were cancelled.
        failed:
          type: array
          description: IDs that were not cancelled, with the reason.
          items:
            type: object
            required: [id, code, message]
            properties:
              id:
                type: string
              code:
                type: string
                description: '`resource_missing`, `payout_on_hold`, `payout_not_cancellable` or `internal_error`.'
              message:
                type: string

    BatchStatus:
      type: string
      description: |
        Where a batch is in its lifecycle. `uploaded` to `validating` to `validated` (or `validation_failed`), then
        `confirmed` to `processing` to `completed`, `partial` (some rows failed) or `failed` (all rows failed).
        `cancelled` is reachable before processing begins. Treat a status you do not know as in progress.
      enum:
        - uploaded
        - validating
        - validated
        - validation_failed
        - confirmed
        - processing
        - completed
        - partial
        - failed
        - cancelled

    BatchIssue:
      type: object
      description: 'One problem found in a batch file: an `error` that stops a row, or a `warning` that does not.'
      required: [object, severity, row, field, type, message]
      properties:
        object:
          type: string
          enum: [batch_issue]
        severity:
          type: string
          enum: [error, warning]
        row:
          type: integer
          description: 1-based row number in the file you uploaded.
        field:
          type: [string, 'null']
          description: The column the issue applies to; `null` for a row-level issue and for warnings.
        type:
          type: [string, 'null']
          description: |
            For a warning, its category: `duplicate_in_batch` or `beneficiary_name_change`. `null` for an error.
            Treat an unknown value as informational.
        message:
          type: string
      example:
        {
          "object": "batch_issue",
          "severity": "error",
          "row": 3,
          "field": "amount",
          "type": null,
          "message": "must be positive"
        }

    BatchSummary:
      type: object
      description: The validation summary you review before confirming.
      required:
        - new_beneficiaries
        - matched_beneficiaries
        - existing_beneficiaries
        - external_id_matched_beneficiaries
        - methods
        - estimated_debits
        - fx_markup_basis_points
        - balance_checks
      properties:
        new_beneficiaries:
          type: integer
          description: Beneficiaries that would be created from the file.
        matched_beneficiaries:
          type: integer
          description: Rows that matched an existing beneficiary by name.
        existing_beneficiaries:
          type: integer
          description: Distinct existing beneficiaries referenced.
        external_id_matched_beneficiaries:
          type: integer
          description: Rows that matched an existing beneficiary by your `external_id`.
        methods:
          type: object
          description: Row count by payment method.
          additionalProperties:
            type: integer
        estimated_debits:
          type: array
          items:
            type: object
            required: [currency, amount, fx_rows, same_currency_rows, rate_at]
            properties:
              currency:
                $ref: '#/components/schemas/CurrencyCode'
              amount:
                $ref: '#/components/schemas/Money'
              fx_rows:
                type: integer
              same_currency_rows:
                type: integer
              rate_at:
                type: [string, 'null']
                format: date-time
                description: When the FX rates behind the estimate were taken; `null` when no rate was needed or recorded.
        fx_markup_basis_points:
          type: integer
          description: FX markup applied to cross-currency rows, in basis points.
        balance_checks:
          type: object
          description: Whether each funding currency covers the batch, keyed by currency code.
          additionalProperties:
            type: object
            required: [available, estimated_debit, sufficient]
            properties:
              available:
                $ref: '#/components/schemas/Money'
              estimated_debit:
                $ref: '#/components/schemas/Money'
              sufficient:
                type: boolean

    BatchRowResult:
      type: object
      description: The outcome of one row of a processed batch.
      required: [object, row, status, payout_id, beneficiary_id, instrument_id, message]
      properties:
        object:
          type: string
          enum: [batch_row_result]
        row:
          type: integer
        status:
          type: string
          enum: [success, failed, skipped, pending]
        payout_id:
          type: [string, 'null']
          pattern: '^pay_[a-zA-Z0-9]+$'
        beneficiary_id:
          type: [string, 'null']
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: [string, 'null']
          pattern: '^ins_[a-zA-Z0-9]+$'
        message:
          type: [string, 'null']
          description: Why the row `failed` or was `skipped`; `null` otherwise.
      example:
        {
          "object": "batch_row_result",
          "row": 2,
          "status": "failed",
          "payout_id": null,
          "beneficiary_id": null,
          "instrument_id": null,
          "message": "payout could not be created"
        }

    Batch:
      type: object
      description: |
        A batch upload of payout rows. It moves through the statuses in `BatchStatus`; it can be cancelled before
        processing begins. Row-level problems are not inline: read them from `GET /v1/batches/{id}/errors`.
      required:
        - id
        - object
        - livemode
        - status
        - file_name
        - file_format
        - file_size
        - total_rows
        - valid_rows
        - invalid_rows
        - warning_rows
        - skipped_rows
        - processed_rows
        - summary
        - source_currency
        - total_amount
        - total_currency
        - uploaded_by
        - confirmed_by
        - cancelled_by
        - metadata
        - created_at
        - updated_at
        - confirmed_at
        - processing_started_at
        - completed_at
        - cancelled_at
        - expires_at
      properties:
        id:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
          example: bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT
        object:
          type: string
          enum: [batch]
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/BatchStatus'
        file_name:
          type: string
          example: payroll_2026_04_15.csv
        file_format:
          type: string
          enum: [csv, xlsx]
        file_size:
          type: integer
          description: Bytes.
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        warning_rows:
          type: integer
        skipped_rows:
          type: integer
        processed_rows:
          type: integer
        summary:
          oneOf:
            - $ref: '#/components/schemas/BatchSummary'
            - type: 'null'
          description: '`null` until validation has produced a summary.'
        source_currency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
          description: Default funding currency for rows that name none. Set at confirmation.
        total_amount:
          type: [string, 'null']
          description: |
            Total of every valid row, when all rows share one destination currency; `null` for a mixed-currency
            batch (see `summary.estimated_debits`).
          example: "12345.67"
        total_currency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
        uploaded_by:
          type: [string, 'null']
          description: The user in your team who uploaded the file.
        confirmed_by:
          type: [string, 'null']
        cancelled_by:
          type: [string, 'null']
        confirmed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        processing_started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cancelled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Deadline for confirming a `validated` batch.
        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          description: Your own key/value pairs for this batch, set with the `metadata` form field on upload. Returned as-is, never read by Anton.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        {
          "id": "bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT",
          "object": "batch",
          "livemode": false,
          "status": "validated",
          "file_name": "payroll.csv",
          "file_format": "csv",
          "file_size": 2048,
          "total_rows": 3,
          "valid_rows": 2,
          "invalid_rows": 1,
          "warning_rows": 0,
          "skipped_rows": 0,
          "processed_rows": 0,
          "summary": {
            "new_beneficiaries": 1,
            "matched_beneficiaries": 0,
            "existing_beneficiaries": 0,
            "external_id_matched_beneficiaries": 0,
            "methods": {
              "ach": 2
            },
            "estimated_debits": [
              {
                "currency": "USD",
                "amount": "1200.50",
                "fx_rows": 0,
                "same_currency_rows": 2,
                "rate_at": "2026-11-19T14:00:00.000Z"
              }
            ],
            "fx_markup_basis_points": 50,
            "balance_checks": {
              "USD": {
                "available": "5000.00",
                "estimated_debit": "1200.50",
                "sufficient": true
              }
            }
          },
          "source_currency": null,
          "total_amount": "1200.50",
          "total_currency": "USD",
          "uploaded_by": "usr_01HX8Z9K0M2N3P4Q5R6S7T8UU1",
          "confirmed_by": null,
          "cancelled_by": null,
          "created_at": "2026-11-19T14:03:22.104Z",
          "updated_at": "2026-11-19T14:03:25.871Z",
          "confirmed_at": null,
          "processing_started_at": null,
          "completed_at": null,
          "cancelled_at": null,
          "expires_at": null
        }

    BatchUpload:
      description: 'The result of an upload: the batch, and any other batch of yours still in flight.'
      allOf:
        - $ref: '#/components/schemas/Batch'
        - type: object
          required: [pending_batches]
          properties:
            pending_batches:
              type: array
              items:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    pattern: '^bat_[a-zA-Z0-9]+$'
                  status:
                    $ref: '#/components/schemas/BatchStatus'

    BeneficiaryImport:
      type: object
      description: |
        A bulk beneficiary import. Created by `POST /v1/beneficiaries/import` as a preview
        (`status` `preview`, `rows` set, `result` `null`); once confirmed it is `confirmed`
        with `result` set and `rows` `null`. A preview expires 24 hours after it is created and is deleted then.
      required: [id, object, livemode, status, summary, rows, result, metadata, created_at, confirmed_at, expires_at]
      properties:
        id:
          type: string
          pattern: '^imp_[a-zA-Z0-9]+$'
        object:
          type: string
          enum: [beneficiary_import]
        livemode:
          type: boolean
        status:
          type: string
          enum: [preview, confirmed, expired]
        summary:
          type: object
          required: [total, valid, invalid]
          properties:
            total:
              type: integer
            valid:
              type: integer
            invalid:
              type: integer
        rows:
          type:
            - array
            - 'null'
          description: The parsed rows with their validation outcome. Set on the preview, `null` once confirmed.
          items:
            $ref: '#/components/schemas/BeneficiaryImportRow'
        result:
          oneOf:
            - $ref: '#/components/schemas/BeneficiaryImportResult'
            - type: 'null'
          description: The outcome of the confirm. `null` until confirmed.
        confirmed_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          description: Your own key/value pairs for this import, set with the `metadata` form field on upload. Returned as-is, never read by Anton.
        created_at:
          $ref: '#/components/schemas/Timestamp'
      example: {"id":"imp_dbvlj5qukohfu54jbn2g","object":"beneficiary_import","livemode":false,"status":"preview","summary":{"total":2,"valid":2,"invalid":0},"rows":[{"row_number":1,"type":"individual","valid":true,"errors":[],"external_ref":"R-001","country":"GB","masked":{"display_name":"A**** L**","email":"***@example.com","phone":"**********11"}},{"row_number":2,"type":"individual","valid":true,"errors":[],"external_ref":"R-002","country":"US","masked":{"display_name":"B** S****","email":"***@example.com","phone":"*********01"}}],"result":null,"confirmed_at":null,"expires_at":"2026-11-20T20:18:31.834Z","metadata":{},"created_at":"2026-11-19T20:18:31.834Z"}

    BeneficiaryImportRow:
      type: object
      description: One parsed row of a preview.
      required: [row_number, type, valid, errors, external_ref, country, masked]
      properties:
        row_number:
          type: integer
          description: 1-indexed row number relative to the data section (header excluded).
        type:
          type: string
          enum: [individual, business]
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
          description: What is wrong with the row, by column, never the value. Empty when `valid` is true.
        external_ref:
          type: [string, 'null']
          description: Your own reference for the row, as uploaded. `null` when the row has none or it is longer than 255 characters or holds control characters.
        country:
          type: [string, 'null']
          description: The row's `country` column (ISO 3166-1 alpha-2), upper-cased. `null` when it is not a valid code.
        masked:
          type: [object, 'null']
          description: |
            The row's details, masked so you can recognise it. The payee's real details are not stored by
            Anton in the import; a valid row's are sealed in the vault at preview and used when you confirm.
          required: [display_name, email, phone]
          properties:
            display_name:
              type: string
              description: The name with all but each word's first character masked, for example `J*** D**`.
            email:
              type: string
              description: The email with its local part masked, for example `***@example.com`.
            phone:
              type: string
              description: The phone number with all but its last two digits masked.

    BeneficiaryImportResult:
      type: object
      description: The outcome of confirming an import.
      required: [created, skipped, failed, beneficiary_ids, errors]
      properties:
        created:
          type: integer
          description: Beneficiaries created by the confirm.
        skipped:
          type: integer
          description: Rows that failed validation at preview.
        failed:
          type: integer
          description: Rows that passed preview but could not be created.
        beneficiary_ids:
          type: array
          items:
            type: string
            pattern: '^ben_[a-zA-Z0-9]+$'
        errors:
          type: array
          items:
            type: object
            required: [row_number, message]
            properties:
              row_number:
                type: integer
              message:
                type: string

    ReviewKind:
      type: string
      description: |
        `payout_held_by_rule` is opened by your own payout rules; its money decision is made on the
        linked approval in the portal, not through this API.
      enum: [possible_sanctions_match, possible_pep_match, screening_review, manual, payout_held_by_rule]
    ReviewStatus:
      type: string
      enum: [open, waiting_on_customer, awaiting_approval, closed]
    ReviewDecisionType:
      type: string
      description: |
        The first five are decisions you can record through this API. `release` and `cancel` are votes on a
        payout your rule held, and `approved`, `rejected` and `expired` are how such a review can close; both are
        made in the portal.
      enum: [waiting_on_customer, not_a_match, confirmed_match, no_concern, concern_confirmed, release, cancel, approved, rejected, expired]
    ReviewReasonCode:
      type: string
      description: |-
        Accepted per decision: `waiting_on_customer` accepts `dob_needed`, `id_document_needed`, `more_information_needed`;
        `not_a_match` accepts `dob_differs`, `nationality_differs`, `id_document_verified`, `different_entity_type`, `location_differs`;
        `confirmed_match` accepts `identity_confirmed`, `exact_identifier_match`, `customer_confirmed`;
        `no_concern` accepts `activity_explained`, `documents_verified`; `concern_confirmed` accepts `suspicious_activity`, `policy_breach`;
        `other` goes with any decision.
        `payee_verified` and `payee_not_verified` appear only on decisions about a payout your own rule held;
        those are made in the portal, so this API returns them but doesn't accept them.
      enum: [dob_needed, id_document_needed, more_information_needed, dob_differs, nationality_differs, id_document_verified,
        different_entity_type, location_differs, identity_confirmed, exact_identifier_match, customer_confirmed,
        activity_explained, documents_verified, suspicious_activity, policy_breach, payee_verified, payee_not_verified, other]
    ReviewActor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [user, api_client, system]
        id:
          type: string
          description: The user id or your API credential's client id. Absent for `system`.
    Review:
      type: object
      required: [id, object, livemode, status, number, kind, priority, outcome, source, evaluation_id, linked_evaluation_id, linked_review_id, subject, open_reason, opened_by, owner_id, due_at, paused_at, overdue, closed_at, created_at, updated_at]
      properties:
        id:
          type: string
          example: irv_01JB8QK2
        object:
          type: string
          enum: [review]
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/ReviewStatus'
        number:
          type: string
          example: RV-0142
        kind:
          $ref: '#/components/schemas/ReviewKind'
        priority:
          type: string
          enum: [high, medium, low]
        outcome:
          type: [string, 'null']
          description: How the review closed; `null` while it is open.
        source:
          type: string
          enum: [evaluation, manual, monitoring, list_screening, payout_rule]
        evaluation_id:
          type: [string, 'null']
          description: The evaluation of yours that opened the review.
        linked_evaluation_id:
          type: [string, 'null']
        linked_review_id:
          type: [string, 'null']
        subject:
          type: object
          required: [type, display, reference]
          properties:
            type:
              type: string
              enum: [person, business, account, transaction_pattern, unknown]
            display:
              type: string
              description: Masked (first letter of each word).
              example: V*** S***
            reference:
              type: [string, 'null']
              description: Your own reference for the subject.
              example: cust_7731
        open_reason:
          type: [string, 'null']
          enum: [unusual_activity, due_diligence_refresh, external_referral, screening_follow_up, other, null]
        opened_by:
          $ref: '#/components/schemas/ReviewActor'
        owner_id:
          type: [string, 'null']
        due_at:
          type: [string, 'null']
          format: date-time
        paused_at:
          type: [string, 'null']
          format: date-time
        overdue:
          type: boolean
        closed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ReviewDecision:
      type: object
      required: [id, object, livemode, review_id, decision, reason_code, note_recorded, proposed_by, requires_approval, approval_rule, approval, created_at, updated_at]
      properties:
        id:
          type: string
          example: ird_01JB9A
        object:
          type: string
          enum: [review_decision]
        livemode:
          type: boolean
        review_id:
          type: string
          example: irv_01JB8QK2
        decision:
          $ref: '#/components/schemas/ReviewDecisionType'
        reason_code:
          $ref: '#/components/schemas/ReviewReasonCode'
        note_recorded:
          type: boolean
        proposed_by:
          $ref: '#/components/schemas/ReviewActor'
        requires_approval:
          type: boolean
        approval_rule:
          type: [string, 'null']
          description: Why a second approver is needed; `null` when none is.
          enum: [sanctions_pep, all, api_clearance, null]
        approval:
          type: [object, 'null']
          description: The approver's answer; `null` until there is one.
          required: [id, outcome, by, note_recorded, created_at]
          properties:
            id:
              type: string
            outcome:
              type: string
              enum: [approved, sent_back, withdrawn]
            by:
              $ref: '#/components/schemas/ReviewActor'
            note_recorded:
              type: boolean
            created_at:
              $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ReviewNote:
      type: object
      required: [id, object, livemode, review_id, author, created_at, updated_at]
      description: A note's presence. Its text is never returned by the API.
      properties:
        id:
          type: string
          example: irn_01JB9C
        object:
          type: string
          enum: [review_note]
        livemode:
          type: boolean
        review_id:
          type: string
        author:
          $ref: '#/components/schemas/ReviewActor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ReviewDetail:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [matched_entries, opening_note_recorded, pending_decision_id, decisions, notes, events]
          properties:
            matched_entries:
              type: integer
              description: How many list entries the source screening matched.
            opening_note_recorded:
              type: boolean
            pending_decision_id:
              type: [string, 'null']
              description: The decision waiting for a second approver, if any.
            decisions:
              type: array
              items:
                $ref: '#/components/schemas/ReviewDecision'
            notes:
              type: array
              items:
                $ref: '#/components/schemas/ReviewNote'
            events:
              type: array
              items:
                type: object
                required: [kind, actor, summary, created_at]
                properties:
                  kind:
                    type: string
                  actor:
                    $ref: '#/components/schemas/ReviewActor'
                  summary:
                    type: string
                  created_at:
                    $ref: '#/components/schemas/Timestamp'
    ReviewDecisionRequest:
      type: object
      required: [decision, reason_code]
      additionalProperties: false
      properties:
        decision:
          $ref: '#/components/schemas/ReviewDecisionType'
        reason_code:
          $ref: '#/components/schemas/ReviewReasonCode'
        note:
          type: string
          maxLength: 2000
          description: Stored in a vault; never returned by the API.
    ReviewSettings:
      type: object
      required: [object, livemode, second_approver, cleared_list_enabled, cleared_list_min_decisions, cleared_list_months, target_high_minutes, target_medium_minutes, target_low_minutes, business_day_start_minute, business_day_end_minute, business_days, timezone, auto_open, retention_years, min_retention_years, api_clearance_requires_approval]
      properties:
        object:
          type: string
          enum: [review_settings]
        livemode:
          type: boolean
        second_approver:
          type: string
          enum: [off, sanctions_pep, all]
        cleared_list_enabled:
          type: boolean
        cleared_list_min_decisions:
          type: integer
        cleared_list_months:
          type: integer
        target_high_minutes:
          type: integer
        target_medium_minutes:
          type: integer
        target_low_minutes:
          type: integer
        business_day_start_minute:
          type: integer
        business_day_end_minute:
          type: integer
        business_days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        timezone:
          type: string
          example: America/Toronto
        auto_open:
          type: boolean
        retention_years:
          type: integer
          minimum: 7
          description: How long your review records are kept. 7 years by default; it can only be extended (beyond 7 years with the Audit Pack).
        min_retention_years:
          type: integer
        api_clearance_requires_approval:
          type: boolean
          enum: [true]
    ReviewEvent:
      type: object
      description: |
        The `data.object` of every `intelligence.review.*` event: ids, codes and your own reference for the
        subject. It never carries a name (not even the masked subject), a date of birth, contact details,
        note text, a person on your team, anything about Anton's own screening, or anything about another
        account. Fetch the review for more.
      required: [id, object, livemode, review_id, number, kind, priority, source, actor_type, occurred_at]
      properties:
        id:
          type: string
          description: The review's id. Same as `review_id`.
        object:
          type: string
          enum: [review_event]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          $ref: '#/components/schemas/ReviewStatus'
        review_id:
          type: string
        number:
          type: string
        kind:
          $ref: '#/components/schemas/ReviewKind'
        priority:
          type: string
        source:
          type: string
        evaluation_id:
          type: string
        reference:
          type: string
          description: Your own reference for the subject, when you gave one.
        actor_type:
          type: string
          enum: [user, api_client, system]
        due_at:
          $ref: '#/components/schemas/Timestamp'
        decision_id:
          type: string
        decision:
          $ref: '#/components/schemas/ReviewDecisionType'
        reason_code:
          $ref: '#/components/schemas/ReviewReasonCode'
        requires_approval:
          type: boolean
        approval_rule:
          type: string
          enum: [sanctions_pep, all, api_clearance]
        approved:
          type: boolean
        reason:
          type: string
          description: Why a review reopened.
          enum: [sent_back, withdrawn, customer_responded]
        outcome:
          $ref: '#/components/schemas/ReviewDecisionType'
        note_id:
          type: string
        occurred_at:
          $ref: '#/components/schemas/Timestamp'

    PolicyMatch:
      type: object
      description: >-
        The `data.object` of `policy.matched`: which of your own approval policies a payout matched and what it
        did. A match is a decision, not a stored object, so it has no `id`.
      required: [object, livemode, payout_id, policy_id, action]
      properties:
        object:
          type: string
          enum: [policy_match]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        payout_id:
          type: [string, 'null']
          description: The payout that matched. `null` when it was refused at creation and never stored.
        policy_id:
          type: string
          description: Your approval policy.
        action:
          type: string
          description: What the policy did.
          enum: [require_approval, hold_for_review, block]

    ScheduleEvent:
      type: object
      description: >-
        The `data.object` of `schedule.executed`, `schedule.failed` and `schedule.paused`: the schedule and the
        run the event is about.
      required: [id, object, livemode, name, status, beneficiary_id, instrument_id, amount, currency, run, next_run_at, created_at, updated_at]
      properties:
        id:
          type: string
          description: The schedule.
        object:
          type: string
          enum: [schedule]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          description: The schedule's status after the event.
        name:
          type: string
          description: The schedule's name.
        beneficiary_id:
          type: string
          description: Who is paid.
        instrument_id:
          type: string
          description: The instrument paid.
        amount:
          type: string
          description: The amount of each run, as a decimal string.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: The currency of each run.
        run:
          type: [object, 'null']
          description: The run the event reports. `null` when the event is not about one run.
          required: [run_date, payout_id, cause]
          properties:
            run_date:
              type: string
              format: date
              description: The date the run was for.
            payout_id:
              type: [string, 'null']
              description: The payout the run created. `null` when it failed.
            cause:
              type: [string, 'null']
              description: A coarse category for a failed run. `null` otherwise.
        next_run_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the schedule runs next. `null` when it is paused or finished.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the object last changed.

    BalanceAlert:
      type: object
      description: >-
        The `data.object` of `balance.low`: the threshold that was crossed and the balance that crossed it.
      required: [id, object, livemode, currency, balance, threshold, latched_at]
      properties:
        id:
          type: string
          description: The balance alert threshold.
        object:
          type: string
          enum: [balance_alert]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: The currency of the balance.
        balance:
          type: string
          description: The available balance when the threshold was crossed, as a decimal string.
        threshold:
          type: string
          description: The threshold, as a decimal string.
        latched_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the threshold was crossed. The alert fires once until the balance recovers.

    FundingCredit:
      type: object
      description: >-
        The `data.object` of `funding.credit`: a deposit credited to your balance. The sender name is masked.
      required: [id, object, livemode, amount, currency, sender_name, account_id, reference, credited_at]
      properties:
        id:
          type: string
          description: The credit.
        object:
          type: string
          enum: [funding_credit]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        amount:
          type: string
          description: The amount credited, as a decimal string.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: The currency credited.
        sender_name:
          type: string
          description: The sender's name, masked.
        account_id:
          type: string
          description: The account credited.
        reference:
          type: string
          description: The payment reference.
        credited_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the deposit was credited.

    Insight:
      type: object
      description: >-
        The `data.object` of `insight.created`: a finding Anton raised about your activity. The evidence and
        detail stay in the portal.
      required: [id, object, livemode, type, severity, title, created_at]
      properties:
        id:
          type: string
          description: The insight.
        object:
          type: string
          enum: [insight]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        type:
          type: string
          description: The kind of finding.
        severity:
          type: string
