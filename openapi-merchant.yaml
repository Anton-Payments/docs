              $ref: '#/components/schemas/EndUserRequest'
      responses:
        '200':
          description: Beneficiary restored.
          content:
            application/json:
              example: {"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary","livemode":false,"status":"active","type":"individual","display_name":"Jane Smith","country":"GB","external_ref":null,"risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{},"created_at":"2026-11-20T02:18:15.220Z","updated_at":"2026-11-20T02:18:15.223Z"}
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`beneficiary_not_active` (the beneficiary's state does not allow this change) or `idempotency_in_flight`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/beneficiaries/{id}/rescreen:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Beneficiary ID (prefixed `ben_`).
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    post:
      tags: [Beneficiaries]
      summary: Re-screen a beneficiary
      operationId: rescreenBeneficiary
      description: |-
        Queue a fresh check of an active beneficiary. The call is asynchronous and responds `202` immediately with the beneficiary, whose `status` stays `active` until the check completes. The beneficiary may then become unavailable for payouts (`blocked`, with the `beneficiary.blocked` webhook event); otherwise nothing changes. Both the request and the outcome are audited.

        Takes no request body. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Re-screen queued. The beneficiary, in its current state.
          content:
            application/json:
              example: {"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary","livemode":false,"status":"active","type":"individual","display_name":"Jane Smith","country":"GB","external_ref":null,"risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{},"created_at":"2026-11-20T02:18:15.220Z","updated_at":"2026-11-20T02:18:15.223Z"}
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`beneficiary_not_active` (only active beneficiaries can be re-screened) or `idempotency_in_flight`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Re-screening is temporarily unavailable (`service_unavailable`). Safe to retry.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/payouts:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Payouts]
      summary: Create a payout
      operationId: createPayout
      description: |-
        Send money from your merchant balance to a beneficiary's payment instrument. The payout goes through compliance screening and risk evaluation before it is submitted to a rail. See [How Anton Evaluates Payouts](/concepts/how-anton-evaluates-payouts).

        The payout usually comes back in status `processing`, because screening starts as it is created. It is `on_hold` when it goes to review. When your own approval policy needs a second person, it moves to `pending_approval` after screening. Treat `created` the same way: in progress. The payout moves on asynchronously, and its status changes arrive as `payout.*` webhook events. Do not poll.

        Both `source_amount` and `destination_amount` are required. `fixed_side` (`fixed_source` or `fixed_destination`) says which one is authoritative, and the other is recomputed from current corridor pricing. Amounts are decimal strings with at most the currency's precision (2 places for USD, 0 for JPY, 6 for USDC). More is `422
        amount_precision_invalid`. To pin the fee and rate, call `POST /v1/pricing/quotes` first and pass its `id` as `quote_id`; the payout must match the quote's currencies, amounts, `method`, `rail_type` and destination country, or it is `422 quote_mismatch` naming the field.

        A payout that cannot be processed is refused with `422
        cannot_be_processed`, and the response never says why. A payout your own approval policy blocks is `422 policy_blocked`.

        Requires an `Idempotency-Key` header. A retry with the same key and the same request returns the original result, including the same refusal when the payout was refused, and sends no second `payout.created` event. The same key with a different request is `422 idempotency_key_reused`, however long ago the first call was.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCreateRequest'
            examples:
              same_currency:
                summary: Same-currency USD payout
                value:
                  beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
                  instrument_id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
                  source_amount: "500.00"
                  source_currency: USD
                  destination_amount: "500.00"
                  destination_currency: USD
                  method: ach
                  rail_type: fiat
                  fixed_side: fixed_destination
                  purpose: contractor_payment
                  reference: INV-1042
                  metadata:
                    order_ref: A-1042
              cross_currency:
                summary: USD to EUR over SEPA
                value:
                  beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
                  instrument_id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
                  source_amount: "550.00"
                  source_currency: USD
                  destination_amount: "500.00"
                  destination_currency: EUR
                  method: sepa
                  rail_type: fiat
                  fee_bearer: merchant
                  fixed_side: fixed_destination
                  purpose: supplier_payment
                  reference: PO-8821
              stablecoin:
                summary: USDC on Ethereum
                value:
                  beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
                  instrument_id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA3
                  source_amount: "1000.000000"
                  source_currency: USDC
                  destination_amount: "1000.000000"
                  destination_currency: USDC
                  method: stablecoin
                  rail_type: stablecoin
                  fixed_side: fixed_destination
                  purpose: contractor_payment
                  reference: INV-1042
      responses:
        '201':
          description: Payout created. Webhooks report its later lifecycle.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              example: {"id":"pay_dbvqrpqukoh470i0a7n0","object":"payout","livemode":false,"status":"processing","status_message":null,"failure_code":null,"beneficiary_id":"ben_dbvqrpqukoh470i0a7m0","beneficiary_name":null,"instrument_id":"ins_test789","batch_id":null,"method":"swift","rail_type":"fiat","network":null,"source_amount":"250.00","source_currency":"USD","destination_amount":"200.00","destination_currency":"GBP","exchange_rate":null,"fee":"0.00","fee_currency":"USD","fee_bearer":"merchant","fixed_side":"fixed_destination","fee_finalized":false,"total_debited":"255.00","total_debited_currency":"USD","buffer_amount":"5.00","buffer_currency":"USD","wallet_address":null,"token_contract":null,"token_symbol":null,"transaction_hash":null,"block_confirmations":null,"required_confirmations":null,"network_fee":null,"network_fee_currency":null,"created_by":"usr_test123","purpose":"supplier_payment","reference":"INV-002","screened_at":null,"approved_at":null,"processed_at":null,"completed_at":null,"failed_at":null,"cancelled_at":null,"funds_released_at":null,"risk":null,"delivery":null,"session_quality":null,"metadata":{"order_ref":"A-1042"},"created_at":"2026-11-20T02:18:15.241Z","updated_at":"2026-11-20T02:18:15.241Z"}
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          description: "`resource_missing`: `beneficiary_id` or `quote_id` names no beneficiary or pricing quote of yours."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`idempotency_in_flight` (another request with this key is still running) or `quote_already_used`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: "Well-formed but refused. Codes: `validation_error` (a field fails validation; `details` lists every one, including `metadata` over its limits), `amount_precision_invalid`, `insufficient_balance`, `amount_invalid` (an amount is zero or negative; `param` names it), `payout_rejected`, `policy_blocked` (your own approval policy blocks the payout), `cannot_be_processed` (the payout cannot be processed; no further detail is given), `quote_expired`, `quote_mismatch`, and `idempotency_key_reused`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                insufficient_balance:
                  value:
                    error:
                      type: invalid_request_error
                      code: insufficient_balance
                      message: insufficient funds for this payout
                      doc_url: https://docs.antonpayments.com/api-reference/errors#insufficient_balance
                      request_id: req_01JD3XB7Q2
                cannot_be_processed:
                  value:
                    error:
                      type: invalid_request_error
                      code: cannot_be_processed
                      message: This payout cannot be processed. We are unable to provide further detail.
                      doc_url: https://docs.antonpayments.com/api-reference/errors#cannot_be_processed
                      request_id: req_01JD3XB7Q2
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Payouts]
      summary: List payouts
      operationId: listPayouts
      description: |-
        List your payouts, newest first, with cursor pagination. Every filter value is validated. An unknown status, a malformed ID or timestamp, or an unknown query parameter is a `400`, never an empty list.

        The `status` filter takes the public statuses and returns exactly the payouts whose `status` shows that value.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Filter by one or more statuses. Repeat the parameter to pass several.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PayoutStatus'
          style: form
          explode: true
        - name: beneficiary_id
          in: query
          schema:
            type: string
            pattern: '^ben_[a-zA-Z0-9]+$'
          description: Only payouts to this beneficiary (`ben_...`).
        - name: instrument_id
          in: query
          schema:
            type: string
            pattern: '^ins_[a-zA-Z0-9]+$'
          description: Only payouts to this instrument (`ins_...`).
        - name: batch_id
          in: query
          schema:
            type: string
            pattern: '^bat_[a-zA-Z0-9]+$'
          description: Only payouts created by this batch (`bat_...`).
        - name: source_currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
          description: Only payouts debited in this currency (uppercase code, for example `USD`).
        - name: destination_currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
          description: Only payouts delivered in this currency (uppercase code, for example `EUR`).
        - name: reference
          in: query
          description: Exact-match filter on your `reference`.
          schema:
            type: string
        - name: created_after
          in: query
          description: RFC 3339 timestamp. Returns payouts with `created_at` at or after it. It must be RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          description: RFC 3339 timestamp. Returns payouts with `created_at` before it. It must be RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: A page of payouts.
          content:
            application/json:
