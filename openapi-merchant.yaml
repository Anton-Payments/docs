    PayoutEvent:
      type: object
      description: A single status transition recorded against a payout.
      required: [id, payout_id, merchant_id, status, actor_type, occurred_at, created_at]
      properties:
        id:
          type: string
          pattern: '^pev_[a-zA-Z0-9]+$'
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        status:
          $ref: '#/components/schemas/PayoutStatus'
        previous_status:
          $ref: '#/components/schemas/PayoutStatus'
        actor_type:
          type: string
          description: Origin of the transition.
          enum: [system, merchant, ops, rail, engine]
        actor_id:
          type: string
          description: Identifier of the actor, if applicable.
        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    PayoutVelocityResult:
      type: object
      description: |
        A single velocity/risk rule evaluated against a payout. Snapshot
        semantics — `rule_name`, `rule_type`, `action`, and `threshold` reflect
        the rule's configuration at evaluation time. Editing or deleting the
        underlying rule later does not alter these historical rows.
      required: [id, payout_id, merchant_id, rule_id, rule_name, rule_type, action, triggered, current_value, threshold, evaluated_at, created_at]
      properties:
        id:
          type: string
          pattern: '^vrs_[a-zA-Z0-9]+$'
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        rule_id:
          type: string
          description: The velocity rule this row was evaluated against.
        rule_name:
          type: string
          description: Snapshot of the rule's display name at evaluation time.
        rule_type:
          type: string
          description: Rule family — e.g. `volume`, `count`, `geo`, `amount`.
        action:
          type: string
          enum: [block, review, alert]
          description: The action the rule would have taken if `triggered` is true.
        triggered:
          type: boolean
          description: Whether `current_value` crossed `threshold` on this evaluation.
        current_value:
          $ref: '#/components/schemas/Money'
          description: The measured value at evaluation time.
        threshold:
          $ref: '#/components/schemas/Money'
          description: The rule's configured threshold at evaluation time.
        message:
          type: string
          description: Optional human-readable context for the evaluation.
        evaluated_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    BatchStatus:
      type: string
      enum:
        - uploaded
        - validating
        - validated
        - validation_failed
        - confirmed
        - processing
        - completed
        - partial
        - failed
        - cancelled

    BatchError:
      type: object
      description: A row-level validation error.
      required: [row, message]
      properties:
        row:
          type: integer
          description: 1-based row number in the original file.
        field:
          type: string
          description: Header/column the error applies to. Empty for row-level issues.
        message:
          type: string

    BatchWarning:
      type: object
      description: A non-blocking row-level warning.
      required: [row, type, message]
      properties:
        row:
          type: integer
        type:
          type: string
          description: Category — e.g. `beneficiary_mismatch`, `duplicate_skip`, `duplicate_conflict`.
        message:
          type: string

    BatchSummary:
      type: object
      description: Validation summary the merchant reviews before confirming.
      properties:
        new_beneficiaries:
          type: integer
          description: Beneficiaries that would be created from the file.
        matched_beneficiaries:
          type: integer
          description: Rows that matched an existing beneficiary via display-name heuristic.
        external_id_matched_beneficiaries:
          type: integer
          description: |
            Rows that resolved to an existing beneficiary via merchant-supplied
            `external_id` lookup. Counted separately from `matched_beneficiaries`
            because `external_id` is a stronger match signal than a name
            heuristic.
        existing_beneficiaries:
          type: integer
          description: Distinct existing beneficiaries referenced.
        methods:
          type: object
          description: Count of rows by payment method.
          additionalProperties:
            type: integer
        estimated_debits:
          type: array
          items:
            type: object
            properties:
              currency:
                $ref: '#/components/schemas/CurrencyCode'
              amount:
                $ref: '#/components/schemas/Money'
              fx_rows:
                type: integer
              same_currency_rows:
                type: integer
              rate_timestamp:
                $ref: '#/components/schemas/Timestamp'
        fx_markup_bps:
          type: integer
          description: FX markup applied to cross-currency rows, in basis points.
        balance_check:
          type: object
          description: Balance sufficiency per funding currency.
          additionalProperties:
            type: object
            properties:
              available:
                $ref: '#/components/schemas/Money'
              estimated_debit:
                $ref: '#/components/schemas/Money'
              sufficient:
                type: boolean

    BatchRowResult:
      type: object
      required: [row, status]
      properties:
        row:
          type: integer
        status:
          type: string
          enum: [success, failed, skipped, pending]
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
        error:
          type: string
          description: Free-form reason for `failed`.
        skip_reason:
          type: string
          description: Reason for `skipped` (e.g. `duplicate`).

    Batch:
      type: object
      description: |
        A batch upload. Moves through `uploaded -> validating -> validated ->
        confirmed -> processing -> completed | partial | failed`. Can be
        cancelled from any pre-processing state.
      required:
        - id
        - merchant_id
        - uploaded_by
        - status
        - file_name
        - file_format
        - file_size
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
          example: bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        uploaded_by:
          type: string
          description: User ID of the operator who uploaded this batch.
        status:
          $ref: '#/components/schemas/BatchStatus'
        file_name:
          type: string
          example: payroll_2026_04_15.csv
        file_format:
          type: string
          enum: [csv, xlsx]
        file_size:
          type: integer
          description: Bytes.
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        warning_rows:
          type: integer
        skipped_rows:
          type: integer
        processed_rows:
          type: integer
        summary:
          $ref: '#/components/schemas/BatchSummary'
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Default funding currency used for rows that don't specify their own. Set at confirmation.
        current_row_index:
          type: integer
          description: Resumability checkpoint — highest row index successfully processed.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Deadline for confirming a `validated` batch.
        confirmed_at:
          $ref: '#/components/schemas/Timestamp'
        confirmed_by:
          type: string
        cancelled_at:
          $ref: '#/components/schemas/Timestamp'
        cancelled_by:
          type: string
        processing_started_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookEventType:
      type: string
      description: |
        See [Webhook Events](/api-reference/webhook-events) for the full catalog
        and payload shapes. Some reserved event types (`balance.low` on some
        paths) may be defined but not yet dispatched — subscribing to them is
        safe but no deliveries arrive until they're wired up.
      enum:
        - payout.created
        - payout.approved
        - payout.processing
        - payout.sent
        - payout.completed
        - payout.failed
        - payout.cancelled
        - payout.returned
        - payout.screening_failed
        - payout.velocity_blocked
        - beneficiary.created
        - beneficiary.updated
        - beneficiary.deleted
        - beneficiary.blocked
        - instrument.created
        - instrument.updated
        - instrument.deleted
        - batch.uploaded
        - batch.completed
        - batch.failed
        - fx.quote.created
        - fx.exchange.created
        - fx.exchange.completed
        - fx.exchange.failed
        - funding.credit
        - screening.hit
        - balance.low
        - test

    WebhookSubscriptionCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL that will receive deliveries.
          example: https://example.com/webhooks/anton
        events:
          type: array
          description: Event types this subscription should receive. Use `["*"]` to subscribe to everything.
          items:
            $ref: '#/components/schemas/WebhookEventType'
        metadata:
          type: object
          description: |
            Arbitrary string-to-string map attached to the subscription.
            Echoed back on reads unchanged. Useful for correlating
            subscriptions with your own internal IDs (environment,
            tenant, integration name, etc.). Not interpreted by Anton.
          additionalProperties:
            type: string

    WebhookSubscription:
      type: object
      description: A registered webhook endpoint and its event filter.
      required: [id, merchant_id, url, events, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
          example: whk_01HX8Z9K0M2N3P4Q5R6S7T8UW
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [active, inactive]
        version:
          type: string
          description: API version this subscription pins to.
          example: "2024-01-01"
        metadata:
          type: object
          description: |
            Arbitrary string-to-string map attached at creation. Returned
            unchanged on reads. Not interpreted by Anton.
          additionalProperties:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookEvent:
      type: object
      description: A single webhook event record. The `payload` is the event-specific shape documented in [Webhook Events](/api-reference/webhook-events).
      required: [id, merchant_id, type, payload, created_at]
      properties:
        id:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        type:
          $ref: '#/components/schemas/WebhookEventType'
        payload:
          type: object
          additionalProperties: true
          description: Event-specific payload. See the Webhook Events catalog.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookDelivery:
      type: object
      description: A single delivery attempt of an event to a subscription endpoint.
      required: [id, event_id, subscription_id, status, url, attempts, max_attempts, created_at, updated_at]
      properties:
        id:
          type: string
        event_id:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
        subscription_id:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
        status:
          type: string
          enum: [pending, success, failed, abandoned]
        url:
          type: string
          description: Snapshot of the subscription URL at dispatch time.
        request_headers:
          type: object
          additionalProperties:
            type: string
        response_status:
          type: integer
          description: HTTP status returned by your endpoint.
        response_body:
          type: string
          description: Truncated response body captured from your endpoint.
        response_headers:
          type: object
          additionalProperties:
            type: string
        attempts:
          type: integer
        max_attempts:
          type: integer
        next_retry_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          type: string
          description: Transport-level error, if any (DNS, TLS, timeout, connection refused).
        duration_ms:
          type: integer
          description: Response time for the most recent attempt, in milliseconds.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          $ref: '#/components/schemas/Timestamp'

    Balance:
      type: object
      description: Available, pending, and total funds in a single currency.
      required: [id, merchant_id, currency, available, pending, total, updated_at]
      properties:
        id:
          type: string
          pattern: '^bal_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        available:
          $ref: '#/components/schemas/Money'
          description: Funds usable for new payouts.
        pending:
          $ref: '#/components/schemas/Money'
          description: Funds reserved for in-flight payouts (debited but not yet settled).
        total:
          $ref: '#/components/schemas/Money'
          description: '`available + pending`.'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: bal_01HX8Z9K0M2N3P4Q5R6S7T8UBA1
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        currency: USD
        available: "12450.00"
        pending: "550.00"
        total: "13000.00"
        updated_at: "2026-04-15T14:30:00Z"

    Corridor:
      type: object
      description: |
        An active payout corridor — a (rail_type, currency, country, method,
        network) combination Anton can deliver through. Corridors are
        destination-only; the source currency is not part of the corridor
        (Anton handles FX separately).
      required: [id, rail_type, currency, country, method, active]
      properties:
        id:
          type: string
          pattern: '^cor_[a-zA-Z0-9]+$'
        rail_type:
          $ref: '#/components/schemas/RailType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
          description: Destination country. `XX` for global crypto networks.
        network:
          $ref: '#/components/schemas/Network'
        method:
          type: string
          description: Delivery method within the corridor (bank_transfer, crypto, stablecoin, etc.).
        active:
          type: boolean
        cutoff_time:
          type: string
          description: Daily cutoff for same-day processing (fiat rails, HH:MM UTC).
        settlement_days:
          type: integer
          description: Expected settlement, in business days, for fiat corridors.
        settlement_mins:
          type: integer
          description: Expected settlement, in minutes, for crypto/stablecoin corridors.
        min_amount:
          $ref: '#/components/schemas/Money'
        max_amount:
          $ref: '#/components/schemas/Money'
        required_confirms:
          type: integer
          description: Block confirmations required for crypto corridors.

    InstrumentMethodSchema:
      type: object
      description: |
        Credential-field schema for a payment method in a specific country.
        Use to drive dynamic instrument-creation forms.
      required: [code, country, currency]
      properties:
        code:
          $ref: '#/components/schemas/PaymentMethodCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        label:
          type: string
          description: Human-friendly label for this country+method pairing.
          example: UK Bank Account (Faster Payments)
        fields:
          type: array
          description: Credential fields to prompt for.
          items:
            type: object
            required: [name, type, required]
            properties:
              name:
                type: string
                example: sort_code
              label:
                type: string
                example: Sort code
              type:
                type: string
                enum: [string, integer, enum]
              required:
                type: boolean
              pattern:
                type: string
                description: Regex the value must match, if any.
              enum:
                type: array
                items:
                  type: string
                description: Allowed values when `type=enum`.
              help:
                type: string

    FXQuoteCreateRequest:
      type: object
      required: [sell_currency, buy_currency]
      description: |
        Supply either `sell_amount` OR `buy_amount` — the missing side is
        computed from the locked rate.
      properties:
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        locked:
          type: boolean
          description: Request a locked quote with a short expiry window. Defaults to true.
          default: true

    FXQuote:
