  /v1/verifications/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Verifications]
      summary: Revoke a verification
      operationId: revokeVerification
      description: |-
        Cancel an in-flight verification and expire its hosted link. The verification moves to `revoked` and cannot be resumed. To verify the subject later, open a new verification via re-verify.

        Revoking a verification that is already approved, declined or expired fails with `409 invalid_verification_state`. Revoking one that is already revoked returns it unchanged.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/VerificationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Verification revoked.
          content:
            application/json:
              example: {"id":"vrf_dbvqrpqukoh470i0begg","object":"verification","livemode":false,"status":"revoked","subject_id":"vsub_dbvqrpqukoh470i0be60","reason":"regenerated","screening":{"status":"clear","evaluation_id":"eval_new","score":140,"tier":"low","reasons":[]},"owners":[],"link_expires_at":"2026-11-27T02:18:15.257Z","completed_at":null,"metadata":{},"created_at":"2026-11-20T02:18:15.257Z","updated_at":"2026-11-20T02:18:15.257Z"}
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`invalid_verification_state` (the verification's current state does not allow this action) or `idempotency_in_flight` (another request with the same `Idempotency-Key` is still running)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/verifications/{id}/rescreen:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Verifications]
      summary: Re-screen a verification
      operationId: rescreenVerification
      description: |-
        Re-run Anton's intelligence screening on an existing verification against its current data. The call produces a **fresh evaluation** and an updated `screening` block, so you can refresh the compliance verdict on record, for example after a watchlist update.

        It refreshes the screening only. It does **not** re-open the verification or change its status, and the prior decision stays in the audit trail. The call responds `200` with the verification, whose embedded `screening` carries the fresh `status`, `evaluation_id`, score, tier and reasons.

        It fails with `409 invalid_verification_state` on verifications that have not been screened yet (created, sent, in_progress) or are terminally cancelled (revoked, expired).

        Re-screening is not re-verify, which opens a new verification and re-collects identity.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/VerificationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Screening re-run. The verification carries the refreshed `screening` block.
          content:
            application/json:
              example: {"id":"vrf_dbvqrpqukoh470i0begg","object":"verification","livemode":false,"status":"review","subject_id":"vsub_dbvqrpqukoh470i0be60","reason":"regenerated","screening":{"status":"clear","evaluation_id":"eval_new","score":140,"tier":"low","reasons":[]},"owners":[],"link_expires_at":"2026-11-27T02:18:15.257Z","completed_at":null,"metadata":{},"created_at":"2026-11-20T02:18:15.257Z","updated_at":"2026-11-20T02:18:15.257Z"}
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`invalid_verification_state` (the verification's current state does not allow this action) or `idempotency_in_flight` (another request with the same `Idempotency-Key` is still running)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Screening is not available on this environment.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/verifications/{id}/owners/resend:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Verifications]
      summary: Resend an owner's verification link
      operationId: resendVerificationOwnerLink
      description: |-
        Mint a fresh one-time link for a single owner. Business verifications cascade to each controlling owner, who completes an individual KYC flow.

        Name the owner with exactly one of `owner_id` (an entry in the verification's `owners`; the link goes to the address on file) or `email` (the address of an owner on the case). An `email` that does not belong to an owner of THIS verification returns a 404, so a link is never minted for an arbitrary address. With `email`, `deliver: false` returns the link without emailing it, so you can pass it on.

        The link is returned once, as a secret, and never stored.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/VerificationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOwnerLinkRequest'
            examples:
              by_owner_id:
                value:
                  owner_id: vubo_01JD3XB7Q2
              by_email_without_delivery:
                value:
                  email: owner@example.com
                  deliver: false
      responses:
        '200':
          description: Fresh owner link minted.
          content:
            application/json:
              example: {"object":"verification_owner_link","livemode":false,"hosted_link":"https://verify.example.com/v/fresh","delivered":false}
              schema:
                $ref: '#/components/schemas/VerificationOwnerLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`invalid_verification_state` (the verification's current state does not allow this action) or `idempotency_in_flight` (another request with the same `Idempotency-Key` is still running)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`validation_error` (a malformed `email`) or `idempotency_key_reused`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The verification provider is not configured on this environment.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

