              example: {"id":"vsub_dbvqrpqukoh470i0be60","object":"verification_subject","livemode":false,"status":"created","type":"person","display_name":"A•• L••••••","email":"a***@example.com","external_ref":"customer_8841","country":"CA","current_verification_id":"vrf_dbvqrpqukoh470i0be6g","verifications":[{"id":"vrf_dbvqrpqukoh470i0be6g","object":"verification","livemode":false,"status":"created","subject_id":"vsub_dbvqrpqukoh470i0be60","reason":"initial","screening":null,"owners":[],"link_expires_at":"2026-11-27T02:18:15.255Z","completed_at":null,"metadata":{},"created_at":"2026-11-20T02:18:15.255Z","updated_at":"2026-11-20T02:18:15.255Z"}],"metadata":{"crm_id":"42"},"created_at":"2026-11-20T02:18:15.255Z","updated_at":"2026-11-20T02:18:15.255Z"}
              schema:
                $ref: '#/components/schemas/VerificationSubject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/verification-subjects/{id}/verifications:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Verifications]
      summary: Re-verify a subject
      operationId: reverifySubject
      description: Open a **new verification** for an existing subject, for a periodic KYC refresh or a material change in the subject's details. The prior verification history is preserved, and the subject's current status now tracks the new verification. The response carries the new verification with its secret-once `hosted_link`. When the subject has an email on file, Anton also re-delivers the link (status `sent`).
      security:
