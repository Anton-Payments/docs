      description: "**Invalidate the prior link and inquiry** and open a fresh verification for the same subject (reason `regenerated`). Use it when a link may have been forwarded or exposed: the old flow is dead the moment this returns. Responds `201` with the new verification and its secret-once `hosted_link`."
