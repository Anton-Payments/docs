components:
  securitySchemes:
    oauthDPoP:
      # DECLARED AS http/DPoP, NOT oauth2, deliberately.
      #
      # This is an OAuth 2.0 client_credentials flow, so `type: oauth2` reads as
      # the honest choice — but it renders every generated example as
      # `Authorization: Bearer <token>`, because Bearer is the OAuth2 default and
      # OpenAPI has no way to say otherwise. Anton rejects Bearer on /v1: the
      # token is DPoP-bound, and sending it as Bearer returns 401. A merchant
      # reported exactly this, having followed the generated examples.
      #
      # `type: http` with `scheme: DPoP` (registered by RFC 9449) makes the
      # rendered Authorization header correct, which is what a reader copies.
      #
      # What this gives up: `flows.clientCredentials.tokenUrl` and `scopes` as
      # structured data. That costs less than it looks like — a generic OAuth2
      # helper could never execute this flow anyway, because even the token
      # request requires a signed DPoP proof it has no way to produce. The flow
      # and both scopes are documented in full below.
      type: http
      scheme: DPoP
      description: |-
        OAuth 2.0 `client_credentials` grant (RFC 6749 §4.4) bound to a DPoP keypair (RFC 9449).

        **Flow.** Every authenticated `/v1` call needs both an access token and a fresh per-request DPoP proof.

        1. Register a credential in the merchant portal. Anton issues a `client_id` (`ant_oc_<env>_<32hex>`) and a `client_secret` (`ant_ocs_<env>_<48hex>`, shown once). The portal generates an ES256 or Ed25519 DPoP keypair in your browser, and you store the private half.
        2. Mint an access token with `POST /oauth/token`, using `Authorization: Basic <client_id:client_secret>` and `Content-Type: application/x-www-form-urlencoded`. The body is `grant_type=client_credentials`. A `DPoP` header carrying a proof signed for the token endpoint is required (no `ath` claim on this proof).
        3. Use the token. Send `Authorization: DPoP <access_token>` plus a fresh `DPoP: <proof>` header on every `/v1` request. The proof JWT must carry `htm` (request method), `htu` (request URL, no query or fragment), `iat` (within ±60s), `jti` (unique within 5 min), and `ath` (SHA-256 of the access token, base64url).

        Tokens expire in **1 hour** in production and **8 hours** in sandbox. There are no refresh tokens, so call `/oauth/token` again with your secret. Anton's public signing key is published at `/.well-known/jwks.json`.

        **Scopes** are granted to the credential when you register it in the merchant portal. The token request takes no `scope` parameter, and the token response lists the credential's scopes in its `scope` field.

        | Scope | Grants |
        |---|---|
        | `payouts` | Money movement: payouts, batches, beneficiaries, instruments, balances, funding, FX. |
        | `intelligence` | Anton Intelligence: screening evaluations. |

        This scheme is declared as `http`/`DPoP` rather than `oauth2` so that generated examples show the correct `Authorization: DPoP <access_token>` header. Sending `Authorization: Bearer <access_token>` returns `401 unauthorized`. The token is sender-constrained, and the two schemes are not interchangeable.
    dpopHeader:
      type: apiKey
      in: header
      name: DPoP
      description: "Per-request DPoP proof JWT (RFC 9449). Send it with the `Authorization: DPoP <access_token>` header on every protected operation. You sign the proof with your private DPoP key, and it carries the `htm`, `htu`, `iat`, `jti` and `ath` claims."

  parameters:
    ClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: false
      description: "Your own correlation ID for the request, up to 128 characters from `A-Z a-z 0-9 . _ : -`. Anything else is ignored, never rejected. We log it as a separate field and never use it as our request ID. Accepted on every `/v1` operation."
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    Limit:
      name: limit
      in: query
      description: Items per page, 1 to 100. A value outside that range returns `400 invalid_limit`.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by a previous list response. Omit for the first page.
      required: false
      schema:
        type: string
    AntonVersion:
      name: Anton-Version
      in: header
      description: "The API version for this request, a date such as `2026-12-01`. Optional. Without it, the request runs on your account's pinned version: the latest version when you created your first OAuth client, or the launch version (`2026-12-01`) if you have not created one. An unknown value returns `400 invalid_api_version`. The header applies to one request and never changes your pinned version; move the pin from the dashboard. It does not apply to webhooks, which follow your pinned version. The response echoes the version used in the `Anton-Version` header."
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        example: '2026-12-01'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Unique key identifying this operation. Sending the same key twice returns the original
        response instead of creating a duplicate. Keys are retained for 24 hours.
      required: true
      schema:
        type: string
        maxLength: 255
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      description: Optional on PATCH and DELETE. Sending the same key with the same request returns the original response instead of repeating the change. Keys are kept for 24 hours.
      required: false
      schema:
        type: string
        maxLength: 255
    IntelligenceEvaluationID:
      name: id
      in: path
      required: true
      description: Intelligence evaluation ID.
      schema:
        type: string
        pattern: '^eval_[a-zA-Z0-9]+$'
    ReviewID:
      name: id
      in: path
      required: true
      description: Review ID.
      schema:
        type: string
        pattern: '^irv_[a-zA-Z0-9]+$'
    VerificationSubjectID:
      name: id
      in: path
      required: true
      description: Verification subject ID.
      schema:
        type: string
        pattern: '^vsub_[a-zA-Z0-9]+$'
    VerificationID:
      name: id
      in: path
      required: true
      description: Verification attempt ID.
      schema:
        type: string
        pattern: '^vrf_[a-zA-Z0-9]+$'

  headers:
    Request-Id:
      description: Our identifier for this request (`req_...`), on every response and the same value as `error.request_id`. Always generated by us. Include it when you contact support. On an idempotent replay it is the replay's own ID, not the original's.
      schema:
        type: string
        pattern: '^req_[a-z0-9]+$'
        example: req_dbvk5raukoh5c1reg93g
    X-Request-ID:
      description: >-
        Deprecated alias of `Request-Id`, same value, emitted for one transition and then removed. A client's
        own `X-Request-ID` is no longer echoed; send `X-Client-Request-Id` instead.
      deprecated: true
      schema:
        type: string
    Anton-Version:
      description: |
        The API version this response was produced at. Present on every `/v1` response. An idempotent
        replay returns the version of the original request, not the replay's.
      schema:
        type: string
        example: '2026-12-01'
    Deprecation:
      description: |
        Present only on a route or API version scheduled for removal. An RFC 9745 date: `@` followed by
        the Unix time in seconds at which it was or will be deprecated, for example `@1799971200`.
      schema:
        type: string
        example: '@1799971200'
    Sunset:
      description: |
        Present only on a route or API version scheduled for removal, together with `Deprecation`. The
        date from which it may stop working, as an HTTP-date (RFC 8594), for example
        `Thu, 01 Jul 2027 00:00:00 GMT`.
      schema:
        type: string
        example: Thu, 01 Jul 2027 00:00:00 GMT
    X-RateLimit-Limit:
      description: Maximum requests permitted in the current window. Absent when the limit could not be checked (see `RateLimited`).
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window. Absent when the limit could not be checked (see `RateLimited`).
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix timestamp when the current window resets. Absent when the limit could not be checked (see `RateLimited`).
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying. Included on every 429 and 503 response (a 503 carries `1` unless a longer wait is known).
      schema:
        type: integer
    WWW-Authenticate:
      description: |
        On every `401`: the authentication challenge (RFC 6750, RFC 9449). `DPoP realm="anton", algs="ES256 EdDSA"`
        names the scheme and the DPoP proof algorithms we accept. When a credential was sent and refused it
        adds `error="invalid_token"` (the access token, or a static API key) or `error="invalid_dpop_proof"`
        (the DPoP proof). A request with no credential carries no `error`.
      schema:
        type: string
        example: 'DPoP realm="anton", algs="ES256 EdDSA", error="invalid_token"'
    Idempotent-Replayed:
      description: '`true` when the response is a replay of a previous request with the same `Idempotency-Key`.'
      schema:
        type: string
        enum: ["true"]

  responses:
    BadRequest:
      description: The request body could not be parsed or contains unknown fields, its `Content-Type` is not `application/json` (`invalid_content_type`), or the `Anton-Version` header is not a known version (`invalid_api_version`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, expired or invalid credentials (access token or DPoP proof). Carries `WWW-Authenticate`.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing_key:
              summary: Missing bearer token
              value:
                error:
                  type: authentication_error
                  code: unauthorized
                  message: missing or invalid credentials
                  doc_url: https://docs.antonpayments.com/api-reference/errors#unauthorized
                  request_id: req_01JD3XB7Q2
    Forbidden:
      description: >-
        Authenticated, but not permitted for this operation. A sandbox credential used against production is
        `key_environment_mismatch`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            wrong_environment:
              summary: Sandbox credential used against production
              value:
                error:
                  type: permission_error
                  code: key_environment_mismatch
                  message: test tokens are not allowed in production
                  doc_url: https://docs.antonpayments.com/api-reference/errors#key_environment_mismatch
                  request_id: req_01JD3XB7Q2
    CapabilityForbidden:
      description: |-
        The account capability or credential scope the call needs is missing.

        `capability_required`: the merchant account does not hold the required capability (for example, an AI-compliance-only account calling a payout endpoint). `insufficient_scope`: the account holds it, but this credential was created without the matching scope. Effective access is always `scopes ∩ capabilities`. A sandbox credential used against production is `key_environment_mismatch`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            capability_required:
              summary: Account lacks the capability
              value:
                error:
                  type: permission_error
                  code: capability_required
                  message: this endpoint requires the "payouts" account capability
                  doc_url: https://docs.antonpayments.com/api-reference/errors#capability_required
                  request_id: req_01JD3XB7Q2
            insufficient_scope:
              summary: Credential lacks the scope
              value:
                error:
                  type: permission_error
                  code: insufficient_scope
                  message: this endpoint requires a credential with the "payouts" scope
                  doc_url: https://docs.antonpayments.com/api-reference/errors#insufficient_scope
                  request_id: req_01JD3XB7Q2
            wrong_environment:
              summary: Sandbox credential used against production
              value:
                error:
                  type: permission_error
                  code: key_environment_mismatch
                  message: test tokens are not allowed in production
                  doc_url: https://docs.antonpayments.com/api-reference/errors#key_environment_mismatch
                  request_id: req_01JD3XB7Q2
    ModuleNotEnabled:
      description: "`module_not_enabled`: your account does not have the add-on the call needs (the Reviews API and Webhooks add-on, or the Audit Pack for exports). Also used for `capability_required` / `insufficient_scope` (the `intelligence` scope) and `insufficient_permissions`."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            module_not_enabled:
              value:
                error:
                  type: permission_error
                  code: module_not_enabled
                  message: this feature is not enabled for your account
                  doc_url: https://docs.antonpayments.com/api-reference/errors#module_not_enabled
                  request_id: req_01JD3XB7Q2
    NotFound:
      description: The resource does not exist, or belongs to a different merchant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: >-
        The request failed validation (`validation_error`, or a more specific code such as
        `amount_precision_invalid`). `details` lists every failing field. The same status also carries
        `idempotency_key_reused`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    IdempotencyConflict:
      description: "`idempotency_in_flight`: another request with the same `Idempotency-Key` is still being processed. Retry after it completes, and the completed response is replayed."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            idempotency_in_flight:
              value:
                error:
                  type: idempotency_error
                  code: idempotency_in_flight
                  message: another request with this Idempotency-Key is still in flight; retry after it completes
                  doc_url: https://docs.antonpayments.com/api-reference/errors#idempotency_in_flight
                  request_id: req_01JD3XB7Q2
    IdempotencyKeyReused:
      description: "`idempotency_key_reused`: you used the same `Idempotency-Key` with a different request body. Send a new key for a new request."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            idempotency_key_reused:
              value:
                error:
                  type: idempotency_error
                  code: idempotency_key_reused
                  message: idempotency key already used with a different request payload
                  doc_url: https://docs.antonpayments.com/api-reference/errors#idempotency_key_reused
                  request_id: req_01JD3XB7Q2
    MissingIdempotencyKey:
      description: "`missing_idempotency_key`: this operation requires an `Idempotency-Key` header."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing_idempotency_key:
              value:
                error:
                  type: invalid_request_error
                  code: missing_idempotency_key
                  message: Idempotency-Key header is required for this endpoint
                  doc_url: https://docs.antonpayments.com/api-reference/errors#missing_idempotency_key
                  request_id: req_01JD3XB7Q2
    RateLimited:
      description: >-
        Rate limit exceeded. See `Retry-After`. The `X-RateLimit-*` headers are
        on every authenticated API response, not only on 429s; they are
        documented here because this is where clients act on them. If Anton
        cannot check the limit for a moment, the request is served without a
        limit check and the three headers are left out rather than guessed:
        treat a response without them as "limit unknown", not "unlimited".
        The headers are the contract: they report the limit that applies to
        the request, and the numbers behind them can change. Limits are kept
        per IP address across the API, and per account on some routes (for
        example `/v1/intelligence/*`, exports and test deliveries).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rate_limit_exceeded:
              summary: Retry after the limiter resets
              value:
                error:
                  type: rate_limit_error
                  code: rate_limit_exceeded
                  message: rate limit exceeded, retry after 60 seconds
                  doc_url: https://docs.antonpayments.com/api-reference/errors#rate_limit_exceeded
                  request_id: req_01JD3XB7Q2
    InternalError:
      description: >-
        Something went wrong on our end (`api_error`: 500 `internal_error`, 502 `upstream_error`, 503
        `service_unavailable`). The message is always generic. Safe to retry with the same
        `Idempotency-Key`; quote `Request-Id` to support. A 503 carries `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    OAuthError:
      type: object
      description: "Error envelope from RFC 6749 §5.2 and RFC 9449. It differs from Anton's standard `ErrorEnvelope`: the OAuth endpoints (`/oauth/token`) return this flat shape so any OAuth-conformant SDK can branch on `error` without learning Anton-specific shapes."
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_dpop_proof
            - invalid_token
            - server_error
        error_description: { type: string }

    JSONWebKey:
      type: object
      description: ES256 (P-256) public key in JWK form, as published by `/.well-known/jwks.json`.
      required: [kty, crv, x, y, alg, use, kid]
      properties:
        kty: { type: string, enum: [EC] }
        crv: { type: string, enum: [P-256] }
        x:   { type: string, description: Base64url-encoded x coordinate (32 bytes). }
        y:   { type: string, description: Base64url-encoded y coordinate (32 bytes). }
        alg: { type: string, enum: [ES256] }
        use: { type: string, enum: [sig] }
        kid: { type: string }

    ErrorObject:
      type: object
      description: >-
        The error object of every `/v1` error response. `type`, `code`, `message`, `doc_url` and `request_id` are
        always present.
      required: [type, code, message, doc_url, request_id]
      properties:
        type:
          type: string
          description: >-
            The kind of error; it follows the HTTP status. `idempotency_error` is used only for the two
            `Idempotency-Key` failures that are a 409 or a 422 (`idempotency_in_flight`, `idempotency_key_reused`).
          enum:
            - authentication_error
            - permission_error
            - invalid_request_error
            - idempotency_error
            - rate_limit_error
            - api_error
          example: invalid_request_error
        code:
          type: string
          description: Machine-readable error code. Branch on this, not on `message`. Each code is documented at its `doc_url`.
          example: amount_precision_invalid
          x-anton-error-codes:
            # BEGIN GENERATED: error codes
