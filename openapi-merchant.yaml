          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/verifications/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Verifications]
      summary: Resend a verification link
      operationId: resendVerificationLink
      description: Mint a fresh one-time hosted link for the **same verification** and re-deliver it to the subject's email when one is on file. Use it when the previous link expired unused or never arrived. It fails with `409 invalid_verification_state` on verifications in a terminal state (approved, declined, expired, revoked); open a new verification through re-verify instead.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/VerificationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Fresh link minted (secret-once, in `hosted_link`).
          content:
            application/json:
