        peer:
          type: string
          enum: [sentinel, engine, brain]
        status:
          type: string
          enum: [complete, partial, error, timeout, not_configured, skipped]
        found:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        error_count:
          type: integer
        evaluated_at:
          $ref: '#/components/schemas/Timestamp'

    IntelligenceFinding:
      type: object
      required: [id, peer, kind]
      properties:
        id: { type: string }
        peer:
          type: string
          enum: [sentinel, engine, brain]
        kind: { type: string }
        subject_ref: { type: string }
        query_ref: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
        identity_confidence:
          type: string
          enum: [none, possible, likely, confirmed]
        score:
          type: number
        match:
          type: boolean
        matched_entity_id:
          type: string
        matched_schema:
          type: string
        topics:
          type: array
          items: { type: string }
        datasets:
          type: array
          items: { type: string }
        matched_fields:
          type: array
          items: { type: string }
        contradicted_fields:
          type: array
          items: { type: string }
        missing_disambiguators:
          type: array
          items: { type: string }
        cleared:
          type: boolean
        first_seen:
          type: string
        last_seen:
          type: string

    VerificationStatus:
      type: string
      description: |
        Verification attempt lifecycle status.

        - `created` — attempt exists, link minted, nothing delivered yet (manual delivery, or email unavailable)
        - `sent` — hosted link delivered to the subject by email
        - `in_progress` — the subject opened the flow
        - `processing` — submitted; provider checks running
        - `awaiting_owners` — business only: the business case is done, owner (UBO) flows outstanding
        - `review` — flagged for manual review
        - `approved` — verified (terminal)
        - `declined` — failed verification (terminal)
        - `expired` — the link or inquiry lapsed unused (terminal)
        - `revoked` — cancelled by the merchant (terminal)
      enum:
        - created
        - sent
        - in_progress
        - processing
        - awaiting_owners
        - review
        - approved
        - declined
        - expired
        - revoked

    VerificationCheck:
      type: object
      description: One provider check on an attempt (e.g. government-ID authenticity, selfie match).
      required: [type, label, status, detail]
      properties:
        type:
          type: string
          description: Machine-readable check type.
        label:
          type: string
          description: Human-readable check name.
        status:
          type: string
          enum: [passed, failed, review, pending]
        detail:
          type: string
          description: Human-readable outcome detail.

    VerificationScreening:
      type: object
      description: |
        Sanctions/PEP/watchlist screening block. Every completed verification is screened through
        Anton Intelligence; `evaluation_id` resolves at `GET /v1/intelligence/evaluations/{id}` for
        the full decision evidence.
      required: [status, lists_checked, evaluation_id, detail]
      properties:
        status:
          type: string
          enum: [clear, hit, pending]
        lists_checked:
          type: array
          items:
            type: string
          description: Lists screened against (e.g. OFAC SDN, UN Consolidated, EU Consolidated, UK HMT, PEP).
        evaluation_id:
          type: string
          description: Anton Intelligence evaluation backing this screening outcome.
        detail:
          type: string

    VerificationUBO:
      type: object
      description: |
        A controlling owner (UBO) on a business verification. Each owner completes an individual
        KYC flow; the business cannot reach `approved` until every controlling owner has.
        `display_name` is masked.
      required: [id, display_name, email, ownership_pct, status]
      properties:
        id:
          type: string
          description: Owner ID (`vubo_...`).
        display_name:
          type: string
          description: Masked owner name.
        email:
          type: string
        ownership_pct:
          type: integer
          description: Declared ownership percentage.
        status:
          $ref: '#/components/schemas/VerificationStatus'
        completed_at:
          type: string
          format: date-time
          description: Present once the owner's flow reached a terminal outcome.

    VerificationAttempt:
      type: object
      description: |
        One verification attempt. `hosted_link` is **secret-once**: present only on the response
        that minted it (create / resend / regenerate / re-verify) and never on a read.
      required: [id, status, reason, created_at, checks]
      properties:
        id:
          type: string
          description: Attempt ID (`vrf_...`).
        status:
          $ref: '#/components/schemas/VerificationStatus'
        reason:
          type: string
          enum: [initial, reverification, regenerated]
          description: Why this attempt was opened.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: Present once the attempt reached a terminal outcome.
        link_expires_at:
          type: string
          format: date-time
          description: When the current hosted link lapses.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/VerificationCheck'
        screening:
          $ref: '#/components/schemas/VerificationScreening'
        ubos:
          type: array
          items:
            $ref: '#/components/schemas/VerificationUBO'
          description: Business verifications only — the owner cascade.
        hosted_link:
          type: string
          description: Secret-once hosted verification link. Only on minting responses.

    VerificationSubject:
      type: object
      description: |
        A person or business you verify. `display_name` is **masked on every read**
        (`A•• L••••••••`) — Anton stores the true name only as a vault token reference, and it is
        revealable solely through the dashboard's audited, admin-only reveal flow.
      required: [id, type, display_name, email, country, created_at, attempts]
      properties:
        id:
          type: string
          description: Subject ID (`vsub_...`).
        type:
          type: string
          enum: [person, business]
        display_name:
          type: string
          description: Masked display name.
        email:
          type: string
        external_ref:
          type: string
          description: Your identifier for this subject, echoed back verbatim.
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        created_at:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/VerificationAttempt'
          description: List responses carry a single synthesized latest attempt; the detail endpoint carries the full history, newest first.

    CreateVerificationSubjectRequest:
      type: object
      required: [type, display_name]
      properties:
        type:
          type: string
          enum: [person, business]
        display_name:
          type: string
          description: The subject's legal name. Vault-tokenized at rest; masked on every read.
        email:
          type: string
          description: 'Where the hosted link is delivered (with `delivery: "email"`), and the address shown in the flow. Without an email on file, delivery cannot happen — the attempt stays `created` and you deliver the link yourself.'
        external_ref:
          type: string
          description: Optional identifier from your systems, echoed back on reads.
        country:
          type: string
          description: ISO 3166-1 alpha-2. Recommended — it feeds sanctions screening disambiguation.
        delivery:
          type: string
          enum: [email, manual]
          default: manual
          description: '`email` — Anton emails the hosted link to the subject. `manual` (the default when omitted) — you deliver the returned `hosted_link` yourself.'
        message:
          type: string
          maxLength: 500
          description: |
            Optional text shown in the delivery email, attributed to your business. Used for that
            one send and **never persisted** (it may carry incidental PII) — it cannot be read back.
        link_expires_in_days:
          type: integer
          enum: [7, 14, 30]
          default: 7
          description: Hosted-link lifetime.

    VerificationStats:
      type: object
      required: [totals, pass_rate, median_completion_minutes, weekly]
      properties:
        totals:
          type: object
          required: [started, approved, declined, review, in_flight]
          properties:
            started: { type: integer }
            approved: { type: integer }
            declined: { type: integer }
            review: { type: integer }
            in_flight: { type: integer }
        pass_rate:
          type: number
          description: Approved ÷ decided, 0–1.
        median_completion_minutes:
          type: integer
        weekly:
          type: array
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: integer }
