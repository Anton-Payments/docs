  /v1/fx/quotes:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [FX]
      summary: Create an FX quote
      operationId: createFXQuote
      description: |-
        Quote a conversion between two of your currencies. `source` is the currency you give up and `destination` is the one you receive (the old `sell` and `buy`). Fix one side with `source_amount` or `destination_amount`, and the other is computed.

        A locked quote (the default) is stored, and you can execute it on `POST /v1/fx/exchanges` until `expires_at`. `locked: false` returns an indicative, non-binding price with `expires_at: null`; it is kept only so that executing it is refused with `422 quote_not_locked`. Requires an `Idempotency-Key`; a retry with the same key and body returns the original quote.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FXQuoteCreateRequest'
            example:
              {
                "source_currency": "USD",
                "destination_currency": "EUR",
                "destination_amount": "500.00",
                "metadata": {
                  "order_ref": "A-1042"
                }
              }
      responses:
        '201':
          description: The quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FXQuote'
              examples:
                response:
                  summary: Response
                  value:
                    {
                      "id": "fxq_dbvm07aukoh6sl1ll14g",
                      "object": "fx_quote",
                      "livemode": false,
                      "status": "active",
                      "locked": true,
                      "source_currency": "USD",
                      "destination_currency": "EUR",
                      "source_amount": "540.00",
                      "destination_amount": "500.00",
                      "mid_market_rate": "0.925924",
                      "customer_rate": "0.925924",
                      "inverse_rate": "1.080002",
                      "markup_basis_points": 0,
                      "fee": "0.00",
                      "fee_currency": "USD",
                      "expires_at": "2026-11-19T20:47:51.199Z",
                      "metadata": {
                        "order_ref": "A-1042"
                      },
                      "created_at": "2026-11-19T20:46:21.199Z",
                      "updated_at": "2026-11-19T20:46:21.199Z"
                    }
        '400':
          description: >-
            Malformed JSON, an unknown field (the old `sell_*` and `buy_*` names are `unknown_field`), a
            missing field or a missing `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "unknown_field",
                        "message": "unknown field \"buy_amount\"",
                        "param": "buy_amount",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#unknown_field",
                        "request_id": "req_01JD3XB7Q2"
                      }
                    }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: >-
            A field failed validation: both or neither amount, a zero or negative amount (`amount_invalid`),
            more decimal places than the currency allows (`amount_precision_invalid`), an unsupported currency (`currency_not_supported`) or no account
            in the source currency (`no_funding_account`).
            Also `idempotency_key_reused`: the same `Idempotency-Key` was sent with a different request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "amount_precision_invalid",
                        "message": "source_amount has more decimal places than JPY allows",
                        "param": "source_amount",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#amount_precision_invalid",
                        "request_id": "req_01JD3XB7Q2"
                      }
                    }
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: FX rates are temporarily unavailable (`fx_rates_unavailable`). Safe to retry with the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: A locked rate is not available right now (`locked_rate_unavailable`). Retry.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

