  /v1/webhooks:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      operationId: createWebhookSubscription
      description: |-
        Register an HTTPS endpoint to receive event notifications. Anton POSTs signed JSON deliveries to the URL for every event in `events` that fires on your account.

        The URL must use `https://` (enforced outside development) and be publicly reachable. Private, loopback and metadata addresses are refused. The response carries the signing `secret`, shown once. Store it now, because Anton cannot show it again. Rotate it any time with `POST /v1/webhooks/{id}/secret/rotate`. Requires an `Idempotency-Key`. Because the secret is returned once, a replay with the same key returns the same subscription with `secret` set to `null`.

        See [Webhook Events](/concepts/webhook-events) for the event catalog and [Webhook Signing](/concepts/webhook-signing) for verification.

        **Delivery.** Each delivery is a `POST` with a JSON body and these headers:

        | Header | Value |
        |---|---|
        | `X-Webhook-ID` | The event's id. The same on every retry of one event; use it to drop duplicates. |
        | `X-Webhook-Event` | The event type, such as `payout.completed`. |
        | `X-Webhook-Timestamp` | When this attempt was signed, in Unix seconds. |
        | `X-Webhook-Signature` | One or more comma-separated `v1=<hex>` entries. |
        | `User-Agent` | `AntonPayments-Webhook/1.0`. The version may change; don't match it exactly. |

        Each `v1=` entry is the lowercase hex HMAC-SHA256 of `{X-Webhook-Timestamp}.{raw request body}`, keyed with the endpoint's signing secret. The current secret's signature comes first. During a rotation's grace window, the previous secret's signature follows it. Accept the delivery if any entry matches the one you compute.

        Your endpoint has **30 seconds** to answer. Only a `2xx` counts as delivered. Redirects are not followed, so a `3xx` is a failed attempt, as are any other status, a timeout and a connection error. Anton retries a failed attempt with backoff.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
            example:
              {
                "url": "https://example.com/hooks",
                "events": [
                  "payout.completed"
                ],
                "metadata": {
                  "team": "payments"
                }
              }
      responses:
        '201':
          description: The subscription, with its one-time signing secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionCreated'
              examples:
                response:
                  summary: Response
                  value:
                    {
                      "id": "whk_dbvm07aukoh6sl1ll190",
                      "object": "webhook_subscription",
                      "livemode": false,
                      "status": "active",
                      "url": "https://example.com/hooks",
                      "events": [
                        "payout.completed"
                      ],
                      "metadata": {
                        "team": "payments"
                      },
                      "created_at": "2026-11-19T20:46:21.202Z",
                      "updated_at": "2026-11-19T20:46:21.202Z",
                      "secret": "whsec_0a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef"
                    }
        '400':
          description: >-
            Malformed JSON, an unknown field, a missing `events` or `Idempotency-Key`, or a URL that is not
            accepted (`webhook_url_required`, `webhook_url_invalid`, `webhook_url_not_https`,
            `webhook_url_private_address`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "webhook_url_not_https",
                        "message": "webhook URL must use https",
                        "param": "url",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#webhook_url_not_https",
                        "request_id": "req_01JD3XB7Q2"
                      }
                    }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: "An event type is unknown (a retired name points to its replacement), or metadata is over its limits. Also `idempotency_key_reused`: the same `Idempotency-Key` was sent with a different request body."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "validation_error",
                        "message": "validation failed",
                        "param": "events[0]",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#validation_error",
                        "request_id": "req_01JD3XB7Q2",
                        "details": [
                          {
                            "param": "events[0]",
