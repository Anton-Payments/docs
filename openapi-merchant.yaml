          type: string
        account_id:
          type: string
        type:
          type: string
          description: '`credit` | `debit` | `fee` | `fx` | provider-specific types.'
        status:
          type: string
          description: '`pending` | `posted` | `failed`.'
        amount:
          $ref: '#/components/schemas/Money'
