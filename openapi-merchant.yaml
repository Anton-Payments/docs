  /v1/beneficiaries/{id}/pii:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Beneficiary ID (prefixed `ben_`).
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    get:
      tags: [Beneficiaries]
      summary: Retrieve a beneficiary's personal details
      operationId: getBeneficiaryPII
      description: |-
        Read the beneficiary's personal details back from the secure vault, in the same shape `PATCH /v1/beneficiaries/{id}/pii` accepts.

        **Human users only.** No OAuth scope grants this read. Signed-in admin users of the merchant dashboard can make it, and a machine credential always gets `403`. Every read is recorded in the audit log (PCI DSS 10.2.1).
      responses:
        '200':
          description: The beneficiary's personal details.
          content:
            application/json:
              example: {"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary_pii","livemode":false,"type":"individual","individual":{"first_name":"Jane","last_name":"Smith","email":"jane@example.com","phone":"+442079460000","birth_date":"1988-05-12","nationality":"GB","address":{"street_line_1":"10 Example Street","city":"London","postal_code":"SW1A 1AA","country":"GB"}},"business":null}
              schema:
                $ref: '#/components/schemas/BeneficiaryPII'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Beneficiaries]
      summary: Update a beneficiary's personal details
      operationId: updateBeneficiaryPII
      description: |-
        Replace the personal details stored in the secure vault for this beneficiary. Send the detail block that matches the beneficiary's `type` (`individual` or `business`). The other block is refused.

        The block you send **replaces the stored block as a whole**. Vault tokens are immutable, so a field you leave out of the block is cleared, not kept, and the block must be complete. The `display_name` on the beneficiary is re-derived from the new details.

        Personal details are write-only for machine credentials: your system is the source of the data, so it can replace it without reading it back (see `GET /v1/beneficiaries/{id}/pii`).

        Accepts an `Idempotency-Key` but does not require one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            example: {"individual":{"first_name":"Jane","last_name":"Smith","email":"jane@example.com","phone":"+442079460000","birth_date":"1988-05-12","nationality":"GB","address":{"street_line_1":"10 Example Street","city":"London","postal_code":"SW1A 1AA","country":"GB"}}}
            schema:
              $ref: '#/components/schemas/BeneficiaryPIIUpdateRequest'
      responses:
        '200':
          description: Personal details replaced. Returns the beneficiary.
          content:
            application/json:
              example: {"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary","livemode":false,"status":"active","type":"individual","display_name":"Jane Smith","country":"GB","external_ref":null,"risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{},"created_at":"2026-11-20T02:18:15.220Z","updated_at":"2026-11-20T02:18:15.223Z"}
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/beneficiaries/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Beneficiary ID (prefixed `ben_`).
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    post:
      tags: [Beneficiaries]
      summary: Archive a beneficiary
      operationId: archiveBeneficiary
      description: |-
        Soft-disable a beneficiary. The record is kept and you can restore it later, but it cannot start new payouts while archived. Personal details stay tokenized and accessible. Archiving an archived beneficiary returns it unchanged.

        A beneficiary that cannot be used for payouts (`blocked`) cannot be archived: `409 beneficiary_not_active`.

        The body is optional and may carry only `end_user_ip`. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            example: {"end_user_ip":"203.0.113.42"}
            schema:
              $ref: '#/components/schemas/EndUserRequest'
      responses:
        '200':
          description: Beneficiary archived. Returns the updated record.
          content:
            application/json:
              example: {"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary","livemode":false,"status":"archived","type":"individual","display_name":"Jane Smith","country":"GB","external_ref":null,"risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{},"created_at":"2026-11-20T02:18:15.220Z","updated_at":"2026-11-20T02:18:15.223Z"}
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`beneficiary_not_active` (the beneficiary's state does not allow this change) or `idempotency_in_flight`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/beneficiaries/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Beneficiary ID (prefixed `ben_`).
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    post:
      tags: [Beneficiaries]
      summary: Restore an archived beneficiary
      operationId: restoreBeneficiary
      description: |-
        Restore an archived beneficiary to active status. Restoring an active beneficiary returns it unchanged.

        A beneficiary that cannot be used for payouts (`blocked`) cannot be restored through the API: `409 beneficiary_not_active`.

        The body is optional and may carry only `end_user_ip`. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            example: {"end_user_ip":"203.0.113.42"}
