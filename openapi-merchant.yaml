      description: |
        One endpoint's delivery attempts, newest first. Pages use an opaque `cursor`. The shape is the same as for an event's deliveries.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of delivery attempts.
          content:
            application/json:
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  has_more:
                    type: boolean
                    description: Whether more results exist beyond this page.
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page, `null` on the last page.
              examples:
                response:
                  summary: Response
                  value:
                    {
                      "object": "list",
                      "data": [
                        {
                          "id": "dlv_01",
                          "object": "webhook_delivery",
                          "livemode": false,
                          "status": "success",
                          "event_id": "evt_01",
                          "event_type": "payout.completed",
                          "subscription_id": "whk_01",
