        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        mid_market_rate:
          $ref: '#/components/schemas/Money'
        customer_rate:
          $ref: '#/components/schemas/Money'
          description: Mid-market adjusted by your pricing plan's FX markup.
        inverse_rate:
          $ref: '#/components/schemas/Money'
        fx_markup_bps:
          type: integer
        fx_fee:
          $ref: '#/components/schemas/Money'
        fx_fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        provider:
          type: string
        provider_ref:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        locked:
          type: boolean
        created_at:
          allOf:
