        description: Webhook subscription ID (prefixed `whk_`).
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    post:
      tags: [Webhooks]
      summary: Rotate a webhook signing secret
      operationId: rotateWebhookSecret
      description: Issue a new signing secret. For 24 hours the old secret keeps signing too, so deliveries carry two `v1=` signatures and a verifier that has not switched yet keeps working. Pass `immediate=true` to end the old secret at once, for example when it has leaked. The new secret is in the response and is not shown again. Requires an `Idempotency-Key`. Because the secret is returned once, a replay with the same key returns the same subscription with `secret` set to `null`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: immediate
          in: query
          required: false
          description: End the previous secret now instead of after 24 hours.
          schema:
            type: boolean
      responses:
        '200':
          description: The subscription and its new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionRotated'
              examples:
                response:
                  summary: Response
                  value:
                    {
                      "id": "whk_01",
                      "object": "webhook_subscription",
                      "livemode": false,
                      "status": "active",
                      "url": "https://example.com/hooks",
                      "events": [
                        "payout.completed"
                      ],
                      "metadata": {},
                      "created_at": "2026-11-19T14:03:22.104Z",
                      "updated_at": "2026-11-19T20:46:21.203Z",
                      "secret": "whsec_0a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef",
                      "previous_secret_expires_at": "2026-11-20T20:46:21.203Z"
                    }
        '400':
          description: The id is malformed (`resource_id_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "resource_id_invalid",
                        "message": "invalid id format",
                        "param": "id",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#resource_id_invalid",
                        "request_id": "req_01JD3XB7Q2"
                      }
                    }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such subscription on your account (`resource_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
