  /v1/verification-subjects:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Verifications]
      summary: List verification subjects
      operationId: listVerificationSubjects
      description: |-
        List your verification subjects, newest first. Each row carries a summary of its current verification.

        `display_name` is **masked** on every read (`J•••••• D••`). The true name is available only through the dashboard's audited reveal flow, never through the API.

        You need the `intelligence` credential scope and account capability. An unknown `type`, `status` or query parameter is a 400, never an empty list.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by subject type.
          schema:
            type: string
            enum: [person, business]
        - name: status
          in: query
          required: false
          description: Filter by the subject's current verification status, or `in_flight` for any status still under way (created, sent, in_progress, processing, awaiting_owners).
          schema:
            oneOf:
              - $ref: '#/components/schemas/VerificationStatus'
              - type: string
                enum: [in_flight]
        - name: q
          in: query
          required: false
          description: Search by your own reference (case-insensitive prefix) or the subject id (exact). Names aren't searchable. Up to 100 characters. The search goes in the request URL, so use references that contain no personal data (no names or email addresses).
          schema:
            type: string
            maxLength: 100
          example: CUST_10
        - name: created_after
          in: query
          required: false
          description: Inclusive lower bound on `created_at`, RFC 3339. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          required: false
          description: Exclusive upper bound on `created_at`, RFC 3339. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of verification subjects.
          content:
            application/json:
              example: {"object":"list","data":[{"id":"vsub_dbvqrpqukoh470i0be60","object":"verification_subject","livemode":false,"status":"created","type":"person","display_name":"A•• L••••••","email":"a***@example.com","external_ref":"customer_8841","country":"CA","current_verification_id":"vrf_dbvqrpqukoh470i0be6g","metadata":{"crm_id":"42"},"created_at":"2026-11-20T02:18:15.255Z","updated_at":"2026-11-20T02:18:15.255Z"}],"has_more":false,"next_cursor":null}
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerificationSubject'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor. `null` on the last page.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Verifications]
      summary: Create a verification subject
      operationId: createVerificationSubject
      description: |-
        Create a verification subject (a person or a business) and open its first verification. The response is the subject, with that verification in `verifications` carrying the one-time `hosted_link`. Anton mints a **hosted verification link**, a one-time identity verification flow. A person submits a government ID and selfie. A business submits business details plus a UBO cascade. Identity documents live with the verification provider and Anton's vault; they never touch your systems.

        **Link delivery.** With `delivery: "email"`, Anton emails the link to the subject and the verification is created with status `sent`. If the environment cannot deliver email, or you choose `delivery: "manual"`, the status is `created` and YOU deliver the returned `hosted_link` through your own channel. Only trust `sent` as proof an email went out.

        **`hosted_link` is secret-once.** It appears in this response (and on resend, regenerate and re-verify responses) and is never readable again. Treat it like a credential: it opens a flow that collects your customer's identity documents.

        Track progress through the `verification.*` webhook events or by polling the subject. You need the `intelligence` credential scope and account capability.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationSubjectRequest'
            examples:
              person_email_delivery:
                summary: Verify a person, Anton delivers the link
                value:
                  type: person
                  display_name: Ada Lovelace
                  email: ada@example.com
                  external_ref: customer_8841
                  country: CA
                  delivery: email
                  message: "Hi Ada — please verify your identity so we can activate your account."
                  link_expires_in_days: 7
              business_manual_delivery:
                summary: Verify a business, deliver the link yourself
                value:
                  type: business
                  display_name: Maple Exports Inc.
                  email: finance@example.com
                  country: CA
                  delivery: manual
                  link_expires_in_days: 30
      responses:
        '201':
          description: Subject created; its first verification opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSubject'
              example: {"id":"vsub_01JD3XB7Q2","object":"verification_subject","livemode":false,"status":"created","type":"person","display_name":"A•• L••••••","email":"ada@example.com","external_ref":"customer_8841","country":"CA","current_verification_id":"vrf_01JD3XB7Q3","verifications":[{"id":"vrf_01JD3XB7Q3","object":"verification","livemode":false,"status":"created","subject_id":"vsub_01JD3XB7Q2","reason":"initial","screening":null,"owners":[],"link_expires_at":"2026-11-26T20:26:03.152Z","completed_at":null,"hosted_link":"https://verify.example.com/v/example","metadata":{},"created_at":"2026-11-19T20:26:03.152Z","updated_at":"2026-11-19T20:26:03.152Z"}],"metadata":{"crm_id":"42"},"created_at":"2026-11-19T20:26:03.152Z","updated_at":"2026-11-19T20:26:03.152Z"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: '`validation_error` (every failing field is listed in `details`) or `idempotency_key_reused`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The verification provider is not configured on this environment.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/verification-subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Verifications]
      summary: Get a verification subject
      operationId: getVerificationSubject
      description: "Fetch a subject with its **full verification history** in `verifications`: every verification opened for this person or business, newest first, each with its screening result and, for businesses, the UBO cascade. `hosted_link` is never present on reads."
      parameters:
