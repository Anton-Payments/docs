    IntelligenceCryptoWallet:
      type: object
      additionalProperties: false
      properties:
        network:
          type: string
          enum: [bitcoin, ethereum, solana, polygon, tron, arbitrum, optimism, base, avalanche, bsc, ripple, stellar, litecoin, lightning, other]
        address:
          type: string

    IntelligenceCard:
      type: object
      additionalProperties: false
      properties:
        fingerprint:
          type: string
