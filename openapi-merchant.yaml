              $ref: '#/components/schemas/InstrumentUpdateRequest'
      responses:
        '200':
          description: Instrument updated.
          content:
            application/json:
              example: {"id":"ins_dbvqrpqukoh470i0a3d0","object":"instrument","livemode":false,"status":"disabled","beneficiary_id":"ben_dbvqrpqukoh470i0a3ag","method":"iban","currency":"EUR","country":null,"label":null,"default":true,"display_last4":"3000","display_bank":null,"display_network":"IBAN","masked_account":"IBAN ****3000","created_via":"api","source_batch_id":null,"metadata":{"cost_center":"4421"},"created_at":"2026-11-20T02:18:15.225Z","updated_at":"2026-11-20T02:18:15.226Z"}
              schema:
