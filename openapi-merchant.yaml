        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    BatchStatus:
      type: string
      enum:
        - uploaded
        - validating
        - validated
        - validation_failed
        - confirmed
        - processing
        - completed
        - partial
        - failed
        - cancelled

    BatchError:
      type: object
      description: A row-level validation error.
      required: [row, message]
      properties:
        row:
          type: integer
          description: 1-based row number in the original file.
        field:
          type: string
          description: Header/column the error applies to. Empty for row-level issues.
        message:
          type: string

    BatchWarning:
      type: object
      description: A non-blocking row-level warning.
      required: [row, type, message]
      properties:
        row:
          type: integer
        type:
          type: string
          description: Category — e.g. `beneficiary_mismatch`, `duplicate_skip`, `duplicate_conflict`.
        message:
          type: string

    BatchSummary:
      type: object
      description: Validation summary the merchant reviews before confirming.
      properties:
        new_beneficiaries:
          type: integer
          description: Beneficiaries that would be created from the file.
        matched_beneficiaries:
          type: integer
          description: Rows that matched an existing beneficiary.
        existing_beneficiaries:
          type: integer
          description: Distinct existing beneficiaries referenced.
        methods:
          type: object
          description: Count of rows by payment method.
          additionalProperties:
            type: integer
        estimated_debits:
          type: array
          items:
            type: object
            properties:
              currency:
                $ref: '#/components/schemas/CurrencyCode'
              amount:
                $ref: '#/components/schemas/Money'
              fx_rows:
                type: integer
              same_currency_rows:
                type: integer
              rate_timestamp:
                $ref: '#/components/schemas/Timestamp'
        fx_markup_bps:
          type: integer
          description: FX markup applied to cross-currency rows, in basis points.
        balance_check:
          type: object
          description: Balance sufficiency per funding currency.
          additionalProperties:
            type: object
            properties:
              available:
                $ref: '#/components/schemas/Money'
              estimated_debit:
                $ref: '#/components/schemas/Money'
              sufficient:
                type: boolean

    BatchRowResult:
      type: object
      required: [row, status]
      properties:
        row:
          type: integer
        status:
          type: string
          enum: [success, failed, skipped, pending]
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
        error:
          type: string
          description: Free-form reason for `failed`.
        skip_reason:
          type: string
          description: Reason for `skipped` (e.g. `duplicate`).

    BeneficiaryImportPreview:
      type: object
      description: |
        Result of `POST /v1/beneficiaries/import`. Carries the persisted
        `import_id` (which `confirm` references), top-line counts, and the full
        per-row validation outcome so the merchant portal can render inline
        per-cell errors.
      required: [import_id, summary, rows]
      properties:
        import_id:
          type: string
          pattern: '^imp_[a-zA-Z0-9]+$'
        summary:
          type: object
          required: [total, valid, invalid]
          properties:
            total:
              type: integer
            valid:
              type: integer
            invalid:
              type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BeneficiaryImportRow'

    BeneficiaryImportRow:
      type: object
      description: One row from the preview response.
      required: [row_number, type, valid]
      properties:
        row_number:
          type: integer
          description: 1-indexed row number relative to the data section (header excluded).
        type:
          type: string
          enum: [individual, business]
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
          description: Human-readable error messages. Present iff `valid` is false.
        individual:
          type: object
          description: Parsed individual payload (when `type=individual`).
          additionalProperties: true
        business:
          type: object
          description: Parsed business payload (when `type=business`).
          additionalProperties: true

    BeneficiaryImportConfirm:
      type: object
      description: Result of `POST /v1/beneficiaries/import/{import_id}/confirm`.
      required: [import_id, summary, created_ids, errors]
      properties:
        import_id:
          type: string
          pattern: '^imp_[a-zA-Z0-9]+$'
        summary:
          type: object
          required: [created, skipped, failed]
          properties:
            created:
              type: integer
              description: Beneficiaries created in this confirm call.
            skipped:
              type: integer
              description: Rows that failed validation at preview time.
            failed:
              type: integer
              description: Rows that passed preview validation but failed at create time.
        created_ids:
          type: array
          items:
            type: string
            pattern: '^ben_[a-zA-Z0-9]+$'
        errors:
          type: array
          items:
            type: object
            required: [row_number, error]
            properties:
              row_number:
                type: integer
              error:
                type: string

    Batch:
      type: object
      description: |
        A batch upload. Moves through `uploaded -> validating -> validated ->
        confirmed -> processing -> completed | partial | failed`. Can be
        cancelled from any pre-processing state.
      required:
        - id
        - merchant_id
        - uploaded_by
        - status
        - file_name
        - file_format
        - file_size
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
          example: bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        uploaded_by:
          type: string
          description: User ID of the operator who uploaded this batch.
        status:
          $ref: '#/components/schemas/BatchStatus'
        file_name:
          type: string
          example: payroll_2026_04_15.csv
        file_format:
          type: string
          enum: [csv, xlsx]
        file_size:
          type: integer
          description: Bytes.
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        warning_rows:
          type: integer
        skipped_rows:
          type: integer
        processed_rows:
          type: integer
        summary:
          $ref: '#/components/schemas/BatchSummary'
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Default funding currency used for rows that don't specify their own. Set at confirmation.
        total_amount:
          type: string
          description: |
            Aggregate destination-side amount across every valid row, populated
            during validation when all rows share a single destination currency.
            Absent for mixed-currency batches and legacy batches uploaded before
            the aggregate was materialized — callers should fall back to the
            per-currency breakdown in `summary.estimated_debits`.
          example: "12345.67"
        total_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of `total_amount`. Absent for mixed-currency batches.
        current_row_index:
          type: integer
          description: Resumability checkpoint — highest row index successfully processed.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Deadline for confirming a `validated` batch.
        confirmed_at:
          $ref: '#/components/schemas/Timestamp'
        confirmed_by:
          type: string
        cancelled_at:
          $ref: '#/components/schemas/Timestamp'
        cancelled_by:
          type: string
        processing_started_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookEventType:
      type: string
      description: |
        See [Webhook Events](/api-reference/webhook-events) for the full catalog
        and payload shapes. Some reserved event types (`balance.low` on some
        paths) may be defined but not yet dispatched — subscribing to them is
        safe but no deliveries arrive until they're wired up.
      enum:
        - payout.created
        - payout.approved
        - payout.processing
        - payout.sent
        - payout.completed
        - payout.failed
        - payout.cancelled
        - payout.returned
        - payout.screening_failed
        - payout.velocity_blocked
        - beneficiary.created
        - beneficiary.updated
        - beneficiary.deleted
        - beneficiary.blocked
        - instrument.created
        - instrument.updated
        - instrument.deleted
        - batch.uploaded
        - batch.completed
        - batch.failed
        - fx.quote.created
        - fx.exchange.created
        - fx.exchange.completed
        - fx.exchange.failed
        - funding.credit
        - screening.hit
        - balance.low
        - test

    WebhookSubscriptionCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL that will receive deliveries.
          example: https://example.com/webhooks/anton
        events:
          type: array
          description: Event types this subscription should receive. Use `["*"]` to subscribe to everything.
          items:
            $ref: '#/components/schemas/WebhookEventType'
        metadata:
          type: object
          additionalProperties:
            type: string

    WebhookSubscription:
      type: object
      description: A registered webhook endpoint and its event filter.
      required: [id, merchant_id, url, events, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^wbh_[a-zA-Z0-9]+$'
          example: wbh_01HX8Z9K0M2N3P4Q5R6S7T8UW
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [active, inactive]
        version:
          type: string
          description: API version this subscription pins to.
          example: "2024-01-01"
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookEvent:
      type: object
      description: A single webhook event record. The `payload` is the event-specific shape documented in [Webhook Events](/api-reference/webhook-events).
      required: [id, merchant_id, type, payload, created_at]
      properties:
        id:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        type:
          $ref: '#/components/schemas/WebhookEventType'
        payload:
          type: object
          additionalProperties: true
          description: Event-specific payload. See the Webhook Events catalog.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookDelivery:
      type: object
      description: A single delivery attempt of an event to a subscription endpoint.
      required: [id, event_id, subscription_id, status, url, attempts, max_attempts, created_at, updated_at]
      properties:
        id:
          type: string
        event_id:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
        subscription_id:
          type: string
          pattern: '^wbh_[a-zA-Z0-9]+$'
        status:
          type: string
          enum: [pending, success, failed, abandoned]
        url:
          type: string
          description: Snapshot of the subscription URL at dispatch time.
        request_headers:
          type: object
          additionalProperties:
            type: string
        response_status:
          type: integer
          description: HTTP status returned by your endpoint.
        response_body:
          type: string
          description: Truncated response body captured from your endpoint.
        response_headers:
          type: object
          additionalProperties:
            type: string
        attempts:
          type: integer
        max_attempts:
          type: integer
        next_retry_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          type: string
          description: Transport-level error, if any (DNS, TLS, timeout, connection refused).
        duration_ms:
          type: integer
          description: Response time for the most recent attempt, in milliseconds.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          $ref: '#/components/schemas/Timestamp'

    Balance:
      type: object
      description: Available, pending, and total funds in a single currency.
      required: [id, merchant_id, currency, available, pending, total, updated_at]
      properties:
        id:
          type: string
          pattern: '^bal_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        available:
          $ref: '#/components/schemas/Money'
          description: Funds usable for new payouts.
        pending:
          $ref: '#/components/schemas/Money'
          description: Funds reserved for in-flight payouts (debited but not yet settled).
        total:
          $ref: '#/components/schemas/Money'
          description: '`available + pending`.'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: bal_01HX8Z9K0M2N3P4Q5R6S7T8UBA1
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        currency: USD
        available: "12450.00"
        pending: "550.00"
        total: "13000.00"
        updated_at: "2026-04-15T14:30:00Z"

    Corridor:
      type: object
      description: |
        An active payout corridor — a (rail_type, currency, country, method,
        network) combination Anton can deliver through. Corridors are
        destination-only; the source currency is not part of the corridor
        (Anton handles FX separately).
      required: [id, rail_type, currency, country, method, active]
      properties:
        id:
          type: string
          pattern: '^cor_[a-zA-Z0-9]+$'
        rail_type:
          $ref: '#/components/schemas/RailType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
          description: Destination country. `XX` for global crypto networks.
        network:
          $ref: '#/components/schemas/Network'
        method:
          type: string
          description: Delivery method within the corridor (bank_transfer, crypto, stablecoin, etc.).
        active:
          type: boolean
        priority:
          type: integer
          description: Anton uses lowest priority first when multiple corridors match.
        cutoff_time:
          type: string
          description: Daily cutoff for same-day processing (fiat rails, HH:MM UTC).
        settlement_days:
          type: integer
          description: Expected settlement, in business days, for fiat corridors.
        settlement_mins:
          type: integer
          description: Expected settlement, in minutes, for crypto/stablecoin corridors.
        min_amount:
          $ref: '#/components/schemas/Money'
        max_amount:
          $ref: '#/components/schemas/Money'
        required_confirms:
          type: integer
          description: Block confirmations required for crypto corridors.

    InstrumentMethodSchema:
      type: object
      description: |
        Credential-field schema for a payment method in a specific country.
        Use to drive dynamic instrument-creation forms.
      required: [code, country, currency]
      properties:
        code:
          $ref: '#/components/schemas/PaymentMethodCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        label:
          type: string
          description: Human-friendly label for this country+method pairing.
          example: UK Bank Account (Faster Payments)
        fields:
          type: array
          description: Credential fields to prompt for.
          items:
            type: object
            required: [name, type, required]
            properties:
              name:
                type: string
                example: sort_code
              label:
                type: string
                example: Sort code
              type:
                type: string
                enum: [string, integer, enum]
              required:
                type: boolean
              pattern:
                type: string
                description: Regex the value must match, if any.
              enum:
                type: array
                items:
                  type: string
                description: Allowed values when `type=enum`.
              help:
                type: string

    FXQuoteCreateRequest:
      type: object
      required: [sell_currency, buy_currency]
      description: |
        Supply either `sell_amount` OR `buy_amount` — the missing side is
        computed from the locked rate.
      properties:
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        locked:
          type: boolean
          description: |
            Request a rate-locked quote whose `customer_rate` is held until
            `lock_expires_at`. Redeem the lock by passing the returned `id`
            (or equivalently `lock_id`) as `quote_id` on
            `POST /v1/fx/exchange` before expiry. Defaults to `true`.
            Set to `false` for an indicative (non-binding) quote that cannot
            be redeemed on `/v1/fx/exchange`.
          default: true

    FXQuote:
      type: object
      description: An FX rate quote, optionally locked for execution.
      required:
        - id
        - merchant_id
        - sell_currency
        - buy_currency
        - sell_amount
        - buy_amount
        - mid_market_rate
        - customer_rate
        - locked
        - created_at
      properties:
        id:
          type: string
          pattern: '^fxq_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        mid_market_rate:
          $ref: '#/components/schemas/Money'
        customer_rate:
          $ref: '#/components/schemas/Money'
          description: Mid-market adjusted by your pricing plan's FX markup.
        inverse_rate:
          $ref: '#/components/schemas/Money'
        fx_markup_bps:
          type: integer
        fx_fee:
          $ref: '#/components/schemas/Money'
        fx_fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        provider:
          type: string
        provider_ref:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        locked:
          type: boolean
        lock_id:
          type: string
          pattern: '^fxq_[a-zA-Z0-9]+$'
          description: |
            Identifier of the rate lock. Pass this value as `quote_id` on
            `POST /v1/fx/exchange` to redeem the locked rate before
            `lock_expires_at`. Equal to `id` on locked quotes, and omitted
            entirely on indicative quotes (`locked: false`).
        lock_expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            UTC timestamp past which the rate lock is no longer honored.
            Omitted on indicative quotes. Equal to `expires_at` on locked
            quotes — kept as a dedicated field so clients can distinguish
            "the quote payload expired" from "the merchant's rate lock
            expired" when those semantics diverge in future revisions.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    FXExchange:
      type: object
      description: An executed currency exchange between two merchant balances.
      required:
        - id
        - merchant_id
        - sell_currency
        - buy_currency
        - sell_amount
        - buy_amount
        - customer_rate
        - status
        - quote_id
        - created_at
      properties:
        id:
          type: string
          pattern: '^fxx_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        mid_market_rate:
          $ref: '#/components/schemas/Money'
        customer_rate:
          $ref: '#/components/schemas/Money'
        provider:
          type: string
        provider_ref:
          type: string
        quote_id:
          type: string
          pattern: '^fxq_[a-zA-Z0-9]+$'
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
          description: Set when the exchange was initiated to fund a cross-currency payout.
        status:
          type: string
          enum: [pending, completed, failed]
        created_at:
          $ref: '#/components/schemas/Timestamp'

    MerchantAccount:
      type: object
      description: |
        A virtual funding account provisioned for your merchant in a specific
        currency. Used for depositing funds into your merchant balance.
      required: [id, currency, status, provider]
      properties:
        id:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        balance:
          $ref: '#/components/schemas/Money'
        available_balance:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          description: '`active` | `pending` | `suspended`, depending on provider state.'
        provider:
          type: string
          description: The upstream banking provider backing this account.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    AccountDetails:
      type: object
      description: |
        Banking details for receiving deposits into a funding account. Share
        these with the sender; the exact fields present depend on the country
        and provider.
      required: [currency]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        iban:
          type: string
        bic:
          type: string
        account_number:
          type: string
        sort_code:
          type: string
        bank_name:
          type: string
        holder_name:
          type: string
          description: Beneficiary name to use when initiating the deposit.
        routing_codes:
          type: object
          additionalProperties:
            type: string

    MerchantTransaction:
      type: object
      description: A transaction on a merchant funding account.
      required: [id, type, status, amount, currency, created_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        type:
          type: string
          description: '`credit` | `debit` | `fee` | `fx` | provider-specific types.'
        status:
          type: string
          description: '`pending` | `posted` | `failed`.'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        reference:
          type: string
        counterparty_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'

    PricingPlan:
      type: object
      description: A fee schedule active on your merchant account.
      required: [id, name, active, fee_type, priority]
      properties:
        id:
          type: string
          pattern: '^prc_[a-zA-Z0-9]+$'
        name:
          type: string
        active:
          type: boolean
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Scope — applies only to payouts debiting this currency. Null for all.
        dest_currency:
          $ref: '#/components/schemas/CurrencyCode'
        dest_country:
          $ref: '#/components/schemas/CountryCode'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        fee_type:
          type: string
          enum: [fixed, percentage, hybrid, tiered]
        fixed_fee:
          $ref: '#/components/schemas/Money'
        fixed_currency:
          $ref: '#/components/schemas/CurrencyCode'
        percentage_fee:
          $ref: '#/components/schemas/Money'
          description: Percentage expressed as a decimal (e.g. `"1.50"` = 1.5%).
        min_fee:
          $ref: '#/components/schemas/Money'
        max_fee:
          $ref: '#/components/schemas/Money'
          description: '`0` = no cap.'
        tiers:
          type: array
          description: Populated when `fee_type` is `tiered`.
          items:
            type: object
            properties:
              min_volume:
                $ref: '#/components/schemas/Money'
              max_volume:
                $ref: '#/components/schemas/Money'
              fixed_fee:
                $ref: '#/components/schemas/Money'
              percentage_fee:
                $ref: '#/components/schemas/Money'
        priority:
          type: integer
          description: Lower wins when multiple plans apply. Merchant-specific plans take priority over global templates.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    CreateIntelligenceEvaluationRequest:
      type: object
      additionalProperties: false
      required: [use_case, entity]
      properties:
        use_case:
          type: string
          enum: [payee_registration, instrument_screening, payout_screening, merchant_onboarding, monitoring]
        client_reference_id:
          type: string
          description: Client-supplied reference for reconciliation. Not used for merchant scoping.
        idempotency_key:
          type: string
          description: Body fallback for testing. Prefer the `Idempotency-Key` header.
        entity:
          $ref: '#/components/schemas/IntelligenceEntity'
        instrument:
          $ref: '#/components/schemas/IntelligenceInstrument'
        payout:
          $ref: '#/components/schemas/IntelligencePayout'
        merchant:
          type: object
          description: Accepted for future compatibility but ignored on the public test endpoint.
        context:
          $ref: '#/components/schemas/IntelligenceContext'

    ValidateIntelligenceEvaluationResponse:
      type: object
      required: [valid, contract_version, event_type, use_case]
      properties:
        valid:
          type: boolean
        contract_version:
          type: string
          enum: [intelligence-public-v1]
        event_type:
          type: string
          enum: [payout.create, payee.create, instrument.create, merchant.onboard, monitoring.evaluate]
        use_case:
          type: string
          enum: [payee_registration, instrument_screening, payout_screening, merchant_onboarding, monitoring]

    IntelligenceEntity:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [person, business]
        reference_id:
          type: string
        name:
          type: string
        country:
          $ref: '#/components/schemas/CountryCode'
        birth_date:
          type: string
          format: date
        address:
          $ref: '#/components/schemas/IntelligenceAddress'
        email:
          type: string
          format: email
        phone:
          type: string
        nationality:
          type: array
          items:
            $ref: '#/components/schemas/CountryCode'
        document:
          $ref: '#/components/schemas/IntelligenceDocument'
        vault_token_id:
          type: string
          description: Vault token containing PII to detokenize in memory.

    IntelligenceAddress:
      type: object
      additionalProperties: false
      properties:
        line_1: { type: string }
        line_2: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        country:
          $ref: '#/components/schemas/CountryCode'

    IntelligenceDocument:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [passport, national_id, drivers_license, tax_id, business_registration, other]
        country:
          $ref: '#/components/schemas/CountryCode'
        number:
          type: string

    IntelligenceInstrument:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [bank_account, crypto_wallet, card, iban]
        reference_id:
          type: string
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        bank_account:
          $ref: '#/components/schemas/IntelligenceBankAccount'
        crypto_wallet:
          $ref: '#/components/schemas/IntelligenceCryptoWallet'
        card:
          $ref: '#/components/schemas/IntelligenceCard'
        iban:
          $ref: '#/components/schemas/IntelligenceIBAN'
        vault_token_id:
          type: string

    IntelligenceBankAccount:
      type: object
      additionalProperties: false
      properties:
        routing_number:
          type: string
        account_number:
          type: string
        account_type:
          type: string
          enum: [checking, savings, business_checking, other]

    IntelligenceCryptoWallet:
      type: object
      additionalProperties: false
      properties:
        network:
          type: string
          enum: [bitcoin, ethereum, solana, polygon, tron, other]
        address:
          type: string

    IntelligenceCard:
      type: object
      additionalProperties: false
      properties:
        fingerprint:
          type: string
        bin:
          type: string
        last4:
          type: string

    IntelligenceIBAN:
      type: object
      additionalProperties: false
      properties:
        iban:
          type: string
        bic:
          type: string

    IntelligencePayout:
      type: object
      additionalProperties: false
      required: [amount, destination_country]
      properties:
        reference_id:
          type: string
        amount:
          $ref: '#/components/schemas/IntelligenceMoney'
        source_country:
          $ref: '#/components/schemas/CountryCode'
        destination_country:
          $ref: '#/components/schemas/CountryCode'
        rail:
          type: string
          enum: [bank, card, crypto, wallet, internal, other]

    IntelligenceMoney:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/IntelligenceCurrencyOrAssetCode'

    IntelligenceCurrencyOrAssetCode:
      type: string
      description: Uppercase supported fiat currency or crypto asset code.
      pattern: '^[A-Z]{3,5}$'
      examples: [USD, BTC, USDC]

    IntelligenceContext:
      type: object
      additionalProperties: false
      properties:
        velocity:
          type: object
          additionalProperties: true
        fingerprints:
          type: object
          additionalProperties: true
        history:
          type: object
          additionalProperties: true
        industry:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    IntelligenceEvaluation:
      type: object
      required: [contract_version, evaluation_id, event_id, event_type, status, decision, rationale, peer_statuses, policy, audit, evaluated_at, latency_ms]
      properties:
        contract_version:
          type: string
          enum: [intelligence-public-v1]
        evaluation_id:
          type: string
        event_id:
          type: string
        event_type:
          type: string
          enum: [payout.create, payee.create, instrument.create, merchant.onboard, monitoring.evaluate]
        status:
          type: string
          enum: [complete, partial, error]
        decision:
          type: string
          enum: [approve, review_auto, review_manual, decline]
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        rationale:
          type: string
        next_action:
          type: string
          enum: [none, request_more_information, manual_review, decline]
        summary:
          $ref: '#/components/schemas/IntelligenceEvaluationSummary'
        missing_disambiguators:
          type: array
          items: { type: string }
        peer_statuses:
          type: array
          items:
            $ref: '#/components/schemas/IntelligencePeerStatus'
        policy:
          $ref: '#/components/schemas/IntelligencePolicy'
        audit:
          $ref: '#/components/schemas/IntelligenceAudit'
        evaluated_at:
          $ref: '#/components/schemas/Timestamp'
        latency_ms:
          type: integer
          format: int64

    IntelligenceEvaluationSummary:
      type: object
      additionalProperties: false
      properties:
        screened:
          type: array
          items:
            type: string
            enum: [entity, instrument, payout, context]
        use_case:
          type: string
          enum: [payee_registration, instrument_screening, payout_screening, merchant_onboarding, monitoring]
        instrument_type:
          type: string
          enum: [bank_account, crypto_wallet, card, iban]
        payout_rail:
          type: string
          enum: [bank, card, crypto, wallet, internal, other]
        findings_count:
          type: integer
        highest_severity:
          type: string
          enum: [low, medium, high, critical]
        identity_confidence:
          type: string
          enum: [none, possible, likely, confirmed]
        missing_fields:
          type: array
          items: { type: string }

    IntelligencePeerStatus:
      type: object
      required: [peer, status, found]
      properties:
        peer:
          type: string
          enum: [sentinel, engine, brain]
        status:
          type: string
          enum: [complete, partial, error, timeout, not_configured, skipped]
        found:
          type: boolean

    IntelligencePolicy:
      type: object
      required: [version, rule_fired]
      properties:
        version:
          type: string
          example: triad-policy-v2
        rule_fired:
          type: string
        reasons:
          type: array
          items: { type: string }

    IntelligenceAudit:
      type: object
      required: [hash, persisted]
      properties:
        hash:
          type: string
        persisted:
          type: boolean

    IntelligenceEvidence:
      type: object
      required: [evaluation, peer_results]
      properties:
        evaluation:
          $ref: '#/components/schemas/IntelligenceEvaluation'
        peer_results:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceEvidencePeerResult'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceFinding'

    IntelligenceEvidencePeerResult:
      type: object
      required: [peer, status, found, latency_ms, evaluated_at]
      properties:
        peer:
          type: string
          enum: [sentinel, engine, brain]
        status:
          type: string
          enum: [complete, partial, error, timeout, not_configured, skipped]
        found:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        error_count:
          type: integer
        evaluated_at:
          $ref: '#/components/schemas/Timestamp'

    IntelligenceFinding:
      type: object
      required: [id, peer, kind]
      properties:
        id: { type: string }
        peer:
          type: string
          enum: [sentinel, engine, brain]
        kind: { type: string }
        subject_ref: { type: string }
        query_ref: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
        identity_confidence:
          type: string
          enum: [none, possible, likely, confirmed]
        score:
          type: number
        match:
          type: boolean
        matched_entity_id:
          type: string
        matched_schema:
          type: string
        topics:
          type: array
          items: { type: string }
        datasets:
          type: array
          items: { type: string }
        matched_fields:
          type: array
          items: { type: string }
        contradicted_fields:
          type: array
          items: { type: string }
        missing_disambiguators:
          type: array
          items: { type: string }
        cleared:
          type: boolean
        first_seen:
          type: string
        last_seen:
          type: string
