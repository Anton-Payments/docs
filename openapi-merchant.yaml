  /v1/intelligence/reviews/{id}/decisions:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Reviews]
      summary: Record a decision
      operationId: createIntelligenceReviewDecision
      description: |-
        Record a decision with a reason code (`reviews.decide`). `waiting_on_customer` pauses the due time. The response is the decision; fetch the review for its new status.

        A decision your second-approver setting covers waits for a person to approve it in the portal. A decision your **API credential** proposes that clears the subject (`not_a_match`, `no_concern`) **always** waits for a person, whatever the setting (`approval_rule: api_clearance`). That person must be independent of your API credentials: not the one who created the credential, and not in a role that can create, rotate or revoke credentials (Admin, Technical). In practice that is your Compliance role. With no such person on your team the decision is refused (`409 second_approver_unavailable`). People approve, send back and withdraw in the portal.

        | Review kind | Decisions |
        |---|---|
        | `possible_sanctions_match`, `possible_pep_match`, `screening_review` | `waiting_on_customer`, `not_a_match`, `confirmed_match` |
        | `manual` | `waiting_on_customer`, `no_concern`, `concern_confirmed` |
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/ReviewID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example: {"decision":"not_a_match","reason_code":"dob_differs","note":"Date of birth differs from the listed person."}
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '201':
          description: The decision.
          content:
            application/json:
              example: {"id":"ird_dbvqsbiukoh4g0rnekg0","object":"review_decision","livemode":false,"review_id":"irv_dbvqsbiukoh4g0rnek30","decision":"not_a_match","reason_code":"dob_differs","note_recorded":true,"proposed_by":{"type":"api_client","id":"ant_oc_test_xdbvqsbiukoh4g0rnek10"},"requires_approval":true,"approval_rule":"api_clearance","approval":null,"created_at":"2026-11-20T02:19:26.940Z","updated_at":"2026-11-20T02:19:26.940Z"}
              schema:
                $ref: '#/components/schemas/ReviewDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ModuleNotEnabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `review_closed`, `decision_pending` (a decision is waiting for approval), or
            `second_approver_unavailable` (nobody else on your team can approve).

            Also `idempotency_in_flight`: another request with the same `Idempotency-Key` is still being processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: "`invalid_decision`, `invalid_reason_code`, `note_too_long` or `validation_error`. Also `idempotency_key_reused`: the same `Idempotency-Key` was sent with a different request body."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

