  /v1/beneficiaries:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Beneficiaries]
      summary: Create a beneficiary
      operationId: createBeneficiary
      description: |-
        Create a person (`individual`) or business (`business`) you want to pay. Personal details in the request body are tokenized in a secure vault on creation. Anton stores only a display name, country and opaque token reference.

        To read back the details you submitted, use `GET /v1/beneficiaries/{id}/pii`.

        The call requires an `Idempotency-Key` header. Repeating a call with the same key returns the original beneficiary, and a different body with the same key returns `422 idempotency_key_reused`. An identity you already hold returns `409 duplicate_beneficiary`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryCreateRequest'
            examples:
              individual:
                summary: Individual beneficiary
                value:
                  type: individual
                  country: GB
                  external_ref: contractor-1042
                  metadata:
                    department: engineering
                  individual:
                    first_name: Jane
                    last_name: Smith
                    email: jane@example.com
                    phone: "+442079460000"
                    birth_date: "1988-05-12"
                    nationality: GB
                    address:
                      street_line_1: 10 Example Street
                      city: London
                      postal_code: SW1A 1AA
                      country: GB
              business:
                summary: Business beneficiary
                value:
                  type: business
                  country: DE
                  business:
                    legal_name: Example GmbH
                    registration_number: HRB12345
                    email: ap@example.com
                    phone: "+493012345678"
                    entity_type: llc
                    incorporation_country: DE
                    address:
                      street_line_1: Beispielstraße 1
                      city: Berlin
                      postal_code: "10115"
                      country: DE
      responses:
        '201':
          description: Beneficiary created.
          headers:
            Request-Id:
              $ref: '#/components/headers/Request-Id'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
              examples:
                created:
                  summary: A new individual beneficiary
                  value:
                    {"id": "ben_dbvlj5qukohfu54jblu0", "object": "beneficiary", "livemode": false, "status": "active", "type": "individual", "display_name": "Jane Smith", "country": "GB", "external_ref": "contractor-1042", "risk_score": null, "risk_tier": null, "risk_signals": [], "created_via": "api", "source_batch_id": null, "metadata": {"department": "engineering"}, "created_at": "2026-11-19T20:18:31.415Z", "updated_at": "2026-11-19T20:18:31.415Z"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "`duplicate_beneficiary` (this identity already exists for your merchant) or `idempotency_in_flight`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: The request failed validation (`validation_error`, with `details` listing every failing field), broke a business rule (`invalid_credentials`, `method_not_supported`), or reused a key (`idempotency_key_reused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Beneficiaries]
      summary: List beneficiaries
      operationId: listBeneficiaries
      description: |-
        List your beneficiaries, newest first (ties broken by ID). Results are cursor-paginated.

        Filters are exact-match and validated. An unknown query parameter, a filter value outside its allowed set, an out-of-range `limit` or a bad `cursor` is a `400`, never an empty list. `created_after` is inclusive and `created_before` is exclusive. Both are RFC 3339 UTC timestamps with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Filter by beneficiary status.
          required: false
          schema:
            type: string
            enum: [active, archived, blocked]
        - name: type
          in: query
          description: Filter by beneficiary type.
          required: false
          schema:
            type: string
            enum: [individual, business]
        - name: country
          in: query
          description: Filter by ISO 3166-1 alpha-2 country code.
          required: false
          schema:
            $ref: '#/components/schemas/CountryCode'
        - name: search
          in: query
          description: Substring match on the beneficiary's display name and external reference.
          required: false
          schema:
            type: string
        - name: created_via
          in: query
          description: Filter by the surface that created the beneficiary.
          required: false
          schema:
            type: string
            enum: [api, batch, portal, import]
        - name: source_batch_id
          in: query
          description: Only beneficiaries a specific batch created. A batch ID, prefixed `bat_`.
          required: false
          schema:
            type: string
            pattern: '^bat_[a-zA-Z0-9]+$'
        - name: created_after
          in: query
          description: Only beneficiaries created at or after this instant (inclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Only beneficiaries created before this instant (exclusive).
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated list of beneficiaries.
          headers:
            Request-Id:
              $ref: '#/components/headers/Request-Id'
          content:
            application/json:
              example: {"object":"list","data":[{"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary","livemode":false,"status":"active","type":"individual","display_name":"Jane Smith","country":"GB","external_ref":"contractor-1042","risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{"department":"engineering"},"created_at":"2026-11-20T02:18:15.220Z","updated_at":"2026-11-20T02:18:15.220Z"}],"has_more":false,"next_cursor":null}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/beneficiaries/{id}:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Beneficiary ID (prefixed `ben_`).
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
          example: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
    get:
      tags: [Beneficiaries]
      summary: Retrieve a beneficiary
      operationId: getBeneficiary
      description: Get a beneficiary by ID. Returns `404` if the beneficiary does not exist or belongs to a different merchant.
      responses:
        '200':
          description: Beneficiary.
          content:
            application/json:
              example: {"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary","livemode":false,"status":"active","type":"individual","display_name":"Jane Smith","country":"GB","external_ref":"contractor-1042","risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{"department":"engineering"},"created_at":"2026-11-20T02:18:15.220Z","updated_at":"2026-11-20T02:18:15.220Z"}
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Beneficiaries]
      summary: Update a beneficiary
      operationId: updateBeneficiary
      description: |-
        Update a beneficiary's `display_name`, `country`, `external_ref` and `metadata`. A field you leave out stays unchanged. `null` clears `external_ref` and `metadata`, but `display_name` and `country` cannot be cleared. When you send `metadata`, it replaces the whole map.

        To change personal details, use `PATCH /v1/beneficiaries/{id}/pii`.

        Accepts an `Idempotency-Key` but does not require one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryUpdateRequest'
            examples:
              clear_external_ref:
