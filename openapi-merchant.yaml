      properties:
        id:
          type: string
          pattern: '^doc_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        category:
          type: string
          description: Logical category — e.g. `kyb_incorporation`, `beneficiary_id`, `rfi_evidence`.
        status:
          type: string
          enum: [uploaded, accepted, rejected]
        file_name:
          type: string
        content_type:
          type: string
          description: MIME type.
          example: application/pdf
        file_size:
          type: integer
          description: Bytes.
        entity_type:
          type: string
          enum: [application, beneficiary, rfi]
        entity_id:
          type: string
        uploaded_by:
          type: string
        description:
          type: string
        reviewed_by:
          type: string
        reviewed_at:
          $ref: '#/components/schemas/Timestamp'
        rejection_reason:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Document expiry (e.g. passport expiry).
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    RFI:
      type: object
      description: |
        A Request for Information raised by Anton's compliance team. Each RFI
        asks specific questions about a payout, beneficiary, or merchant and
        typically gates a held transaction until resolved.
      required:
        - id
        - merchant_id
        - status
        - category
        - urgency
        - entity_type
        - entity_id
        - source
        - subject
        - description
        - questions
        - created_at
      properties:
        id:
          type: string
          pattern: '^rfi_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        status:
          type: string
          enum: [open, responded, resolved, escalated]
        category:
          type: string
          description: Compliance category (e.g. `source_of_funds`, `identity_verification`).
        urgency:
          type: string
          enum: [low, medium, high]
        entity_type:
          type: string
          enum: [payout, beneficiary, merchant]
        entity_id:
          type: string
        source:
          type: string
          enum: [internal, merchant, external]
        provider:
          type: string
          description: Upstream rail/system that originated the RFI, if any.
        provider_ref:
          type: string
        subject:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            type: string
        response:
          type: string
          description: Merchant's submitted response text.
        responded_at:
          $ref: '#/components/schemas/Timestamp'
        document_ids:
          type: array
          items:
            type: string
            pattern: '^doc_[a-zA-Z0-9]+$'
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
        resolution_note:
          type: string
        outcome:
          type: string
          enum: [cleared, blocked]
        due_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    BalanceAlertThreshold:
      type: object
      description: |
        A per-(merchant, currency) `balance.low` threshold. Fires the
        `balance.low` webhook once when the merchant's available balance drops
        below `threshold_amount` and is not already latched; clears the latch
        when the balance rises back to at-or-above the threshold.
      required: [id, merchant_id, currency, threshold_amount, enabled, currently_latched, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        threshold_amount:
          $ref: '#/components/schemas/Money'
        enabled:
          type: boolean
          description: When `false`, the threshold is ignored by the evaluator.
        currently_latched:
          type: boolean
          description: |
            `true` when a `balance.low` event has fired and the balance has
            not yet recovered above the threshold. Read-only — the dashboard
            can use this to surface "currently alerting" status.
        last_fired_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the most recent `balance.low` fired for this row.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    BalanceAlertUpsertRequest:
      type: object
      required: [threshold_amount]
      properties:
        threshold_amount:
          $ref: '#/components/schemas/Money'
          description: Non-negative decimal. Setting `0` means "alert whenever the balance is negative"; unusual but allowed.
        enabled:
          type: boolean
          default: true
          description: When `false`, the threshold is retained but ignored.

    PricingPlan:
      type: object
      description: A fee schedule active on your merchant account.
      required: [id, name, active, fee_type, priority]
      properties:
        id:
          type: string
          pattern: '^prc_[a-zA-Z0-9]+$'
        name:
          type: string
        active:
          type: boolean
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Scope — applies only to payouts debiting this currency. Null for all.
        dest_currency:
          $ref: '#/components/schemas/CurrencyCode'
        dest_country:
          $ref: '#/components/schemas/CountryCode'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        fee_type:
          type: string
          enum: [fixed, percentage, hybrid, tiered]
        fixed_fee:
          $ref: '#/components/schemas/Money'
        fixed_currency:
          $ref: '#/components/schemas/CurrencyCode'
        percentage_fee:
          $ref: '#/components/schemas/Money'
          description: Percentage expressed as a decimal (e.g. `"1.50"` = 1.5%).
        min_fee:
          $ref: '#/components/schemas/Money'
        max_fee:
          $ref: '#/components/schemas/Money'
          description: '`0` = no cap.'
        tiers:
          type: array
          description: Populated when `fee_type` is `tiered`.
          items:
            type: object
            properties:
              min_volume:
                $ref: '#/components/schemas/Money'
              max_volume:
                $ref: '#/components/schemas/Money'
              fixed_fee:
                $ref: '#/components/schemas/Money'
              percentage_fee:
                $ref: '#/components/schemas/Money'
        priority:
          type: integer
          description: Lower wins when multiple plans apply. Merchant-specific plans take priority over global templates.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    # ── Wave 6 additions ──────────────────────────────────────────────
    Merchant:
      type: object
      description: |
        The calling merchant's profile. `rate_limit_multiplier` and
        `rate_limit_per_minute` surface the merchant's current rate-limit
        tier (Wave 4). The effective ceiling is base 1000 × multiplier.
      required: [id, status, rate_limit_multiplier, rate_limit_per_minute]
      properties:
        id: { type: string, pattern: '^mer_[a-zA-Z0-9]+$' }
        display_name: { type: string }
        legal_name: { type: string }
        status:
          type: string
          enum: [pending, active, suspended, terminated]
        rate_limit_multiplier:
          type: integer
          description: Per-merchant multiplier applied to the base 1000 req/min ceiling. 1x / 2x / 5x / 10x / 20x.
          enum: [1, 2, 5, 10, 20]
        rate_limit_per_minute:
          type: integer
          description: Effective per-minute request ceiling after the multiplier.
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    APIKey:
      type: object
      required: [id, label, masked_suffix, environment, created_at]
      properties:
        id: { type: string, pattern: '^ak_[a-zA-Z0-9]+$' }
        label: { type: string, maxLength: 100 }
        masked_suffix:
          type: string
          description: Last 4 characters of the raw secret, e.g. `***aB3x`. Only surface used after creation.
        environment: { type: string, enum: [live, test] }
        last_used_at: { $ref: '#/components/schemas/Timestamp' }
        revoked_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    VelocityRule:
      type: object
      required: [id, scope, kind, action, created_at]
      properties:
        id: { type: string }
        scope: { type: string, enum: [platform, merchant] }
        kind: { type: string, description: "E.g. `daily_volume`, `per_payout_amount`, `country_block`." }
        action: { type: string, enum: [block, review, alert] }
        threshold: { type: string }
        params:
          type: object
          additionalProperties: true
        active: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    VelocityRuleWriteRequest:
      type: object
      required: [kind, action]
      properties:
        kind: { type: string }
        action: { type: string, enum: [block, review, alert] }
        threshold: { type: string }
        params:
          type: object
          additionalProperties: true

    VelocityRuleResult:
      type: object
      properties:
        rule_id: { type: string }
        kind: { type: string }
        action: { type: string, enum: [allow, review, block, alert] }
        triggered: { type: boolean }
        reason: { type: string }

    VelocityVerdict:
      type: object
      properties:
        action: { type: string, enum: [allow, review, block] }
        triggered_rules:
          type: array
          items: { $ref: '#/components/schemas/VelocityRuleResult' }

    BeneficiaryEngineVerdict:
      type: object
      description: |
        Merchant-facing projection of Anton's engine verdict. Per the
        v1.0.0 cross-merchant policy, the only "external" signal exposed
        is an opaque boolean aggregating external providers AND the
        Anton network's successful verifications — no counts, no
        identities, no adverse-event signals.
      required: [decision, beneficiary, computed_at]
      properties:
        decision:
          type: object
          required: [action, description]
          properties:
            action: { type: string, enum: [allow, review, block] }
            reason_codes:
              type: array
              items: { type: string }
            description: { type: string }
        beneficiary:
          type: object
          required: [trust_score, identity_consistency, third_party_verification]
          properties:
            trust_score:
              type: string
              description: Decimal string 0..1.
            identity_consistency:
              type: string
              description: Decimal string 0..1.
            third_party_verification:
              type: object
              required: [verified_by_external_sources]
              properties:
                verified_by_external_sources:
                  type: boolean
                  description: Opaque aggregate over external providers and the Anton network. No counts derivable.
        computed_at: { $ref: '#/components/schemas/Timestamp' }

    OnboardingApplication:
      type: object
      description: Merchant-facing projection of an onboarding application. Internal underwriter fields (risk tier/score/notes, assigned-to, internal notes) are stripped.
      required: [id, merchant_id, status, created_at, updated_at]
      properties:
        id: { type: string }
        merchant_id: { type: string }
        status:
          type: string
          enum: [draft, submitted, in_review, info_needed, approved, rejected]
        legal_name: { type: string }
        trading_name: { type: string }
        registration_no: { type: string }
        tax_id: { type: string }
        business_type: { type: string }
        industry: { type: string }
        mcc_code: { type: string }
        website: { type: string }
        description: { type: string }
        approval_conditions: { type: string }
        rejection_reason: { type: string }
        status_token: { type: string }
        kyb_provider: { type: string }
        kyb_reference: { type: string }
        kyb_status: { type: string }
        kyb_completed_at: { $ref: '#/components/schemas/Timestamp' }
        submitted_at: { $ref: '#/components/schemas/Timestamp' }
        reviewed_at: { $ref: '#/components/schemas/Timestamp' }
        decided_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    User:
      type: object
      required: [id, email, role, status, created_at]
      properties:
        id: { type: string, pattern: '^usr_[a-zA-Z0-9]+$' }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        role:
          type: string
          enum: [admin, accounting, technical, operator, viewer]
        status:
          type: string
          enum: [active, invited, deactivated]
        mfa_enrolled: { type: boolean }
        last_sign_in_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
