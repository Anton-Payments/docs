  /v1/webhooks/summary:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Webhooks]
      summary: Summarise webhook deliveries
      operationId: getWebhookDeliverySummary
      description: Delivery outcomes over the last 30 days for every live endpoint, or for one with `subscription_id`. Also returns the retry schedule deliveries follow.
      parameters:
        - name: subscription_id
          in: query
          required: false
          description: Only this endpoint.
          schema:
            type: string
            pattern: '^whk_[a-zA-Z0-9]+$'
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliverySummary'
              examples:
                response:
                  summary: Response
                  value:
                    {
                      "object": "webhook_delivery_summary",
                      "livemode": false,
                      "subscription_id": null,
                      "since": "2026-10-20T20:46:21.204Z",
                      "until": "2026-11-19T20:46:21.204Z",
                      "delivered": 3,
                      "retrying": 0,
                      "abandoned": 0,
                      "pending": 0,
                      "last_delivered_at": "2026-11-19T14:03:22.104Z",
                      "retry_policy": {
                        "max_attempts": 5,
                        "retry_after_seconds": [
                          30,
                          120,
                          480,
                          1920
                        ]
                      }
                    }
        '400':
          description: An unknown query parameter or a `subscription_id` that is not a subscription id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such subscription on your account (`resource_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'


