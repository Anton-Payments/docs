    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Accounts]
      summary: Export transactions
      operationId: exportTransactions
      description: "Download your transactions as CSV (`text/csv`), newest first. It takes the same filters as `GET /v1/transactions`. Debits are written with a negative amount. The export is a bulk copy of your ledger, so it needs the report-download permission, is rate limited per merchant and is audited before any byte is sent. Past 10,000 rows it is refused with `422 export_too_large`: narrow the dates and export again."
      parameters:
        - name: type
          in: query
          required: false
          description: Only this kind of movement.
          schema:
            type: string
            enum: [payin, payout, fee, exchange, transfer, return]
        - name: direction
          in: query
          required: false
          description: Only money in (`credit`) or money out (`debit`).
          schema:
            type: string
            enum: [credit, debit]
        - name: status
          in: query
          required: false
          description: Only this status.
          schema:
            type: string
            enum: [completed, pending, failed, returned]
        - name: currency
          in: query
          required: false
          description: Only this currency (3 to 5 letters).
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: created_after
          in: query
          required: false
          description: Only transactions created at or after this time (inclusive), such as `2026-11-01T00:00:00.000Z`. Use an RFC 3339 UTC timestamp with millisecond precision and a Z suffix. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Only transactions created before this time (exclusive). Use an RFC 3339 UTC timestamp with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The CSV file.
          content:
            text/csv:
              schema:
                type: string
              example: |
                id,created_at,type,direction,status,amount,currency,reference,counterparty,payout_id,exchange_id
                stx_01,2026-11-19T14:03:22.104Z,payout,debit,completed,-40.00,USD,INV-1042,,pay_01,
        '400':
          description: An unknown query parameter (`unknown_parameter`), an invalid filter value or a timestamp that does not parse (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "invalid_request",
                        "message": "type must be one of: payin, payout, fee, exchange, transfer, return",
                        "param": "type",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#invalid_request",
                        "request_id": "req_01JD3XB7Q2"
                      }
                    }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: More than 10,000 transactions match (`export_too_large`).
          content:
