# anton-spec-sync sha256=8b3083b8e241f9d7be479e171f4357911ebfae7df68e6e346dcc7030a0d7792a
openapi: 3.1.0

info:
  title: Anton Payments API
  version: "2026-12-01"
  summary: Cross-border payouts in fiat, stablecoin, and crypto.
  description: |-
    The Anton Payments merchant API. Versioned, idempotent, cursor-paginated.

    - **Authentication**: OAuth 2.0 client_credentials with DPoP proof-of-possession (RFC 6749 §4.4 + RFC 9449). Programmatic clients exchange `(client_id, client_secret)` for a short-lived access token at `POST /oauth/token`, then send each request with `Authorization: DPoP <access_token>` plus a per-request `DPoP: <proof>` header. v1 does not accept static API keys.
    - Base URLs: `https://api.antonpayments.com` (production), `https://api.antonpayments.dev` (sandbox).
    - **Versioning**: the API is versioned by date (`Anton-Version: 2026-12-01`). Your account is pinned to the latest version when you create your first OAuth client; send `Anton-Version` to try another version on one request. Every `/v1` response carries an `Anton-Version` header with the version it was produced at, including idempotent replays (which keep the original's) and a `401` (where the merchant is not yet known, the launch version). An unknown version is `400 invalid_api_version`.
    - **Responses.** A single resource is the object itself at the top level, with no `data` wrapper. A delete returns `{"id", "object", "deleted": true}`. Lists are the list object below. A field is either always present (`null` when empty) or documented as conditional.
    - **Requests.** A request with a body must send `Content-Type: application/json` (an upload route takes `multipart/form-data`), otherwise `400 invalid_content_type`. A route that takes no body rejects a non-empty one; an unknown query parameter is `400 unknown_parameter`.
    - Monetary amounts are decimal strings, never floats.
    - Timestamps are RFC 3339 UTC.
    - Every `POST` that creates or changes something requires the `Idempotency-Key` header. `PATCH` and `DELETE` accept one but do not require it. A `POST` that only calculates and stores nothing (`POST /v1/intelligence/evaluations/validate`) is exempt.
    - Anton's OAuth public signing key is published at `GET /.well-known/jwks.json` (5-minute cache; RFC 8615).

    **Capabilities and scopes.** Every account carries a capability set (`payouts`, `intelligence`) and every
    credential carries a scope set validated against it at creation. AI-compliance-only accounts hold only
    `intelligence`, and every payout endpoint returns `403 capability_required` for them. A credential
    minted without a scope returns `403 insufficient_scope` on that surface. Effective access is
    `scopes ∩ capabilities`. Access tokens embed the grants as a space-delimited `scope` claim, echoed in the
    token response.

    **What machine credentials can never do.** Approval decisions (payout approve and reject, because maker-checker
    requires a human identity) and detokenized PII readback (beneficiary PII, verification name reveal,
    captured-document viewing) are dashboard-only: those operations require a signed-in portal user with the
    right role, and every access is audit-logged. Machine credentials can deposit and replace PII, since your
    system is its source, but can never read it back, so a leaked credential cannot harvest identities.

    **Errors.** Every error response from `/v1` has one shape, whatever the status:
    `{"error": {"type", "code", "message", "param"?, "doc_url", "request_id", "details"?}}`. Branch on `code`
    (each code is documented at its `doc_url` anchor on the errors page), not on `message`. `type` follows the
    status: `authentication_error` 401, `permission_error` 403, `invalid_request_error` 400/404/405/409/410/413/422,
    `idempotency_error` (the two `Idempotency-Key` failures that are a 409 or a 422: `idempotency_in_flight`,
    `idempotency_key_reused`; a missing key is a 400 `invalid_request_error` `missing_idempotency_key`),
    `rate_limit_error` 429, `api_error` 500/502/503. A `429` and a `503` carry `Retry-After`.
    A `401` carries `WWW-Authenticate`. An ID in a path with the wrong prefix or shape is `400
    resource_id_invalid` with `param` set; a well-formed ID that names nothing of yours (or belongs to another
    merchant) is `404 resource_missing`; a bad or expired `cursor` is `400 cursor_invalid`.
    `param` names the request field at fault; a validation failure lists every failing field at once in
    `details`. A 5xx never carries internal detail in `message`; it is safe to retry with the same
    `Idempotency-Key`. `/oauth/token` keeps the RFC 6749 error format.

    Three more statuses are `invalid_request_error` too: `405 method_not_allowed` (the path exists but not
    with that method), `413 file_too_large` or `payload_too_large` (an upload or request body over its size limit) and `410 deprecated_endpoint`
    (an endpoint past its `Sunset` date; nothing is past one today). Details that have no field to point at
    are `details` rows (`param` is the key, `message` the value).

    **Lists.** Every list response is `{"object": "list", "data": [...], "has_more": bool, "next_cursor":
    string | null}`. `next_cursor` is `null` on the last page.

    **Request IDs.** Every response carries `Request-Id: req_...`, our identifier for that request; it is the
    same value as `error.request_id` and the one to quote to support. It is always generated by us. The legacy
    `X-Request-ID` header carries the same value for one transition and will be removed; do not send it
    expecting it to be echoed. To correlate with your own systems, send `X-Client-Request-Id` (up to 128
    characters from `A-Z a-z 0-9 . _ : -`; anything else is ignored). We log it beside ours and never use it
    as ours. An idempotent replay (`Idempotent-Replayed: true`) returns the original body unchanged, so its
    `error.request_id`, if any, is the original request's; its `Request-Id` header is the replay's own.

    The Cross-Cutting section of the docs covers idempotency, pagination, rate limits, errors, webhook events, and webhook signing.
  contact:
    name: Anton Payments Support
    url: https://help.antonpayments.com
  license:
    name: Proprietary
    url: https://www.antonpayments.com

servers:
  - url: https://api.antonpayments.com
    description: Production
  - url: https://api.antonpayments.dev
    description: Sandbox

security:
  - oauthDPoP: []
    dpopHeader: []

tags:
  - name: Authentication
    description: OAuth 2.0 token endpoint and JWKS publication. See the API description for the full DPoP-bound flow.
  - name: Reference Data
    description: Currencies, countries, and supported payment methods.
  - name: Beneficiaries
    description: Create and manage the people and businesses you pay.
  - name: Instruments
    description: "Your payees' payment instruments: bank accounts, wallets, and cards."
  - name: Payouts
    description: Send payouts and track them.
  - name: Batches
    description: Process bulk payouts from a CSV file.
  - name: Balances
    description: Your balance in each currency.
  - name: Accounts
    description: Virtual accounts for funding your balance.
  - name: Webhooks
    description: Subscribe to event notifications.
  - name: Pricing
    description: Read your pricing plans and quote fees.
  - name: FX
    description: Quote, lock, and execute currency exchanges between balances.
  - name: Corridors
    description: The active cross-border corridors for your account.
  - name: Sandbox
    description: Reset and seed your sandbox.
  - name: Intelligence
    description: Risk evaluations of payees, instruments, payouts, and merchants, with normalized results.
  - name: Reviews
    description: Run your team's own compliance reviews over the API, with webhooks and exports for your auditors. Needs the Reviews API and Webhooks add-on. Exports need the Audit Pack.
  - name: Verifications
    description: Verify the identity of your customers and their businesses (KYC and KYB) through Anton-hosted flows, with screening built in.

paths:
  /v1/intelligence/evaluations:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Intelligence]
      summary: Create an evaluation
      operationId: createIntelligenceEvaluation
      description: |-
        Run payee, instrument, payout, merchant onboarding, or monitoring inputs through Anton Intelligence. A `payout_screening` evaluation returns before it finishes; every other use case returns the finished evaluation.

        The request contract is strict and uses fixed enums, so you can generate SDKs safely. You can send direct PII over TLS or have Anton recover it from a vault token. Anton uses it in memory for the evaluation and persists only redacted decision evidence.

        **Required fields per use case.** Beyond the always-required `use_case` and `entity.type`, each use case adds requirements (a `422 validation_error` otherwise):
        - `payee_registration`: `entity.name`, `entity.vault_token_id` or `entity.document.number`.
        - `merchant_onboarding`: `entity.type` must be `business`, plus `entity.name`, `entity.vault_token_id` or `entity.document.number`.
        - `instrument_screening`: an `instrument` block.
        - `payout_screening`: a `payout` block, plus searchable `entity` or `instrument` data.
        - `monitoring`: searchable `entity` or `instrument` data.

        A searchable entity has a `name`, a `vault_token_id` or a `document.number`. An `email` or `phone` alone is not searchable, because sanctions lists can't be matched on them.

        The static `required` arrays below can't express these conditions, so they are listed here.

        **Authentication.** You need OAuth+DPoP credentials; a request without them is refused with `401`. The evaluation is stored under YOUR merchant account (retrievable through the scoped reads below), and the `Idempotency-Key` header is REQUIRED. The credential must carry the `intelligence` scope and the account the `intelligence` capability. Vault-token enrichment only accepts tokens owned by the calling merchant.

        **The status follows the use case.** A `payout_screening` evaluation runs the full AI panel and can take up to ~20 seconds, so it is accepted asynchronously: `202 Accepted` with the evaluation in `status: pending` and a `Location` header. Poll `GET /v1/intelligence/evaluations/{id}` until `status` is `completed` or `failed`, or subscribe to the `intelligence.evaluation.completed` and `intelligence.evaluation.failed` webhook events. Every other use case is decided before the response: `201 Created` with the completed evaluation. How you authenticate never changes the status.

        `metadata` is yours: up to 50 keys (keys up to 40 characters, values up to 500), strings only. It is stored and returned on the evaluation, never searched, and never sent to screening.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 255
          description: Required. Retries with the same key return the original response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntelligenceEvaluationRequest'
            examples:
              payee_registration:
                summary: Payee registration
                value:
                  use_case: payee_registration
                  client_reference_id: payee_john_doe_001
                  metadata:
                    crm_id: "42"
                  entity:
                    type: person
                    reference_id: payee_john_doe
                    name: John Doe
                    country: US
                    birth_date: "1979-12-30"
              crypto_wallet:
                summary: Crypto wallet screening
                value:
                  use_case: instrument_screening
                  entity:
                    type: person
                    reference_id: payee_john_doe
                    name: John Doe
                    country: US
                  instrument:
                    type: crypto_wallet
                    country: US
                    currency: BTC
                    crypto_wallet:
                      network: bitcoin
                      address: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
              bank_account:
                summary: Bank account screening
                value:
                  use_case: instrument_screening
                  entity:
                    type: person
                    reference_id: payee_john_doe
                    name: John Doe
                    country: US
                  instrument:
                    type: bank_account
                    country: US
                    currency: USD
                    bank_account:
                      routing_number: "021000021"
                      account_number: "000123456789"
                      account_type: checking
      responses:
        '201':
          description: The evaluation, decided (every use case except `payout_screening`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceEvaluation'
              example: {"id":"eval_01JD3XB7Q2","object":"evaluation","livemode":false,"status":"completed","use_case":"payee_registration","coverage":"complete","decision":"approve","score":80,"tier":"low","reasons":[],"required_actions":[],"metadata":{"crm_id":"42"},"created_at":"2026-11-19T20:31:51.681Z","updated_at":"2026-11-19T20:31:51.681Z"}
        '202':
          description: |
            The evaluation, accepted for asynchronous processing (`payout_screening`): `status` is `pending` and
            only the envelope fields are present. Poll the `Location` URL or subscribe to `intelligence.evaluation.completed`.
          headers:
            Location:
              schema:
                type: string
              description: Polling URL for the accepted evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceEvaluation'
              example: {"id":"eval_01JD3XB7Q3","object":"evaluation","livemode":false,"status":"pending","use_case":"payout_screening","metadata":{},"created_at":"2026-11-19T20:31:52.000Z","updated_at":"2026-11-19T20:31:52.026Z"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Intelligence]
      summary: List evaluations
      operationId: listIntelligenceEvaluations
      description: List your evaluations, newest first. Only evaluations created under your account appear. You need the `intelligence` credential scope and account capability. Every filter is optional; an unknown value or parameter is a 400, never an empty list.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: decision
          in: query
          required: false
          description: One or more of `approve`, `review`, `decline`, comma-separated. These are the values an evaluation's `decision` shows.
          schema:
            type: string
          example: review,decline
        - name: event_type
          in: query
          required: false
          description: One or more of `payee.create`, `instrument.create`, `payout.create`, `merchant.onboard`, `monitoring.evaluate`, comma-separated.
          schema:
            type: string
        - name: risk_level
          in: query
          required: false
          description: Filter by risk level.
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: created_after
          in: query
          required: false
          description: Inclusive lower bound on when the evaluation was decided, RFC 3339. `evaluated_after` is the same filter; send one. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          required: false
          description: Exclusive upper bound, RFC 3339. `evaluated_before` is the same filter; send one. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: evaluated_after
          in: query
          required: false
          description: Alias of `created_after`.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: evaluated_before
          in: query
          required: false
          description: Alias of `created_before`.
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Page of evaluations.
          content:
            application/json:
              example: {"object":"list","data":[{"id":"eval_dbvqroqukoh470i09qa0","object":"evaluation","livemode":false,"status":"completed","use_case":"payee_registration","coverage":"complete","decision":"approve","score":0,"tier":"low","reasons":[],"required_actions":[],"metadata":{"crm_id":"42"},"created_at":"2026-11-20T02:18:11.739Z","updated_at":"2026-11-20T02:18:11.739Z"}],"has_more":false,"next_cursor":null}
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntelligenceEvaluation'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor; pass it back as `cursor`. `null` on the last page.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/intelligence/evaluations/validate:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Intelligence]
      summary: Validate an evaluation request
      operationId: validateIntelligenceEvaluation
      description: Check a request against the strict evaluation contract without creating or storing anything. The answer is a dry-run result, not a stored resource, so it has no `id`. Because it stores nothing, it is exempt from `Idempotency-Key` (the header is not required). Like every evaluation route, it needs OAuth+DPoP credentials.
      security:
        - oauthDPoP: []
          dpopHeader: []
      requestBody:
        required: true
        content:
          application/json:
            example: {"use_case":"payee_registration","entity":{"type":"person","reference_id":"payee_jane_smith","name":"Jane Smith","country":"GB"}}
            schema:
              $ref: '#/components/schemas/CreateIntelligenceEvaluationRequest'
      responses:
        '200':
          description: Request is valid and can be mapped to an evaluation.
          content:
            application/json:
              example: {"object":"evaluation_validation","livemode":false,"valid":true,"event_type":"payee.create","use_case":"payee_registration"}
              schema:
                $ref: '#/components/schemas/IntelligenceEvaluationValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/intelligence/evaluations/{id}:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Intelligence]
      summary: Get an evaluation
      operationId: getIntelligenceEvaluation
      description: "Fetch one of your evaluations. A foreign evaluation ID is a 404, the same as a nonexistent one. An evaluation still being decided has `status: pending` (or `processing`). A failed one has `status: failed` and a `failure_reason`. Result fields are present once `status` is `completed`."
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - $ref: '#/components/parameters/IntelligenceEvaluationID'
      responses:
        '200':
          description: The evaluation.
          content:
            application/json:
              example: {"id":"eval_dbvqroqukoh470i09qa0","object":"evaluation","livemode":false,"status":"completed","use_case":"payee_registration","coverage":"complete","decision":"approve","score":0,"tier":"low","reasons":[],"required_actions":[],"metadata":{"crm_id":"42"},"created_at":"2026-11-20T02:18:11.739Z","updated_at":"2026-11-20T02:18:11.739Z"}
              schema:
                $ref: '#/components/schemas/IntelligenceEvaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/intelligence/reviews:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Reviews]
      summary: List reviews
      operationId: listIntelligenceReviews
      description: List your team's compliance reviews, newest first. You need the **Reviews API and Webhooks** add-on (`403 module_not_enabled` otherwise), the `intelligence` scope and `reviews.view`. The API returns the masked subject and your own reference for it, never names, dates of birth, contact details or note text. Anton's own screening of your payouts never appears here. An unknown `status` or `kind`, a bad timestamp or an unknown parameter is a 400.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by review status.
          schema:
            $ref: '#/components/schemas/ReviewStatus'
        - name: kind
          in: query
          required: false
          description: Filter by review kind.
          schema:
            $ref: '#/components/schemas/ReviewKind'
        - name: created_after
          in: query
          required: false
          description: RFC 3339 timestamp, inclusive. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
        - name: created_before
          in: query
          required: false
          description: RFC 3339 timestamp, exclusive. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of reviews.
          content:
            application/json:
              example: {"object":"list","data":[{"id":"irv_dbvqsbiukoh4g0rnek30","object":"review","livemode":false,"status":"open","number":"RV-0001","kind":"possible_sanctions_match","priority":"high","outcome":null,"source":"evaluation","evaluation_id":"eval_dbvqsbiukoh4g0rnek2g","linked_evaluation_id":null,"linked_review_id":null,"subject":{"type":"person","display":"A*** L***","reference":null},"open_reason":null,"opened_by":{"type":"system"},"owner_id":null,"due_at":"2026-11-20T13:00:00.000Z","paused_at":null,"overdue":false,"closed_at":null,"created_at":"2026-11-20T02:19:26.327Z","updated_at":"2026-11-20T02:19:26.327Z"}],"has_more":false,"next_cursor":null}
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor; pass it back as `cursor`. `null` on the last page.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ModuleNotEnabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/intelligence/reviews/settings:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Reviews]
      summary: Retrieve review settings
      operationId: getIntelligenceReviewSettings
      description: "Read your review settings. You change them in the portal (Admin only). `api_clearance_requires_approval` is always `true`: a decision your API credential proposes that clears the subject waits for a person."
      security:
        - oauthDPoP: []
          dpopHeader: []
      responses:
        '200':
          description: The settings (the defaults until your team saves them).
          content:
            application/json:
              example: {"object":"review_settings","livemode":false,"second_approver":"sanctions_pep","cleared_list_enabled":true,"cleared_list_min_decisions":3,"cleared_list_months":12,"target_high_minutes":240,"target_medium_minutes":480,"target_low_minutes":1440,"business_day_start_minute":540,"business_day_end_minute":1020,"business_days":[1,2,3,4,5],"timezone":"UTC","auto_open":true,"retention_years":7,"min_retention_years":7,"api_clearance_requires_approval":true}
              schema:
                $ref: '#/components/schemas/ReviewSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ModuleNotEnabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/intelligence/reviews/export:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Reviews]
      summary: Export reviews as CSV
      operationId: exportIntelligenceReviews
      description: Download your reviews opened in `[created_after, created_before)` as a CSV file for your auditors. The range is at most 366 days and the file at most 10,000 reviews. You need the **Audit Pack** add-on and `reviews.view`. The file holds codes, ids and the masked subject only. It is rendered on the fly and never stored. Each call is recorded in your audit log with the range, row count and a SHA-256 of the file. It works for any review your account still holds, whatever its status and whatever other add-ons you hold.
      security:
        - oauthDPoP: []
          dpopHeader: []
      parameters:
        - name: created_after
          in: query
          required: true
          description: RFC 3339 timestamp, inclusive. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
        - name: created_before
          in: query
          required: true
          description: RFC 3339 timestamp, exclusive. At most 366 days after `created_after`. Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else is a `400 invalid_request` with `param` set.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Only reviews in this status.
          schema:
            $ref: '#/components/schemas/ReviewStatus'
