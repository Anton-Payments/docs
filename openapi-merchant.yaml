openapi: 3.1.0

info:
  title: Anton Payments API
  version: 1.0.0
  summary: Cross-border payout infrastructure. Fiat, stablecoin, and crypto.
  description: |
    The Anton Payments merchant API. Versioned, idempotent, cursor-paginated.

    - Authentication: bearer API key in the `Authorization` header.
    - Base URLs: `https://api.antonpayments.com` (production), `https://api.antonpayments.dev` (sandbox).
    - Monetary amounts are decimal strings. Never floats.
    - Timestamps are RFC 3339 UTC.
    - All mutating endpoints support the `Idempotency-Key` header.

    See the Cross-Cutting section of the docs for idempotency, pagination, rate limits, errors, webhook events, and webhook signing.
  contact:
    name: Anton Payments Support
    url: https://help.antonpayments.com
  license:
    name: Proprietary
    url: https://www.antonpayments.com

servers:
  - url: https://api.antonpayments.com
    description: Production
  - url: https://api.antonpayments.dev
    description: Sandbox

security:
  - bearerAuth: []

tags:
  - name: Reference Data
    description: Currencies, countries, and supported payment methods.
  - name: Beneficiaries
    description: Create and manage the people and businesses you pay.
  - name: Instruments
    description: Payment instruments attached to beneficiaries — bank accounts, wallets, cards.
  - name: Payouts
    description: Initiate and track payouts.
  - name: Batches
    description: CSV-driven bulk payout processing.
  - name: Balances
    description: Merchant balance by currency.
  - name: Accounts
    description: Virtual accounts for merchant funding.
  - name: Webhooks
    description: Subscribe to event notifications.
  - name: Documents
    description: Upload and manage KYB and supporting documents.
  - name: RFIs
    description: Respond to Requests for Information raised during review.
  - name: Pricing
    description: Read merchant pricing plans and quote fees.
  - name: FX
    description: Quote, lock, and execute currency exchanges between balances.
  - name: Corridors
    description: Active cross-border corridors for your merchant.
  - name: Balance Alerts
    description: Per-currency low-balance thresholds that drive the `balance.low` webhook event.
  - name: Sandbox
    description: Reset and seed your sandbox environment.
  - name: Merchant
    description: Merchant profile, branding, preferences, and security posture.
  - name: API Keys
    description: Issue, list, and revoke API keys.
  - name: Users
    description: Self-service profile, MFA, and team management.
  - name: Notifications
    description: Per-user notification channels and preferences.
  - name: Velocity
    description: Merchant-scoped risk rules and what-if simulation.
  - name: Engine
    description: Glass-box view of Anton's risk intelligence.
  - name: Onboarding
    description: Authenticated KYB onboarding draft and submission.
  - name: Public Onboarding
    description: Session-authenticated hosted onboarding flow. Not intended for SDK consumption.

paths:
  /v1/currencies:
    get:
      tags: [Reference Data]
      summary: List supported currencies
      operationId: listCurrencies
      description: |
        Return every currency Anton supports, across fiat, crypto, and stablecoin.
        Use these codes when building payout or FX requests.

        The catalog is pruned at call time to currencies with at least one active
        corridor. Each entry carries a lifecycle `status` (`active` or `deprecated`)
        and `supported_rails` indicating which rail families (`fiat`, `crypto`,
        `stablecoin`) can carry the token.
      responses:
        '200':
          description: Supported currencies.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'
              example:
                data:
                  - code: USD
                    name: US Dollar
                    decimals: 2
                    symbol: "$"
                    type: fiat
                    status: active
                    supported_rails: [fiat]
                  - code: USDC
                    name: USD Coin
                    decimals: 6
                    symbol: USDC
                    type: stablecoin
                    status: active
                    supported_rails: [stablecoin]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/countries:
    get:
      tags: [Reference Data]
      summary: List supported countries
      operationId: listCountries
      description: |
        Return every country Anton recognizes (the full 159-country superset derived
        from the instrument registry), along with the currencies each country
        supports and whether Anton currently has an active, non-wildcard payout
        corridor for the destination (`payout_supported`).

        Clients that previously relied on `/v1/countries` returning only routable
        destinations should filter on `payout_supported == true`.
      responses:
        '200':
          description: Supported countries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/payment-methods:
    get:
      tags: [Reference Data]
      summary: List supported payment methods
      operationId: listPaymentMethods
      description: |
        Return the catalog of payment-method descriptors — each row is a credential
        format (IBAN, UK bank, US bank, IPX proxies, crypto, card, mobile money)
        with the countries where it's supported.

        Use this endpoint to drive dynamic instrument-creation UI: pick a country,
        filter to supported methods, prompt for the right credential fields.
      responses:
        '200':
          description: Supported payment methods.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethodDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/beneficiaries:
    post:
      tags: [Beneficiaries]
      summary: Create a beneficiary
      operationId: createBeneficiary
      description: |
        Create a person (`individual`) or business (`business`) you want to pay. PII
        submitted in the request body is tokenized in Basis Theory on creation — only
        a display name, country, and opaque token reference are stored in the Anton
        database.

        To retrieve the PII you submitted, use `GET /v1/beneficiaries/{id}/pii`.

        This endpoint requires an `Idempotency-Key` header. Duplicate calls with the
        same key return the original beneficiary; different bodies with the same key
        return `409 idempotency_conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryCreateRequest'
            examples:
              individual:
                summary: Individual beneficiary
                value:
                  type: individual
                  country: GB
                  external_ref: contractor-1042
                  individual:
                    first_name: Jane
                    last_name: Smith
                    email: jane@example.com
                    phone: "+442079460000"
                    date_of_birth: "1988-05-12"
                    nationality: GB
                    address:
                      street_line_1: 10 Example Street
                      city: London
                      postal_code: SW1A 1AA
                      country: GB
              business:
                summary: Business beneficiary
                value:
                  type: business
                  country: DE
                  business:
                    legal_name: Example GmbH
                    registration_number: HRB12345
                    email: ap@example.de
                    phone: "+493012345678"
                    entity_type: llc
                    incorporation_country: DE
                    address:
                      street_line_1: Beispielstraße 1
                      city: Berlin
                      postal_code: "10115"
                      country: DE
      responses:
        '201':
          description: Beneficiary created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Idempotent-Replayed:
              $ref: '#/components/headers/X-Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/IdempotencyConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Beneficiaries]
      summary: List beneficiaries
      operationId: listBeneficiaries
      description: |
        List beneficiaries scoped to your merchant. Results are cursor-paginated and
        sorted by creation time descending.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Filter by beneficiary status.
          required: false
          schema:
            type: string
            enum: [active, archived, blocked]
        - name: type
          in: query
          description: Filter by beneficiary type.
          required: false
          schema:
            type: string
            enum: [individual, business]
        - name: country
          in: query
          description: Filter by ISO-3166 alpha-2 country code.
          required: false
          schema:
            $ref: '#/components/schemas/CountryCode'
      responses:
        '200':
          description: Paginated list of beneficiaries.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/beneficiaries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Beneficiary ID (prefixed `ben_`).
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
          example: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
    get:
      tags: [Beneficiaries]
      summary: Retrieve a beneficiary
      operationId: getBeneficiary
      description: Return a single beneficiary by ID. Returns `404` if the beneficiary does not exist or belongs to a different merchant.
      responses:
        '200':
          description: Beneficiary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags: [Beneficiaries]
      summary: Update a beneficiary
      operationId: updateBeneficiary
      description: |
        Update mutable fields on a beneficiary: `display_name`, `country`, `external_ref`,
        and `metadata`. PII cannot be updated via this endpoint — use
        `PUT /v1/beneficiaries/{id}/pii` instead, since PII is tokenized.

        Fields not present in the request body are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryUpdateRequest'
      responses:
        '200':
          description: Beneficiary updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Beneficiaries]
      summary: Delete a beneficiary
      operationId: deleteBeneficiary
      description: |
        Soft-deletes a beneficiary. The record is removed from active listings and
        can no longer be used to initiate new payouts. Historical payouts referencing
        this beneficiary remain unchanged and accessible.

        Archiving is typically preferred over deletion — see
        `POST /v1/beneficiaries/{id}/archive`. Archiving preserves the beneficiary
        in a disabled state that can be restored later.
      responses:
        '204':
          description: Beneficiary deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/beneficiaries/{id}/pii:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    get:
      tags: [Beneficiaries]
      summary: Retrieve beneficiary PII
      operationId: getBeneficiaryPII
      description: |
        Detokenizes and returns the PII stored in Basis Theory for this beneficiary.
        Every access is recorded in the merchant audit log (PCI DSS 10.2.1).

        Use this to pre-populate edit forms or verify submitted identity data.
      responses:
        '200':
          description: Beneficiary PII, detokenized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryPII'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags: [Beneficiaries]
      summary: Replace beneficiary PII
      operationId: updateBeneficiaryPII
      description: |
        Replaces the PII stored in Basis Theory for this beneficiary. The entire PII
        blob is replaced — partial updates are not supported, because tokens are
        immutable.

        Supply the detail block matching the beneficiary's `type` (`individual` or
        `business`). The `display_name` on the beneficiary record is automatically
        re-derived from the new PII.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryPIIUpdateRequest'
      responses:
        '200':
          description: Beneficiary PII replaced. Returns the updated beneficiary record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/beneficiaries/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    post:
      tags: [Beneficiaries]
      summary: Archive a beneficiary
      operationId: archiveBeneficiary
      description: |
        Soft-disables a beneficiary. The record is preserved and can be restored later,
        but it cannot be used to initiate new payouts while archived. PII remains
        tokenized and accessible.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                end_user_ip:
                  type: string
                  description: IP address of the merchant's end-user who initiated this action.
      responses:
        '200':
          description: Beneficiary archived. Returns the updated record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/beneficiaries/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    post:
      tags: [Beneficiaries]
      summary: Restore an archived beneficiary
      operationId: restoreBeneficiary
      description: |
        Restores a previously archived beneficiary to active status. Beneficiaries
        blocked by compliance cannot be restored via this endpoint — contact support.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                end_user_ip:
                  type: string
      responses:
        '200':
          description: Beneficiary restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/beneficiaries/{id}/rescore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    post:
      tags: [Beneficiaries]
      summary: Rescore a beneficiary
      operationId: rescoreBeneficiary
      description: |
        Triggers a manual Payee-pillar rescore of this beneficiary via the Anton
        Engine. Use this after remediating a data issue (completed verification,
        resolved an adverse event, updated PII) when you want a fresh verdict
        before the next payout rather than waiting for the next scheduled
        evaluation.

        The engine response is returned directly so the portal can render the
        old vs new score. The merchant-initiated `reason` is always recorded as
        `ops_review`; no request body is required.

        Requires an `Idempotency-Key` header.

        Concurrency and rate limiting are enforced by the engine:
        - If another rescore is already in flight for this beneficiary, the API
          returns `202 Accepted` with `{"status": "in_flight"}` (no retry needed).
        - If a rescore completed very recently, the API returns
          `429 rescore_rate_limited`. Honor `Retry-After` before retrying.
        - If the beneficiary is in a terminal state (permanently locked), the
          API returns `409 beneficiary_scoring_locked`.
        - If the engine has not yet seeded a profile for this beneficiary, the
          API returns `404 engine_beneficiary_not_found`. Retry after the next
          payout, which seeds the profile.
        - If the engine admin token is not configured on this environment, the
          API returns `501 rescore_not_configured`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: No request body is required. Any body is ignored.
      responses:
        '200':
          description: Rescore completed. The body is the engine's verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryRescoreResponse'
        '202':
          description: |
            A rescore is already running for this beneficiary. No retry is
            needed; wait for the next scheduled reconciliation or poll the
            beneficiary.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    enum: [in_flight]
                  message:
                    type: string
                    example: a rescore for this beneficiary is already running
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Beneficiary not found (`beneficiary_not_found`) or the engine has
            no profile for this beneficiary yet (`engine_beneficiary_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                beneficiary_not_found:
                  summary: Beneficiary does not exist under this merchant
                  value:
                    error:
                      message: beneficiary not found
                      code: beneficiary_not_found
                engine_beneficiary_not_found:
                  summary: Engine has no profile for this beneficiary yet
                  value:
                    error:
                      message: engine has no profile for this beneficiary yet — please try again after the next payout
                      code: engine_beneficiary_not_found
        '409':
          description: |
            Either an idempotency key conflict (`idempotency_conflict`) or the
            beneficiary is in a terminal scoring state (`beneficiary_scoring_locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                beneficiary_scoring_locked:
                  summary: Beneficiary is permanently locked and cannot be rescored
                  value:
                    error:
                      message: this beneficiary is in a terminal state and cannot be rescored
                      code: beneficiary_scoring_locked
                idempotency_conflict:
                  summary: Idempotency key was replayed with a different payload
                  value:
                    error:
                      message: idempotency key conflict
                      code: idempotency_conflict
        '429':
          description: |
            Either the standard per-merchant rate limit (`rate_limit_exceeded`)
            or the beneficiary-specific rescore cooldown (`rescore_rate_limited`).
            Honor `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                rescore_rate_limited:
                  summary: A rescore for this beneficiary completed recently
                  value:
                    error:
                      message: a rescore completed recently; please wait before retrying
                      code: rescore_rate_limited
        '501':
          description: |
            Manual rescore is not configured on this API instance (the engine
            admin token is not set). This is an environment-level configuration
            issue, not a caller mistake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                rescore_not_configured:
                  value:
                    error:
                      message: manual rescore is not enabled on this API
                      code: rescore_not_configured

  /v1/payouts:
    post:
      tags: [Payouts]
      summary: Create a payout
      operationId: createPayout
      description: |
        Initiate a payout from your merchant balance to a beneficiary's payment
        instrument. The payout goes through compliance screening, velocity
        evaluation, and engine risk scoring before being submitted to a rail — see
        [How Anton Evaluates Payouts](/how-anton-evaluates-payouts) for the full
        lifecycle.

        The initial status is `created`. The payout transitions to
        `pending_screening` within moments and its subsequent state changes are
        delivered via `payout.*` webhook events. Do not poll.

        Both `source_amount` and `dest_amount` must be provided along with
        `fixed_side` (`fixed_source` or `fixed_dest`) indicating which amount is
        authoritative. The other amount is recomputed on the backend using the
        current corridor pricing. An FX quote may be locked via `POST /v1/fx/quote`
        if you need rate certainty before submission.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCreateRequest'
            examples:
              same_currency:
                summary: Same-currency USD payout
                value:
                  beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
                  instrument_id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
                  source_amount: "500.00"
                  source_currency: USD
                  dest_amount: "500.00"
                  dest_currency: USD
                  method: ach
                  rail_type: fiat
                  fixed_side: fixed_dest
                  purpose: contractor_payment
                  reference: INV-1042
              cross_currency:
                summary: USD -> EUR SEPA
                value:
                  beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
                  instrument_id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
                  source_amount: "550.00"
                  source_currency: USD
                  dest_amount: "500.00"
                  dest_currency: EUR
                  method: sepa
                  rail_type: fiat
                  fee_bearer: merchant
                  fixed_side: fixed_dest
                  purpose: supplier_payment
                  reference: PO-8821
              stablecoin:
                summary: USDC on Ethereum
                value:
                  beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
                  instrument_id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA3
                  source_amount: "1000.00"
                  source_currency: USDC
                  dest_amount: "1000.00"
                  dest_currency: USDC
                  method: stablecoin
                  rail_type: stablecoin
                  fixed_side: fixed_dest
                  purpose: contractor_payment
                  reference: INV-1042
      responses:
        '201':
          description: Payout created. Subsequent lifecycle is reported via webhooks.
          headers:
            X-Idempotent-Replayed:
              $ref: '#/components/headers/X-Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden — common causes include merchant not approved, corridor not enabled, or velocity rule blocking (`velocity_blocked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Beneficiary or instrument not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: |
            Unprocessable — validation failed, insufficient balance, or beneficiary/
            instrument not eligible (e.g. archived, disabled, wrong currency).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                insufficient_balance:
                  value:
                    error:
                      code: insufficient_balance
                      message: insufficient funds for this payout
                validation:
                  value:
                    error:
                      code: validation_error
                      message: request failed validation
                      details:
                        - field: dest_currency
                          message: must be a valid ISO-4217 currency code
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Payouts]
      summary: List payouts
      operationId: listPayouts
      description: |
        Cursor-paginated list of payouts for your merchant, sorted by `created_at`
        descending.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Filter by one or more statuses. Repeat the param to pass multiple values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PayoutStatus'
          style: form
          explode: true
        - name: beneficiary_id
          in: query
          schema:
            type: string
            pattern: '^ben_[a-zA-Z0-9]+$'
        - name: instrument_id
          in: query
          schema:
            type: string
            pattern: '^ins_[a-zA-Z0-9]+$'
        - name: batch_id
          in: query
          schema:
            type: string
            pattern: '^bat_[a-zA-Z0-9]+$'
        - name: dest_currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: reference
          in: query
          description: Exact-match filter on the merchant's `reference` field.
          schema:
            type: string
        - name: created_after
          in: query
          description: RFC 3339 timestamp. Returns payouts with `created_at >= this`.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          description: RFC 3339 timestamp. Returns payouts with `created_at < this`.
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Paginated list of payouts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Payout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/payouts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Payout ID (prefixed `pay_`).
        schema:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
          example: pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB
    get:
      tags: [Payouts]
      summary: Retrieve a payout
      operationId: getPayout
      description: Return a single payout by ID. Returns `404` if the payout does not exist or belongs to a different merchant.
      responses:
        '200':
          description: Payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/payouts/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
    get:
      tags: [Payouts]
      summary: List lifecycle events for a payout
      operationId: listPayoutEvents
      description: |
        Return every status transition recorded for this payout, oldest first. Use
        this to reconstruct a payout's timeline for support, accounting, or
        debugging purposes. Note: the preferred way to react to events in real time
        is via webhook subscriptions — polling this endpoint wastes rate-limit
        budget.
      responses:
        '200':
          description: Lifecycle events.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/payouts/{id}/velocity-results:
    parameters:
      - name: id
        in: path
        required: true
        description: Payout ID (prefixed `pay_`).
        schema:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
    get:
      tags: [Payouts]
      summary: List velocity rule results for a payout
      operationId: listPayoutVelocityResults
      description: |
        Returns the per-rule velocity / risk evaluation snapshot captured at
        payout-creation time. Each row is one rule the engine evaluated against
        this payout with the triggered/threshold/action values recorded for that
        specific evaluation — rules edited or deleted after the fact don't
        rewrite history here.

        **Portal-only (JWT auth).** API-key callers get `403 api_key_not_accepted`
        — this endpoint is only reachable through the merchant dashboard. The
        same data is not exposed on public API keys to avoid encoding internal
        risk-policy surface into merchant integrations.
      x-anton-portal-only: true
      responses:
        '200':
          description: Velocity rule evaluation snapshot. May be empty if no rules ran (e.g. pre-screening payouts, or engine-bypassed flows).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutVelocityResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden — the request authenticated via an API key. This endpoint
            is only available through the merchant dashboard (JWT auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                api_key_rejected:
                  value:
                    error:
                      code: api_key_not_accepted
                      message: this endpoint is only available through the merchant dashboard
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/payouts/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
    post:
      tags: [Payouts]
      summary: Cancel a payout
      operationId: cancelPayout
      description: |
        Cancel a payout that has not yet been submitted to a rail. Cancellation is
        only possible from `created`, `pending_screening`, `pending_approval`,
        `pending_engine_review`, or `manual_review`. Once a payout reaches
        `processing` or beyond, it cannot be cancelled via the API — contact
        support if you need to halt a payout in flight.

        Any debited source funds (source amount, fee, and cross-currency buffer)
        are released back to the merchant balance on successful cancellation.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Free-form reason for cancellation. Recorded in the audit log.
                  maxLength: 255
                end_user_ip:
                  type: string
      responses:
        '200':
          description: Payout cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Payout is not in a cancellable state, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/beneficiaries/{id}/instruments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
    get:
      tags: [Instruments]
      summary: List a beneficiary's instruments
      operationId: listInstrumentsForBeneficiary
      description: Return all payment instruments attached to this beneficiary.
      responses:
        '200':
          description: List of instruments for the beneficiary.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Instruments]
      summary: Create an instrument for a beneficiary
      operationId: createInstrumentForBeneficiary
      description: |
        Attach a payment instrument to a beneficiary. The credentials you submit
        (bank account numbers, wallet addresses, card PANs) are tokenized in Basis
        Theory on receipt — Anton's core database stores only a token reference, a
        display-only masked value, and a content fingerprint used for cross-merchant
        deduplication.

        The request body shape depends on the `method` — each method has a distinct
        credential schema. See the [Instruments methods endpoint](#tag/Reference-Data/operation/listPaymentMethods)
        for the full per-country method catalog.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentCreateRequest'
      responses:
        '201':
          description: Instrument created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: |
            The request failed validation or a business rule on the instrument.

            Common error codes:
              * `validation_error` — body shape or field validation failed (e.g. `end_user_ip` not a valid IPv4/IPv6).
              * `invalid_credentials` — method-specific credential check failed (IBAN checksum, ABA routing checksum, wallet address format, etc.).
              * `method_not_supported` — the requested `method` is valid globally but is not supported for the beneficiary's country (e.g. `us_bank` on a `GB` beneficiary).
              * `duplicate_instrument` — an instrument with the same credentials already exists on this beneficiary. Reuse the existing instrument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/batches/template:
    get:
      tags: [Batches]
      summary: Download the batch template
      operationId: downloadBatchTemplate
      description: |
        Returns a ready-to-fill batch template with the canonical header row and a
        handful of example rows. Use this to anchor your batch format — column
        order and casing matter.

        Two formats are offered and are byte-for-byte aligned — the XLSX template
        uses the same columns in the same order as the CSV and is preferred for
        merchants editing in Excel / Google Sheets (richer data validation). The
        default format is `xlsx` when the `format` query parameter is omitted.

        Reconciliation columns of note:
          * `external_id` — your opaque internal payee reference (CRM ID, HR
            system ID, accounting-package payee code). Stored on every payout
            and beneficiary created from this batch and echoed back on reads so
            you can reconcile against your system of record. Must not contain
            PII, card data, or account numbers.
          * `source_currency` — optional per-row override of the funding
            currency; if unset, rows fall back to the `source_currency` passed
            on `POST /v1/batches/{id}/confirm`.
      parameters:
        - name: format
          in: query
          description: |
            Template format to download. Defaults to `xlsx` when omitted.
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        '200':
          description: Batch template in the requested format.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: '`invalid_template_format` — `format` is not `xlsx` or `csv`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`template_not_found` — the template file is missing on this API instance (environment misconfiguration).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/batches:
    post:
      tags: [Batches]
      summary: Upload a batch
      operationId: uploadBatch
      description: |
        Upload a batch file (CSV or XLSX) containing many payout rows. The file
        is stored, hashed for duplicate detection, and queued for asynchronous
        validation. The response returns the batch in `uploaded` status; the
        status transitions to `validating`, then `validated` (or
        `validation_failed`) via webhook.

        After `validated`, review `GET /v1/batches/{id}` and the summary, then
        call `POST /v1/batches/{id}/confirm` to actually create the payouts.
        Confirmation expires — see `expires_at` on the batch record.

        If any other batch is already in a pending lifecycle state (`uploaded`,
        `validating`, `validated`, or `confirmed`) for this merchant, the
        response includes a `pending_batches` array as a soft warning — the
        upload still succeeds, but you should likely confirm or cancel the
        earlier batches first so funding calculations don't collide.

        Maximum file size: 32 MB. Maximum rows per batch: 10,000.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX file. Filename is preserved.
                file_hash:
                  type: string
                  pattern: '^sha256:[a-f0-9]{64}$'
                  description: |
                    Optional client-computed SHA-256 of the file for defence-in-depth
                    verification. If provided, the server recomputes the hash and
                    rejects the upload with `file_hash_mismatch` (400) on any drift.
                    Format: `sha256:<64-hex>` (lowercase hex).
                  example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
      responses:
        '201':
          description: Batch accepted and queued for validation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Batch'
                  - type: object
                    properties:
                      pending_batches:
                        type: array
                        description: |
                          Other in-flight batches for this merchant at the time of
                          upload. Present only when at least one prior batch is in
                          `validated` or `confirmed` state. Use the IDs to confirm
                          or cancel the earlier batches.
                        items:
                          type: object
                          required: [id, status]
                          properties:
                            id:
                              type: string
                              pattern: '^bat_[a-zA-Z0-9]+$'
                            status:
                              $ref: '#/components/schemas/BatchStatus'
        '400':
          description: |
            Malformed upload.

            Common error codes:
              * `invalid_multipart_form` — request body could not be parsed as multipart.
              * `invalid_file` — the `file` form field is missing.
              * `invalid_file_format` — file extension is not `.csv` or `.xlsx`.
              * `file_hash_mismatch` — client-supplied `file_hash` does not match the server-computed SHA-256.
              * `file_too_large` — file exceeds the 32 MB limit. (Historically documented as 413; the 32 MB BodySizeLimit middleware currently surfaces oversize uploads as 400.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`duplicate_file` — a batch with this exact SHA-256 file hash is already `uploaded`, `validating`, `validated`, `confirmed`, or `processing` for this merchant. Wait for it to finish or cancel it; retry after.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`batch_upload_failed` — generic upload-flow failure not covered by the 400/409 codes above. Retry; share `X-Request-ID` on support tickets.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Batches]
      summary: List batches
      operationId: listBatches
      description: Cursor-paginated list of batches for your merchant.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Restrict to a single batch status.
          schema:
            $ref: '#/components/schemas/BatchStatus'
        - name: created_after
          in: query
          description: |
            RFC 3339 timestamp — inclusive lower bound on `created_at`.
            Unparseable values are silently ignored (degrades to "no lower
            bound") rather than returning 400, to match `GET /v1/payouts`.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          description: RFC 3339 timestamp — inclusive upper bound on `created_at`. Unparseable values are silently ignored.
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Paginated list of batches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Batch'
        '400':
          description: '`invalid_cursor` — the supplied cursor is malformed or tampered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    get:
      tags: [Batches]
      summary: Retrieve a batch
      operationId: getBatch
      description: Return a single batch, including its validation summary (when available).
      responses:
        '200':
          description: Batch record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/batches/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    post:
      tags: [Batches]
      summary: Confirm a validated batch
      operationId: confirmBatch
      description: |
        Confirm a batch for processing. Only batches in `validated` status can be
        confirmed; the batch moves to `confirmed` and then `processing` as payouts
        are created from valid rows.

        Confirmation is irrevocable — once a batch is `confirmed`, individual
        payouts can still be cancelled (`POST /v1/payouts/{id}/cancel`) up until
        they're submitted to a rail, but the batch itself proceeds.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source_currency:
                  $ref: '#/components/schemas/CurrencyCode'
                  description: Override the default funding currency for rows that don't specify one.
      responses:
        '200':
          description: Batch confirmed and queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            - `batch_not_validated` — batch is not in `validated` status.
            - `batch_confirmation_expired` — the batch's `expires_at` has passed; re-upload the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            - `batch_confirm_failed` — generic confirmation failure not covered by the 409 codes above.
            - `validation_error` — the optional `source_currency` body field is not a valid ISO 4217 currency code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/batches/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    post:
      tags: [Batches]
      summary: Cancel a batch
      operationId: cancelBatch
      description: |
        Cancel a batch before processing begins. Valid from `uploaded`,
        `validating`, `validated`, `validation_failed`, or `confirmed`. Once
        `processing` begins, use per-payout cancellation instead.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Batch cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`batch_not_cancellable` — batch is already in a terminal state or is actively processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`batch_cancel_failed` — generic cancel-flow failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/batches/{id}/payouts:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    get:
      tags: [Batches]
      summary: List payouts created from a batch
      operationId: listBatchPayouts
      description: |
        Cursor-paginated list of payouts created by processing this batch. Row
        order in the original file is preserved in the response.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Payouts created by this batch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Payout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/batches/{id}/beneficiaries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    get:
      tags: [Batches]
      summary: List beneficiaries touched by a batch
      operationId: listBatchBeneficiaries
      description: |
        List the beneficiaries that this batch created or first referenced.
        Covers both the auto-create path (a row with inline beneficiary
        details for which no matching beneficiary existed — Anton creates one
        and tags it with `source_batch_id`) and the match path (a row that
        resolved by `external_id` or display-name heuristic against an
        existing beneficiary, but where this batch was the first to touch it).

        Returned beneficiaries have `created_via: "batch"` and a
        `source_batch_id` equal to the batch ID in the URL. The response is
        merchant-scoped — cross-merchant ID probing returns 404.

        This endpoint may return `501 not_configured` on API instances where
        the beneficiary service is not wired into the batch handler (not the
        case for production or sandbox).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated list of beneficiaries created or first referenced by this batch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: '`not_configured` — batch beneficiary listing is not enabled on this API instance.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/batches/{id}/errors:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    get:
      tags: [Batches]
      summary: List validation errors and warnings for a batch
      operationId: listBatchErrors
      description: |
        Return the row-level validation errors and warnings produced during the
        `validating` phase. Each error or warning carries the row number and
        field it applies to so you can point the merchant back to their source
        file.
      responses:
        '200':
          description: Errors and warnings keyed by row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/BatchError'
                      warnings:
                        type: array
                        items:
                          $ref: '#/components/schemas/BatchWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/batches/{id}/results:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
    get:
      tags: [Batches]
      summary: List per-row processing results
      operationId: listBatchResults
      description: |
        Return the per-row outcome of `processing`. For each original row you
        get the row number, outcome (`success`, `failed`, `skipped`, `pending`),
        the created `payout_id` (if any), and a human-readable reason for any
        non-success outcome.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Per-row results.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BatchRowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/instruments:
    get:
      tags: [Instruments]
      summary: List instruments
      operationId: listInstruments
      description: |
        List payment instruments across all beneficiaries in your merchant scope.
        Use the `beneficiary_id` filter to narrow to a single beneficiary (or call
        `GET /v1/beneficiaries/{id}/instruments`, which returns the same result).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: beneficiary_id
          in: query
          schema:
            type: string
            pattern: '^ben_[a-zA-Z0-9]+$'
        - name: method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethodCode'
        - name: currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: country
          in: query
          schema:
            $ref: '#/components/schemas/CountryCode'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
      responses:
        '200':
          description: Paginated list of instruments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/instruments/countries:
    get:
      tags: [Instruments]
      summary: List countries available for instrument creation
      operationId: listInstrumentCountries
      description: |
        Lightweight country list scoped to the countries Anton can deliver
        payouts to. Use this to populate country dropdowns in an instrument-
        creation form — paired with `/v1/instruments/methods` to build the
        full method picker.

        For the full reference catalog (including IS3 codes and currency
        lists), use `/v1/countries` instead.
      responses:
        '200':
          description: Supported instrument countries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [iso2, name]
                      properties:
                        iso2:
                          $ref: '#/components/schemas/CountryCode'
                        name:
                          type: string

  /v1/instruments/methods:
    get:
      tags: [Instruments]
      summary: List payment-method schemas per country
      operationId: listInstrumentMethods
      description: |
        Return the per-country method catalog with the exact credential-field
        schema required for each method. Use this to drive dynamic instrument-
        creation forms that know which fields to prompt for based on the
        selected country and method.
      parameters:
        - name: country
          in: query
          description: Filter to methods available in a specific country.
          schema:
            $ref: '#/components/schemas/CountryCode'
      responses:
        '200':
          description: Per-country method schemas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstrumentMethodSchema'

  /v1/instruments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
    get:
      tags: [Instruments]
      summary: Retrieve an instrument
      operationId: getInstrument
      description: Return a single instrument by ID.
      responses:
        '200':
          description: Instrument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags: [Instruments]
      summary: Update an instrument
      operationId: updateInstrument
      description: |
        Update the mutable fields on an instrument — `label`, `is_default`, and
        `status`. Credentials cannot be updated; create a new instrument and
        delete the old one to replace them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 255
                is_default:
                  type: boolean
                status:
                  type: string
                  enum: [active, disabled]
                end_user_ip:
                  type: string
                  format: ip
                  description: |
                    The end-user's public IP address for the session that initiated
                    this update. Captured on the audit trail and fed into risk scoring.
                    Must be a valid IPv4 or IPv6 address.
                  example: "203.0.113.42"
      responses:
        '200':
          description: Instrument updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Instruments]
      summary: Delete an instrument
      operationId: deleteInstrument
      description: |
        Soft-delete an instrument. The instrument is removed from active listings
        and cannot be used on new payouts. Historical payouts referencing it
        remain accessible and unchanged.

        An optional JSON body may supply `end_user_ip` — the public IP of the
        end-user session that initiated the delete — for audit and risk. The
        field must be a valid IPv4 or IPv6 address.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                end_user_ip:
                  type: string
                  format: ip
                  description: |
                    The end-user's public IP address for the session that
                    initiated this deletion. Captured on the audit trail and
                    used as a risk signal. Must be a valid IPv4 or IPv6 address.
                  example: "203.0.113.42"
      responses:
        '204':
          description: Instrument deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/balances:
    get:
      tags: [Balances]
      summary: List all balances
      operationId: listBalances
      description: |
        Return your merchant balance in every currency you hold. Each balance
        distinguishes between `available` (usable for new payouts), `pending`
        (reserved for in-flight payouts), and `total`.
      responses:
        '200':
          description: Balances across all currencies.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/balances/{currency}:
    parameters:
      - name: currency
        in: path
        required: true
        description: ISO 4217 currency code (or stablecoin/crypto symbol).
        schema:
          $ref: '#/components/schemas/CurrencyCode'
    get:
      tags: [Balances]
      summary: Retrieve a balance by currency
      operationId: getBalance
      description: Return your merchant balance in a single currency.
      responses:
        '200':
          description: Balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No balance exists for this currency on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/accounts:
    get:
      tags: [Accounts]
      summary: List merchant funding accounts
      operationId: listAccounts
      description: |
        Return your virtual funding accounts — one per currency Anton has
        provisioned for you. Used for depositing funds into your merchant
        balance.
      responses:
        '200':
          description: Funding accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/accounts/{currency}:
    parameters:
      - name: currency
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CurrencyCode'
    get:
      tags: [Accounts]
      summary: Retrieve a funding account
      operationId: getAccount
      description: Return the funding account for a single currency.
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`account_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/accounts/{currency}/details:
    parameters:
      - name: currency
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CurrencyCode'
    get:
      tags: [Accounts]
      summary: Retrieve deposit details
      operationId: getAccountDetails
      description: |
        Return the banking / deposit details for your funding account in this
        currency — IBAN/BIC, sort code + account number, routing codes, etc.
        Share these with the sender to fund your balance.
      responses:
        '200':
          description: Account deposit details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/accounts/{currency}/transactions:
    parameters:
      - name: currency
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CurrencyCode'
    get:
      tags: [Accounts]
      summary: List transactions on a funding account
      operationId: listAccountTransactions
      description: |
        Cursor-paginated list of transactions for this funding account — deposits
        from external parties, payout debits, fee deductions, and FX transfers.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Transactions on this account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MerchantTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/transactions:
    get:
      tags: [Accounts]
      summary: List transactions across all accounts
      operationId: listTransactions
      description: |
        Cursor-paginated list of transactions across every funding account you
        hold. Only `limit` and `cursor` are honored; server-side filtering by
        currency, type, or time range is not yet supported — filter client-side
        on the returned `MerchantTransaction` objects, or call
        `GET /v1/accounts/{currency}/transactions` to narrow by currency.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Transactions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MerchantTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/pricing:
    get:
      tags: [Pricing]
      summary: List merchant pricing plans
      operationId: listMerchantPricing
      description: |
        Return the pricing plans active on your merchant account. Plans are
        scoped by currency, country, and method — more specific plans take
        priority.
      responses:
        '200':
          description: Active plans.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricingPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/pricing/quote:
    post:
      tags: [Pricing]
      summary: Quote a fee for a hypothetical payout
      operationId: createPricingQuote
      description: |
        Preview the fee that would apply for a given source/destination pair
        and amount. Useful for surfacing fees to your end user before they
        confirm a payout.

        **Bindable quotes (v1.0.0).** Every quote response includes a
        `quote_id` (prefix `pq_`) and an `expires_at` timestamp. You can
        bind the exact quoted fee to a subsequent payout by passing the
        `quote_id` on `POST /v1/payouts`. If the quote has expired, been
        already bound to another payout, or the payout's currencies/amount
        don't match the quote, the payout create call returns
        `422 quote_expired` / `422 quote_already_used` / `422 quote_mismatch`.
        Omit `quote_id` on the payout to let the platform re-price at
        submission time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_currency, dest_currency, amount]
              properties:
                source_currency:
                  $ref: '#/components/schemas/CurrencyCode'
                dest_currency:
                  $ref: '#/components/schemas/CurrencyCode'
                dest_country:
                  $ref: '#/components/schemas/CountryCode'
                method:
                  $ref: '#/components/schemas/PayoutMethod'
                amount:
                  $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: Fee quote.
          content:
            application/json:
              schema:
                type: object
                required:
                  - fee
                  - fee_currency
                  - plan_id
                  - quote_id
                  - source_currency
                  - dest_currency
                  - source_amount
                  - dest_amount
                  - rate
                  - total_cost
                  - total_currency
                  - created_at
                  - expires_at
                properties:
                  quote_id:
                    type: string
                    pattern: '^pq_[a-zA-Z0-9]+$'
                    description: Bindable quote identifier. Pass on `POST /v1/payouts` to lock this fee.
                  plan_id:
                    type: string
                    pattern: '^prc_[a-zA-Z0-9]+$'
                  source_currency:
                    $ref: '#/components/schemas/CurrencyCode'
                  dest_currency:
                    $ref: '#/components/schemas/CurrencyCode'
                  source_amount:
                    $ref: '#/components/schemas/Money'
                  dest_amount:
                    $ref: '#/components/schemas/Money'
                  fee:
                    $ref: '#/components/schemas/Money'
                  fee_currency:
                    $ref: '#/components/schemas/CurrencyCode'
                  rate:
                    type: string
                    description: |
                      FX rate applied to produce `dest_amount` from `source_amount`.
                      `"1"` for same-currency quotes. Decimal string.
                  rail_type:
                    $ref: '#/components/schemas/RailType'
                  method:
                    $ref: '#/components/schemas/PayoutMethod'
                  total_cost:
                    allOf:
                      - $ref: '#/components/schemas/Money'
                    description: |
                      `source_amount + fee` when the fee is charged in
                      `source_currency`. Decimal string.
                  total_currency:
                    $ref: '#/components/schemas/CurrencyCode'
                  created_at:
                    $ref: '#/components/schemas/Timestamp'
                  expires_at:
                    $ref: '#/components/schemas/Timestamp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/corridors:
    get:
      tags: [Corridors]
      summary: List active corridors
      operationId: listCorridors
      description: |
        Return every active payout corridor on your merchant account. A corridor
        is a (rail_type, currency, country, method, network) combination Anton
        can deliver payouts through.

        Use this to validate a (country, currency, method) combination before
        attempting `POST /v1/payouts`. Corridors not listed here will return
        `corridor_not_enabled`.
      parameters:
        - name: rail_type
          in: query
          schema:
            $ref: '#/components/schemas/RailType'
        - name: currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: country
          in: query
          schema:
            $ref: '#/components/schemas/CountryCode'
      responses:
        '200':
          description: Active corridors.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Corridor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhooks:
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      operationId: createWebhookSubscription
      description: |
        Register an HTTPS endpoint to receive event notifications. Anton POSTs
        signed JSON deliveries to the URL you supply every time an event from
        the `events` list fires on your merchant account.

        **Requirements:**
        - The URL must use `https://` (enforced outside development environments).
        - The URL must be publicly reachable — private, loopback, and metadata
          addresses are rejected.

        The response includes a `secret` — this is shown **once at creation**.
        Store it in your secrets manager immediately; Anton cannot recover it
        later. You can rotate the secret any time via
        `POST /v1/webhooks/{id}/secret/rotate`.

        See [Webhook Events](/api-reference/webhook-events) for the event catalog
        and [Webhook Signing](/api-reference/webhook-signing) for verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
      responses:
        '201':
          description: Subscription created. Includes the one-time signing secret.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: Signing secret (`whsec_` + 64 hex). Shown once — store it now.
                        example: whsec_0a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef
        '400':
          description: |
            - `webhook_url_required` — `url` missing.
            - `webhook_url_invalid` — `url` is malformed or hostless.
            - `webhook_url_not_https` — HTTP scheme used outside development.
            - `webhook_url_private_address` — URL resolves to a private / loopback / metadata address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      operationId: listWebhookSubscriptions
      description: |
        Return all webhook subscriptions on your merchant account.

        Subscriptions that have been deleted via `DELETE /v1/webhooks/{id}`
        are soft-deleted and excluded from this list. Their delivery
        history is retained and can be inspected via the deliveries
        endpoint with `include_deleted=true`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: List of subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: Retrieve a webhook subscription
      operationId: getWebhookSubscription
      description: |
        Retrieve a single subscription by ID. Subscriptions that have been
        deleted via `DELETE /v1/webhooks/{id}` are soft-deleted and return
        `404 webhook_subscription_not_found` here — they are not visible
        to merchant reads. Delivery history is still accessible via
        `GET /v1/webhooks/events/{id}/deliveries?include_deleted=true`.
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      operationId: deleteWebhookSubscription
      description: |
        Soft-delete a subscription. The subscription disappears from
        `GET /v1/webhooks` and `GET /v1/webhooks/{id}` (which will return
        404) and will not receive any further event deliveries. The full
        delivery history is preserved for audit retention and can be
        retrieved via `GET /v1/webhooks/events/{id}/deliveries` with
        `include_deleted=true`.

        This endpoint is **idempotent**. Calling `DELETE` on a
        subscription that was never created, or on one that has already
        been deleted, also returns `204 No Content`. Clients can safely
        retry `DELETE` after a timeout without worrying about spurious
        404s.

        Prefer `POST /v1/webhooks/{id}/deactivate` if you may re-enable
        the same subscription later — deactivate is reversible;
        delete is not.
      responses:
        '204':
          description: |
            Subscription is now in the deleted state. Returned whether the
            subscription existed and was freshly deleted, or was already
            deleted, or never existed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/webhooks/{id}/secret:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: Retrieve the current signing secret
      operationId: getWebhookSecret
      description: |
        Return the current HMAC signing secret for this subscription. Use this
        if you lost the secret after creation — the endpoint is audited and
        rate-limited for safety.
      responses:
        '200':
          description: Current secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret]
                    properties:
                      secret:
                        type: string
                        description: '`whsec_` + 64 hex.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    post:
      tags: [Webhooks]
      summary: Send a test delivery
      operationId: testWebhookSubscription
      description: |
        Dispatch a synthetic `test` event to this subscription right now. Useful
        for verifying signature verification, network reachability, and logging
        pipelines without waiting for a real event.

        Rate-limited.
      responses:
        '202':
          description: |
            Test event queued for delivery. The response contains the full
            `WebhookEvent` envelope — ID, type, timestamp, and the
            synthetic payload — so the caller can correlate the queued
            event with the delivery that arrives at the endpoint shortly
            after.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhooks/{id}/deactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    post:
      tags: [Webhooks]
      summary: Deactivate a webhook subscription
      operationId: deactivateWebhookSubscription
      description: |
        Stop delivering events to this subscription without deleting it. The
        subscription moves to `inactive` and stops receiving further
        deliveries. To re-enable a subscription later, contact support —
        there is no public reactivation endpoint. If you expect to
        re-enable an endpoint programmatically, prefer creating a fresh
        subscription over deactivating the existing one.
      responses:
        '200':
          description: Subscription deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/events:
    get:
      tags: [Webhooks]
      summary: List webhook events
      operationId: listWebhookEvents
      description: |
        Return the history of webhook events generated on your merchant account.
        Events persist independently of delivery — you can inspect and replay
        them via `/deliveries` below.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/WebhookEventType'
        - name: created_after
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Paginated list of events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/webhooks/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: Retrieve a webhook event
      operationId: getWebhookEvent
      responses:
        '200':
          description: Event with full payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/events/{id}/deliveries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: List deliveries for an event
      operationId: listWebhookDeliveries
      description: |
        Return every attempt Anton made to deliver this event to every
        subscribed endpoint. Each attempt records the request headers, response
        status, body, duration, and retry schedule — useful for debugging
        failing integrations.

        By default, deliveries that targeted a subscription which has
        since been deleted (`DELETE /v1/webhooks/{id}`) are excluded
        from this list. Pass `include_deleted=true` to include them —
        useful when auditing historical delivery activity from a
        subscription you have since removed.
      parameters:
        - name: include_deleted
          in: query
          required: false
          description: |
            When `true`, include deliveries whose target subscription
            has been soft-deleted. Accepts standard boolean values
            (`true`/`false`, `1`/`0`). Defaults to `false`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Delivery history.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/merchant/sandbox/reset:
    post:
      tags: [Sandbox]
      summary: Reset your sandbox environment
      operationId: resetSandbox
      description: |
        Wipe sandbox data scoped to your merchant and optionally reseed. Only
        available in sandbox environments; returns `403 sandbox_only` elsewhere.

        Rate-limited to 10 resets per merchant per hour.

        **Scopes:**
        - `balances` (default) — reset currency balances. Beneficiaries, payouts,
          and instruments are preserved.
        - `all` — wipe payouts, instruments, beneficiaries, and sandbox
          transactions; re-seed currency balances only.
        - `delete-all` — wipe everything. No reseed; you land at zero state.
        - `full-reset` — wipe everything and re-seed balances + sample
          beneficiaries + sample payouts. Equivalent to a fresh merchant with
          demo data.
      parameters:
        - name: scope
          in: query
          description: What to wipe and whether to re-seed.
          schema:
            type: string
            enum: [balances, all, delete-all, full-reset]
            default: balances
      responses:
        '200':
          description: Reset complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [reset, deleted, cleaned]
                    description: |
                      Outcome of the reset. Varies by `scope`:
                      - `reset` — balances re-seeded (`scope=balances` or `scope=full-reset`)
                      - `cleaned` — everything wiped and balances re-seeded (`scope=all`)
                      - `deleted` — everything wiped without re-seed (`scope=delete-all`)
                  scope:
                    type: string
                  merchant_id:
                    type: string
                  beneficiaries:
                    type: integer
                    description: |
                      Sample beneficiaries re-seeded. Only populated when
                      `scope=full-reset`; omitted otherwise.
                    example: 4
                  instruments:
                    type: integer
                    description: |
                      Sample instruments re-seeded. Only populated when
                      `scope=full-reset`; omitted otherwise.
                    example: 4
                  payouts:
                    type: integer
                    description: |
                      Sample payouts re-seeded. Only populated when
                      `scope=full-reset`; omitted otherwise.
                    example: 4
        '400':
          description: '`invalid_scope` — the `scope` query parameter is not one of the accepted values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`sandbox_only` — not available in the current environment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/merchant/sandbox/seed-beneficiaries:
    post:
      tags: [Sandbox]
      summary: Seed sample beneficiaries
      operationId: seedSampleBeneficiaries
      description: |
        Create a curated set of sample beneficiaries across multiple countries
        and payment methods. Useful as CI fixtures or demo data. Sandbox only.
      responses:
        '200':
          description: Beneficiaries seeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: seeded
                  merchant_id:
                    type: string
                  beneficiaries:
                    type: integer
                    description: Number of sample beneficiaries created.
                    example: 4
                  instruments:
                    type: integer
                    description: |
                      Number of payment instruments created across the
                      seeded beneficiaries.
                    example: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`sandbox_only`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/fx/quote:
    post:
      tags: [FX]
      summary: Create a lockable FX quote
      operationId: createFXQuote
      description: |
        Request a lockable exchange rate between two currencies. Quotes have a
        short expiry window; use the returned `id` on
        `POST /v1/fx/exchange` to lock the rate before expiry.

        Rate-limited to 30 per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FXQuoteCreateRequest'
      responses:
        '201':
          description: Quote created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FXQuote'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: '`currency_not_supported` or other pricing error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: '`fx_rates_unavailable` — upstream rate provider did not respond.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/fx/rate:
    get:
      tags: [FX]
      summary: Retrieve an indicative rate
      operationId: getIndicativeFXRate
      description: |
        Non-binding rate between two currencies. Cheaper than a lockable quote;
        use for display purposes. Rate-limited to 30 per minute per IP.

        **Provider note.** In sandbox, indicative rates are served by the
        frankfurter.app public data feed (sandbox-only). Production uses the
        same locked-rate providers as `POST /v1/fx/quote`.
      parameters:
        - name: sell_currency
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: buy_currency
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: buy_amount
          in: query
          description: |
            Optional — the recipient-side (`buy_currency`) amount to price. When
            present, the response includes a computed `sell_amount`. Defaults
            to `1` unit of `buy_currency` when omitted (rate display).
          schema:
            $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: Indicative rate.
          content:
            application/json:
              schema:
                type: object
                required: [sell_currency, buy_currency, mid_market_rate, customer_rate, fx_markup_bps]
                properties:
                  sell_currency:
                    $ref: '#/components/schemas/CurrencyCode'
                  buy_currency:
                    $ref: '#/components/schemas/CurrencyCode'
                  mid_market_rate:
                    $ref: '#/components/schemas/Money'
                  customer_rate:
                    $ref: '#/components/schemas/Money'
                    description: Mid-market adjusted by your pricing plan's FX markup.
                  fx_markup_bps:
                    type: integer
                    description: Markup applied to mid-market, in basis points.
                  sell_amount:
                    $ref: '#/components/schemas/Money'
                  buy_amount:
                    $ref: '#/components/schemas/Money'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: '`fx_rates_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/fx/exchange:
    post:
      tags: [FX]
      summary: Execute an FX exchange
      operationId: executeFXExchange
      description: |
        Exchange a locked quote — debits the sell currency balance and credits
        the buy currency balance. The quote must still be within its validity
        window; expired quotes return `quote_expired`.

        Rate-limited to 10 per minute per IP. Requires `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
                  pattern: '^fxq_[a-zA-Z0-9]+$'
                  description: ID of a quote previously created via `POST /v1/fx/quote`.
      responses:
        '201':
          description: Exchange executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FXExchange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`quote_not_found` — the quote does not exist or belongs to a different merchant.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: '`quote_expired` — the quote is past its expiry window.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            - `quote_not_locked` — quote must be lockable.
            - `insufficient_balance` — sell currency balance cannot cover the exchange.
            - `no_buy_account` — the merchant has no funding account in the
              `buy_currency`. Provision the account (via ops) before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: '`locked_rate_unavailable` — the locked rate can no longer be honored by the provider.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/fx/exchanges:
    get:
      tags: [FX]
      summary: List FX exchanges
      operationId: listFXExchanges
      description: Cursor-paginated history of executed FX exchanges for your merchant.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sell_currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: buy_currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: created_after
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Paginated list of exchanges.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FXExchange'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/merchant/sandbox/seed-payouts:
    post:
      tags: [Sandbox]
      summary: Seed sample payouts
      operationId: seedSamplePayouts
      description: |
        Create a mix of sample payouts across different statuses (pending,
        completed, failed, cancelled, manual_review) for UI, webhook, and
        integration testing. Sandbox only. Requires seeded beneficiaries — call
        `POST /v1/merchant/sandbox/seed-beneficiaries` first if your sandbox is
        empty.
      responses:
        '200':
          description: Payouts seeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: seeded
                  merchant_id:
                    type: string
                  created:
                    type: integer
                    description: Number of sample payouts created.
                    example: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`sandbox_only`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`no_beneficiaries` — seed beneficiaries before payouts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ── Merchant profile and workspace settings ──────────────────────────
  /v1/webhooks/{id}/secret/rotate:
    post:
      tags: [Webhooks]
      summary: Rotate the webhook signing secret
      operationId: rotateWebhookSecret
      description: |
        Generate a new HMAC signing secret. The raw secret is returned
        **exactly once** in the response body. Any subsequent `GET
        /v1/webhooks/{id}/secret` returns only a masked suffix
        (`***xxxx`). NTF-2.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^whk_[a-zA-Z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret]
                    properties:
                      secret:
                        type: string
                        description: Raw signing secret. Shown once — store immediately.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        API keys are opaque strings prefixed by environment:
        - `ak_live_*` — production keys, accepted only on `api.antonpayments.com`.
        - `ak_test_*` — sandbox keys, accepted only on `api.antonpayments.dev`.

        Include your key in the `Authorization` header: `Bearer ak_test_...`.

  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page. Maximum 100.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by a previous list response. Omit for the first page.
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Unique key identifying this operation. Sending the same key twice returns the original
        response instead of creating a duplicate. Keys are retained for 24 hours.
      required: true
      schema:
        type: string
        maxLength: 255

  headers:
    X-Request-ID:
      description: Opaque request identifier. Include when contacting support.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Maximum requests permitted in the current window.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix timestamp when the current window resets.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying. Included on 429 responses.
      schema:
        type: integer
    X-Idempotent-Replayed:
      description: '`true` when the response is a replay of a previous request with the same `Idempotency-Key`.'
      schema:
        type: string
        enum: ["true"]

  responses:
    Unauthorized:
      description: Missing or invalid API key, or key used against the wrong environment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing_key:
              summary: Missing bearer token
              value:
                error:
                  code: unauthorized
                  message: missing or invalid credentials
            wrong_environment:
              summary: Test key used against production
              value:
                error:
                  code: key_environment_mismatch
                  message: this API key is not valid for this environment
    Forbidden:
      description: Authenticated, but not permitted for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The resource does not exist, or belongs to a different merchant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    IdempotencyConflict:
      description: The same `Idempotency-Key` was previously used with a different request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded. See `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Something went wrong on our end.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: Human-readable description of what went wrong.
            code:
              type: string
              description: Machine-readable error code. Branch on this, not on `message`.
              example: insufficient_balance
      example:
        error:
          message: insufficient funds for this payout
          code: insufficient_balance

    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: request failed validation
            code:
              type: string
              enum: [validation_error]
            details:
              type: array
              description: Field-level validation errors.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: Dotted JSON path to the offending field.
                    example: individual.date_of_birth
                  message:
                    type: string
                    example: must be in YYYY-MM-DD format
      example:
        error:
          message: request failed validation
          code: validation_error
          details:
            - field: individual.first_name
              message: is required
            - field: country
              message: must be a valid ISO-3166 alpha-2 country code

    CursorList:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: {}
          description: Array of results for this page. Element schema varies by endpoint.
        has_more:
          type: boolean
          description: Whether more results exist beyond this page.
        next_cursor:
          type: string
          description: Cursor for the next page. Present only when `has_more` is `true`.

    Money:
      type: string
      description: Decimal amount as a string, never a float. Up to 12 whole digits.
      pattern: '^-?\d{1,12}(\.\d+)?$'
      example: "1234.56"

    CurrencyCode:
      type: string
      description: ISO 4217 three-letter currency code.
      pattern: '^[A-Z]{3}$'
      example: USD

    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      pattern: '^[A-Z]{2}$'
      example: US

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 / ISO 8601 timestamp in UTC.
      example: "2026-04-15T14:30:00Z"

    # ---------------------------------------------------------------------
    # Resource schemas — scaffolded, filled in per-endpoint.
    # TODO: populate full property lists as each endpoint group is written.
    # ---------------------------------------------------------------------

    Address:
      type: object
      required: [street_line_1, city, postal_code, country]
      properties:
        street_line_1:
          type: string
          example: 10 Example Street
        street_line_2:
          type: string
          example: Apt 4B
        city:
          type: string
          example: London
        state:
          type: string
          description: State, province, or region. Required in some countries (e.g. US, CA, AU).
          example: Greater London
        postal_code:
          type: string
          example: SW1A 1AA
        country:
          $ref: '#/components/schemas/CountryCode'

    IndividualDetails:
      type: object
      required: [first_name, last_name, email, phone, date_of_birth, nationality, address]
      description: PII for an `individual` beneficiary. Tokenized on creation.
      properties:
        first_name:
          type: string
          example: Jane
        middle_name:
          type: string
          example: R
        last_name:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: jane@example.com
        phone:
          type: string
          description: E.164-formatted phone number.
          example: "+442079460000"
        date_of_birth:
          type: string
          description: YYYY-MM-DD.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "1988-05-12"
        nationality:
          $ref: '#/components/schemas/CountryCode'
        address:
          $ref: '#/components/schemas/Address'

    BusinessDetails:
      type: object
      required: [legal_name, registration_number, email, phone, address]
      description: PII for a `business` beneficiary. Tokenized on creation.
      properties:
        legal_name:
          type: string
          example: Example GmbH
        trading_name:
          type: string
          description: Name the business trades as, if different from legal name.
          example: Example
        registration_number:
          type: string
          example: HRB12345
        tax_id:
          type: string
          example: DE123456789
        entity_type:
          type: string
          description: Legal entity form.
          enum: [llc, corporation, partnership, sole_proprietorship, trust, other]
        incorporation_country:
          $ref: '#/components/schemas/CountryCode'
        incorporation_date:
          type: string
          description: YYYY-MM-DD.
          pattern: '^\d{4}-\d{2}-\d{2}$'
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164-formatted phone number.
          example: "+493012345678"
        website:
          type: string
          format: uri
          example: https://example.de
        address:
          $ref: '#/components/schemas/Address'

    BeneficiaryCreateRequest:
      type: object
      required: [type, country]
      description: |
        Create a beneficiary. Supply exactly one of `individual` or `business` matching
        the declared `type`.
      properties:
        type:
          type: string
          enum: [individual, business]
          description: Whether this beneficiary is a person or a business.
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: string
          description: Your own reference for this beneficiary. Stored as-is, not validated.
          maxLength: 255
          example: contractor-1042
        metadata:
          type: object
          description: Arbitrary string map of your own labels. Stored as-is.
          additionalProperties:
            type: string
          example:
            department: engineering
            cost_center: "4421"
        individual:
          $ref: '#/components/schemas/IndividualDetails'
        business:
          $ref: '#/components/schemas/BusinessDetails'
        end_user_ip:
          type: string
          description: |
            IP address of the merchant's end-user who initiated this action. Used for
            risk signals. Accepts IPv4 or IPv6. Optional but recommended.
          example: 203.0.113.42

    Beneficiary:
      type: object
      description: |
        A person or business you pay. PII is tokenized in Basis Theory on creation —
        raw identifiers are never returned in this response. Use
        `GET /v1/beneficiaries/{id}/pii` to retrieve detokenized PII for a
        beneficiary you own.
      required: [id, merchant_id, type, status, display_name, country, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
          example: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        type:
          type: string
          enum: [individual, business]
        status:
          type: string
          enum: [active, archived, blocked]
          description: |
            - `active` — usable for payouts.
            - `archived` — soft-disabled by the merchant; not usable. Can be restored.
            - `blocked` — blocked by compliance. Not usable and cannot be restored via the API.
        display_name:
          type: string
          description: |
            Derived from the tokenized PII on creation. For individuals, a concatenation
            of name fields; for businesses, the legal name.
          example: Jane Smith
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: [string, "null"]
          description: Your own reference, if you supplied one at creation.
        metadata:
          type: object
          additionalProperties:
            type: string
        trust_score:
          type: [number, "null"]
          format: float
          minimum: 0
          maximum: 1
          description: |
            Cross-merchant composite Payee-pillar trust score computed by the Anton
            Engine. Range `0.0`–`1.0`; higher is more trustworthy. `null` when the
            engine has not yet seeded a profile for this beneficiary — a beneficiary
            created moments ago may land in this state briefly until the engine's
            beneficiary events consumer writes the first profile row.
          example: 0.87
        trust_tier:
          type: [string, "null"]
          enum: [CRITICAL, HIGH, MEDIUM, LOW, null]
          description: |
            Bucketed label for `trust_score` using the engine's Payee cut-points.
            Provided so merchant UIs can colour the beneficiary without reimplementing
            the thresholds. `null` when `trust_score` is `null`.
          example: HIGH
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        type: individual
        status: active
        display_name: Jane Smith
        country: GB
        external_ref: contractor-1042
        metadata:
          department: engineering
        trust_score: 0.87
        trust_tier: HIGH
        created_at: "2026-04-15T14:30:00Z"
        updated_at: "2026-04-15T14:30:00Z"

    BeneficiaryRescoreResponse:
      type: object
      description: |
        Verdict returned by a successful `POST /v1/beneficiaries/{id}/rescore`.
        Carries both the new evaluation and, when available, the previous one
        so clients can render old-vs-new score comparisons.
      required: [pillar, resource_id, new_evaluation_id, new_score, new_tier]
      properties:
        pillar:
          type: string
          enum: [payee]
          description: |
            The engine scoring pillar that was recomputed. Merchant rescores
            are always Payee-pillar.
        resource_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
          description: The beneficiary ID this verdict applies to.
        new_evaluation_id:
          type: string
          description: |
            Engine evaluation ID for the rescore run. Persistent — can be used
            to correlate with the engine's audit trail.
        new_score:
          type: integer
          description: |
            Engine-native raw score for the rescore run. This is the engine's
            internal integer score, not the normalized `trust_score` (0.0–1.0)
            exposed on `GET /v1/beneficiaries/{id}` — the normalization is
            performed by the engine's profile writer.
        new_tier:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
          description: Bucketed tier for `new_score`.
        previous_evaluation_id:
          type: string
          description: |
            Engine evaluation ID of the prior evaluation, if any. Omitted when
            this is the first evaluation for the beneficiary.
        previous_score:
          type: [integer, "null"]
          description: |
            Prior engine raw score, if any. Nullable (not omitted) so a
            legitimate prior score of `0` is distinguishable from "no previous
            evaluation."
        previous_tier:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
          description: Prior tier, if any. Omitted when there was no prior evaluation.
      example:
        pillar: payee
        resource_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        new_evaluation_id: eval_01HXA1B2C3D4E5F6G7H8J9K0
        new_score: 423
        new_tier: MEDIUM
        previous_evaluation_id: eval_01HX9Z0Y8X7W6V5U4T3S2R1Q
        previous_score: 380
        previous_tier: HIGH

    Currency:
      type: object
      required: [code, name, decimals, type, status]
      properties:
        code:
          $ref: '#/components/schemas/CurrencyCode'
        name:
          type: string
          example: US Dollar
        decimals:
          type: integer
          description: Number of decimal places the currency supports. USD=2, JPY=0, BTC=8.
          example: 2
        symbol:
          type: string
          example: "$"
        type:
          type: string
          enum: [fiat, crypto, stablecoin]
        status:
          type: string
          enum: [active, deprecated]
          description: |
            Lifecycle state of the currency. `active` means at least one corridor
            currently routes the currency end-to-end; `deprecated` means Anton
            still recognizes the symbol but no corridor can carry it. New payouts
            against deprecated currencies are rejected upstream.
          example: active
        supported_rails:
          type: array
          description: |
            Rail families that can carry this currency. Used to build corridor-aware
            payout UIs without a round-trip to `/v1/corridors`. Omitted when no rail
            carries the currency (the entry will still appear if declared in the
            catalog, but `supported_rails` will be absent).
          items:
            type: string
            enum: [fiat, crypto, stablecoin]
          example: [fiat]

    Country:
      type: object
      required: [iso2, iso3, name, supported_currencies, payout_supported]
      properties:
        iso2:
          $ref: '#/components/schemas/CountryCode'
        iso3:
          type: [string, "null"]
          description: |
            ISO 3166-1 alpha-3 country code. Always three uppercase letters for
            countries with an assigned alpha-3. Kosovo (`XK`) has no ISO-assigned
            alpha-3 and is returned as an empty string — treat empty string as
            "unassigned" and fall back to `iso2`.
          example: USA
        name:
          type: string
          example: United States
        supported_currencies:
          type: array
          description: Currencies Anton can deliver in this country.
          items:
            $ref: '#/components/schemas/CurrencyCode'
        payout_supported:
          type: boolean
          description: |
            `true` when Anton has at least one active, non-wildcard payout corridor
            for the destination country. Clients that need only routable
            destinations should filter on this field rather than assuming every
            country in the response is payout-ready.
          example: true

    PaymentMethodDescriptor:
      type: object
      required: [code, name, rail_type]
      description: A supported payment method, with the countries where it's available.
      properties:
        code:
          $ref: '#/components/schemas/PaymentMethodCode'
        name:
          type: string
          example: UK Bank Account
        description:
          type: string
          example: Sort code + account number. Routes via Faster Payments, BACS, CHAPS.
        rail_type:
          type: string
          enum: [fiat, crypto, stablecoin]
        supported_countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryCode'

    BeneficiaryUpdateRequest:
      type: object
      description: Mutable fields on a beneficiary. Fields not included are left unchanged.
      properties:
        display_name:
          type: string
          maxLength: 255
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: [string, "null"]
          maxLength: 255
          description: Set to `null` to clear.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Replaces the existing metadata map in full.
        end_user_ip:
          type: string

    BeneficiaryPII:
      type: object
      description: |
        Detokenized PII for a beneficiary. Returned by `GET /v1/beneficiaries/{id}/pii`.
        Exactly one of `individual` or `business` is populated matching the
        beneficiary's `type`.
      properties:
        type:
          type: string
          enum: [individual, business]
        individual:
          $ref: '#/components/schemas/IndividualDetails'
        business:
          $ref: '#/components/schemas/BusinessDetails'

    BeneficiaryPIIUpdateRequest:
      type: object
      description: |
        Replacement PII. Provide the detail block matching the beneficiary's type.
        The entire PII blob is replaced — partial updates are not supported.
      properties:
        individual:
          $ref: '#/components/schemas/IndividualDetails'
        business:
          $ref: '#/components/schemas/BusinessDetails'
        end_user_ip:
          type: string

    PaymentMethodCode:
      type: string
      description: |
        Credential format of a payment instrument — named by what data is stored,
        not by the rail that delivers the funds. One credential type can route to
        multiple rails (e.g. an IBAN can go via SEPA, SEPA Instant, TARGET2, SWIFT,
        or CHAPS — the rail is selected at payout time).

        Query `GET /v1/payment-methods` for the full country-specific catalog
        including per-method credential schemas.
      enum:
        - iban
        - uk_bank
        - us_bank
        - ca_bank
        - au_bank
        - nz_bank
        - jp_bank
        - in_bank
        - za_bank
        - ng_bank
        - ph_bank
        - cl_bank
        - co_bank
        - swift
        - clabe
        - cbu
        - cci
        - pix
        - upi
        - interac
        - paynow
        - fps_hk
        - promptpay
        - card
        - crypto
        - mobile_money

    InstrumentCreateRequest:
      type: object
      required: [method]
      description: |
        Create an instrument attached to a beneficiary.

        The `credentials` object shape varies by `method`. A few common shapes:

        - `iban`: `{ "account_holder_name": "Ada Lovelace", "iban": "GB82WEST12345698765432", "bic": "WESTGB22" }` (BIC optional; `account_holder_name` required)
        - `uk_bank`: `{ "account_holder_name": "Ada Lovelace", "account_number": "12345678", "sort_code": "123456" }`
        - `us_bank`: `{ "account_holder_name": "Ada Lovelace", "routing_number": "026073150", "account_number": "...", "account_type": "checking" }`
        - `crypto`: `{ "wallet_address": "0x...", "network": "ethereum", "token_symbol": "USDC" }`
        - `card`: `{ "number": "...", "exp_month": "12", "exp_year": "2028" }` (routed through PCI vault; all fields are strings)

        Call `GET /v1/instruments/methods?country=XX` for the complete per-country
        catalog with the exact credential schema required for each method.
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        label:
          type: string
          description: Merchant-visible label for this instrument (e.g. "Payroll - primary account").
          maxLength: 255
        credentials:
          type: object
          description: Method-specific credential fields. Tokenized on receipt.
          additionalProperties: true
        is_default:
          type: boolean
          description: Make this the default instrument for the beneficiary. The previous default (if any) is unflagged.
          default: false
        end_user_ip:
          type: string
          format: ip
          description: |
            The end-user's public IP address, forwarded by you from the session that
            submitted these credentials. Captured on the audit trail and used as a
            signal in Anton's risk scoring.

            Must be a valid IPv4 or IPv6 address. Requests with a malformed value
            are rejected with `422 validation_error`.
          example: "203.0.113.42"

    Instrument:
      type: object
      description: |
        A payment destination attached to a beneficiary. Credentials (account numbers,
        wallet addresses, card PANs) are tokenized in Basis Theory and never returned
        by the API. Only masked display fields and method metadata are exposed.
      required: [id, beneficiary_id, merchant_id, method, status, is_default, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
          example: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        label:
          type: string
          description: Merchant-visible label.
        display_last4:
          type: string
          description: Last 4 characters of the primary credential (account number / PAN / wallet address), for display.
        display_bank:
          type: string
          description: Bank name derived from routing details, for display.
        display_network:
          type: string
          description: Card network or chain, for display (e.g. `visa`, `ethereum`).
        masked_account:
          type: string
          description: Fully masked credential for list views.
          example: "****5432"
        status:
          type: string
          enum: [active, disabled]
        is_default:
          type: boolean
          description: Whether this is the beneficiary's default instrument for payouts.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
        beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        method: iban
        currency: EUR
        country: DE
        label: Primary EUR account
        display_last4: "5432"
        display_bank: Deutsche Bank
        masked_account: DE89****5432
        status: active
        is_default: true
        created_at: "2026-04-15T14:30:00Z"
        updated_at: "2026-04-15T14:30:00Z"

    PayoutStatus:
      type: string
      description: |
        Payout lifecycle state. See the
        [How Anton Evaluates Payouts](/how-anton-evaluates-payouts) guide for
        the full state machine and integration guidance.
      enum:
        - created
        - pending_screening
        - screening_failed
        - pending_approval
        - approved
        - processing
        - sent
        - completed
        - failed
        - returned
        - cancelled
        - manual_review
        - velocity_blocked
        - pending_engine_review

    PayoutMethod:
      type: string
      description: |
        How the payout will be delivered. Distinct from an `Instrument`'s `method`
        (which is the credential format) — this is the rail-family selection.
      enum:
        - bank_transfer
        - wire
        - sepa
        - swift
        - ach
        - faster_payment
        - mobile_money
        - wallet
        - crypto
        - layer2
        - exchange
        - stablecoin

    RailType:
      type: string
      enum: [fiat, crypto, stablecoin]

    Network:
      type: string
      description: Specific rail or chain. Populated by the rail adapter when the payout is submitted.
      enum:
        - swift
        - sepa
        - ach
        - fps
        - rtgs
        - ethereum
        - bitcoin
        - tron
        - solana
        - polygon
        - arbitrum
        - optimism
        - base
        - avalanche
        - bsc
        - lightning
        - stellar
        - ripple

    PayoutCreateRequest:
      type: object
      required:
        - beneficiary_id
        - instrument_id
        - source_amount
        - dest_amount
        - dest_currency
        - method
        - purpose
        - reference
      properties:
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
          description: Must belong to the beneficiary named above and be in `active` status.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Amount debited from your merchant balance (before fees).
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
        dest_amount:
          $ref: '#/components/schemas/Money'
          description: Amount the beneficiary receives.
        dest_currency:
          $ref: '#/components/schemas/CurrencyCode'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        rail_type:
          $ref: '#/components/schemas/RailType'
          description: Hint for rail routing. Anton may override based on corridor availability.
        network:
          $ref: '#/components/schemas/Network'
          description: |
            Optional rail network hint (e.g. `swift`, `sepa`, `ethereum`). If
            omitted Anton derives the network from the instrument and corridor
            pricing. Populated on the response regardless.
        fixed_side:
          type: string
          enum: [fixed_source, fixed_dest]
          default: fixed_dest
          description: Which amount is authoritative — Anton recomputes the other using current corridor pricing.
        fee_bearer:
          type: string
          enum: [merchant, beneficiary]
          default: merchant
          description: Who absorbs the fee. `beneficiary` reduces the amount credited to them by the fee.
        purpose:
          type: string
          maxLength: 255
          description: |
            Payment purpose code. Used for compliance reporting and corridor-specific
            rail requirements. Examples — `contractor_payment`, `supplier_payment`,
            `salary`, `refund`.
          example: contractor_payment
        reference:
          type: string
          maxLength: 100
          description: Your own reference. Surfaces to the beneficiary where the rail supports it.
          example: INV-1042
        metadata:
          type: object
          additionalProperties:
            type: string
        end_user_ip:
          type: string
          description: IP of the merchant's end-user who initiated the payout. Used for risk signals.
        quote_id:
          type: string
          pattern: '^pq_[a-zA-Z0-9]+$'
          description: |
            Optional bindable pricing quote id returned by `POST /v1/pricing/quote`.
            When present, the payout fee is locked to the quoted value. The quote
            must be unexpired, unbound, and match the payout's currencies + amount,
            otherwise the create returns `422 quote_expired` / `422 quote_already_used`
            / `422 quote_mismatch`.

    Payout:
      type: object
      description: |
        A single payment from your merchant balance to a beneficiary's instrument.
        Moves through a 13-state machine — see the
        [How Anton Evaluates Payouts](/how-anton-evaluates-payouts) guide.

        Rail-specific fields (`rail_provider`, `rail_reference`, `network`,
        `wallet_address`, `tx_hash`, etc.) populate as the payout moves through
        `approved -> processing -> sent -> completed`.
      required:
        - id
        - merchant_id
        - beneficiary_id
        - instrument_id
        - status
        - method
        - source_amount
        - source_currency
        - dest_amount
        - dest_currency
        - rail_type
        - purpose
        - reference
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
          example: pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
        batch_id:
          type: [string, "null"]
          pattern: '^bat_[a-zA-Z0-9]+$'
          description: Set when the payout was created as part of a batch upload.
        status:
          $ref: '#/components/schemas/PayoutStatus'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        source_amount:
          $ref: '#/components/schemas/Money'
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
        dest_amount:
          $ref: '#/components/schemas/Money'
        dest_currency:
          $ref: '#/components/schemas/CurrencyCode'
        exchange_rate:
          $ref: '#/components/schemas/Money'
          description: Source-to-dest rate. Present on cross-currency payouts.
        fee:
          $ref: '#/components/schemas/Money'
        fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        fee_bearer:
          type: string
          enum: [merchant, beneficiary]
        fixed_side:
          type: string
          enum: [fixed_source, fixed_dest]
        total_debited:
          $ref: '#/components/schemas/Money'
          description: Total drawn from your balance — `source_amount + fee + buffer` during processing. Buffer releases on finalization.
        total_debited_currency:
          $ref: '#/components/schemas/CurrencyCode'
        fee_finalized:
          type: boolean
          description: Whether `fee` reflects the final rate from the rail.
        buffer_amount:
          $ref: '#/components/schemas/Money'
          description: Cross-currency rate buffer held during processing, released on settlement.
        buffer_currency:
          $ref: '#/components/schemas/CurrencyCode'
        pricing_plan_id:
          type: string
          description: Which pricing plan was used for the quote.
        rail_type:
          $ref: '#/components/schemas/RailType'
        rail_provider:
          type: string
          description: External rail name. Populated at rail-submission time.
          example: openpayd
        rail_reference:
          type: string
          description: External provider reference. Useful for support tickets.
        network:
          $ref: '#/components/schemas/Network'
        wallet_address:
          type: string
          description: Destination wallet address. Present for crypto/stablecoin payouts.
        token_contract:
          type: string
          description: ERC-20 / TRC-20 contract address. Present for stablecoin payouts.
        token_symbol:
          type: string
          example: USDC
        tx_hash:
          type: string
          description: On-chain transaction hash. Present once `sent` for crypto/stablecoin payouts.
        block_confirmations:
          type: integer
          description: Number of confirmations observed so far.
        required_confirms:
          type: integer
          description: Confirmations required before the payout reaches `completed`.
        network_fee:
          $ref: '#/components/schemas/Money'
          description: Gas / network fee. Deducted from the settlement, not from your balance.
        network_fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        cancelled_reason:
          type: string
          description: Populated on `cancelled`, `failed`, `velocity_blocked`, `screening_failed`.
        engine_unavailable_at:
          $ref: '#/components/schemas/Timestamp'
          description: Present if the payout entered `pending_engine_review` because the Anton Engine was unreachable.
        purpose:
          type: string
        reference:
          type: string
        metadata:
