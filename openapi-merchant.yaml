    get:
      tags: [FX]
      summary: List indicative FX rates
      operationId: listIndicativeFXRates
      description: |
        Indicative, non-binding rates between two currencies, as a list of `fx_quote` objects with `locked: false`. Today the list holds exactly one quote, for the requested pair, and `has_more` is always `false`. Nothing is stored. Fix at most one side; with none, the price is for one unit of the destination currency.
