        - buy_currency
        - sell_amount
        - buy_amount
        - customer_rate
        - status
        - quote_id
      properties:
        id:
          type: string
          pattern: '^fxx_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          description: |
            Reserved. Not present on current responses — clients must not rely
            on this field being set.
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        mid_market_rate:
          $ref: '#/components/schemas/Money'
        customer_rate:
          $ref: '#/components/schemas/Money'
        provider:
          type: string
        provider_ref:
          type: string
        quote_id:
          type: string
          pattern: '^fxq_[a-zA-Z0-9]+$'
        payout_id:
