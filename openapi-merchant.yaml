  /v1/instruments/methods:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    get:
      tags: [Instruments]
      summary: List payment methods per country
      operationId: listInstrumentMethods
      description: List the payment methods available in each country, one entry per country and method, with the credential fields to collect. Use it to build an instrument-creation form that asks for the right fields for the selected country and method. `country` narrows the list. A value that is not an alpha-2 code Anton delivers to is `400 invalid_request`. All entries come back on one page.
      parameters:
        - name: country
          in: query
          description: Only methods available in this country.
          required: false
          schema:
            $ref: '#/components/schemas/CountryCode'
      responses:
        '200':
          description: Per-country payment methods.
          content:
            application/json:
              example: {"object":"list","data":[{"object":"instrument_method","livemode":false,"country":"DE","country_name":"Germany","method":"iban","label":"Bank Transfer (IBAN)","category":"bank_account","default_currency":"EUR","fields":[{"key":"account_holder_name","label":"Account Holder Name","type":"string","required":true},{"key":"iban","label":"IBAN","type":"string","required":true,"pattern":"(?i)^[A-Z]{2}\\d{2}[A-Z0-9]{11,30}$","hint":"2-letter country + 2 check digits + 11-30 alphanumeric","example":"DE89370400440532013000"},{"key":"bic","label":"BIC / SWIFT Code","type":"string","required":false,"pattern":"(?i)^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$","hint":"8 or 11 character BIC/SWIFT code","example":"COBADEFFXXX"},{"key":"bank_name","label":"Bank Name","type":"string","required":false},{"key":"bank_address","label":"Bank Address","type":"string","required":false},{"key":"bank_country","label":"Bank Country","type":"string","required":false,"hint":"ISO 3166-1 alpha-2 country code"}]},{"object":"instrument_method","livemode":false,"country":"DE","country_name":"Germany","method":"card","label":"Debit/Credit Card","category":"card","default_currency":"EUR","fields":[{"key":"number","label":"Card Number","type":"string","required":true,"hint":"13-19 digit card number"},{"key":"exp_month","label":"Expiry Month","type":"string","required":true,"pattern":"^(0[1-9]|1[0-2])$","hint":"Two-digit month (01-12)","example":"09"},{"key":"exp_year","label":"Expiry Year","type":"string","required":true,"pattern":"^\\d{4}$","hint":"Four-digit year","example":"2028"},{"key":"brand","label":"Card Brand","type":"string","required":false,"hint":"e.g., visa, mastercard"}]},{"object":"instrument_method","livemode":false,"country":"DE","country_name":"Germany","method":"crypto","label":"Cryptocurrency Wallet","category":"crypto","default_currency":"USDC","fields":[{"key":"wallet_address","label":"Wallet Address","type":"string","required":true,"hint":"Blockchain wallet address"},{"key":"network","label":"Network","type":"enum","required":true,"hint":"Blockchain network","example":"ethereum","options":["ethereum","bitcoin","tron","solana","polygon","arbitrum","optimism","base","avalanche","bsc","ripple","stellar","litecoin"]},{"key":"token_symbol","label":"Token Symbol","type":"string","required":false,"hint":"Token symbol if not native currency (e.g., USDC, USDT)","example":"USDC"}]}],"has_more":false,"next_cursor":null}
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstrumentMethod'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/instruments/{id}:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
      - name: id
        in: path
        required: true
        description: Instrument ID (prefixed `ins_`).
        schema:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
    get:
      tags: [Instruments]
      summary: Retrieve an instrument
      operationId: getInstrument
      description: Get one instrument by ID. Returns `404` if it does not exist or belongs to a different merchant.
      responses:
        '200':
          description: Instrument.
          content:
            application/json:
