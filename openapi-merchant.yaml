            application/json:
              example: {"id":"ben_dbvqrpqukoh470i0a2j0","object":"beneficiary","livemode":false,"status":"active","type":"individual","display_name":"Jane A. Smith","country":"GB","external_ref":null,"risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{},"created_at":"2026-11-20T02:18:15.220Z","updated_at":"2026-11-20T02:18:15.222Z"}
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
