  /v1/sandbox/deposits:
    parameters:
      - $ref: '#/components/parameters/AntonVersion'
    post:
      tags: [Sandbox]
      summary: Fund a sandbox balance
      operationId: createSandboxDeposit
      description: |-
        **Sandbox only.** Credit your sandbox balance in a currency so you can run the payout flow end to end from the API, with no dashboard step and no real money. The credit is additive, so repeated calls stack. If you hold no account in the currency yet, Anton creates one holding the deposit.

        The endpoint exists only in the sandbox (`https://api.antonpayments.dev`). In production it answers `404`. Requires an `Idempotency-Key`. Rate limited per merchant.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, amount]
              properties:
                currency:
                  $ref: '#/components/schemas/CurrencyCode'
                amount:
                  $ref: '#/components/schemas/Money'
                  description: Amount to credit. Must be positive, at the currency's precision.
            example:
              {
                "currency": "USD",
                "amount": "1000.00"
              }
      responses:
        '201':
          description: The balance was credited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxDeposit'
              examples:
                response:
                  summary: Response
                  value:
                    {
                      "id": "sdp_dbvm07aukoh6sl1ll1b0",
                      "object": "sandbox_deposit",
                      "livemode": false,
                      "currency": "USD",
                      "amount": "1000.00",
                      "available": "1000.00",
                      "created_at": "2026-11-19T20:46:21.205Z",
                      "updated_at": "2026-11-19T20:46:21.205Z"
                    }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not the sandbox. The endpoint does not exist in production.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: "The amount has too many decimal places for the currency (`amount_precision_invalid`) or is not positive, or the currency has no sandbox account (`unsupported_sandbox_currency`). Also `idempotency_key_reused`: the same `Idempotency-Key` was sent with a different request body."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                error:
                  summary: Example
                  value:
                    {
                      "error": {
                        "type": "invalid_request_error",
                        "code": "amount_precision_invalid",
                        "message": "amount has more decimal places than USD allows",
                        "param": "amount",
                        "doc_url": "https://docs.antonpayments.com/api-reference/errors#amount_precision_invalid",
                        "request_id": "req_01JD3XB7Q2"
                      }
                    }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

