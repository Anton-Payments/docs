  /oauth/token:
    post:
      tags: [Authentication]
      summary: Mint a DPoP-bound access token
      operationId: createAccessToken
      description: |-
        Exchange `(client_id, client_secret)` plus a DPoP proof for an OAuth 2.0 access token bound to your registered DPoP keypair. RFC 6749 §4.4 (client_credentials) + RFC 9449 §5.

        Send credentials with HTTP Basic auth (`Authorization: Basic <base64(client_id:client_secret)>`). The body is also accepted. The `DPoP` header is required and MUST carry a proof JWT signed with your private DPoP key, with `htm=POST`, `htu=https://api.../oauth/token`, a fresh `iat` and `jti`, and NO `ath` claim (the access token does not exist yet).

        A token lasts **1 hour** in production and **8 hours** in sandbox. There are no refresh tokens: call `POST /oauth/token` again for a fresh token.
      security: []
      parameters:
        - in: header
          name: DPoP
          required: true
          schema: { type: string }
          description: DPoP proof JWT for this token request.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            example: {"grant_type":"client_credentials"}
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id:
                  type: string
                  description: Optional when supplied via Basic auth header.
                client_secret:
                  type: string
                  description: Optional when supplied via Basic auth header.
      responses:
        '200':
          description: Access token minted.
          headers:
            Cache-Control: { schema: { type: string }, description: '`no-store` per RFC 6749 §5.1.' }
          content:
            application/json:
              example: {"access_token":"example-access-token-not-a-real-token","token_type":"DPoP","expires_in":3600,"scope":"payouts intelligence"}
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token:
                    type: string
                    description: "Signed JWT to send as `Authorization: DPoP <token>`."
                  token_type:
                    type: string
                    enum: [DPoP]
                  expires_in:
                    type: integer
                    description: Token lifetime in seconds.
                  scope:
                    type: string
                    description: Space-delimited granted scopes (RFC 6749 §3.3). They echo your credential's grants and match the values in the access token's `scope` claim, for example `payouts intelligence`.
        '400':
          description: Invalid request, unsupported_grant_type, or invalid DPoP proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: "`invalid_client`: the `client_id` is unknown or the secret is wrong. The response carries the `WWW-Authenticate` header (RFC 6749 section 5.2), and the body stays in the RFC 6749 format."
          headers:
            WWW-Authenticate:
              description: "`Basic realm=\"anton\"`. The token endpoint authenticates clients with their id and secret."
              schema:
                type: string
                example: 'Basic realm="anton"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Test client used in production.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: "Too many token requests from your IP address. The rate limiter answers before the token endpoint runs, so this body is Anton's standard error envelope (`rate_limit_error`, `rate_limit_exceeded`), not the flat OAuth error. Wait for `Retry-After` seconds, then request the token again."
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                rate_limit_exceeded:
                  value:
                    error:
                      type: rate_limit_error
                      code: rate_limit_exceeded
                      message: rate limit exceeded, retry after 60 seconds
                      doc_url: https://docs.antonpayments.com/api-reference/errors#rate_limit_exceeded
                      request_id: req_01JD3XB7Q2
        '500':
          description: "`server_error`: the client could not be authenticated or the token could not be signed, on our side. The body is the flat OAuth error with a generic `error_description` (`internal error` or `could not mint token`). Safe to retry."
          headers:
            Cache-Control: { schema: { type: string }, description: '`no-store` per RFC 6749 §5.1.' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: {"error":"server_error","error_description":"internal error"}

  /.well-known/jwks.json:
    get:
      tags: [Authentication]
      summary: Public OAuth signing key set
      operationId: getJwks
      description: Get the public half of Anton's OAuth signing key as a JSON Web Key Set. During a 24h rotation overlap it holds both keys. SDKs and external verifiers fetch it to verify access tokens locally without a DB hit. The response is cached for 5 minutes.
      security: []
      responses:
        '200':
          description: JWKS document.
          headers:
            Cache-Control: { schema: { type: string }, description: '`public, max-age=300`.' }
          content:
            application/json:
              example: {"keys":[{"kty":"EC","crv":"P-256","kid":"example-signing-key-1","use":"sig","alg":"ES256","x":"f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU","y":"x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"}]}
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/JSONWebKey' }




