        - name: created_after
          in: query
          required: false
          description: Only objects created at or after this timestamp (inclusive), such as `2026-11-01T00:00:00.000Z`. Use RFC 3339 UTC with millisecond precision and a Z suffix. Anything else returns `400 invalid_request` with `param` set.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Only objects created before this timestamp (exclusive). Use RFC 3339 UTC with millisecond precision and a Z suffix, such as `2026-11-01T00:00:00.000Z`. Anything else returns `400 invalid_request` with `param` set.
