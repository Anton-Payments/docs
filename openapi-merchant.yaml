                        items:
                          $ref: '#/components/schemas/BatchWarning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`batch_not_found` — the batch does not exist, or belongs to a different merchant.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/batches/{id}/results:
    parameters:
      - name: id
        in: path
