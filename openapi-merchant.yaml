        message:
          type: string
          description: Human-readable description for a developer. Never includes personal data or internal detail; a 5xx message is always generic.
          example: CAD amounts allow 2 decimal places; got 3.
        param:
          type: string
          description: The request field or query parameter at fault, when one is. With several failures, see `details`.
          example: amount
        doc_url:
          type: string
          format: uri
          description: Where this code is documented.
          example: https://docs.antonpayments.com/api-reference/errors#amount_precision_invalid
        request_id:
          type: string
          description: The `req_` ID of the request that failed; the same value as the `Request-Id` header.
          example: req_01JD3XB7Q2
        details:
          type: array
          description: Every field failure at once, so a form can be fixed in one pass.
          items:
            type: object
            required: [param, code, message]
            properties:
              param:
                type: string
                description: Dotted JSON path to the offending field.
                example: amount
              code:
                type: string
                example: amount_precision_invalid
              message:
                type: string
                example: CAD amounts allow 2 decimal places; got 3.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
      example:
        error:
          type: invalid_request_error
          code: insufficient_balance
          message: insufficient funds for this payout
          doc_url: https://docs.antonpayments.com/api-reference/errors#insufficient_balance
          request_id: req_01JD3XB7Q2

    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ErrorObject'
            - type: object
              required: [details]
      example:
        error:
          type: invalid_request_error
          code: validation_error
          message: request failed validation
          doc_url: https://docs.antonpayments.com/api-reference/errors#validation_error
          request_id: req_01JD3XB7Q2
          details:
            - param: individual.first_name
              code: validation_error
              message: is required
            - param: country
              code: invalid_country_code
              message: must be a valid ISO-3166 alpha-2 country code

    CursorList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items: {}
          description: Results for this page. The element schema varies by endpoint.
        has_more:
          type: boolean
          description: Whether more results exist beyond this page.
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; pass it back as `cursor`. `null` on the last page.

    Money:
      type: string
      description: Decimal amount as a string, never a float. Up to 12 whole digits.
      pattern: '^-?\d{1,12}(\.\d+)?$'
      example: "1234.56"

    CurrencyCode:
      type: string
      description: Uppercase currency or asset code, ISO 4217 for fiat (`USD`) and the published asset code for stablecoins and crypto (`USDC`). `GET /v1/currencies` lists them.
      pattern: '^[A-Z][A-Z0-9]{2,9}$'
      example: USD

    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      pattern: '^[A-Z]{2}$'
      example: US

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 / ISO 8601 timestamp in UTC.
      example: "2026-04-15T14:30:00Z"

    # ---------------------------------------------------------------------
    # Resource schemas — scaffolded, filled in per-endpoint.
    # TODO: populate full property lists as each endpoint group is written.
    # ---------------------------------------------------------------------

    Address:
      type: object
      required: [street_line_1, city, postal_code, country]
      properties:
        street_line_1:
          type: string
          example: 10 Example Street
        street_line_2:
          type: string
          example: Apt 4B
        city:
          type: string
          example: London
        state:
          type: string
          description: State, province or region. Required in some countries (for example US, CA, AU).
          example: Greater London
        postal_code:
          type: string
          example: SW1A 1AA
        country:
          $ref: '#/components/schemas/CountryCode'

    IndividualDetails:
      type: object
      required: [first_name, last_name, email, phone, birth_date, nationality, address]
      description: PII for an `individual` beneficiary. Tokenized on creation.
      properties:
        first_name:
          type: string
          example: Jane
        middle_name:
          type: string
          example: R
        last_name:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: jane@example.com
        phone:
          type: string
          description: E.164-formatted phone number.
          example: "+442079460000"
        birth_date:
          type: string
          description: YYYY-MM-DD.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "1988-05-12"
        nationality:
          $ref: '#/components/schemas/CountryCode'
        tax_id:
          type: string
          description: Tax identification number (for example US SSN/ITIN, UK NINO, or a foreign equivalent). Tokenized in the PII vault on creation and never stored in plaintext on the beneficiary record. Optional.
          example: "123-45-6789"
        address:
          $ref: '#/components/schemas/Address'

    BusinessDetails:
      type: object
      required: [legal_name, registration_number, email, phone, address]
      description: PII for a `business` beneficiary. Tokenized on creation.
      properties:
        legal_name:
          type: string
          example: Example GmbH
        trading_name:
          type: string
          description: Name the business trades as, if different from its legal name.
          example: Example
        registration_number:
          type: string
          example: HRB12345
        tax_id:
          type: string
          example: DE123456789
        entity_type:
          type: string
          description: Legal entity form.
          enum: [llc, corporation, partnership, sole_proprietorship, trust, other]
        incorporation_country:
          $ref: '#/components/schemas/CountryCode'
        incorporation_date:
          type: string
          description: YYYY-MM-DD.
          pattern: '^\d{4}-\d{2}-\d{2}$'
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164-formatted phone number.
          example: "+493012345678"
        website:
          type: string
          format: uri
          example: https://example.de
        address:
          $ref: '#/components/schemas/Address'

    Metadata:
      type: object
      description: |-
        Your own key/value pairs, stored and returned as-is. At most 50 keys; keys up to 40 characters and values up to 500, all strings. On a beneficiary the key `block_reason` is reserved and is refused with `422`. Anton never reads it, never logs or audits it, and never sends it to screening or risk checks, so it is not searchable. Never put personal data in it.

        Do not store personal information, account numbers or credentials in metadata. Use the resource's own fields, which are tokenized.
      maxProperties: 50
      propertyNames:
        minLength: 1
        maxLength: 40
      additionalProperties:
        type: string
        maxLength: 500
      example:
        department: engineering
        cost_center: "4421"

    EndUserRequest:
      type: object
      description: The optional body of a state change or delete.
      additionalProperties: false
      properties:
        end_user_ip:
          type: string
          description: IP address of your end user who started this action, IPv4 or IPv6. Used for risk signals. Optional but recommended.
          example: 203.0.113.42

    BeneficiaryCreateRequest:
      type: object
      required: [type, country]
      description: Create a beneficiary. Supply exactly one of `individual` or `business`, matching the declared `type`.
      properties:
        type:
          type: string
          enum: [individual, business]
          description: Whether the payee is a person or a business.
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: string
          description: Your own reference for this beneficiary. Stored as-is, not validated.
          maxLength: 255
          example: contractor-1042
        metadata:
          $ref: '#/components/schemas/Metadata'
        individual:
          $ref: '#/components/schemas/IndividualDetails'
        business:
          $ref: '#/components/schemas/BusinessDetails'
        end_user_ip:
          type: string
          description: IP address of your end user who started this action, IPv4 or IPv6. Used for risk signals. Optional but recommended.
          example: 203.0.113.42

    Beneficiary:
      type: object
      description: |
        A person or business you pay. Personal details are tokenized in a secure vault on
        creation and never appear here; `GET /v1/beneficiaries/{id}/pii` reads them back
        for signed-in admin users.
      required: [id, object, livemode, status, type, display_name, country, external_ref, risk_score, risk_tier, risk_signals, created_via, source_batch_id, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
          example: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        object:
          type: string
          enum: [beneficiary]
        livemode:
          type: boolean
          description: "`true` in production, `false` in sandbox."
        status:
          type: string
          enum: [active, archived, blocked]
          description: |-
            - `active`: usable for payouts.
            - `archived`: disabled by you and not usable. You can restore it.
            - `blocked`: cannot be used for payouts and cannot be restored through the API.

            New values may be added.
        type:
          type: string
          enum: [individual, business]
        display_name:
          type: string
          description: "Built from the tokenized details on creation: the joined name fields for individuals, the legal name for businesses."
          example: Jane Smith
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: [string, 'null']
          description: Your own reference, if you supplied one.
        risk_score:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
          description: Payee risk score, an integer from 0 to 1000. Higher is always worse. Reflects the payee and recent payouts to it, and is refreshed over time. `null` until the payee's first score, shortly after it is created.
        risk_tier:
          type: [string, 'null']
          enum: [critical, high, medium, low, null]
          description: "Risk band for `risk_score`: `>= 900` `critical`, `>= 700` `high`, `>= 400` `medium`, otherwise `low`. `null` while unscored."
        risk_signals:
          type: array
          maxItems: 2
          description: |-
            The main reasons behind `risk_score`, worst first, at most two. Empty while unscored or when nothing stands out. Show `label` as-is and branch on `code`, which is stable. New codes may be added.

            Codes: `regulatory_review`, `flagged_across_network`, `high_risk_country`, `possible_duplicate`, `identity_mismatch`, `masked_network`, `location_mismatch`, `details_changed`, `high_payout_volume`, `large_payouts`, `unusual_activity`, `unverified_account`, `crypto_focused`, `new_payee`, `incomplete_details`, `established`, `trusted_by_other_merchants`.
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
                example: new_payee
              label:
                type: string
                example: New payee
        created_via:
          type: string
          enum: [api, batch, portal, import]
          description: The surface that first created the beneficiary.
        source_batch_id:
          type: [string, 'null']
          description: The batch (`bat_…`) that created the beneficiary when `created_via` is `batch`, otherwise `null`.
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example: {"id":"ben_dbvlj5qukohfu54jblu0","object":"beneficiary","livemode":false,"status":"active","type":"individual","display_name":"Jane Smith","country":"GB","external_ref":"contractor-1042","risk_score":null,"risk_tier":null,"risk_signals":[],"created_via":"api","source_batch_id":null,"metadata":{"department":"engineering"},"created_at":"2026-11-19T20:18:31.415Z","updated_at":"2026-11-19T20:18:31.415Z"}

    BeneficiaryDeleted:
      type: object
      description: The result of deleting a beneficiary.
      required: [id, object, deleted]
      properties:
        id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        object:
          type: string
          enum: [beneficiary]
        deleted:
          type: boolean
          enum: [true]

    BeneficiaryPII:
      type: object
      description: |-
        A payee's personal details, read back from the secure vault. Exactly one of
        `individual` and `business` is set, matching `type`; the other is `null`. Optional
        fields are omitted when they were never set.
      required: [id, object, livemode, type, individual, business]
      properties:
        id:
          type: string
          description: The beneficiary's ID.
          pattern: '^ben_[a-zA-Z0-9]+$'
        object:
          type: string
          enum: [beneficiary_pii]
        livemode:
          type: boolean
        type:
          type: string
          enum: [individual, business]
        individual:
          oneOf:
            - $ref: '#/components/schemas/IndividualDetails'
            - type: 'null'
        business:
          oneOf:
            - $ref: '#/components/schemas/BusinessDetails'
            - type: 'null'

    Currency:
      type: object
      description: >-
        A currency or asset Anton can move. `precision` is the number of decimal places its amounts
        carry everywhere in the API: a request with more is refused with `422 amount_precision_invalid`,
        and responses always render exactly that many (`"10.50"`, never `"10.5"`). A list of these is
        returned by `GET /v1/currencies`.
      required: [id, object, livemode, code, name, symbol, type, precision, status, supported_rails]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [currency]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        status:
          type: string
          enum: [active, deprecated]
          description: Whether a corridor routes this currency end to end.
        code:
          type: string
          description: ISO 4217 code for fiat, the published asset code for crypto and stablecoins. Same as `id`.
        name:
          type: string
          description: Display name.
        symbol:
          type: string
          description: Display symbol.
        type:
          type: string
          enum: [fiat, stablecoin, crypto]
          description: Kind of currency.
        precision:
          type: integer
          description: >-
            Decimal places amounts in this currency carry: CAD 2, JPY 0, USDC 6.
        supported_rails:
          type: array
          items:
            type: string
          description: Rail families that carry the currency (`fiat`, `crypto`, `stablecoin`).

    Country:
      type: object
      description: >-
        A destination country Anton can hold payee instruments for. `payout_supported` says whether an
        active payout corridor reaches it.
      required: [id, object, livemode, iso2, iso3, name, supported_currencies, payout_supported]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [country]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        iso2:
          type: string
          description: ISO 3166-1 alpha-2 code. Same as `id`.
        iso3:
          type: string
          description: ISO 3166-1 alpha-3 code.
        name:
          type: string
          description: Country name.
        supported_currencies:
          type: array
          items:
            type: string
          description: Currencies paid out in the country.
        payout_supported:
          type: boolean
          description: True when at least one active payout corridor reaches the country.

    PaymentMethodDescriptor:
      type: object
      description: A payout method (`bank_transfer`, `card`, `crypto`, `stablecoin`, `interac`).
      required: [id, object, livemode, code, name, description, rail_type, supported_countries]
      properties:
        id:
          type: string
          description: Unique identifier.
        object:
          type: string
          enum: [payment_method]
          description: The type of the object.
        livemode:
          type: boolean
          description: True in production, false in the sandbox.
        code:
          type: string
          description: The method code. Same as `id`.
        name:
          type: string
          description: Display name.
        description:
          type: string
          description: What the method is.
        rail_type:
          type: string
          enum: [fiat, crypto, stablecoin]
          description: Rail family that carries the method.
        supported_countries:
          type: array
          items:
            type: string
          description: Destination countries the method reaches.

    BeneficiaryUpdateRequest:
      type: object
      description: |
        Mutable fields on a beneficiary. A field left out is left unchanged; `null` clears
        `external_ref` and `metadata`.
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 255
          description: Cannot be `null` or empty.
