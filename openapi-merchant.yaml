  /v1/pricing/quote:
    post:
      tags: [Pricing]
      summary: Quote a fee for a hypothetical payout
      operationId: createPricingQuote
      description: |
        Preview the fee that would apply for a given source/destination pair
        and amount. Useful for surfacing fees to your end user before they
        confirm a payout.

        **Bindable quotes (v1.0.0).** Every quote response includes a
        `quote_id` (prefix `pq_`) and an `expires_at` timestamp. You can
        bind the exact quoted fee to a subsequent payout by passing the
        `quote_id` on `POST /v1/payouts`. If the quote has expired, been
        already bound to another payout, or the payout's currencies/amount
        don't match the quote, the payout create call returns
        `422 quote_expired` / `422 quote_already_used` / `422 quote_mismatch`.
        Omit `quote_id` on the payout to let the platform re-price at
        submission time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_currency, dest_currency, amount]
              properties:
                source_currency:
                  $ref: '#/components/schemas/CurrencyCode'
                dest_currency:
                  $ref: '#/components/schemas/CurrencyCode'
                dest_country:
                  $ref: '#/components/schemas/CountryCode'
                method:
                  $ref: '#/components/schemas/PayoutMethod'
                amount:
                  $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: Fee quote.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [fee, fee_currency, fee_type, plan_id, quote_id, expires_at]
                    properties:
                      fee:
                        $ref: '#/components/schemas/Money'
                      fee_currency:
                        $ref: '#/components/schemas/CurrencyCode'
                      fee_type:
                        type: string
                        enum: [fixed, percentage, hybrid, tiered]
                      plan_id:
                        type: string
                        pattern: '^prc_[a-zA-Z0-9]+$'
                      quote_id:
                        type: string
                        pattern: '^pq_[a-zA-Z0-9]+$'
                        description: Bindable quote identifier. Pass on `POST /v1/payouts` to lock this fee.
                      expires_at:
                        $ref: '#/components/schemas/Timestamp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/corridors:
    get:
      tags: [Corridors]
      summary: List active corridors
      operationId: listCorridors
      description: |
        Return every active payout corridor on your merchant account. A corridor
        is a (rail_type, currency, country, method, network) combination Anton
        can deliver payouts through.

        Use this to validate a (country, currency, method) combination before
        attempting `POST /v1/payouts`. Corridors not listed here will return
        `corridor_not_enabled`.
      parameters:
        - name: rail_type
          in: query
          description: |
            Filter to one rail family. An unrecognised value returns
            `400` — it is validated against the enum, not silently ignored.
          schema:
            $ref: '#/components/schemas/RailType'
        - name: currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: country
          in: query
          schema:
            $ref: '#/components/schemas/CountryCode'
      responses:
        '200':
          description: Active corridors.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Corridor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhooks:
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      operationId: createWebhookSubscription
      description: |
        Register an HTTPS endpoint to receive event notifications. Anton POSTs
        signed JSON deliveries to the URL you supply every time an event from
        the `events` list fires on your merchant account.

        **Requirements:**
        - The URL must use `https://` (enforced outside development environments).
        - The URL must be publicly reachable — private, loopback, and metadata
          addresses are rejected.

        The response includes a `secret` — this is shown **once at creation**.
        Store it in your secrets manager immediately; Anton cannot recover it
        later. You can rotate the secret any time via
        `POST /v1/webhooks/{id}/secret/rotate`.

        See [Webhook Events](/api-reference/webhook-events) for the event catalog
        and [Webhook Signing](/api-reference/webhook-signing) for verification.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
      responses:
        '201':
          description: Subscription created. Includes the one-time signing secret.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: Signing secret (`whsec_` + 64 hex). Shown once — store it now.
                        example: whsec_0a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef
        '400':
          description: |
            - `webhook_url_required` — `url` missing.
            - `webhook_url_invalid` — `url` is malformed or hostless.
            - `webhook_url_not_https` — HTTP scheme used outside development.
            - `webhook_url_private_address` — URL resolves to a private / loopback / metadata address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      operationId: listWebhookSubscriptions
      description: Return all webhook subscriptions on your merchant account.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: List of subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: Retrieve a webhook subscription
      operationId: getWebhookSubscription
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      summary: Update a webhook subscription
      operationId: updateWebhookSubscription
      description: |
        Partial update: any of `url`, `events`, `metadata`. Absent fields are
        left unchanged; a body carrying none of the three is rejected with
        `400 missing_required_field`.

        - `url` — validated with the same HTTPS/SSRF rules as creation.
        - `events` — must be non-empty when present; every entry must be a
          known event type or the `"*"` wildcard (unknown types fail with
          `422`, keyed by position).
        - `metadata` — replaces the whole map (`{}` clears it); no per-key
          merge.

        `status` and the signing secret are not patchable — unknown fields
        are rejected with `400 unknown_field`. Use
        `POST /v1/webhooks/{id}/deactivate` and
        `POST /v1/webhooks/{id}/secret/rotate` instead.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
      responses:
        '200':
          description: The updated subscription (same shape as GET; the secret is never included).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscription'
        '400':
          description: >-
            No patchable field present (`missing_required_field`), an unknown
            field such as `status` or `secret` (`unknown_field`), or an
            invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      operationId: deleteWebhookSubscription
      description: |
        Permanently delete a subscription. Event history and past delivery
        records are retained for audit, but no new deliveries will be attempted.
        Prefer `POST /v1/webhooks/{id}/deactivate` if you may re-enable later.
      responses:
        '204':
          description: Subscription deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/{id}/secret:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: Retrieve the current signing secret
      operationId: getWebhookSecret
      description: |
        Return the current HMAC signing secret for this subscription. Use this
        if you lost the secret after creation — the endpoint is audited and
        rate-limited for safety.
      responses:
        '200':
          description: Current secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret]
                    properties:
                      secret:
                        type: string
                        description: '`whsec_` + 64 hex.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/{id}/secret/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    post:
      tags: [Webhooks]
      summary: Rotate the signing secret
      operationId: rotateWebhookSecret
      description: |
        Generate a fresh signing secret. By default rotation opens a 24-hour
        dual-signature grace window: the new secret signs immediately, and the
        outgoing secret keeps signing as a second `v1=` entry in
        `X-Webhook-Signature` until `previous_secret_expires_at`. A verifier
        that matches ANY entry keeps accepting deliveries, so you can deploy
        the new secret without dropping events.

        Pass `?immediate=true` to skip the window — the old secret stops
        verifying at once. Use this when rotating a leaked secret, accepting
        that deliveries to a not-yet-updated endpoint will fail verification.

        The new secret is shown **once** in the response. Store it now.
      parameters:
        - name: immediate
        - $ref: '#/components/parameters/IdempotencyKey'
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When true, skip the dual-signature grace window: the previous
            secret is dropped at once and `previous_secret_expires_at` is
            null.
      responses:
        '200':
          description: Rotated. Response carries the new secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret, previous_secret_expires_at]
                    properties:
                      secret:
                        type: string
                      previous_secret_expires_at:
                        type: [string, 'null']
                        format: date-time
                        description: >-
                          When the dual-signature grace window closes — the
                          moment the previous secret stops signing deliveries.
                          Null when the rotation was immediate (no window). The
                          previous secret value itself is never returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    post:
      tags: [Webhooks]
      summary: Send a test delivery
      operationId: testWebhookSubscription
      description: |
        Dispatch a synthetic `test` event to this subscription right now. Useful
        for verifying signature verification, network reachability, and logging
        pipelines without waiting for a real event.

        Rate-limited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Test event queued for delivery.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
                        pattern: '^evt_[a-zA-Z0-9]+$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhooks/{id}/deactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
    post:
      tags: [Webhooks]
      summary: Deactivate a webhook subscription
      operationId: deactivateWebhookSubscription
      description: |
        Stop delivering events to this subscription without deleting it. The
        subscription moves to `inactive` and can be reactivated by updating its
        status (contact support or wait for a re-activation endpoint).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Subscription deactivated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/events:
    get:
      tags: [Webhooks]
      summary: List webhook events
      operationId: listWebhookEvents
      description: |
        Return the history of webhook events generated on your merchant account.
        Events persist independently of delivery — you can inspect and replay
        them via `/deliveries` below.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/WebhookEventType'
        - name: created_after
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Paginated list of events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/webhooks/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: Retrieve a webhook event
      operationId: getWebhookEvent
      responses:
        '200':
          description: Event with full payload.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/events/{id}/deliveries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
    get:
      tags: [Webhooks]
      summary: List deliveries for an event
      operationId: listWebhookDeliveries
      description: |
        Return every attempt Anton made to deliver this event to every
        subscribed endpoint. Each attempt records the request headers, response
        status, body, duration, and retry schedule — useful for debugging
        failing integrations.
      responses:
        '200':
          description: Delivery history.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'





  /v1/fx/quote:
    post:
      tags: [FX]
      summary: Create a lockable FX quote
      operationId: createFXQuote
      description: |
        Request a lockable exchange rate between two currencies. Quotes have a
        short expiry window; use the returned `id` on
        `POST /v1/fx/exchange` to lock the rate before expiry.

        You must supply **at least one** of `sell_amount` or `buy_amount` —
        omitting both returns `400 missing_required_field`. (The two are
        individually optional but not both.)

        Rate-limited to 30 per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FXQuoteCreateRequest'
      responses:
        '201':
          description: Quote created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FXQuote'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >-
            `currency_not_supported`, `no_funding_account` (no balance account
            for the sell currency on a cross-currency quote), or another
            pricing error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: '`fx_rates_unavailable` — upstream rate provider did not respond.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: |
            `locked_rate_unavailable` — the request asked for a locked quote
            (the default) but the upstream provider could not issue a rate
            lock. Retry with backoff, or set `locked: false` for an
            indicative quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/fx/rate:
    get:
      tags: [FX]
      summary: Retrieve an indicative rate
      operationId: getIndicativeFXRate
      description: |
        Non-binding rate between two currencies. Cheaper than a lockable quote;
        use for display purposes. Rate-limited to 30 per minute per IP.
      parameters:
        - name: sell_currency
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: buy_currency
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: sell_amount
          in: query
          description: Optional — amount to convert. When present, the response includes a `buy_amount`.
          schema:
            $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: Indicative rate.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sell_currency, buy_currency, mid_market_rate, customer_rate, fx_markup_bps]
                    properties:
                      sell_currency:
                        $ref: '#/components/schemas/CurrencyCode'
                      buy_currency:
                        $ref: '#/components/schemas/CurrencyCode'
                      mid_market_rate:
                        $ref: '#/components/schemas/Money'
                      customer_rate:
                        $ref: '#/components/schemas/Money'
                        description: Mid-market adjusted by your pricing plan's FX markup.
                      fx_markup_bps:
                        type: integer
                        description: Markup applied to mid-market, in basis points.
                      sell_amount:
                        $ref: '#/components/schemas/Money'
                      buy_amount:
                        $ref: '#/components/schemas/Money'
                      rate_timestamp:
                        $ref: '#/components/schemas/Timestamp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: '`fx_rates_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/fx/exchange:
    post:
      tags: [FX]
      summary: Execute an FX exchange
      operationId: executeFXExchange
      description: |
        Exchange a locked quote — debits the sell currency balance and credits
        the buy currency balance. The quote must still be within its validity
        window; expired quotes return `quote_expired`.

        Rate-limited to 10 per minute per IP. Requires `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
                  pattern: '^fxq_[a-zA-Z0-9]+$'
                  description: ID of a quote previously created via `POST /v1/fx/quote`.
      responses:
        '201':
          description: Exchange executed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FXExchange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`quote_not_found` — the quote does not exist or belongs to a different merchant.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: '`quote_expired` — the quote is past its expiry window.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            - `quote_not_locked` — quote must be lockable.
            - `insufficient_balance` — sell currency balance cannot cover the exchange.
            - `no_buy_account` — the merchant has no funding account in the buy currency. The buy-side account must be provisioned out-of-band (onboarding or support) before this currency can receive exchanges; there is no merchant-facing provisioning endpoint today.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: '`locked_rate_unavailable` — the locked rate can no longer be honored by the provider.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/fx/exchanges:
    get:
      tags: [FX]
      summary: List FX exchanges
      operationId: listFXExchanges
      description: Cursor-paginated history of executed FX exchanges for your merchant.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sell_currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: buy_currency
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: created_after
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: created_before
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Paginated list of exchanges.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FXExchange'
        '401':
          $ref: '#/components/responses/Unauthorized'













components:
  securitySchemes:
    oauthDPoP:
      type: oauth2
      description: |
        OAuth 2.0 client_credentials grant (RFC 6749 §4.4) bound to a DPoP keypair (RFC 9449).

        **Flow** (every authenticated `/v1` call requires both an access token AND a fresh per-request DPoP proof):

        1. Register a credential via the merchant portal. Anton issues a `client_id` (`ant_oc_<env>_<32hex>`) and a `client_secret` (`ant_ocs_<env>_<48hex>`, shown ONCE). The portal generates an ES256 or Ed25519 DPoP keypair in your browser; you store the private half.
        2. Mint an access token: `POST /oauth/token` with `Authorization: Basic <client_id:client_secret>` and `Content-Type: application/x-www-form-urlencoded`. Body: `grant_type=client_credentials`. A `DPoP` header carrying a proof signed for the token endpoint is required (no `ath` claim on this proof).
        3. Use the token: send `Authorization: DPoP <access_token>` plus a fresh `DPoP: <proof>` header on every `/v1` request. The proof JWT MUST carry `htm` (request method), `htu` (request URL, no query/fragment), `iat` (within ±60s), `jti` (unique within 5 min), and `ath` (SHA-256 of the access token, base64url).

        Tokens expire in **1 hour** in production / staging and **8 hours** in sandbox. There are no refresh tokens — call `/oauth/token` again with your secret. Anton's public signing key is published at `/.well-known/jwks.json`.

        OpenAPI 3.0 has no native DPoP scheme; this declaration plus `dpopHeader` together convey both the access-token Authorization and the per-request proof header.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            payouts: Money movement — payouts, batches, beneficiaries, instruments, balances, funding, FX.
            intelligence: Anton Intelligence — screening evaluations and evidence.
    dpopHeader:
      type: apiKey
      in: header
      name: DPoP
      description: |
        Per-request DPoP proof JWT (RFC 9449). MUST accompany the `Authorization: DPoP <access_token>` header on every protected operation. The proof is signed by the merchant's private DPoP key and carries `htm`, `htu`, `iat`, `jti`, and `ath` claims.

  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page. Maximum 100.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by a previous list response. Omit for the first page.
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Unique key identifying this operation. Sending the same key twice returns the original
        response instead of creating a duplicate. Keys are retained for 24 hours.
      required: true
      schema:
        type: string
        maxLength: 255
    IntelligenceEvaluationID:
      name: id
      in: path
      required: true
      description: Intelligence evaluation ID.
      schema:
        type: string
        pattern: '^eval_[a-zA-Z0-9]+$'
    VerificationSubjectID:
      name: id
      in: path
      required: true
      description: Verification subject ID.
      schema:
        type: string
        pattern: '^vsub_[a-zA-Z0-9]+$'
    VerificationID:
      name: id
      in: path
      required: true
      description: Verification attempt ID.
      schema:
        type: string
        pattern: '^vrf_[a-zA-Z0-9]+$'

  headers:
    X-Request-ID:
      description: Opaque request identifier. Include when contacting support.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Maximum requests permitted in the current window.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix timestamp when the current window resets.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying. Included on 429 responses.
      schema:
        type: integer
    X-Idempotent-Replayed:
      description: '`true` when the response is a replay of a previous request with the same `Idempotency-Key`.'
      schema:
        type: string
        enum: ["true"]

  responses:
    BadRequest:
      description: The request body could not be parsed or contains unknown fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid API key, or key used against the wrong environment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing_key:
              summary: Missing bearer token
              value:
                error:
                  code: unauthorized
                  message: missing or invalid credentials
            wrong_environment:
              summary: Test key used against production
              value:
                error:
                  code: key_environment_mismatch
                  message: this API key is not valid for this environment
    Forbidden:
      description: Authenticated, but not permitted for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CapabilityForbidden:
      description: |
        The account capability or credential scope required by this endpoint is missing.
        `capability_required` — the merchant account does not hold the required capability
        (e.g. an AI-compliance-only account calling a payout endpoint). `insufficient_scope` —
        the account holds it, but this credential was created without the matching scope.
        Effective access is always `scopes ∩ capabilities`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            capability_required:
              summary: Account lacks the capability
              value:
                error:
                  code: capability_required
                  message: this endpoint requires the "payouts" account capability
            insufficient_scope:
              summary: Credential lacks the scope
              value:
                error:
                  code: insufficient_scope
                  message: this endpoint requires a credential with the "payouts" scope
    NotFound:
      description: The resource does not exist, or belongs to a different merchant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    IdempotencyConflict:
      description: The same `Idempotency-Key` was previously used with a different request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: >-
        Rate limit exceeded. See `Retry-After`. The `X-RateLimit-*` headers are
        present on every API response, not only on 429s — they are documented
        here because this is where clients act on them.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rate_limit_exceeded:
              summary: Retry after the limiter resets
              value:
                error:
                  code: rate_limit_exceeded
                  message: rate limit exceeded, retry after 60 seconds
    InternalError:
      description: Something went wrong on our end.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    OAuthError:
      type: object
      description: |
        RFC 6749 §5.2 / RFC 9449 error envelope. Distinct from Anton's standard `ErrorEnvelope` — the OAuth endpoints (`/oauth/token`) return this flat shape so any OAuth-conformant SDK can branch on `error` without learning Anton-specific shapes.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_dpop_proof
            - invalid_token
            - server_error
        error_description: { type: string }

    JSONWebKey:
      type: object
      description: ES256 (P-256) public key in JWK form, as published by `/.well-known/jwks.json`.
      required: [kty, crv, x, y, alg, use, kid]
      properties:
        kty: { type: string, enum: [EC] }
        crv: { type: string, enum: [P-256] }
        x:   { type: string, description: Base64url-encoded x coordinate (32 bytes). }
        y:   { type: string, description: Base64url-encoded y coordinate (32 bytes). }
        alg: { type: string, enum: [ES256] }
        use: { type: string, enum: [sig] }
        kid: { type: string }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: Human-readable description of what went wrong.
            code:
              type: string
              description: Machine-readable error code. Branch on this, not on `message`.
              example: insufficient_balance
      example:
        error:
          message: insufficient funds for this payout
          code: insufficient_balance

    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: request failed validation
            code:
              type: string
              enum: [validation_error]
            details:
              type: array
              description: Field-level validation errors.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: Dotted JSON path to the offending field.
                    example: individual.date_of_birth
                  message:
                    type: string
                    example: must be in YYYY-MM-DD format
      example:
        error:
          message: request failed validation
          code: validation_error
          details:
            - field: individual.first_name
              message: is required
            - field: country
              message: must be a valid ISO-3166 alpha-2 country code

    CursorList:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: {}
          description: Array of results for this page. Element schema varies by endpoint.
        has_more:
          type: boolean
          description: Whether more results exist beyond this page.
        next_cursor:
          type: string
          description: Cursor for the next page. Present only when `has_more` is `true`.

    Money:
      type: string
      description: Decimal amount as a string, never a float. Up to 12 whole digits.
      pattern: '^-?\d{1,12}(\.\d+)?$'
      example: "1234.56"

    CurrencyCode:
      type: string
      description: ISO 4217 three-letter currency code.
      pattern: '^[A-Z]{3}$'
      example: USD

    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      pattern: '^[A-Z]{2}$'
      example: US

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 / ISO 8601 timestamp in UTC.
      example: "2026-04-15T14:30:00Z"

    # ---------------------------------------------------------------------
    # Resource schemas — scaffolded, filled in per-endpoint.
    # TODO: populate full property lists as each endpoint group is written.
    # ---------------------------------------------------------------------

    Address:
      type: object
      required: [street_line_1, city, postal_code, country]
      properties:
        street_line_1:
          type: string
          example: 10 Example Street
        street_line_2:
          type: string
          example: Apt 4B
        city:
          type: string
          example: London
        state:
          type: string
          description: State, province, or region. Required in some countries (e.g. US, CA, AU).
          example: Greater London
        postal_code:
          type: string
          example: SW1A 1AA
        country:
          $ref: '#/components/schemas/CountryCode'

    IndividualDetails:
      type: object
      required: [first_name, last_name, email, phone, date_of_birth, nationality, address]
      description: PII for an `individual` beneficiary. Tokenized on creation.
      properties:
        first_name:
          type: string
          example: Jane
        middle_name:
          type: string
          example: R
        last_name:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: jane@example.com
        phone:
          type: string
          description: E.164-formatted phone number.
          example: "+442079460000"
        date_of_birth:
          type: string
          description: YYYY-MM-DD.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "1988-05-12"
        nationality:
          $ref: '#/components/schemas/CountryCode'
        tax_id:
          type: string
          description: |
            Tax identification number (e.g. US SSN/ITIN, UK NINO, foreign-equivalent).
            Tokenized in the PII vault on creation — never stored in plaintext on
            the beneficiary record. Optional.
          example: "123-45-6789"
        address:
          $ref: '#/components/schemas/Address'

    BusinessDetails:
      type: object
      required: [legal_name, registration_number, email, phone, address]
      description: PII for a `business` beneficiary. Tokenized on creation.
      properties:
        legal_name:
          type: string
          example: Example GmbH
        trading_name:
          type: string
          description: Name the business trades as, if different from legal name.
          example: Example
        registration_number:
          type: string
          example: HRB12345
        tax_id:
          type: string
          example: DE123456789
        entity_type:
          type: string
          description: Legal entity form.
          enum: [llc, corporation, partnership, sole_proprietorship, trust, other]
        incorporation_country:
          $ref: '#/components/schemas/CountryCode'
        incorporation_date:
          type: string
          description: YYYY-MM-DD.
          pattern: '^\d{4}-\d{2}-\d{2}$'
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164-formatted phone number.
          example: "+493012345678"
        website:
          type: string
          format: uri
          example: https://example.de
        address:
          $ref: '#/components/schemas/Address'

    BeneficiaryCreateRequest:
      type: object
      required: [type, country]
      description: |
        Create a beneficiary. Supply exactly one of `individual` or `business` matching
        the declared `type`.
      properties:
        type:
          type: string
          enum: [individual, business]
          description: Whether this beneficiary is a person or a business.
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: string
          description: Your own reference for this beneficiary. Stored as-is, not validated.
          maxLength: 255
          example: contractor-1042
        metadata:
          type: object
          description: Arbitrary string map of your own labels. Stored as-is.
          additionalProperties:
            type: string
          example:
            department: engineering
            cost_center: "4421"
        individual:
          $ref: '#/components/schemas/IndividualDetails'
        business:
          $ref: '#/components/schemas/BusinessDetails'
        end_user_ip:
          type: string
          description: |
            IP address of the merchant's end-user who initiated this action. Used for
            risk signals. Accepts IPv4 or IPv6. Optional but recommended.
          example: 203.0.113.42

    Beneficiary:
      type: object
      description: |
        A person or business you pay. PII is tokenized in Basis Theory on creation —
        raw identifiers are never returned in this response. Use
        `GET /v1/beneficiaries/{id}/pii` to retrieve detokenized PII for a
        beneficiary you own.
      required: [id, merchant_id, type, status, display_name, country, risk_score, risk_tier, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
          example: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        type:
          type: string
          enum: [individual, business]
        status:
          type: string
          enum: [active, archived, blocked]
          description: |
            - `active` — usable for payouts.
            - `archived` — soft-disabled by the merchant; not usable. Can be restored.
            - `blocked` — blocked by compliance. Not usable and cannot be restored via the API.
        display_name:
          type: string
          description: |
            Derived from the tokenized PII on creation. For individuals, a concatenation
            of name fields; for businesses, the legal name.
          example: Jane Smith
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: [string, 'null']
          description: Your own reference, if you supplied one at creation.
        metadata:
          type: object
          additionalProperties:
            type: string
        risk_score:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
          description: |
            Anton Engine payee risk score, 0–1000 integer. Higher is ALWAYS
            worse. `null` until the engine has profiled this beneficiary
            (typically after its first payout). Derived from the payee
            profile at read time.
        risk_tier:
          type: [string, 'null']
          enum: [CRITICAL, HIGH, MEDIUM, LOW, null]
          description: >-
            Risk band for `risk_score` — `>= 900` CRITICAL, `>= 700` HIGH,
            `>= 400` MEDIUM, else LOW. `null` while unscored.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        type: individual
        status: active
        display_name: Jane Smith
        country: GB
        external_ref: contractor-1042
        risk_score: 120
        risk_tier: LOW
        metadata:
          department: engineering
        created_at: "2026-04-15T14:30:00Z"
        updated_at: "2026-04-15T14:30:00Z"

    BeneficiaryRescoreResult:
      type: object
      description: |
        Result of a manual Payee-pillar rescore. Scores are 0–1000 integers
        where higher is ALWAYS worse — the same orientation as `risk_score`
        on the beneficiary resource. The `previous_*` fields are absent when
        the engine had no prior evaluation on record.
      required: [pillar, resource_id, new_evaluation_id, new_risk_score, new_tier]
      properties:
        pillar:
          type: string
          example: payee
        resource_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        new_evaluation_id:
          type: string
        new_risk_score:
          type: integer
          minimum: 0
          maximum: 1000
          description: Fresh Payee-pillar risk score. Higher is ALWAYS worse.
        new_tier:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
        previous_evaluation_id:
          type: string
        previous_risk_score:
          type: integer
          minimum: 0
          maximum: 1000
        previous_tier:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]

    Currency:
      type: object
      required: [code, name, decimals, type, status]
      properties:
        code:
          $ref: '#/components/schemas/CurrencyCode'
        name:
          type: string
          example: US Dollar
        decimals:
          type: integer
          description: Number of decimal places the currency supports. USD=2, JPY=0, BTC=8.
          example: 2
        symbol:
          type: string
          example: "$"
        type:
          type: string
          enum: [fiat, crypto, stablecoin]
        status:
          type: string
          enum: [active, deprecated]
          description: |
            Lifecycle status. `active` currencies are usable in new payouts;
            `deprecated` are kept for historical reads but no new corridors
            route to them. The `/v1/currencies` catalog is pruned at call
            time to currencies with at least one active corridor (ANT-85).
        supported_rails:
          type: array
          description: |
            Rail families that can carry this currency. Subset of
            `[fiat, crypto, stablecoin]`. Surfaced by Wave 5d REF-B2.
          items:
            type: string
            enum: [fiat, crypto, stablecoin]

    Country:
      type: object
      required: [iso2, iso3, name, supported_currencies, payout_supported]
      properties:
        iso2:
          $ref: '#/components/schemas/CountryCode'
        iso3:
          type: [string, 'null']
          description: |
            ISO 3166-1 alpha-3 country code. Empty string for the ISO-assigned
            exception of Kosovo (XK), which has no alpha-3.
          pattern: '^[A-Z]{3}$|^$'
          example: USA
        name:
          type: string
          example: United States
        supported_currencies:
          type: array
          description: Currencies Anton can deliver in this country.
          items:
            $ref: '#/components/schemas/CurrencyCode'
        payout_supported:
          type: boolean
          description: |
            Whether Anton can route payouts to this country today. The
            `/v1/countries` endpoint returns the full 159-country superset
            including pre-routable countries; filter by `payout_supported`
            for the deliverable subset (Wave 5d REF-B1).

    PaymentMethodDescriptor:
      type: object
      required: [code, name, rail_type]
      description: A supported payment method, with the countries where it's available.
      properties:
        code:
          $ref: '#/components/schemas/PaymentMethodCode'
        name:
          type: string
          example: UK Bank Account
        description:
          type: string
          example: Sort code + account number. Routes via Faster Payments, BACS, CHAPS.
        rail_type:
          type: string
          enum: [fiat, crypto, stablecoin]
        supported_countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryCode'

    BeneficiaryUpdateRequest:
      type: object
      description: Mutable fields on a beneficiary. Fields not included are left unchanged.
      properties:
        display_name:
          type: string
          maxLength: 255
        country:
          $ref: '#/components/schemas/CountryCode'
        external_ref:
          type: [string, 'null']
          maxLength: 255
          description: Set to `null` to clear.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Replaces the existing metadata map in full.
        end_user_ip:
          type: string

    BeneficiaryPIIUpdateRequest:
      type: object
      description: |
        Replacement PII. Provide the detail block matching the beneficiary's type.
        The entire PII blob is replaced — partial updates are not supported.
      properties:
        individual:
          $ref: '#/components/schemas/IndividualDetails'
        business:
          $ref: '#/components/schemas/BusinessDetails'
        end_user_ip:
          type: string

    PaymentMethodCode:
      type: string
      description: |
        Credential format of a payment instrument — named by what data is stored,
        not by the rail that delivers the funds. One credential type can route to
        multiple rails (e.g. an IBAN can go via SEPA, SEPA Instant, TARGET2, SWIFT,
        or CHAPS — the rail is selected at payout time).

        Query `GET /v1/payment-methods` for the full country-specific catalog
        including per-method credential schemas.
      enum:
        - iban
        - uk_bank
        - us_bank
        - ca_bank
        - au_bank
        - nz_bank
        - jp_bank
        - in_bank
        - za_bank
        - ng_bank
        - ph_bank
        - cl_bank
        - co_bank
        - swift
        - clabe
        - cbu
        - cci
        - pix
        - upi
        - interac
        - paynow
        - fps_hk
        - promptpay
        - card
        - crypto
        - mobile_money

    InstrumentCreateRequest:
      type: object
      required: [method]
      description: |
        Create an instrument attached to a beneficiary.

        The `credentials` object shape varies by `method`. A few common shapes:

        - `iban`: `{ "iban": "GB82WEST12345698765432", "bic": "WESTGB22" }` (BIC optional)
        - `uk_bank`: `{ "account_number": "12345678", "sort_code": "123456" }`
        - `us_bank`: `{ "routing_number": "026073150", "account_number": "...", "account_type": "checking" }`
        - `crypto`: `{ "wallet_address": "0x...", "network": "ethereum", "token_symbol": "USDC" }`
        - `card`: `{ "pan": "...", "expiry_month": 12, "expiry_year": 2028 }` (routed through PCI vault)

        Call `GET /v1/payment-methods?country=XX` for the complete per-country catalog
        with the exact credential schema required.
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        currency:
          $ref: '#/components/schemas/IntelligenceCurrencyOrAssetCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        label:
          type: string
          description: Merchant-visible label for this instrument (e.g. "Payroll - primary account").
          maxLength: 255
        credentials:
          type: object
          description: Method-specific credential fields. Tokenized on receipt.
          additionalProperties: true
        is_default:
          type: boolean
          description: Make this the default instrument for the beneficiary. The previous default (if any) is unflagged.
          default: false
        end_user_ip:
          type: string

    Instrument:
      type: object
      description: |
        A payment destination attached to a beneficiary. Credentials (account numbers,
        wallet addresses, card PANs) are tokenized in Basis Theory and never returned
        by the API. Only masked display fields and method metadata are exposed.
      required: [id, beneficiary_id, merchant_id, method, status, is_default, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
          example: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        label:
          type: string
          description: Merchant-visible label.
        display_last4:
          type: string
          description: Last 4 characters of the primary credential (account number / PAN / wallet address), for display.
        display_bank:
          type: string
          description: Bank name derived from routing details, for display.
        display_network:
          type: string
          description: Card network or chain, for display (e.g. `visa`, `ethereum`).
        masked_account:
          type: string
          description: Fully masked credential for list views.
          example: "****5432"
        status:
          type: string
          enum: [active, disabled]
        is_default:
          type: boolean
          description: Whether this is the beneficiary's default instrument for payouts.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
        beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        method: iban
        currency: EUR
        country: DE
        label: Primary EUR account
        display_last4: "5432"
        display_bank: Deutsche Bank
        masked_account: DE89****5432
        status: active
        is_default: true
        created_at: "2026-04-15T14:30:00Z"
        updated_at: "2026-04-15T14:30:00Z"

    PayoutStatus:
      type: string
      description: |
        Payout lifecycle state. See the
        [How Anton Evaluates Payouts](/how-anton-evaluates-payouts) guide for
        the full state machine and integration guidance.
      enum:
        - created
        - pending_screening
        - screening_failed
        - pending_approval
        - approved
        - processing
        - sent
        - completed
        - failed
        - returned
        - cancelled
        - manual_review
        - velocity_blocked
        - pending_engine_review

    PayoutMethod:
      type: string
      description: |
        How the payout will be delivered. Distinct from an `Instrument`'s `method`
        (which is the credential format) — this is the rail-family selection.
      enum:
        - bank_transfer
        - wire
        - sepa
        - swift
        - ach
        - faster_payment
        - mobile_money
        - wallet
        - crypto
        - layer2
        - exchange
        - stablecoin

    RailType:
      type: string
      enum: [fiat, crypto, stablecoin]

    Network:
      type: string
      description: Specific rail or chain. Populated by the rail adapter when the payout is submitted.
      enum:
        - swift
        - sepa
        - ach
        - fps
        - rtgs
        - ethereum
        - bitcoin
        - tron
        - solana
        - polygon
        - arbitrum
        - optimism
        - base
        - avalanche
        - bsc
        - lightning
        - stellar
        - ripple

    PayoutCreateRequest:
      type: object
      required:
        - beneficiary_id
        - instrument_id
        - source_amount
        - dest_amount
        - dest_currency
        - method
        - purpose
        - reference
      properties:
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
          description: Must belong to the beneficiary named above and be in `active` status.
        source_amount:
          $ref: '#/components/schemas/Money'
          description: Amount debited from your merchant balance (before fees).
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
        dest_amount:
          $ref: '#/components/schemas/Money'
          description: Amount the beneficiary receives.
        dest_currency:
          $ref: '#/components/schemas/CurrencyCode'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        rail_type:
          $ref: '#/components/schemas/RailType'
          description: Hint for rail routing. Anton may override based on corridor availability.
        fixed_side:
          type: string
          enum: [fixed_source, fixed_dest]
          default: fixed_dest
          description: Which amount is authoritative — Anton recomputes the other using current corridor pricing.
        fee_bearer:
          type: string
          enum: [merchant, beneficiary]
          default: merchant
          description: Who absorbs the fee. `beneficiary` reduces the amount credited to them by the fee.
        purpose:
          type: string
          maxLength: 255
          description: |
            Payment purpose code. Used for compliance reporting and corridor-specific
            rail requirements. Examples — `contractor_payment`, `supplier_payment`,
            `salary`, `refund`.
          example: contractor_payment
        reference:
          type: string
          maxLength: 100
          description: Your own reference. Surfaces to the beneficiary where the rail supports it.
          example: INV-1042
        metadata:
          type: object
          additionalProperties:
            type: string
        end_user_ip:
          type: string
          description: IP of the merchant's end-user who initiated the payout. Used for risk signals.
        quote_id:
          type: string
          pattern: '^pq_[a-zA-Z0-9]+$'
          description: |
            Optional bindable pricing quote id returned by `POST /v1/pricing/quote`.
            When present, the payout fee is locked to the quoted value. The quote
            must be unexpired, unbound, and match the payout's currencies + amount,
            otherwise the create returns `422 quote_expired` / `422 quote_already_used`
            / `422 quote_mismatch`.

    Payout:
      type: object
      description: |
        A single payment from your merchant balance to a beneficiary's instrument.
        Moves through a 13-state machine — see the
        [How Anton Evaluates Payouts](/how-anton-evaluates-payouts) guide.

        Rail-specific fields (`rail_provider`, `rail_reference`, `network`,
        `wallet_address`, `tx_hash`, etc.) populate as the payout moves through
        `approved -> processing -> sent -> completed`.
      required:
        - id
        - merchant_id
        - beneficiary_id
        - instrument_id
        - status
        - method
        - source_amount
        - source_currency
        - dest_amount
        - dest_currency
        - rail_type
        - purpose
        - reference
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
          example: pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
        batch_id:
          type: [string, 'null']
          pattern: '^bat_[a-zA-Z0-9]+$'
          description: Set when the payout was created as part of a batch upload.
        status:
          $ref: '#/components/schemas/PayoutStatus'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        source_amount:
          $ref: '#/components/schemas/Money'
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
        dest_amount:
          $ref: '#/components/schemas/Money'
        dest_currency:
          $ref: '#/components/schemas/CurrencyCode'
        exchange_rate:
          $ref: '#/components/schemas/Money'
          description: Source-to-dest rate. Present on cross-currency payouts.
        fee:
          $ref: '#/components/schemas/Money'
        fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        fee_bearer:
          type: string
          enum: [merchant, beneficiary]
        fixed_side:
          type: string
          enum: [fixed_source, fixed_dest]
        total_debited:
          $ref: '#/components/schemas/Money'
          description: Total drawn from your balance — `source_amount + fee + buffer` during processing. Buffer releases on finalization.
        total_debited_currency:
          $ref: '#/components/schemas/CurrencyCode'
        fee_finalized:
          type: boolean
          description: Whether `fee` reflects the final rate from the rail.
        buffer_amount:
          $ref: '#/components/schemas/Money'
          description: Cross-currency rate buffer held during processing, released on settlement.
        buffer_currency:
          $ref: '#/components/schemas/CurrencyCode'
        pricing_plan_id:
          type: string
          description: Which pricing plan was used for the quote.
        rail_type:
          $ref: '#/components/schemas/RailType'
        rail_provider:
          type: string
          description: External rail name. Populated at rail-submission time.
          example: openpayd
        rail_reference:
          type: string
          description: External provider reference. Useful for support tickets.
        network:
          $ref: '#/components/schemas/Network'
        wallet_address:
          type: string
          description: Destination wallet address. Present for crypto/stablecoin payouts.
        token_contract:
          type: string
          description: ERC-20 / TRC-20 contract address. Present for stablecoin payouts.
        token_symbol:
          type: string
          example: USDC
        tx_hash:
          type: string
          description: On-chain transaction hash. Present once `sent` for crypto/stablecoin payouts.
        block_confirmations:
          type: integer
          description: Number of confirmations observed so far.
        required_confirms:
          type: integer
          description: Confirmations required before the payout reaches `completed`.
        network_fee:
          $ref: '#/components/schemas/Money'
          description: Gas / network fee. Deducted from the settlement, not from your balance.
        network_fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        cancelled_reason:
          type: string
          description: Populated on `cancelled`, `failed`, `velocity_blocked`, `screening_failed`.
        engine_unavailable_at:
          $ref: '#/components/schemas/Timestamp'
          description: Present if the payout entered `pending_engine_review` because the Anton Engine was unreachable.
        purpose:
          type: string
        reference:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_by:
          type: string
          description: |
            ID of the portal user who created the payout (`usr_...`). Omitted
            for payouts created with programmatic credentials and for payouts
            predating maker-checker support. Drives the maker-checker guard:
            the creator can never approve or reject their own payout.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        screened_at:
          $ref: '#/components/schemas/Timestamp'
        screening_failed_at:
          $ref: '#/components/schemas/Timestamp'
        approved_at:
          $ref: '#/components/schemas/Timestamp'
        processed_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        failed_at:
          $ref: '#/components/schemas/Timestamp'
        cancelled_at:
          $ref: '#/components/schemas/Timestamp'
        delivery:
          allOf:
            - $ref: '#/components/schemas/PayoutDelivery'
          description: |
            Delivery-time context for this payout based on its destination
            corridor's recent performance. Present only when the corridor has
            a sufficient completed-payout sample across enough distinct
            merchants. Omitted once the payout reaches a terminal state
            (completed, failed, returned, cancelled) — the ETA is only
            meaningful before delivery. See `PayoutDelivery`.
      example:
        id: pay_01HX8Z9K0M2N3P4Q5R6S7T8UAB
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        beneficiary_id: ben_01HX8Z9K0M2N3P4Q5R6S7T8UA1
        instrument_id: ins_01HX8Z9K0M2N3P4Q5R6S7T8UA2
        status: processing
        method: sepa
        source_amount: "550.00"
        source_currency: USD
        dest_amount: "500.00"
        dest_currency: EUR
        exchange_rate: "0.9091"
        fee: "5.00"
        fee_currency: USD
        fee_bearer: merchant
        fixed_side: fixed_dest
        total_debited: "557.50"
        total_debited_currency: USD
        fee_finalized: false
        buffer_amount: "2.50"
        buffer_currency: USD
        rail_type: fiat
        rail_provider: openpayd
        rail_reference: OP-2026-04-15-778812
        network: sepa
        purpose: supplier_payment
        reference: PO-8821
        created_at: "2026-04-15T14:30:00Z"
        updated_at: "2026-04-15T14:30:05Z"
        screened_at: "2026-04-15T14:30:02Z"
        approved_at: "2026-04-15T14:30:04Z"
        processed_at: "2026-04-15T14:30:05Z"

    PayoutEvent:
      type: object
      description: A single status transition recorded against a payout.
      required: [id, payout_id, merchant_id, status, actor_type, occurred_at, created_at]
      properties:
        id:
          type: string
          pattern: '^pev_[a-zA-Z0-9]+$'
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        status:
          $ref: '#/components/schemas/PayoutStatus'
        previous_status:
          $ref: '#/components/schemas/PayoutStatus'
        actor_type:
          type: string
          description: Origin of the transition.
          enum: [system, merchant, ops, rail, engine]
        actor_id:
          type: string
          description: Identifier of the actor, if applicable.
        metadata:
          type: object
          additionalProperties: true
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    BatchStatus:
      type: string
      enum:
        - uploaded
        - validating
        - validated
        - validation_failed
        - confirmed
        - processing
        - completed
        - partial
        - failed
        - cancelled

    BatchError:
      type: object
      description: A row-level validation error.
      required: [row, message]
      properties:
        row:
          type: integer
          description: 1-based row number in the original file.
        field:
          type: string
          description: Header/column the error applies to. Empty for row-level issues.
        message:
          type: string

    BatchWarning:
      type: object
      description: A non-blocking row-level warning.
      required: [row, type, message]
      properties:
        row:
          type: integer
        type:
          type: string
          description: Category — e.g. `beneficiary_mismatch`, `duplicate_skip`, `duplicate_conflict`.
        message:
          type: string

    BatchSummary:
      type: object
      description: Validation summary the merchant reviews before confirming.
      properties:
        new_beneficiaries:
          type: integer
          description: Beneficiaries that would be created from the file.
        matched_beneficiaries:
          type: integer
          description: Rows that matched an existing beneficiary.
        existing_beneficiaries:
          type: integer
          description: Distinct existing beneficiaries referenced.
        methods:
          type: object
          description: Count of rows by payment method.
          additionalProperties:
            type: integer
        estimated_debits:
          type: array
          items:
            type: object
            properties:
              currency:
                $ref: '#/components/schemas/CurrencyCode'
              amount:
                $ref: '#/components/schemas/Money'
              fx_rows:
                type: integer
              same_currency_rows:
                type: integer
              rate_timestamp:
                $ref: '#/components/schemas/Timestamp'
        fx_markup_bps:
          type: integer
          description: FX markup applied to cross-currency rows, in basis points.
        balance_check:
          type: object
          description: Balance sufficiency per funding currency.
          additionalProperties:
            type: object
            properties:
              available:
                $ref: '#/components/schemas/Money'
              estimated_debit:
                $ref: '#/components/schemas/Money'
              sufficient:
                type: boolean

    BatchRowResult:
      type: object
      required: [row, status]
      properties:
        row:
          type: integer
        status:
          type: string
          enum: [success, failed, skipped, pending]
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
        beneficiary_id:
          type: string
          pattern: '^ben_[a-zA-Z0-9]+$'
        instrument_id:
          type: string
          pattern: '^ins_[a-zA-Z0-9]+$'
        error:
          type: string
          description: Free-form reason for `failed`.
        skip_reason:
          type: string
          description: Reason for `skipped` (e.g. `duplicate`).

    BeneficiaryImportPreview:
      type: object
      description: |
        Result of `POST /v1/beneficiaries/import`. Carries the persisted
        `import_id` (which `confirm` references), top-line counts, and the full
        per-row validation outcome so the merchant portal can render inline
        per-cell errors.
      required: [import_id, summary, rows]
      properties:
        import_id:
          type: string
          pattern: '^imp_[a-zA-Z0-9]+$'
        summary:
          type: object
          required: [total, valid, invalid]
          properties:
            total:
              type: integer
            valid:
              type: integer
            invalid:
              type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BeneficiaryImportRow'

    BeneficiaryImportRow:
      type: object
      description: One row from the preview response.
      required: [row_number, type, valid]
      properties:
        row_number:
          type: integer
          description: 1-indexed row number relative to the data section (header excluded).
        type:
          type: string
          enum: [individual, business]
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
          description: Human-readable error messages. Present iff `valid` is false.
        individual:
          type: object
          description: Parsed individual payload (when `type=individual`).
          additionalProperties: true
        business:
          type: object
          description: Parsed business payload (when `type=business`).
          additionalProperties: true

    BeneficiaryImportConfirm:
      type: object
      description: Result of `POST /v1/beneficiaries/import/{import_id}/confirm`.
      required: [import_id, summary, created_ids, errors]
      properties:
        import_id:
          type: string
          pattern: '^imp_[a-zA-Z0-9]+$'
        summary:
          type: object
          required: [created, skipped, failed]
          properties:
            created:
              type: integer
              description: Beneficiaries created in this confirm call.
            skipped:
              type: integer
              description: Rows that failed validation at preview time.
            failed:
              type: integer
              description: Rows that passed preview validation but failed at create time.
        created_ids:
          type: array
          items:
            type: string
            pattern: '^ben_[a-zA-Z0-9]+$'
        errors:
          type: array
          items:
            type: object
            required: [row_number, error]
            properties:
              row_number:
                type: integer
              error:
                type: string

    Batch:
      type: object
      description: |
        A batch upload. Moves through `uploaded -> validating -> validated ->
        confirmed -> processing -> completed | partial | failed`. Can be
        cancelled from any pre-processing state.
      required:
        - id
        - merchant_id
        - uploaded_by
        - status
        - file_name
        - file_format
        - file_size
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^bat_[a-zA-Z0-9]+$'
          example: bat_01HX8Z9K0M2N3P4Q5R6S7T8UBT
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        uploaded_by:
          type: string
          description: User ID of the operator who uploaded this batch.
        status:
          $ref: '#/components/schemas/BatchStatus'
        file_name:
          type: string
          example: payroll_2026_04_15.csv
        file_format:
          type: string
          enum: [csv, xlsx]
        file_size:
          type: integer
          description: Bytes.
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        warning_rows:
          type: integer
        skipped_rows:
          type: integer
        processed_rows:
          type: integer
        summary:
          $ref: '#/components/schemas/BatchSummary'
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Default funding currency used for rows that don't specify their own. Set at confirmation.
        total_amount:
          type: string
          description: |
            Aggregate destination-side amount across every valid row, populated
            during validation when all rows share a single destination currency.
            Absent for mixed-currency batches and legacy batches uploaded before
            the aggregate was materialized — callers should fall back to the
            per-currency breakdown in `summary.estimated_debits`.
          example: "12345.67"
        total_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of `total_amount`. Absent for mixed-currency batches.
        current_row_index:
          type: integer
          description: Resumability checkpoint — highest row index successfully processed.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Deadline for confirming a `validated` batch.
        confirmed_at:
          $ref: '#/components/schemas/Timestamp'
        confirmed_by:
          type: string
        cancelled_at:
          $ref: '#/components/schemas/Timestamp'
        cancelled_by:
          type: string
        processing_started_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookEventType:
      type: string
      description: |
        See [Webhook Events](/api-reference/webhook-events) for the full catalog
        and payload shapes. Some reserved event types (`balance.low` on some
        paths) may be defined but not yet dispatched — subscribing to them is
        safe but no deliveries arrive until they're wired up.
      enum:
        - payout.created
        - payout.approved
        - payout.processing
        - payout.sent
        - payout.completed
        - payout.failed
        - payout.cancelled
        - payout.returned
        - payout.screening_failed
        - payout.velocity_blocked
        - payout.engine_blocked
        - beneficiary.created
        - beneficiary.updated
        - beneficiary.deleted
        - beneficiary.blocked
        - instrument.created
        - instrument.updated
        - instrument.deleted
        - batch.uploaded
        - batch.completed
        - batch.failed
        - fx.quote.created
        - fx.exchange.created
        - fx.exchange.completed
        - fx.exchange.failed
        - funding.credit
        - screening.hit
        - intelligence.evaluation.completed
        - intelligence.evaluation.failed
        - balance.low
        - test

    WebhookSubscriptionCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL that will receive deliveries.
          example: https://example.com/webhooks/anton
        events:
          type: array
          description: Event types this subscription should receive. Use `["*"]` to subscribe to everything.
          items:
            $ref: '#/components/schemas/WebhookEventType'
        metadata:
          type: object
          additionalProperties:
            type: string

    WebhookSubscriptionUpdateRequest:
      type: object
      description: |
        Partial update for `PATCH /v1/webhooks/{id}`. Include at least one
        field. `metadata` replaces the entire map. Status changes and secret
        rotation go through their dedicated endpoints.
      properties:
        url:
          type: string
          format: uri
          description: New HTTPS delivery URL. Same validation rules as creation.
        events:
          type: array
          description: Full replacement event filter. Must be non-empty when present.
          items:
            $ref: '#/components/schemas/WebhookEventType'
        metadata:
          type: object
          additionalProperties:
            type: string

    WebhookSubscription:
      type: object
      description: A registered webhook endpoint and its event filter.
      required: [id, merchant_id, url, events, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
          example: whk_01HX8Z9K0M2N3P4Q5R6S7T8UW
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [active, inactive]
        version:
          type: string
          description: API version this subscription pins to.
          example: "2024-01-01"
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookEvent:
      type: object
      description: A single webhook event record. The `payload` is the event-specific shape documented in [Webhook Events](/api-reference/webhook-events).
      required: [id, merchant_id, type, payload, created_at]
      properties:
        id:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        type:
          $ref: '#/components/schemas/WebhookEventType'
        payload:
          type: object
          additionalProperties: true
          description: Event-specific payload. See the Webhook Events catalog.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    WebhookDelivery:
      type: object
      description: A single delivery attempt of an event to a subscription endpoint.
      required: [id, event_id, subscription_id, status, url, attempts, max_attempts, created_at, updated_at]
      properties:
        id:
          type: string
        event_id:
          type: string
          pattern: '^evt_[a-zA-Z0-9]+$'
        subscription_id:
          type: string
          pattern: '^whk_[a-zA-Z0-9]+$'
        status:
          type: string
          enum: [pending, success, failed, abandoned]
        url:
          type: string
          description: Snapshot of the subscription URL at dispatch time.
        request_headers:
          type: object
          additionalProperties:
            type: string
        response_status:
          type: integer
          description: HTTP status returned by your endpoint.
        response_body:
          type: string
          description: Truncated response body captured from your endpoint.
        response_headers:
          type: object
          additionalProperties:
            type: string
        attempts:
          type: integer
        max_attempts:
          type: integer
        next_retry_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          type: string
          description: Transport-level error, if any (DNS, TLS, timeout, connection refused).
        duration_ms:
          type: integer
          description: Response time for the most recent attempt, in milliseconds.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          $ref: '#/components/schemas/Timestamp'

    Balance:
      type: object
      description: Available, pending, and total funds in a single currency.
      required: [id, merchant_id, currency, available, pending, total, updated_at]
      properties:
        id:
          type: string
          pattern: '^bal_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
          pattern: '^mer_[a-zA-Z0-9]+$'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        available:
          $ref: '#/components/schemas/Money'
          description: Funds usable for new payouts.
        pending:
          $ref: '#/components/schemas/Money'
          description: Funds reserved for in-flight payouts (debited but not yet settled).
        total:
          $ref: '#/components/schemas/Money'
          description: '`available + pending`.'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: bal_01HX8Z9K0M2N3P4Q5R6S7T8UBA1
        merchant_id: mer_01HX8Z9K0M2N3P4Q5R6S7T8UZZ
        currency: USD
        available: "12450.00"
        pending: "550.00"
        total: "13000.00"
        updated_at: "2026-04-15T14:30:00Z"

    Corridor:
      type: object
      description: |
        An active payout corridor — a (rail_type, currency, country, method,
        network) combination Anton can deliver through. Corridors are
        destination-only; the source currency is not part of the corridor
        (Anton handles FX separately).
      required: [id, rail_type, currency, country, method, active]
      properties:
        id:
          type: string
          pattern: '^cor_[a-zA-Z0-9]+$'
        rail_type:
          $ref: '#/components/schemas/RailType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
          description: Destination country. `XX` for global crypto networks.
        network:
          $ref: '#/components/schemas/Network'
        method:
          type: string
          description: Delivery method within the corridor (bank_transfer, crypto, stablecoin, etc.).
        active:
          type: boolean
        priority:
          type: integer
          description: Anton uses lowest priority first when multiple corridors match.
        cutoff_time:
          type: string
          description: Daily cutoff for same-day processing (fiat rails, HH:MM UTC).
        settlement_days:
          type: integer
          description: Expected settlement, in business days, for fiat corridors.
        settlement_mins:
          type: integer
          description: Expected settlement, in minutes, for crypto/stablecoin corridors.
        min_amount:
          $ref: '#/components/schemas/Money'
        max_amount:
          $ref: '#/components/schemas/Money'
        required_confirms:
          type: integer
          description: Block confirmations required for crypto corridors.

    PayoutDelivery:
      type: object
      description: |
        Delivery-time context for an individual payout, based on how its
        destination corridor (country × method) has performed over the
        trailing 30 days. Present only when the corridor has a sufficient
        completed-payout sample across enough distinct merchants, and only
        while the payout is non-terminal — it is omitted once the payout
        reaches a terminal state (`completed`, `failed`, `returned`,
        `cancelled`), where an ETA carries no meaning.
        `estimated_completion_at` and a `delayed` value of `true` are
        meaningful only while the payout is in flight (`processing` or `sent`,
        with a `processed_at` timestamp); for every other non-terminal state
        `estimated_completion_at` is omitted and `delayed` is `false`.
      required: [corridor, method, p50_minutes, p90_minutes, sample_size, delayed]
      properties:
        corridor:
          $ref: '#/components/schemas/CountryCode'
          description: ISO 3166-1 alpha-2 destination country for this payout.
        method:
          type: string
        p50_minutes:
          type: integer
          description: Median send-to-complete time for the corridor, in minutes.
        p90_minutes:
          type: integer
          description: 90th-percentile send-to-complete time for the corridor, in minutes.
        sample_size:
          type: integer
          description: Number of completed payouts the percentiles were computed from.
        estimated_completion_at:
          type: string
          format: date-time
          description: |
            Projected completion time (`processed_at` + p50 minutes), RFC 3339
            UTC. Present only while the payout is in flight.
        delayed:
          type: boolean
          description: |
            True when an in-flight payout has already exceeded the corridor's
            p90 delivery time (running slower than 90% of comparable payouts).

    InstrumentMethodSchema:
      type: object
      description: |
        Credential-field schema for a payment method in a specific country.
        Use to drive dynamic instrument-creation forms.
      required: [code, country, currency]
      properties:
        code:
          $ref: '#/components/schemas/PaymentMethodCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        label:
          type: string
          description: Human-friendly label for this country+method pairing.
          example: UK Bank Account (Faster Payments)
        fields:
          type: array
          description: Credential fields to prompt for.
          items:
            type: object
            required: [name, type, required]
            properties:
              name:
                type: string
                example: sort_code
              label:
                type: string
                example: Sort code
              type:
                type: string
                enum: [string, integer, enum]
              required:
                type: boolean
              pattern:
                type: string
                description: Regex the value must match, if any.
              enum:
                type: array
                items:
                  type: string
                description: Allowed values when `type=enum`.
              help:
                type: string

    FXQuoteCreateRequest:
      type: object
      required: [sell_currency, buy_currency]
      description: |
        Supply either `sell_amount` OR `buy_amount` — the missing side is
        computed from the locked rate.
      properties:
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        locked:
          type: boolean
          description: |
            Request a rate-locked quote whose `customer_rate` is held until
            `lock_expires_at`. Redeem the lock by passing the returned `id`
            (or equivalently `lock_id`) as `quote_id` on
            `POST /v1/fx/exchange` before expiry. Defaults to `true`.
            Set to `false` for an indicative (non-binding) quote that cannot
            be redeemed on `/v1/fx/exchange`.
          default: true

    FXQuote:
      type: object
      description: An FX rate quote, optionally locked for execution.
      required:
        - id
        - merchant_id
        - sell_currency
        - buy_currency
        - sell_amount
        - buy_amount
        - mid_market_rate
        - customer_rate
        - locked
        - created_at
      properties:
        id:
          type: string
          pattern: '^fxq_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        mid_market_rate:
          $ref: '#/components/schemas/Money'
        customer_rate:
          $ref: '#/components/schemas/Money'
          description: Mid-market adjusted by your pricing plan's FX markup.
        inverse_rate:
          $ref: '#/components/schemas/Money'
        fx_markup_bps:
          type: integer
        fx_fee:
          $ref: '#/components/schemas/Money'
        fx_fee_currency:
          $ref: '#/components/schemas/CurrencyCode'
        provider:
          type: string
        provider_ref:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        locked:
          type: boolean
        lock_id:
          type: string
          pattern: '^fxq_[a-zA-Z0-9]+$'
          description: |
            Identifier of the rate lock. Pass this value as `quote_id` on
            `POST /v1/fx/exchange` to redeem the locked rate before
            `lock_expires_at`. Equal to `id` on locked quotes, and omitted
            entirely on indicative quotes (`locked: false`).
        lock_expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            UTC timestamp past which the rate lock is no longer honored.
            Omitted on indicative quotes. Equal to `expires_at` on locked
            quotes — kept as a dedicated field so clients can distinguish
            "the quote payload expired" from "the merchant's rate lock
            expired" when those semantics diverge in future revisions.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    FXExchange:
      type: object
      description: An executed currency exchange between two merchant balances.
      required:
        - id
        - merchant_id
        - sell_currency
        - buy_currency
        - sell_amount
        - buy_amount
        - customer_rate
        - status
        - quote_id
        - created_at
      properties:
        id:
          type: string
          pattern: '^fxx_[a-zA-Z0-9]+$'
        merchant_id:
          type: string
        sell_currency:
          $ref: '#/components/schemas/CurrencyCode'
        buy_currency:
          $ref: '#/components/schemas/CurrencyCode'
        sell_amount:
          $ref: '#/components/schemas/Money'
        buy_amount:
          $ref: '#/components/schemas/Money'
        mid_market_rate:
          $ref: '#/components/schemas/Money'
        customer_rate:
          $ref: '#/components/schemas/Money'
        provider:
          type: string
        provider_ref:
          type: string
        quote_id:
          type: string
          pattern: '^fxq_[a-zA-Z0-9]+$'
        payout_id:
          type: string
          pattern: '^pay_[a-zA-Z0-9]+$'
          description: Set when the exchange was initiated to fund a cross-currency payout.
        status:
          type: string
          enum: [pending, completed, failed]
        created_at:
          $ref: '#/components/schemas/Timestamp'

    MerchantAccount:
      type: object
      description: |
        A virtual funding account provisioned for your merchant in a specific
        currency. Used for depositing funds into your merchant balance.
      required: [id, currency, status, provider]
      properties:
        id:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        balance:
          $ref: '#/components/schemas/Money'
        available_balance:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          description: '`active` | `pending` | `suspended`, depending on provider state.'
        provider:
          type: string
          description: The upstream banking provider backing this account.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    AccountDetails:
      type: object
      description: |
        Banking details for receiving deposits into a funding account. Share
        these with the sender; the exact fields present depend on the country
        and provider.
      required: [currency]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        country:
          $ref: '#/components/schemas/CountryCode'
        iban:
          type: string
        bic:
          type: string
        account_number:
          type: string
        sort_code:
          type: string
        bank_name:
          type: string
        holder_name:
          type: string
          description: Beneficiary name to use when initiating the deposit.
        routing_codes:
          type: object
          additionalProperties:
            type: string

    MerchantTransaction:
      type: object
      description: A transaction on a merchant funding account.
      required: [id, type, status, amount, currency, created_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        type:
          type: string
          description: '`credit` | `debit` | `fee` | `fx` | provider-specific types.'
        status:
          type: string
          description: '`pending` | `posted` | `failed`.'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        reference:
          type: string
        counterparty_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'

    PricingPlan:
      type: object
      description: A fee schedule active on your merchant account.
      required: [id, name, active, fee_type, priority]
      properties:
        id:
          type: string
          pattern: '^prc_[a-zA-Z0-9]+$'
        name:
          type: string
        active:
          type: boolean
        source_currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Scope — applies only to payouts debiting this currency. Null for all.
        dest_currency:
          $ref: '#/components/schemas/CurrencyCode'
        dest_country:
          $ref: '#/components/schemas/CountryCode'
        method:
          $ref: '#/components/schemas/PayoutMethod'
        fee_type:
          type: string
          enum: [fixed, percentage, hybrid, tiered]
        fixed_fee:
          $ref: '#/components/schemas/Money'
        fixed_currency:
          $ref: '#/components/schemas/CurrencyCode'
        percentage_fee:
          $ref: '#/components/schemas/Money'
          description: Percentage expressed as a decimal (e.g. `"1.50"` = 1.5%).
        min_fee:
          $ref: '#/components/schemas/Money'
        max_fee:
          $ref: '#/components/schemas/Money'
          description: '`0` = no cap.'
        tiers:
          type: array
          description: Populated when `fee_type` is `tiered`.
          items:
            type: object
            properties:
              min_volume:
                $ref: '#/components/schemas/Money'
              max_volume:
                $ref: '#/components/schemas/Money'
              fixed_fee:
                $ref: '#/components/schemas/Money'
              percentage_fee:
                $ref: '#/components/schemas/Money'
        priority:
          type: integer
          description: Lower wins when multiple plans apply. Merchant-specific plans take priority over global templates.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

